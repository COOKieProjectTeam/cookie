schema_version: 1
model_status: target
updated_at: 2026-09-04
source:
  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/
  authority: docs/architecture/README.md

defaults:
  backend_runtime: kotlin_jvm
  backend_framework: spring_boot_mvc
  jdk_version: 25
  state_store: postgresql
  event_bus: nats_jetstream
  delivery_semantics: at_least_once
  transactional_outbox: required_for_event_publishers
  idempotent_inbox: required_for_event_consumers
  database_access: owner_only
  operational_http_contract: contracts/openapi/runtime.yaml
  operational_endpoint_owner: each_deployable_component

infrastructure:
  edge_gateway:
    product: caddy
  relational_database:
    product: postgresql
    rule: each stateful domain service owns an isolated database or schema
    deployment_topology: TBD
  event_bus:
    product: nats_jetstream
    stream_topology: COOKIE_EVENTS captures cookie.events.> for v1 domain events
  ephemeral_store:
    product: redis
    rule: not a system of record; only declared uses are allowed
  observability_ui:
    product: grafana
    metrics_backend: TBD
    logs_backend: TBD
    traces_backend: TBD
  object_storage:
    protocol: s3_compatible
    product: TBD

services:
  - id: api_gateway
    name: Caddy API Gateway
    kind: edge
    runtime: caddy
    stateful: false
    purpose: TLS termination, routing and edge rate limiting
    openapi_tags: []
    redis:
      - keyspace: rate_limit
        data: short-lived counters by IP, account and route
    inbound: [mobile_client]
    outbound:
      - mobile_bff
      - identity
      - user
      - food_catalog
      - nutrition
      - recipe
      - shopping
      - health
      - media
      - meal_planner

  - id: mobile_bff
    name: Mobile BFF
    kind: backend_for_frontend
    runtime: kotlin_jvm
    stateful: false
    purpose: aggregate domain APIs into mobile screen responses such as /today
    openapi_tags: [bff]
    synchronous_dependencies: [user, progress, recipe, nutrition]

  - id: identity
    name: Identity Service
    kind: domain_service
    stateful: true
    purpose: email/password accounts, credentials and access/refresh sessions
    openapi_tags: [auth]
    dbml: contracts/dbml/identity.dbml
    publishes:
      - account.activated
      - notification.email.requested
    consumes: []

  - id: user
    name: User Service
    kind: domain_service
    stateful: true
    purpose: profile, onboarding, nutrition goals, allergies, diet and goal overrides
    openapi_tags: [profile]
    dbml: contracts/dbml/user.dbml
    publishes:
      - user.profile.updated
      - user.goal.changed
      - user.goal_override.changed
      - user.hydration_goal.changed
    consumes: [account.activated]

  - id: food_catalog
    name: Food Catalog Service
    kind: domain_service
    stateful: true
    purpose: custom foods and proxy search/barcode lookup in Open Food Facts
    openapi_tags: [food]
    dbml: contracts/dbml/food-catalog.dbml
    synchronous_dependencies: [open_food_facts]
    redis:
      - keyspace: off_search
        data: Open Food Facts search response cache
        ttl: 10m
      - keyspace: off_barcode
        data: Open Food Facts barcode response cache
        ttl: 1h

  - id: nutrition
    name: Nutrition Service
    kind: domain_service
    stateful: true
    purpose: food diary, meals, dishes, food entries, saved dishes and water
    openapi_tags: [diary]
    dbml: contracts/dbml/nutrition.dbml
    publishes:
      - nutrition.meal.created
      - nutrition.meal.updated
      - nutrition.meal.deleted
      - nutrition.day.changed
      - nutrition.water.changed
    synchronous_dependencies: [recipe, media]

  - id: recipe
    name: Recipe Service
    kind: domain_service
    stateful: true
    purpose: recipes, versions, personal customizations, favorites and cooking history
    openapi_tags: [recipes]
    dbml: contracts/dbml/recipe.dbml
    publishes:
      - recipe.customization.updated
      - recipe.customization.deleted
    synchronous_dependencies: [media]

  - id: shopping
    name: Shopping Service
    kind: domain_service
    stateful: true
    purpose: recipe cart, ingredient snapshots and shopping list
    openapi_tags: [shopping]
    dbml: contracts/dbml/shopping.dbml
    consumes:
      - recipe.customization.updated
      - recipe.customization.deleted
    synchronous_dependencies: [recipe]

  - id: health
    name: Health Data Service
    kind: domain_service
    stateful: true
    purpose: domain activity and weight data synchronized from platform health providers; never operational probes
    openapi_tags: [health]
    dbml: contracts/dbml/health.dbml
    publishes:
      - health.activity.changed
      - health.weight.changed
    external_dependencies: [apple_healthkit, android_health_connect]

  - id: progress
    name: Progress Service
    kind: domain_service
    stateful: true
    purpose: event-driven daily nutrition and health progress read models
    openapi_tags: [progress]
    dbml: contracts/dbml/progress.dbml
    publishes:
      - progress.day.updated
    consumes:
      - nutrition.day.changed
      - nutrition.water.changed
      - health.activity.changed
      - health.weight.changed
      - user.profile.updated
      - user.goal.changed
      - user.goal_override.changed
      - user.hydration_goal.changed

  - id: notification
    name: Notification Service
    kind: domain_service
    stateful: true
    purpose: push, email, reminder scheduling and delivery state
    openapi_tags: [notifications]
    dbml: contracts/dbml/notification.dbml
    consumes:
      - notification.email.requested
      - account.activated
      - nutrition.meal.created
      - nutrition.meal.updated
      - nutrition.meal.deleted
      - nutrition.water.changed
      - health.weight.changed
      - user.profile.updated
      - user.goal.changed
      - user.goal_override.changed
      - progress.day.updated
    redis:
      - keyspace: reminder_deadlines
        data: ephemeral queue/index of due reminder deadlines
    external_dependencies: [apns, fcm, smtp]

  - id: media
    name: Media Service
    kind: domain_service
    stateful: true
    purpose: media metadata, ownership, lifecycle and pre-signed object access
    openapi_tags: [media]
    dbml: contracts/dbml/media.dbml
    synchronous_dependencies: [object_storage]

  - id: meal_planner
    name: Meal Planner Service
    kind: domain_service
    stateful: true
    purpose: asynchronous generation and execution of 14-day meal plans
    openapi_tags: [meal-plan]
    dbml: contracts/dbml/meal-planner.dbml
    synchronous_dependencies: [user, recipe, shopping]

external_systems:
  - id: mobile_client
    name: Kotlin Multiplatform mobile client
  - id: open_food_facts
    name: Open Food Facts
  - id: object_storage
    name: S3-compatible object storage
  - id: apple_healthkit
    name: Apple HealthKit
  - id: android_health_connect
    name: Android Health Connect
  - id: apns
    name: Apple Push Notification service
  - id: fcm
    name: Firebase Cloud Messaging
  - id: smtp
    name: SMTP provider
