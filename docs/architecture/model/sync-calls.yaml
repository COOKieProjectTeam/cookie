schema_version: 1
model_status: target
updated_at: 2026-10-20
source:
  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/

rules:
  - calls not listed here are forbidden until the model is updated
  - every internal operation is owned and authorized by the callee service
  - internal protected operations require cryptographic workload identity with callee audience
  - explicitly public signing-key discovery uses fixed authenticated TLS origin and no workload token
  - client module availability does not grant permission to call the callee
  - callee operation grants must be a subset of calls declared here
  - callers must set timeouts and propagate trace context
  - a synchronous failure must not be hidden by writing another service database
  - cross-service transactions are forbidden

calls:
  - caller: mobile_bff
    callee: user
    purpose: profile and current goal for /today
  - caller: mobile_bff
    callee: progress
    purpose: daily progress for /today
  - caller: mobile_bff
    callee: recipe
    purpose: recommended recipes for /today
  - caller: mobile_bff
    callee: nutrition
    purpose: daily diary for /today

  - caller: meal_planner
    callee: shopping
    purpose: create asynchronous add-to-cart import job and poll its status
  - caller: meal_planner
    callee: recipe
    purpose: retrieve and filter recipe candidates for plan generation
  - caller: meal_planner
    callee: user
    purpose: retrieve current profile, goals, diet and allergies

  - caller: nutrition
    callee: recipe
    purpose: resolve a personalized immutable recipe snapshot before creating a dish
  - caller: nutrition
    callee: media
    purpose: validate ownership/readiness and resolve media URLs for dishes
  - caller: shopping
    callee: recipe
    purpose: retrieve recipe version and ingredient snapshot
  - caller: recipe
    callee: media
    purpose: resolve temporary recipe photo URLs

  - caller: food_catalog
    callee: open_food_facts
    purpose: product search and barcode lookup; responses are cached in Redis
  - caller: media
    callee: object_storage
    purpose: create pre-signed URLs, verify uploaded object metadata and delete objects
  - caller: mobile_client
    callee: object_storage
    purpose: direct pre-signed PUT/GET without proxying bytes through backend services
  - caller: notification
    callee: fcm
    purpose: send Android and iOS push through FCM HTTP v1; Firebase manages downstream APNs delivery
  - caller: notification
    callee: smtp
    purpose: authenticated TLS email submission
  - caller: notification
    callee: identity
    purpose: public signing-key discovery at /v1/auth/jwks
    authentication: public_jwks_over_tls
    user_context: none
    implementation: fixed-origin bounded JWKS cache, not an internal domain client
  - caller: user
    callee: identity
    purpose: public signing-key discovery at /v1/auth/jwks
    authentication: public_jwks_over_tls
    user_context: none
    implementation: fixed-origin bounded JWKS cache
  - caller: user
    callee: health
    purpose: calculate initial nutrition/hydration targets and idempotently record initial manual weight for onboarding
    implementation: planned; requires Health implementation and callee-owned workload policy before activation
