schema_version: 1
model_status: target
updated_at: 2026-09-17
source:
  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/

transport:
  broker: nats_jetstream
  guarantee: at_least_once
  producer_pattern: transactional_outbox
  consumer_pattern: idempotent_inbox
  ordering: no global ordering assumption
  subject_mapping: cookie.events.<event_type>.v<event_version>
  stream: COOKIE_EVENTS
  retry_policy: producer retries forever with exponential backoff from 1s to 5m and jitter
  dead_letter_policy: consumer-owned PostgreSQL metadata quarantine; original broker replay while retained

envelope:
  required:
    event_id: uuid
    event_type: string
    event_version: positive_integer
    occurred_at: rfc3339_utc
    producer: service_id
    aggregate_type: string
    aggregate_id: string
    payload: object
  optional:
    aggregate_version: integer
    correlation_id: uuid
    causation_id: uuid
    trace_id: string

events:
  - type: account.activated
    version: 1
    producer: identity
    consumers: [user, notification]
    payload: [userId, accountMetadata]

  - type: account.deletion.requested
    version: 1
    producer: identity
    consumers: [user, food_catalog, nutrition, recipe, shopping, health, progress, notification, media, meal_planner]
    payload: [accountId, deletionRequestId, requestedAt]
    implementation_note: >-
      Identity publishes the request; Notification and User consume it and erase their
      owned data with minimal tombstones. Other listed consumers are target
      data owners. No acknowledgement/finalization protocol exists; the account
      therefore remains DELETION_PENDING. event_id and
      occurred_at are mandatory envelope fields and are intentionally not
      duplicated in this PII-free business payload.

  - type: notification.email.requested
    version: 1
    producer: identity
    consumers: [notification]
    payload: [template, encryptedPayload, expiresAt]
    security_note: >-
      encryptedPayload is compact JWE using RSA-OAEP-256 and A256GCM. Only the
      Notification Service decrypts registrationAttemptId, recipientEmail, locale
      and the one-time token;
      raw delivery secrets never enter outbox rows, JetStream or logs.

  - type: user.profile.updated
    version: 1
    producer: user
    consumers: [progress, notification]
    payload: [userId, changedFields, timezone, locale, onboardingCompleted]

    aggregate_version_required: true

  - type: user.goal.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, nutritionGoalVersion]

  - type: user.goal_override.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, localDate, override]

  - type: user.hydration_goal.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, targetMl, effectiveFrom]

  - type: nutrition.meal.created
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId, eatenAt, dishes]

    aggregate_version_required: true

  - type: nutrition.meal.updated
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId, eatenAt, changedFields]

    aggregate_version_required: true

  - type: nutrition.meal.deleted
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId]

    aggregate_version_required: true

  - type: nutrition.day.changed
    version: 1
    producer: nutrition
    consumers: [progress]
    payload: [userId, localDate, nutritionTotals]

  - type: nutrition.water.changed
    version: 1
    producer: nutrition
    consumers: [progress, notification]
    payload: [userId, localDate, totalMl, lastConsumedAt]

    aggregate_version_required: true

  - type: recipe.customization.updated
    version: 1
    producer: recipe
    consumers: [shopping]
    payload: [recipeId, userId, revision, ingredients]

  - type: recipe.customization.deleted
    version: 1
    producer: recipe
    consumers: [shopping]
    payload: [recipeId, userId]

  - type: health.weight.changed
    version: 1
    producer: health
    consumers: [progress, notification]
    payload: [measurementId, userId, deleted, valueKg, measuredAt]

    aggregate_version_required: true

  - type: health.activity.changed
    version: 1
    producer: health
    consumers: [progress]
    payload: [userId, localDate, steps, activeCalories]

  - type: progress.day.updated
    version: 1
    producer: progress
    consumers: [notification]
    payload: [userId, localDate, timezone, calories, water]

    aggregate_version_required: true
