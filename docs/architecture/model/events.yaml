schema_version: 1
model_status: target
updated_at: 2026-09-17
source:
  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/

transport:
  broker: nats_jetstream
  guarantee: at_least_once
  producer_pattern: transactional_outbox
  consumer_pattern: idempotent_inbox
  ordering: no global ordering assumption
  subject_mapping: cookie.events.<event_type>.v<event_version>
  stream: COOKIE_EVENTS
  retry_policy: producer retries forever with exponential backoff from 1s to 5m and jitter
  dead_letter_policy: consumer-owned PostgreSQL metadata quarantine; original broker replay while retained

envelope:
  required:
    event_id: uuid
    event_type: string
    event_version: positive_integer
    occurred_at: rfc3339_utc
    producer: service_id
    aggregate_type: string
    aggregate_id: string
    payload: object
  optional:
    aggregate_version: integer
    correlation_id: uuid
    causation_id: uuid
    trace_id: string

events:
  - type: account.activated
    version: 1
    producer: identity
    consumers: [user, notification, health]
    payload: [userId, accountMetadata]

  - type: account.deletion.requested
    version: 1
    producer: identity
    consumers: [user, food_catalog, nutrition, recipe, shopping, health, progress, notification, media, meal_planner]
    payload: [accountId, deletionRequestId, requestedAt]
    implementation_note: >-
      Identity publishes the request; Notification, Nutrition and User consume it and erase
      their owned data with minimal tombstones. Other listed consumers are target
      data owners. No acknowledgement/finalization protocol exists; the account
      therefore remains DELETION_PENDING. event_id and
      occurred_at are mandatory envelope fields and are intentionally not
      duplicated in this PII-free business payload.

  - type: notification.email.requested
    version: 1
    producer: identity
    consumers: [notification]
    payload: [template, encryptedPayload, expiresAt]
    security_note: >-
      encryptedPayload is compact JWE using RSA-OAEP-256 and A256GCM. Only the
      Notification Service decrypts registrationAttemptId, recipientEmail, locale
      and the one-time token;
      raw delivery secrets never enter outbox rows, JetStream or logs.

  - type: user.profile.updated
    version: 1
    producer: user
    consumers: [progress, notification]
    payload: [userId, changedFields, timezone, locale, onboardingCompleted, baseline, goalRevision, hasAcceptedGoal, sourceSeq]

    aggregate_version_required: true

  - type: user.goal.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, nutritionGoalVersion]

  - type: user.goal.changed
    aggregate_version_required: true
    version: 2
    producer: user
    consumers: [progress]
    payload: [userId, nutritionGoalVersion, sourceSeq]

  - type: user.goal_override.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, localDate, override]

  - type: user.goal_override.changed
    aggregate_version_required: true
    version: 2
    producer: user
    consumers: [progress]
    payload: [userId, localDate, override, sourceSeq]

  - type: user.hydration_goal.changed
    aggregate_version_required: true
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, id, revision, targetMl, effectiveFrom, sourceSeq]

  - type: progress.user_cut.requested
    version: 1
    producer: progress
    consumers: [user]
    payload: [userId, boundary]

  - type: progress.user_replay.requested
    version: 1
    producer: progress
    consumers: [user]
    payload: [userId, firstSeq, lastSeq]

  - type: user.progress_commit.recorded
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, endLsn, committedAt, firstSeq, lastSeq]

  - type: user.progress_cut.confirmed
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, endLsn, boundary, beforeSeq, throughSeq]

  - type: user.progress_fact.replayed
    version: 1
    producer: user
    consumers: [progress]
    payload: [userId, event]

  - type: nutrition.meal.created
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId, eatenAt]
    aggregate_version: positive monotonic meal version

    aggregate_version_required: true

  - type: nutrition.meal.updated
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId, eatenAt]
    aggregate_version: positive monotonic meal version

    aggregate_version_required: true

  - type: nutrition.meal.deleted
    version: 1
    producer: nutrition
    consumers: [notification]
    payload: [mealId, userId]
    aggregate_version: strictly higher meal tombstone version

    aggregate_version_required: true

  - type: nutrition.day.changed
    version: 1
    producer: nutrition
    consumers: [progress]
    payload: [userId, localDate, nutritionTotals]
    aggregate_version: positive monotonic version scoped to userId and localDate, survives empty days

  - type: nutrition.day.changed
    version: 2
    producer: nutrition
    consumers: [progress]
    implementation_note: Carbohydrates exclude fibre and include polyols. Unknown label semantics propagate as null.
    payload: [userId, localDate, nutritionTotals]
    aggregate_version: positive monotonic version scoped to userId and localDate, survives empty days

  - type: nutrition.day.changed
    version: 3
    producer: nutrition
    consumers: [progress]
    payload: [userId, localDate, nutritionTotals, mealCount, zoneProvenance, sourceSeq]
    aggregate_version: positive monotonic version scoped to userId and localDate, survives empty days

  - type: nutrition.water.changed
    version: 1
    producer: nutrition
    consumers: [progress, notification]
    payload: [userId, localDate, totalMl, lastConsumedAt, zoneProvenance, sourceSeq]
    aggregate_version: positive monotonic version scoped to userId and localDate, survives empty days
    implementation_note: totalMl is an integer in [0, 2147483647]; overflow is rejected atomically by Nutrition. lastConsumedAt is explicitly null when totalMl is zero; complete snapshot, never a delta

    aggregate_version_required: true

  - type: progress.nutrition_cut.requested
    version: 1
    producer: progress
    consumers: [nutrition]
    payload: [userId, boundary]

  - type: progress.nutrition_replay.requested
    version: 1
    producer: progress
    consumers: [nutrition]
    payload: [userId, firstSeq, lastSeq]

  - type: nutrition.progress_commit.recorded
    version: 1
    producer: nutrition
    consumers: [progress]
    payload: [userId, endLsn, committedAt, firstSeq, lastSeq]

  - type: nutrition.progress_cut.confirmed
    version: 1
    producer: nutrition
    consumers: [progress]
    payload: [userId, endLsn, boundary, beforeSeq, throughSeq]

  - type: nutrition.progress_fact.replayed
    version: 1
    producer: nutrition
    consumers: [progress]
    payload: [userId, event]

  - type: recipe.customization.updated
    version: 1
    producer: recipe
    consumers: [shopping]
    payload: [recipeId, userId, revision, ingredients]

  - type: recipe.customization.deleted
    version: 1
    producer: recipe
    consumers: [shopping]
    payload: [recipeId, userId]

  - type: health.weight.changed
    version: 1
    producer: health
    consumers: [progress, notification]
    payload: [measurementId, userId, deleted, valueKg, measuredAt]

    aggregate_version_required: true

  - type: health.weight.changed
    version: 2
    producer: health
    consumers: [progress, notification]
    payload: [measurementId, userId, deleted, valueKg, measuredAt, measurementLocalDate, source]
    aggregate_version_required: true

  - type: health.connection_summary.changed
    version: 1
    producer: health
    consumers: [progress]
    payload: [userId, activeConnectionCount]
    aggregate_version_required: true

  - type: health.activity.changed
    version: 2
    producer: health
    consumers: [progress]
    payload: [userId, localDate, timezone, connectionId, steps, activeKcal, deleted]
    aggregate_version_required: true

  - type: progress.day.updated
    version: 1
    producer: progress
    consumers: [notification]
    payload: [userId, localDate, timezone, calories, water]

    aggregate_version_required: true

  - type: progress.day.updated
    version: 2
    producer: progress
    consumers: [notification]
    payload: [userId, localDate, timezone, calories, water]
    implementation_note: "Calories include consumed, goalState, goalId, goalRevision, low, high and cheatDay. Unknown facts use null. Water is unchanged from v1."
    aggregate_version_required: true

  - type: user.goal_assessment.requested
    version: 1
    producer: user
    consumers: [health]
    payload: [accountId, attemptId, encryptedPayload]
    aggregate_version_required: true

  - type: health.goal_assessment.resolved
    version: 1
    producer: health
    consumers: [user]
    payload: [accountId, attemptId, encryptedPayload]
    aggregate_version_required: true
