ust pass the same overlay when enabling push. Disabled push\\ndoes not report a fake successful delivery. Production startup validates the\\nenabled FCM settings; local development uses Mailpit and disabled push.\\n\\nThe mobile apps must register their Firebase Messaging registration token,\\nincluding on iOS. Tokens are opaque and case-sensitive; a native APNs device\\ntoken cannot be converted into an FCM token. Migration V006 disables all existing\\niOS device registrations and cancels their pending or claimed push jobs. Users\\nmust open the updated iOS app and re-register its FCM token before iOS push can\\nresume. The migration preserves terminal delivery history and email jobs.\\n\\n### Key rotation\\n\\nNotification obtains only public JWT verification keys from the fixed HTTPS\\nJWKS URL. It does not receive Identity's private signing key. Prepublish a new\\nverification key before switching signing keys; keep old public keys for the\\nconfigured maximum access-token lifetime plus the five-minute JWKS cache window.\\n\\nJWE decryption keys are independent. Install the new private key in Notification,\\nretain old private keys in its `retiring` mount, then switch Identity's public\\nencryption key. Set `COOKIE_NOTIFICATION_RETIRING_PRIVATE_KEY_PATHS` to the\\ncomma-separated container paths under `/run/notification-retiring`. Retain old\\nkeys at least the seven-day broker window and until no unexpired delivery refers\\nto them. Expired verification deliveries are discarded, not replayed as email.\\n\\nAfter replacing mounted key/credential files, explicitly redeploy the affected\\nservice even when its image digest is unchanged (`--notification <current-digest>`\\nor `--identity <current-digest>`). Compose file-backed mounts can keep the old\\ninode after atomic host replacement; provider credentials are startup-loaded.\\nWait for readiness after installing Notification's new private key before\\nswitching/restarting Identity's public encryption key. A file-reload loop alone\\ndoes not replace a mounted inode or update a configured retiring-key path list.\\n\\n## PostgreSQL provisioning on existing volumes\\n\\nIdentity's historical initialization script applies only to an empty cluster.\\nAdding Notification never depends on Docker re-running that script. The\\n`notification-db-provision` one-shot job authenticates with the administrator\\nsecret, creates the missing database and roles and converges grants on each run.\\nIt preserves existing Identity/Notification rows and fails if an existing\\nNotification database has an unexpected owner.\\n\\n`notification_migrator` owns Notification's database/schema and runs Flyway;\\n`notification_app` has CONNECT/USAGE/DML and sequence grants only. Neither role\\nis superuser, can create databases/roles, bypass RLS, or read Identity tables.\\nThe administrative credential is mounted only into PostgreSQL and its provisioning\\njob. This job runs before Notification starts, including upgrades over a\\nprevious Identity-only data volume. Provisioning does not imply a schema rollback.\\n\\n## NATS provisioning and least privilege\\n\\nGenerate operator/account/user material offline with `nsc`, not on the VM. Install\\none operator, system account, an application account with JetStream enabled and\\na memory resolver with their account JWTs. No anonymous/default user is allowed.\\nNATS client traffic is TLS-only. Identity retains its three publish subjects\\nand reply subscription `_INBOX.cookie.identity.>`; it cannot consume events.\\n\\n`config/notification-nats-permissions.json` is the exact permission fragment for\\nNotification's application-account user. It grants consumer INFO/NEXT for\\n`COOKIE_EVENTS.notification-v1`, ACK subjects scoped to that stream/consumer,\\nand only `_INBOX.cookie.notification.>` subscriptions. Both supported ACK layouts\\nare listed. It does not grant domain publishing, stream reads, arbitrary reply\\nsubscriptions, or creation/deletion of consumers. Broker subject filters come\\nfrom `config/notification-consumer.json`, validated against `service.yaml` by CI.\\n\\nThe deploy-only credential may read/create/edit `COOKIE_EVENTS` and\\n`notification-v1`, plus its own reply inbox. It stays outside application\\ncontainers. Extend the original stream-admin permissions with only:\\n\\n```text\\n$JS.API.CONSUMER.INFO.COOKIE_EVENTS.notification-v1\\n$JS.API.CONSUMER.CREATE.COOKIE_EVENTS.notification-v1\\n$JS.API.CONSUMER.DURABLE.CREATE.COOKIE_EVENTS.notification-v1\\n```\\n\\nUse the subject forms emitted by the pinned nats CLI and validate credentials\\nagainst the isolated broker before installation. The init job converges the\\nstream and consumer without delete/recreate or cursor reset. Existing incompatible\\nconsumer settings require an operator-reviewed migration; never hide that failure\\nby discarding a durable consumer.\\n\\nThe consumer uses DeliverAll, explicit ACK, 30-second ACK wait, at most 128\\noutstanding messages, and unlimited transient retries. PostgreSQL inbox commit\\nprecedes ACK. Poison records are durably quarantined by the application. The\\nstream retains seven days / 1 GiB / one million messages; inbox deduplication\\nretains 30 days. Alert on consumer lag, oldest quarantine, failed delivery age,\\nRedis/NATS errors and DB pool saturation.\\n\\nQuarantine replay is an operator action with a **separate** credential. Do not\\nadd `$JS.API.STREAM.MSG.GET.COOKIE_EVENTS` to Notification's runtime user: it\\nwould bypass its subject filters. The replay procedure must use broker retention\\nand preserve the original event identity. Telemetry storage/export backends\\nremain a separate architecture decision; counters alone are not installed alerts.\\n\\nDelivery gauges are `cookie.notification.delivery.pending`,\\n`cookie.notification.delivery.oldest.age.seconds`,\\n`cookie.notification.delivery.unknown` and `cookie.notification.delivery.failed`.\\nTreat `cookie.notification.delivery.metrics.healthy=0` as a failed metrics snapshot,\\nnot an empty queue. Inspect `cookie.notification.delivery.attempt` by channel and\\noutcome when investigating growing age or failure counts. Provider responses with\\nan unknown outcome require operator review and are not automatically resent.\\n\\n### Quarantine replay command\\n\\nInstall an operator credential as a separate `10001:10001`, `0400` file outside\\nthe normal Notification secret mounts. Its only broker grants are publish\\n`$JS.API.STREAM.MSG.GET.COOKIE_EVENTS` and subscribe\\n`_INBOX.cookie.notification_operator.>`. The operator can thereby retrieve a\\nstored quarantined stream sequence; it cannot republish an event.\\n\\n```bash\\nsudo docker compose \\\\\\n  --project-directory /opt/cookie/production \\\\\\n  --env-file /etc/cookie/production.env \\\\\\n  --env-file /srv/cookie/releases/current.env \\\\\\n  --file /opt/cookie/production/compose.yaml \\\\\\n  run --rm --no-deps \\\\\\n  --volume /srv/cookie/secrets/operators/notification-replay.creds:/run/secrets/operator.creds:ro \\\\\\n  notification \\\\\\n  --spring.profiles.active=notification-replay \\\\\\n  --spring.main.web-application-type=none \\\\\\n  --cookie.notification.consumer-enabled=false \\\\\\n  --cookie.notification.scheduler-enabled=false \\\\\\n  --cookie.notification.delivery.enabled=false \\\\\\n  --cookie.notification.delivery.fcm.enabled=false \\\\\\n  --cookie.notification.operator-nats-credentials-path=/run/secrets/operator.creds \\\\\\n  --notification-replay-id='<quarantine-UUID>'\\n```\\n\\nThe short-lived process inherits Notification database/truststore/key mounts,\\nuses a separate broker connection for the privileged lookup, verifies the stored\\nmessage hash/subject, preserves the original event ID and closes after replay.\\nIt does not run background consumption, scheduling or provider delivery. A\\nmessage removed by broker retention causes an explicit failure. Do not bypass\\nUNKNOWN delivery outcomes or synthesize a replacement event to force sending.\\n\\n## Deploy, recovery and rollback\\n\\nInitial deployment on an empty host requires both image digests:\\n\\n```bash\\nsudo /opt/cookie/production/deploy.sh \\\\\\n  --identity 'cr.yandex/<registry-id>/identity@sha256:<64-hex-digest>' \\\\\\n  --notification 'cr.yandex/<registry-id>/notification@sha256:<64-hex-digest>'\\n```\\n\\nFor an existing Identity release, install the new bundle/config/secrets and run\\nonly `--notification <digest>`. The old Identity-only manifest is read safely,\\nits digest is preserved and Identity is not recreated. Subsequent deployments\\ncan specify either service independently. Supplying a service explicitly also\\nallows reapplying configuration at the same digest. The original single\\npositional Identity-digest invocation remains supported after both images are\\nrecorded.\\n\\nDeployment serializes with `/run/lock/cookie-production-deploy.lock`, gets a\\nshort-lived registry token, validates/pulls immutable artifacts, starts shared\\ninfrastructure, provisions Notification's DB and durable consumer, then starts\\nonly requested services. Notification is explicitly stopped before its replacement\\nstarts, including recovery and rollback; Flyway then runs inside the new process.\\nThis coordinated restart prevents old APNs workers from overlapping migration\\nV006 or new FCM token registration. Do not run extra old Notification replicas\\nor a separate migrator alongside this rollout. Container and published-port\\nreadiness must pass.\\nRedis failure permits PostgreSQL scheduling fallback. No deploy step sends a\\nreal email or push as a health check.\\n\\nThe root-owned `releases/current.env` atomically records both digests only after\\nsuccess. `releases/pending.env` records the old/new pair and services attempted\\nbefore each restart. Failures and TERM/INT roll back attempted services in reverse\\norder; first-install failures stop the new service. A KILL/power interruption\\nleaves the journal for recovery at the next invocation. A journal left after a\\nsuccessful manifest commit is cleared without rolling back that commit. If\\nrecovery fails, the script retains the journal and stops for operator recovery.\\nIt never sources release/journal text as shell code.\\n\\nAn image rollback does **not** roll back Flyway, provider requests, Redis state,\\nNATS stream configuration, secrets, or deployment-bundle changes. Keep migrations\\nforward-compatible with the previous image and review bundle/secret compatibility\\nbefore rollout. Rolling back the image after V006 does not reactivate old iOS\\ntokens or restore the old token format. Recover with an FCM-capable image; if an\\nolder image is temporarily required for incident recovery, keep push disabled\\nuntil the FCM-capable service is restored. Never send newly registered FCM tokens\\nthrough the old direct APNs adapter. An incompatible migration is a\\nrestore/incident operation.\\n\\nBefore real traffic, verify gateway header/client-IP behavior, actual SMTP and\\npush credentials in a controlled test, external HTTPS monitoring, snapshot/restore,\\nand disk/VM alerts. Configuration tests do not establish production readiness by\\nthemselves.\\n\\n## Disposable production rehearsal in CI\\n\\nThe `Production deployment rehearsal` job builds both real service Dockerfiles\\nand runs `.github/scripts/test-production-containers.py` as root on a fresh\\nLinux GitHub runner. It refuses an existing `/srv/cookie` or deployment lock.\\nThe test generates short-lived JWKs, a CA and certificates, JKS truststores,\\nNATS operator/account/user JWTs and independent role passwords. No fixture\\nprivate key, credential, email or token is committed or uploaded as an artifact.\\n\\nThe original production `compose.yaml` and `deploy.sh` execute without source\\nrewriting. A test overlay resolves the disposable HTTPS/SMTP host and installs\\nits CA in Notification's JVM truststore; production profiles, hostname\\nverification, SMTP authentication and required STARTTLS remain enabled. Real\\nPostgreSQL, Redis and TLS/JWT NATS run with the production secret mounts, UIDs,\\npermissions, consumer filters and resource limits. A strict local SMTP fixture\\naccepts email only after STARTTLS and authentication.\\n\\nThe rehearsal covers a fresh two-service installation, invalid secret-mode\\nrejection, and registration → encrypted event → SMTP → confirmation → JWT\\nauthenticated Notification API, including opaque 4096-character Android and\\nmixed-case iOS FCM token registration through the runtime database role. A second\\nrun first starts only the actual Identity image and populates its real schema\\nthrough registration, then adds\\nNotification to that same PostgreSQL directory. It verifies data preservation\\nand that Identity's container ID does not change during Notification installation,\\nindependent rollout, failed-image rollback and recovery after a SIGKILL leaves\\nthe deployment journal. Migrations remain applied during image rollback.\\n\\nOnly cloud-specific transport is substituted: VM metadata returns a synthetic\\ntoken, registry login is local, and synthetic `cr.yandex/...@sha256:` references\\nmap to already-built immutable Docker image IDs. Docker/Compose execution,\\ncontainer states, readiness requests, file ownership, locks and process signals\\nare real. This test does not validate Yandex IAM, registry availability, gateway\\nrouting, public DNS/certificates, real provider credentials or VM capacity under\\nload. Those remain deployment acceptance checks; CI never deploys production.\\n\\nThe job installs `.github/scripts/production-test-requirements.txt` in a private\\nvirtual environment and invokes:\\n\\n```bash\\nsudo --preserve-env=GITHUB_ACTIONS,PATH \\\\\\n  .cache/production-rehearsal-venv/bin/python \\\\\\n  .github/scripts/test-production-containers.py \\\\\\n  --identity-image cookie/identity-ci:<commit> \\\\\\n  --notification-image cookie/notification-ci:<commit>\\n```\\n\",\"deploy/production/compose.yaml\":\"name: cookie-production\\n\\nx-logging: &default-logging\\n  driver: json-file\\n  options:\\n    max-size: \\\"10m\\\"\\n    max-file: \\\"5\\\"\\n\\nservices:\\n  postgres:\\n    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2\\n    restart: unless-stopped\\n    stop_grace_period: 60s\\n    environment:\\n      POSTGRES_DB: identity\\n      POSTGRES_USER: postgres\\n      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password\\n      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums\\n    secrets:\\n      - source: postgres_admin_password\\n        target: postgres-admin-password\\n      - source: postgres_identity_password\\n        target: postgres-identity-password\\n      - source: postgres_identity_migration_password\\n        target: postgres-identity-migration-password\\n    volumes:\\n      - type: bind\\n        source: ${COOKIE_DATA_ROOT:-/srv/cookie}/postgres\\n        target: /var/lib/postgresql\\n        bind:\\n          create_host_path: false\\n      - type: bind\\n        source: ./scripts/postgres-init-identity.sh\\n        target: /docker-entrypoint-initdb.d/10-identity-roles.sh\\n        read_only: true\\n    healthcheck:\\n      test: [\\\"CMD-SHELL\\\", \\\"pg_isready --username=postgres --dbname=identity\\\"]\\n      interval: 5s\\n      timeout: 3s\\n      retries: 24\\n      start_period: 20s\\n    shm_size: \\\"128m\\\"\\n    mem_limit: \\\"1536m\\\"\\n    cpus: \\\"1.0\\\"\\n    pids_limit: 256\\n    security_opt:\\n      - no-new-privileges:true\\n    logging: *default-logging\\n    networks:\\n      - backend\\n\\n  nats:\\n    image: nats:2.14.6-alpine3.22@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3\\n    restart: unless-stopped\\n    stop_grace_period: 30s\\n    user: \\\"1000:1000\\\"\\n    command: [\\\"--config\\\", \\\"/etc/nats/nats-server.conf\\\"]\\n    secrets swordHasher.kt\\\",\\n        \\\"line\\\": 37\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-lockout\\\",\\n      \\\"label\\\": \\\"Блокировка пароля\\\",\\n      \\\"value\\\": \\\"С 5-й ошибки: 30 с → максимум 15 мин\\\",\\n      \\\"description\\\": \\\"Экспоненциальная блокировка хранится в account; одинаковый механизм используется при login и первичном подтверждении удаления паролем.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/domain/src/main/kotlin/com/cookie/identity/domain/Account.kt\\\",\\n        \\\"line\\\": 162\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-register-limits\\\",\\n      \\\"label\\\": \\\"Register limits\\\",\\n      \\\"value\\\": \\\"IP 20/час · email 3/час\\\",\\n      \\\"description\\\": \\\"IP bucket применяется первым, в том числе к exact retry. Подтверждённый точный повтор не расходует email bucket.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 11\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-resend-limits\\\",\\n      \\\"label\\\": \\\"Resend limits\\\",\\n      \\\"value\\\": \\\"IP 30/час · email 1/мин и 5/час\\\",\\n      \\\"description\\\": \\\"Готовая/истёкшая попытка и cooldown могут завершиться no-op до email bucket; оба email окна учитываются перед отказом.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 17\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-login-limits\\\",\\n      \\\"label\\\": \\\"Login limits\\\",\\n      \\\"value\\\": \\\"IP 100/15 мин · email 10/15 мин\\\",\\n      \\\"description\\\": \\\"Дополняют account lockout; для неизвестного email вычисляется dummy hash, ответ не раскрывает наличие аккаунта.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 27\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-confirm-limits\\\",\\n      \\\"label\\\": \\\"Confirm limits\\\",\\n      \\\"value\\\": \\\"IP 60/15 мин · token 10/15 мин\\\",\\n      \\\"description\\\": \\\"Exact successful retry обходит token bucket, но не IP bucket. Неизвестный/невалидный token не создаёт произвольный token scope.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 33\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-session-limits\\\",\\n      \\\"label\\\": \\\"Refresh / logout limits\\\",\\n      \\\"value\\\": \\\"IP 120/мин · family 30/мин для каждой операции\\\",\\n      \\\"description\\\": \\\"Refresh family bucket расходуется только новой rotation; обнаруженный reuse отзывает family даже без прохождения business bucket.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 40\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-delete-limits\\\",\\n      \\\"label\\\": \\\"Удаление: limits\\\",\\n      \\\"value\\\": \\\"IP 30/час · account 10/час\\\",\\n      \\\"description\\\": \\\"Account scope определяется только после проверки access JWT; limits применяются и к повторному запросу. Возврат существующего receipt дополнительно требует проверки currentPassword.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\\\",\\n        \\\"line\\\": 54\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-limit-store\\\",\\n      \\\"label\\\": \\\"Хранилище rate limits\\\",\\n      \\\"value\\\": \\\"PostgreSQL fixed windows\\\",\\n      \\\"description\\\": \\\"Атомарный INSERT ON CONFLICT использует время БД; scope pseudonymized через HMAC. Identity не использует Redis для этих counters.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/persistence/JdbcRateLimitRepository.kt\\\",\\n        \\\"line\\\": 21\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-http-body\\\",\\n      \\\"label\\\": \\\"HTTP body\\\",\\n      \\\"value\\\": \\\"16 KiB\\\",\\n      \\\"description\\\": \\\"BoundedRequestBodyFilter ограничивает тело до domain handler; malformed JSON не достигает application IP limiter.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/IdentityConfiguration.kt\\\",\\n        \\\"line\\\": 237\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-db-defaults\\\",\\n      \\\"label\\\": \\\"JDBC defaults\\\",\\n      \\\"value\\\": \\\"pool 10; acquire 2 с; validate 1 с; socket 10 с\\\",\\n      \\\"description\\\": \\\"Statement timeout 5 с и lock timeout 2 с по умолчанию; значения имеют env overrides. Отдельного общего server request deadline в application.yaml нет.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 14\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-db-production\\\",\\n      \\\"label\\\": \\\"JDBC production override\\\",\\n      \\\"value\\\": \\\"pool 8 · identity_app / identity_migrator\\\",\\n      \\\"description\\\": \\\"Production Compose задаёт отдельные runtime и Flyway роли; их пароли приходят из файлов configtree.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 159\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-transaction\\\",\\n      \\\"label\\\": \\\"Транзакции\\\",\\n      \\\"value\\\": \\\"5 с; lock 2 с\\\",\\n      \\\"description\\\": \\\"SpringTransactionRunner применяет TransactionTemplate и локальные statement/lock timeouts. Транзакция фиксируется до возврата handler.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/SpringTransactionRunner.kt\\\",\\n        \\\"line\\\": 19\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-registration-audit\\\",\\n      \\\"label\\\": \\\"Срок хранения registration tombstones\\\",\\n      \\\"value\\\": \\\"Abandoned: после max(abandonedAt, expiresAt); completed: после completedAt\\\",\\n      \\\"description\\\": \\\"К обеим границам применяется configured attempt-audit retention, по умолчанию 30 дней. У suppressed попытки abandonment наступает сразу, но удаление evidence ждёт также исходного expiry; exact retry не превращается в новую отправку из-за раннего cleanup.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/persistence/JdbcMaintenanceRepository.kt\\\",\\n        \\\"line\\\": 76\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-retention\\\",\\n      \\\"label\\\": \\\"Очистка по умолчанию\\\",\\n      \\\"value\\\": \\\"attempt audit 30 д; family audit 90 д; published outbox 7 д\\\",\\n      \\\"description\\\": \\\"Rate-limit grace 1 день; job каждую минуту, batch500, максимум400 batches и30 с на запуск. Эти сроки не продлевают credentials.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 70\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-outbox-loop\\\",\\n      \\\"label\\\": \\\"Outbox polling\\\",\\n      \\\"value\\\": \\\"500 мс · batch100 · lease30 с · ACK budget10 с\\\",\\n      \\\"description\\\": \\\"После PubAck запись помечается published с fencing claimId; сбой/неопределённость ведёт к повтору того же eventId.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\\\",\\n        \\\"line\\\": 121\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-outbox-retry\\\",\\n      \\\"label\\\": \\\"Outbox retry\\\",\\n      \\\"value\\\": \\\"1 с → 5 мин, equal jitter\\\",\\n      \\\"description\\\": \\\"Nats-Msg-Id равен eventId; это at-least-once, а не гарантия exactly-once. Inbox потребителя остаётся обязательным.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\\\",\\n        \\\"line\\\": 128\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-nats\\\",\\n      \\\"label\\\": \\\"NATS connection\\\",\\n      \\\"value\\\": \\\"connect2 с · reconnect1 с · без лимита reconnect\\\",\\n      \\\"description\\\": \\\"В production обязательны tls://, workload credentials, readable truststore и hostname verification. HappyEyeballs сохраняет исходное имя брокера для проверки DNS/IP SAN, включая reconnect. Dev/test могут provision stream; production делает отдельный init job.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/NatsJetStreamConnection.kt\\\",\\n        \\\"line\\\": 100\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-probes\\\",\\n      \\\"label\\\": \\\"Probes\\\",\\n      \\\"value\\\": \\\"/healthz: процесс; /readyz: PostgreSQL + ключи на старте\\\",\\n      \\\"description\\\": \\\"Liveness не обращается к БД. Readiness проверяет JDBC isValid; KeyMaterial проходит startup validation. NATS outage не снимает readiness: outbox накапливается.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/SystemController.kt\\\",\\n        \\\"line\\\": 13\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-proxy\\\",\\n      \\\"label\\\": \\\"Client IP\\\",\\n      \\\"value\\\": \\\"Только настроенные trusted proxy CIDRs\\\",\\n      \\\"description\\\": \\\"Без доверенного peer используется remoteAddr; валидная XFF-цепочка обходится справа налево. Servlet forwarding отключён; default список доверенных CIDR пуст.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/ClientIpResolver.kt\\\",\\n        \\\"line\\\": 17\\n      }\\n    }\\n  ],\\n  \\\"flows\\\": [\\n    {\\n      \\\"id\\\": \\\"identity-register\\\",\\n      \\\"title\\\": \\\"Регистрация и постановка email в outbox\\\",\\n      \\\"operationIds\\\": [\\n        \\\"registerWithEmail\\\"\\n      ],\\n      \\\"description\\\": \\\"202 означает завершённый handler/commit, но не доставленное письмо. После commit HTTP-ответ и асинхронная публикация могут происходить независимо.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/email/register\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 21\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP limit → validation → exact retry\\\",\\n          \\\"detail\\\": \\\"Проверяются locale, canonical email, admission policy, password и proof. Exact fingerprint совпадает — no-op; иначе email limiter и Argon2 до транзакции.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationUseCases.kt\\\",\\n            \\\"line\\\": 43\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Блокировки и ветвления\\\",\\n          \\\"detail\\\": \\\"Lock email + attemptId/proof. Exact retry — no-op; повторное использование id/proof с другими данными —409. Для существующего account сохраняется abandoned attempt с id/proof/fingerprint, чтобы retry и конфликты не раскрывали существование account.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationUseCases.kt\\\",\\n            \\\"line\\\": 70\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Attempt + verifier; outbox только для pending\\\",\\n          \\\"detail\\\": \\\"Pending attempt хранит password hash и proof/token verifier; encrypted notification.email.requested.v1 записывается в той же транзакции. При существующем account password hash/locale стираются до INSERT, token verifier сохраняется без email event. Token expiry ≤30 мин/attempt expiry.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationAttemptIssuer.kt\\\",\\n            \\\"line\\\": 37\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ 202\\\",\\n          \\\"detail\\\": \\\"Ответ возвращается после execute; broker и SMTP не являются синхронными prerequisites. Асинхронное продолжение показано в общем outbox flow.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 59\\n          }\\n        }\\n      ],\\n      \\\"nextFlows\\\": [\\n        \\\"identity-outbox\\\"\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-resend\\\",\\n      \\\"title\\\": \\\"Повторная доставка verification token\\\",\\n      \\\"operationIds\\\": [\\n        \\\"resendEmailVerification\\\"\\n      ],\\n      \\\"description\\\": \\\"Привязана к конкретной попытке и registrationProof. Generic202 не подтверждает существование аккаунта или отправку письма.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/email/verification/resend\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 148\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP limit и проверка attempt/proof\\\",\\n          \\\"detail\\\": \\\"Проверяются email и proof. Подтверждённая, истёкшая или ещё в cooldown попытка заканчивается202 no-op; неверная pair не выдаёт token.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationUseCases.kt\\\",\\n            \\\"line\\\": 119\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Email business buckets\\\",\\n          \\\"detail\\\": \\\"1/мин и5/час. Pending, suppressed и проигравшие abandoned attempts соблюдают одинаковый cooldown и расход email buckets. Неизвестная попытка либо неверный proof после applicable limits остаётся generic202.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationUseCases.kt\\\",\\n            \\\"line\\\": 135\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Повторная проверка под lock\\\",\\n          \\\"detail\\\": \\\"Account/email lock и attempt FOR UPDATE; повторно проверяются состояние и cooldown. Pending получает verifier и encrypted outbox event. Abandoned до исходного expiry получает только неотправленный verifier, сохраняя scrubbed password hash/locale; confirm для неё всегда недопустим.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationUseCases.kt\\\",\\n            \\\"line\\\": 142\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ 202 после commit/no-op\\\",\\n          \\\"detail\\\": \\\"При созданном email event новый eventId запускает отдельную delivery; resend не меняет outcome прежнего SMTP UNKNOWN. Suppressed/abandoned путь возвращает тот же202 без отправки.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 62\\n          }\\n        }\\n      ],\\n      \\\"nextFlows\\\": [\\n        \\\"identity-outbox\\\"\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-confirm\\\",\\n      \\\"title\\\": \\\"Подтверждение: token + независимый proof\\\",\\n      \\\"operationIds\\\": [\\n        \\\"confirmEmail\\\"\\n      ],\\n      \\\"description\\\": \\\"Оба секрета необходимы. Успешный confirm активирует account, но не выдаёт refresh-секрет; login выполняется отдельно.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/email/verification/confirm\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 110\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP limit, parsing и verifiers\\\",\\n          \\\"detail\\\": \\\"Invalid token/proof даёт400. Точный повтор уже завершённой pair возвращает204; для нового подтверждения применяются token limit и proof check.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 42\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Одна транзакция активации\\\",\\n          \\\"detail\\\": \\\"Lock email и attempt. Проверяется отсутствие другого account; создаётся account с pending password hash, attempt complete, прочие pending attempts того же email abandoned.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 74\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"account.activated.v1 в outbox\\\",\\n          \\\"detail\\\": \\\"Событие содержит userId и accountMetadata, без credentials. Записывается до commit вместе с account и завершением attempt.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 106\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ 204\\\",\\n          \\\"detail\\\": \\\"Невалидная/истёкшая/проигравшая pair —400; доказанный exact successful retry —204 пока audit сохранён (default30 дней). Сессия здесь не создаётся.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 72\\n          }\\n        }\\n      ],\\n      \\\"nextFlows\\\": [\\n        \\\"identity-outbox\\\"\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-login\\\",\\n      \\\"title\\\": \\\"Login и новая refresh family\\\",\\n      \\\"operationIds\\\": [\\n        \\\"loginWithEmail\\\"\\n      ],\\n      \\\"description\\\": \\\"200 содержит JWT и refresh secret только после успешного commit family. Невалидные credentials не раскрывают наличие email.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/email/login\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 61\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP → parsing → email limiter → Argon2\\\",\\n          \\\"detail\\\": \\\"Для неизвестного email используется dummy hash. Password hashing выполняется до row lock; ограничение hash permits может дать503.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 123\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Проверка актуального credential и lockout\\\",\\n          \\\"detail\\\": \\\"Под account FOR UPDATE сверяется snapshot password hash. При смене credential — до2 попыток, затем503. Ошибка пароля записывает failure/lockout; неизвестный/неактивный/заблокированный account —401.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 135\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Refresh family и verifier\\\",\\n          \\\"detail\\\": \\\"ACTIVE account получает новую family с absolute TTL30 дней и opaque refresh verifier. Открытый refresh остаётся в памяти для ответа.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/SessionIssuer.kt\\\",\\n            \\\"line\\\": 20\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Подписать JWT и вернуть200\\\",\\n          \\\"detail\\\": \\\"ES256 access JWT формируется при выдаче; HTTP response идёт после commit. Cache-Control:no-store и Pragma:no-cache. Outbox-событие login не публикуется.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 83\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-refresh\\\",\\n      \\\"title\\\": \\\"Rotation, восстановление retry и обнаружение reuse\\\",\\n      \\\"operationIds\\\": [\\n        \\\"refreshSession\\\"\\n      ],\\n      \\\"description\\\": \\\"Refresh token + тот же UUIDv4 Idempotency-Key восстанавливают непосредственный successor, пока он остаётся текущим.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/refresh\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 179\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP limit, UUIDv4, verifier lookup\\\",\\n          \\\"detail\\\": \\\"Неправильный Idempotency-Key —400; неизвестный или неподтверждённый refresh —401. Account определяется lookup по проверенному refresh credential, не из запроса пользователя.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 184\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Account + family FOR UPDATE\\\",\\n          \\\"detail\\\": \\\"Неактивный account/истёкшая или revoked family —401. Другой ключ для уже использованного credential — reuse: family revoke фиксируется до401.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 199\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"ROTATE / RETRY / STALE_RETRY\\\",\\n          \\\"detail\\\": \\\"ROTATE тратит family bucket и пишет successor verifier. RETRY восстанавливает тот же successor без новой rotation. После следующей rotation прежний exact retry stale:401 без отзыва family.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 210\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ200 после commit\\\",\\n          \\\"detail\\\": \\\"JWT может быть новым, refresh successor детерминированно тот же для exact retry. Absolute family expiry не продлевается; secrets response no-store/no-cache.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/SessionIssuer.kt\\\",\\n            \\\"line\\\": 70\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-logout\\\",\\n      \\\"title\\\": \\\"Logout текущей refresh family\\\",\\n      \\\"operationIds\\\": [\\n        \\\"logout\\\"\\n      ],\\n      \\\"description\\\": \\\"Идемпотентная операция по предъявленному refresh token; bearer access JWT для неё не требуется.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/logout\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 246\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"IP limit и parsing\\\",\\n          \\\"detail\\\": \\\"Malformed/unknown token либо несовпадающий verifier завершаются no-op. Это не401; transport validation тела всё ещё может дать400.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 245\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Проверенная family → revoke\\\",\\n          \\\"detail\\\": \\\"Для известного verifier расходуется family bucket, затем family блокируется, verifier перепроверяется и фиксируется revoke(LOGOUT).\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\\\",\\n            \\\"line\\\": 261\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ204\\\",\\n          \\\"detail\\\": \\\"Access JWT уже выпущены и не удаляются этой операцией; offline JWT consumers могут принимать их до exp. Другие refresh families не отзываются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 101\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-delete\\\",\\n      \\\"title\\\": \\\"Удаление аккаунта: JWT + пароль + durable request\\\",\\n      \\\"operationIds\\\": [\\n        \\\"requestAccountDeletion\\\"\\n      ],\\n      \\\"description\\\": \\\"Запускает асинхронное удаление. 202 не означает, что все сервисы уже удалили данные.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST /v1/auth/account-deletion-requests\\\",\\n          \\\"detail\\\": \\\"Публичный контракт Identity; поля, security и ответы определяет OpenAPI.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"HTTPS → Identity\\\",\\n          \\\"detail\\\": \\\"Начальный production gateway проксирует /v1/auth/* на HTTP-порт 8080 в VPC. Клиентский X-Forwarded-For удаляется; Authorization и Idempotency-Key сохраняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Строгие headers и authentication\\\",\\n          \\\"detail\\\": \\\"Один Authorization:Bearer и canonical UUIDv4 Idempotency-Key. Затем IP limit, JWT signature/iss/aud/expiry/sub/sid/jti, account limiter. Ошибка access JWT —401; accountId берётся только из sub.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 136\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Проверка currentPassword при каждом запросе\\\",\\n          \\\"detail\\\": \\\"После JWT+limits выполняется Argon2 вне транзакции, включая повтор existing request. Под account lock сверяется credential snapshot; при его изменении проверка повторяется, максимум2 попытки. Existing receipt возвращается только при совпавшем пароле и статусе DELETION_PENDING.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AccountDeletionUseCase.kt\\\",\\n            \\\"line\\\": 40\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Commit запроса и немедленный запрет sessions\\\",\\n          \\\"detail\\\": \\\"Первый успех одной транзакцией меняет account на DELETION_PENDING, сохраняет request, отзывает все refresh families и записывает account.deletion.requested.v1. Неверный пароль активного account учитывается lockout. Неверный пароль при receipt retry даёт401 без изменения lockout; верный retry не создаёт request/event повторно и не открывает sessions.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AccountDeletionUseCase.kt\\\",\\n            \\\"line\\\": 68\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Ответ202 + stable receipt\\\",\\n          \\\"detail\\\": \\\"deletionRequestId/status/requestedAt; no-store/no-cache. Событие дойдёт до Notification асинхронно; до его ingestion удаление там ещё не применено.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 123\\n          }\\n        }\\n      ],\\n      \\\"nextFlows\\\": [\\n        \\\"identity-outbox\\\",\\n        \\\"notification-account-deletion\\\"\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-jwks\\\",\\n      \\\"title\\\": \\\"Публичный JWKS discovery\\\",\\n      \\\"operationIds\\\": [\\n        \\\"getIdentityJwks\\\"\\n      ],\\n      \\\"description\\\": \\\"Не является внутренним domain RPC и не требует user JWT. Клиенты получают только публичные signing keys.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Запрос к фиксированному HTTPS origin\\\",\\n          \\\"detail\\\": \\\"Notification обращается к настроенному JWKS URL; token-controlled jku/x5u/jwk не выбирают источник ключей. Полный HTTP exchange ограничен3 с.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n            \\\"line\\\": 24\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"GET /v1/auth/jwks\\\",\\n          \\\"detail\\\": \\\"Попадает в тот же public /v1/auth/* proxy; специальных приватных endpoint или database lookup не нужно.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/identity.yaml\\\",\\n            \\\"line\\\": 335\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Публичная часть active + retiring\\\",\\n          \\\"detail\\\": \\\"Источник — startup KeyMaterial. Ответ содержит EC/P-256, algES256, useSIG, kid,x,y; приватные параметры в transport не попадают.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/NimbusAccessTokenProvider.kt\\\",\\n            \\\"line\\\": 46\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"200; public max-age300\\\",\\n          \\\"detail\\\": \\\"Контроллер устанавливает public cache5 минут. HTTP handler не обращается к PostgreSQL или NATS.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 130\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Кэш и fail-closed\\\",\\n          \\\"detail\\\": \\\"Кэш300 с; scheduled refresh240 с, глобальный refresh cooldown30 с. Нет пригодных ключей —503, неверный токен при пригодном ключе —401.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n            \\\"line\\\": 78\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"identity-outbox\\\",\\n      \\\"title\\\": \\\"Общее асинхронное продолжение Identity outbox\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"Применяется к email request, account activation и deletion. После commit API-ответ и publisher независимы; порядок доставки и повторов не заменяет inbox.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Transactional outbox\\\",\\n          \\\"detail\\\": \\\"Pending регистрация/resend записывают JWE email event; suppressed/abandoned пути email event не создают. Новый confirm пишет account.activated; первый deletion —account.deletion.requested. Все записи создаются в transaction вызывающего handler.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxIdentityEventRecorder.kt\\\",\\n            \\\"line\\\": 20\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Claim batch и publishAsync\\\",\\n          \\\"detail\\\": \\\"Publisher каждые500 мс забирает до100 записей с lease30 с, формирует envelope producer=identity и Nats-Msg-Id=eventId.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\\\",\\n            \\\"line\\\": 28\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"JetStream PubAck\\\",\\n          \\\"detail\\\": \\\"Публикация cookie.events.<type>.v1; общий batch ACK budget10 с. Сбой/потеря ACK может породить повтор, поэтому доставка at-least-once.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\\\",\\n            \\\"line\\\": 74\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Mark published с fencing\\\",\\n          \\\"detail\\\": \\\"Только успешный PubAck позволяет markPublished(eventId,claimId). Stale completion игнорируется; release назначает retry с jitter1с…5мин.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\\\",\\n            \\\"line\\\": 79\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Consumer → inbox → обработка\\\",\\n          \\\"detail\\\": \\\"Notification подтверждает сообщение только после успешного handler commit; replay тех же eventId не создаёт повторную delivery.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n            \\\"line\\\": 40\\n          }\\n        }\\n      ],\\n      \\\"nextFlows\\\": [\\n        \\\"notification-verification-email\\\",\\n        \\\"notification-account-deletion\\\"\\n      ]\\n    }\\n  ],\\n  \\\"operationNotes\\\": {\\n    \\\"registerWithEmail\\\": {\\n      \\\"flowId\\\": \\\"identity-register\\\",\\n      \\\"notes\\\": [\\n        \\\"202 одинаков для новой попытки, existing email и допустимого exact retry; email может не быть отправлен.\\\",\\n        \\\"Для existing account сохраняется abandoned attempt с id/proof/fingerprint и неотправленным token verifier, без password hash/locale и email event. Exact retry расходует только IP bucket; изменённый payload конфликтует так же, как для pending.\\\",\\n        \\\"Конфликт повторного attemptId/proof с другими данными:409. Validation:400; body>16KiB:413; applicable bucket:429+Retry-After; временная БД/hash capacity:503.\\\",\\n        \\\"Независимый256-битный proof хранится клиентом до отправки; он не включается в JWE/email/link. Новое письмо после expiry требует нового attemptId+proof.\\\"\\n      ]\\n    },\\n    \\\"resendEmailVerification\\\": {\\n      \\\"flowId\\\": \\\"identity-resend\\\",\\n      \\\"notes\\\": [\\n        \\\"202 скрывает наличие account и допустимость resend; неверный proof не выдаёт письмо.\\\",\\n        \\\"Срок попытки24ч не продлевается; cooldown1мин; старые token children не отзываются самим resend и живут до expiry.\\\",\\n        \\\"Suppressed и проигравшие abandoned attempts до исходного expiry добавляют неотправленные token verifiers с тем же cooldown и email limits. Такие tokens не могут подтвердить account и не создают delivery.\\\",\\n        \\\"400 validation;413 body;429 applicable IP/email limits;503 временная зависимость. Новый eventId не сбрасывает прежний UNKNOWN SMTP outcome.\\\"\\n      ]\\n    },\\n    \\\"confirmEmail\\\": {\\n      \\\"flowId\\\": \\\"identity-confirm\\\",\\n      \\\"notes\\\": [\\n        \\\"204 при новом успехе и доказанном exact successful retry в retained audit; сессия не создаётся.\\\",\\n        \\\"Token без proof и proof без token недостаточны; неверная/истёкшая pair или competing account:400 INVALID_VERIFICATION_TOKEN.\\\",\\n        \\\"IP60/15мин, token10/15мин; exact retry обходит только token bucket. Возможны413/429/503. account.activated записывается до commit.\\\"\\n      ]\\n    },\\n    \\\"loginWithEmail\\\": {\\n      \\\"flowId\\\": \\\"identity-login\\\",\\n      \\\"notes\\\": [\\n        \\\"200 после commit refresh family; access15мин, family30дней по default. Secrets response: no-store/no-cache.\\\",\\n        \\\"401 INVALID_CREDENTIALS одинаков для неизвестного email, неверного пароля и недоступного account; lockout с5-й неудачи30с…15мин.\\\",\\n        \\\"400 validation,413 body,429 IP/email,503 БД/hash capacity или два credential snapshot конфликта. Login не публикует event.\\\"\\n      ]\\n    },\\n    \\\"refreshSession\\\": {\\n      \\\"flowId\\\": \\\"identity-refresh\\\",\\n      \\\"notes\\\": [\\n        \\\"Обязателен UUIDv4 Idempotency-Key; access JWT не требуется. Refresh token+key —bearer-sensitive recovery material.\\\",\\n        \\\"Тот же key+predecessor возвращает текущий непосредственный successor; после следующей rotation stale retry даёт401 без revoke. Другой key для использованного credential отзывает family и даёт401.\\\",\\n        \\\"Family TTL не продлевается. 400 malformed key/body,401 invalid refresh,413 body,429 limits,503 зависимость. Token-bearing200 запрещён кэшированию.\\\"\\n      ]\\n    },\\n    \\\"logout\\\": {\\n      \\\"flowId\\\": \\\"identity-logout\\\",\\n      \\\"notes\\\": [\\n        \\\"204 для валидного logout и malformed/unknown/уже отозванного refresh; access JWT не требуется.\\\",\\n        \\\"Отзывается только предъявленная family. Уже выданные access JWT сохраняют криптографическую валидность до exp, если consumer не применил отдельный lifecycle gate.\\\",\\n        \\\"400 transport validation,413 body,429 IP/family,503 зависимость. Событие logout отсутствует.\\\"\\n      ]\\n    },\\n    \\\"requestAccountDeletion\\\": {\\n      \\\"flowId\\\": \\\"identity-delete\\\",\\n      \\\"notes\\\": [\\n        \\\"Единственная из этих mutation-операций требует access JWT; нужны currentPassword и canonical UUIDv4 Idempotency-Key.\\\",\\n        \\\"Повтор с тем же или новым Idempotency-Key возвращает stable202 только после JWT+limits и повторной проверки currentPassword. Неверный пароль всегда даёт401, включая гонку за account lock; pending receipt path не меняет lockout и не открывает sessions.\\\",\\n        \\\"Статус DELETION_PENDING не означает завершение удаления во всех consumers; успешный receipt retry не публикует повторное событие.\\\",\\n        \\\"Неверный JWT:401 INVALID_ACCESS_TOKEN+WWW-Authenticate; неверный пароль:401 INVALID_CREDENTIALS. Также400/413/429/503. Все refresh families отзываются в том же commit, что event.\\\"\\n      ]\\n    },\\n    \\\"getIdentityJwks\\\": {\\n      \\\"flowId\\\": \\\"identity-jwks\\\",\\n      \\\"notes\\\": [\\n        \\\"GET /v1/auth/jwks публичный;200 public,max-age=300. Не требует БД/NATS в самом handler.\\\",\\n        \\\"Только public EC/P-256 signing keys; не выдаёт закрытый JWT-ключ или RSA JWE key. Active/retiring keys читаются на старте сервиса.\\\"\\n      ]\\n    }\\n  }\\n}\\n\",\"docs/architecture/explorer/details/infrastructure.json\":\"{\\n  \\\"serviceId\\\": \\\"infrastructure\\\",\\n  \\\"facts\\\": [\\n    {\\n      \\\"id\\\": \\\"infra-topology\\\",\\n      \\\"label\\\": \\\"Статус топологии\\\",\\n      \\\"value\\\": \\\"Начальный production: single VM, non-HA\\\",\\n      \\\"description\\\": \\\"Реализованы Identity и Notification; один PostgreSQL instance с отдельными БД и один NATS node. Target HA topology ещё TBD.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"docs/architecture/model/services.yaml\\\",\\n        \\\"line\\\": 52\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-current-edge\\\",\\n      \\\"label\\\": \\\"Текущий edge\\\",\\n      \\\"value\\\": \\\"Yandex API Gateway, HTTPS default domain\\\",\\n      \\\"description\\\": \\\"Terraform прямо обозначает gateway временным ingress до готовности домена и Caddy. Это текущая конфигурация репозитория, не подтверждение состояния облака.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n        \\\"line\\\": 257\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-target-edge\\\",\\n      \\\"label\\\": \\\"Целевой edge\\\",\\n      \\\"value\\\": \\\"Caddy; TLS, routing, edge rate limits\\\",\\n      \\\"description\\\": \\\"Модель описывает target Caddy и Redis keyspace rate_limit. Этот target не означает, что Caddy или его counters уже
