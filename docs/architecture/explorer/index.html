.event-direction{padding:12px 30px;background:#f8fafd;border-bottom:1px solid var(--line)}

.catalog-group:last-child{padding-bottom:0}
.catalog-group-heading{position:sticky;top:-15px;z-index:1;display:flex;align-items:center;gap:8px;background:#f9fbfd;border-bottom:1px solid #cad7e7;font-size:14px;line-height:1.4;margin:0 0 7px;padding:13px 5px 11px;flex-wrap:wrap}

id\":\"identity-token-ttl\",\"label\":\"Сроки по умолчанию\",\"source\":{\"line\":46,\"path\":\"backend/services/identity/src/main/resources/application.yaml\"},\"value\":\"JWT 15 мин · refresh family 30 дней\"},{\"description\":\"Срок token ограничен также expiresAt самой попытки. Resend добавляет verifier; email event создаётся только для pending попытки. Для abandoned попытки token остаётся неотправленным и не может подтвердить account.\",\"id\":\"identity-registration-ttl\",\"label\":\"Регистрация\",\"source\":{\"line\":36,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationAttemptIssuer.kt\"},\"value\":\"Попытка 24 ч · email token ≤30 мин · resend ≥1 мин\"},{\"description\":\"Именно такие defaults заданы в application.yaml; это не гарантированный срок доставки письма.\",\"id\":\"identity-registration-defaults\",\"label\":\"Настройки регистрации\",\"source\":{\"line\":48,\"path\":\"backend/services/identity/src/main/resources/application.yaml\"},\"value\":\"P1D / PT30M / PT1M\"},{\"description\":\"Claims: iss, aud, sub=account UUID, sid=family UUID, jti, iat, exp. В JWT нет email, пароля или registrationProof.\",\"id\":\"identity-jwt-profile\",\"label\":\"Access JWT\",\"source\":{\"line\":25,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/NimbusAccessTokenProvider.kt\"},\"value\":\"ES256 / P-256 / typ=at+jwt\"},{\"description\":\"GET /v1/auth/jwks публикует только публичные параметры EC; закрытый ключ подписи остаётся у Identity.\",\"id\":\"identity-jwks\",\"label\":\"Публичные ключи\",\"source\":{\"line\":46,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/NimbusAccessTokenProvider.kt\"},\"value\":\"Активный + retiring; cache 5 мин\"},{\"description\":\"Identity шифрует recipientEmail, token, locale, attemptId и expiresAt публичным ключом Notification. RegistrationProof в payload отсутствует; приватный JWE-ключ нужен только Notification.\",\"id\":\"identity-jwe\",\"label\":\"Email payload\",\"source\":{\"line\":32,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/NotificationPayloadEncryptor.kt\"},\"value\":\"RSA-OAEP-256 + A256GCM\"},{\"description\":\"Refresh successor воспроизводится из predecessor secret, replacementId и Idempotency-Key через HMAC-SHA-256. Exact retry не требует хранения открытого successor.\",\"id\":\"identity-secret-verifiers\",\"label\":\"Refresh и proof\",\"source\":{\"line\":37,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/Sha256SecretTokenService.kt\"},\"value\":\"SHA-256 verifier; секреты не сохраняются открыто\"},{\"description\":\"Salt 16 байт, hash 32 байта; параллельность вычислений ограничена 1…4 permits по CPU, ожидание permit 2 с. Исчерпание capacity даёт 503.\",\"id\":\"identity-argon\",\"label\":\"Пароли\",\"source\":{\"line\":37,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/Argon2PasswordHasher.kt\"},\"value\":\"Argon2 · 19 456 KiB · 2 итерации · p=1\"},{\"description\":\"Экспоненциальная блокировка хранится в account; одинаковый механизм используется при login и первичном подтверждении удаления паролем.\",\"id\":\"identity-lockout\",\"label\":\"Блокировка пароля\",\"source\":{\"line\":162,\"path\":\"backend/services/identity/domain/src/main/kotlin/com/cookie/identity/domain/Account.kt\"},\"value\":\"С 5-й ошибки: 30 с → максимум 15 мин\"},{\"description\":\"IP bucket применяется первым, в том числе к exact retry. Подтверждённый точный повтор не расходует email bucket.\",\"id\":\"identity-register-limits\",\"label\":\"Register limits\",\"source\":{\"line\":11,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 20/час · email 3/час\"},{\"description\":\"Готовая/истёкшая попытка и cooldown могут завершиться no-op до email bucket; оба email окна учитываются перед отказом.\",\"id\":\"identity-resend-limits\",\"label\":\"Resend limits\",\"source\":{\"line\":17,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 30/час · email 1/мин и 5/час\"},{\"description\":\"Дополняют account lockout; для неизвестного email вычисляется dummy hash, ответ не раскрывает наличие аккаунта.\",\"id\":\"identity-login-limits\",\"label\":\"Login limits\",\"source\":{\"line\":27,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 100/15 мин · email 10/15 мин\"},{\"description\":\"Exact successful retry обходит token bucket, но не IP bucket. Неизвестный/невалидный token не создаёт произвольный token scope.\",\"id\":\"identity-confirm-limits\",\"label\":\"Confirm limits\",\"source\":{\"line\":33,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 60/15 мин · token 10/15 мин\"},{\"description\":\"Refresh family bucket расходуется только новой rotation; обнаруженный reuse отзывает family даже без прохождения business bucket.\",\"id\":\"identity-session-limits\",\"label\":\"Refresh / logout limits\",\"source\":{\"line\":40,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 120/мин · family 30/мин для каждой операции\"},{\"description\":\"Account scope определяется только после проверки access JWT; limits применяются и к повторному запросу. Возврат существующего receipt дополнительно требует проверки currentPassword.\",\"id\":\"identity-delete-limits\",\"label\":\"Удаление: limits\",\"source\":{\"line\":54,\"path\":\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\"},\"value\":\"IP 30/час · account 10/час\"},{\"description\":\"Атомарный INSERT ON CONFLICT использует время БД; scope pseudonymized через HMAC. Identity не использует Redis для этих counters.\",\"id\":\"identity-limit-store\",\"label\":\"Хранилище rate limits\",\"source\":{\"line\":21,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/persistence/JdbcRateLimitRepository.kt\"},\"value\":\"PostgreSQL fixed windows\"},{\"description\":\"BoundedRequestBodyFilter ограничивает тело до domain handler; malformed JSON не достигает application IP limiter.\",\"id\":\"identity-http-body\",\"label\":\"HTTP body\",\"source\":{\"line\":237,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/IdentityConfiguration.kt\"},\"value\":\"16 KiB\"},{\"description\":\"Statement timeout 5 с и lock timeout 2 с по умолчанию; значения имеют env overrides. Отдельного общего server request deadline в application.yaml нет.\",\"id\":\"identity-db-defaults\",\"label\":\"JDBC defaults\",\"source\":{\"line\":14,\"path\":\"backend/services/identity/src/main/resources/application.yaml\"},\"value\":\"pool 10; acquire 2 с; validate 1 с; socket 10 с\"},{\"description\":\"Production Compose задаёт отдельные runtime и Flyway роли; их пароли приходят из файлов configtree.\",\"id\":\"identity-db-production\",\"label\":\"JDBC production override\",\"source\":{\"line\":159,\"path\":\"deploy/production/compose.yaml\"},\"value\":\"pool 8 · identity_app / identity_migrator\"},{\"description\":\"SpringTransactionRunner применяет TransactionTemplate и локальные statement/lock timeouts. Транзакция фиксируется до возврата handler.\",\"id\":\"identity-transaction\",\"label\":\"Транзакции\",\"source\":{\"line\":19,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/SpringTransactionRunner.kt\"},\"value\":\"5 с; lock 2 с\"},{\"description\":\"К обеим границам применяется configured attempt-audit retention, по умолчанию 30 дней. У suppressed попытки abandonment наступает сразу, но удаление evidence ждёт также исходного expiry; exact retry не превращаетс  limits. Такие tokens не могут подтвердить account и не создают delivery.\",\"400 validation;413 body;429 applicable IP/email limits;503 временная зависимость. Новый eventId не сбрасывает прежний UNKNOWN SMTP outcome.\"]}},\"serviceId\":\"identity\",\"source\":{\"line\":1,\"path\":\"docs/architecture/explorer/details/identity.json\"}},{\"facts\":[{\"description\":\"Реализованы Identity и Notification; один PostgreSQL instance с отдельными БД и один NATS node. Target HA topology ещё TBD.\",\"id\":\"infra-topology\",\"label\":\"Статус топологии\",\"source\":{\"line\":52,\"path\":\"docs/architecture/model/services.yaml\"},\"value\":\"Начальный production: single VM, non-HA\"},{\"description\":\"Terraform прямо обозначает gateway временным ingress до готовности домена и Caddy. Это текущая конфигурация репозитория, не подтверждение состояния облака.\",\"id\":\"infra-current-edge\",\"label\":\"Текущий edge\",\"source\":{\"line\":257,\"path\":\"infra/terraform/environments/production/main.tf\"},\"value\":\"Yandex API Gateway, HTTPS default domain\"},{\"description\":\"Модель описывает target Caddy и Redis keyspace rate_limit. Этот target не означает, что Caddy или его counters уже развёрнуты в production Compose.\",\"id\":\"infra-target-edge\",\"label\":\"Целевой edge\",\"source\":{\"line\":63,\"path\":\"docs/architecture/model/services.yaml\"},\"value\":\"Caddy; TLS, routing, edge rate limits\"},{\"description\":\"Gateway сохраняет path/query/headers; Authorization и Idempotency-Key проходят. Клиентский X-Forwarded-For удаляется перед HTTP integration.\",\"id\":\"infra-gateway-identity\",\"label\":\"Маршрут Identity\",\"source\":{\"line\":294,\"path\":\"infra/terraform/environments/production/main.tf\"},\"value\":\"/v1/auth/{path+} → private HTTP:8080\"},{\"description\":\"Это отдельный upstream на той же VM. /healthz и /readyz не входят в gateway specification; public source contracts генерируются отдельно.\",\"id\":\"infra-gateway-notification\",\"label\":\"Маршрут Noti eploy/production/deploy.sh\"},\"value\":\"Health180с default; published-port30с\"},{\"description\":\"Metrics/logs/traces backends в модели не выбраны. Actuator HTTP exposure выключен у сервисов; наличие registry metrics не означает deployed monitoring pipeline.\",\"id\":\"infra-telemetry\",\"label\":\"Telemetry\",\"source\":{\"line\":38,\"path\":\"docs/architecture/model/services.yaml\"},\"value\":\"Grafana target; backend TBD\"},{\"description\":\"Production сохраняет /tmp noexec и использует поддерживаемый pure-Java backend BouncyCastle: native CPU probe иначе не может загрузиться из /tmp. Notification pool12 оставляет capacity вне8 push workers. Проверять стоимость Argon2 нагрузкой с этими JVM options.\",\"id\":\"infra-java-crypto\",\"label\":\"JVM crypto и noexec\",\"source\":{\"line\":45,\"path\":\"deploy/production/README.md\"},\"value\":\"BouncyCastle CPU variant = java\"}],\"flows\":[{\"description\":\"Реализованные routes и declared deadlines; отсутствующие конфигурационные значения не заменяются догадками о cloud/framework defaults.\",\"id\":\"infrastructure-ingress\",\"operationIds\":[],\"steps\":[{\"detail\":\"Начальный production использует выданный API Gateway HTTPS domain. Целевой Caddy пока остаётся моделью будущего edge.\",\"label\":\"HTTPS к public gateway\",\"node\":\"mobile_client\",\"source\":{\"line\":24,\"path\":\"docs/architecture/model/services.yaml\"}},{\"detail\":\"/v1/auth/* →Identity8080; /v1/notifications/* →Notification8082. Connect2с/read12с, execution15с; клиентский XFF удаляется.\",\"label\":\"Route только public API\",\"node\":\"gateway\",\"source\":{\"line\":274,\"path\":\"infra/terraform/environments/production/main.tf\"}},{\"detail\":\"Body≤16KiB; application rate limits и JWT/password/refresh checks выполняет Identity. /healthz и /readyz доступны на service port, но не проксируются gateway.\",\"label\":\"Identity boundary\",\"node\":\"identity\",\"source\":{\"line\":231,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/IdentityConfiguration.kt\"}},{\"detail\":\"Body≤16KiB; account определяется из проверенного Identity JWT. Service /readyz дополнительно требует свежие JWKS и usable JWE ring.\",\"label\":\"Notification boundary\",\"node\":\"notification\",\"source\":{\"line\":20,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/SystemController.kt\"}}],\"title\":\"Текущий public ingress и private probes\"},{\"description\":\"Оператор явно выбирает immutable service image. Указание same digest позволяет применить новую конфигурацию; неподанные сервисы сохраняют образ.\",\"id\":\"infrastructure-rollout\",\"operationIds\":[],\"steps\":[{\"detail\":\"Добавление Notification расширяет существующий gateway и сохраняет issuer. Health/readiness probes в gateway не добавляются.\",\"label\":\"Ingress остаётся на прежнем origin\",\"node\":\"gateway\",\"source\":{\"line\":24,\"path\":\"deploy/production/README.md\"}},{\"detail\":\"Deploy запускает PostgreSQL/NATS и ждёт их health перед provisioning и перезапуском приложений.\",\"label\":\"Общая инфраструктура готова\",\"node\":\"identity_db\",\"source\":{\"line\":386,\"path\":\"deploy/production/deploy.sh\"}},{\"detail\":\"Отдельный one-shot создаёт отсутствующую Notification DB/роли и converges grants на существующем volume; приложению admin secret не выдаётся.\",\"label\":\"Повторяемое provisioning\",\"node\":\"notification_db\",\"source\":{\"line\":389,\"path\":\"deploy/production/deploy.sh\"}},{\"detail\":\"nats-init converges existing stream и consumer без reset cursor; runtime consumer работает с ограниченными credentials.\",\"label\":\"Provision stream + consumer\",\"node\":\"nats\",\"source\":{\"line\":31,\"path\":\"deploy/production/scripts/nats-init.sh\"}},{\"detail\":\"Deploy пытается запустить Redis; при отказе сообщает о PostgreSQL scheduler fallback и может продолжить rollout.\",\"label\":\"Допустимое degraded состояние\",\"node\":\"redis\",\"source\":{\"line\":391,\"path\":\"deploy/production/deploy.sh\"}},{\"detail\":\"pending.env сохраняет old/new image pair и attempted services. Перезапускаются только выбранные сервисы в порядке Identity, Notification. Notification останавливается перед новым JVM/Flyway, чтобы старые workers не пересекались с V006.\",\"label\":\"Journal до restart\",\"node\":\"identity\",\"source\":{\"line\":401,\"path\":\"deploy/production/deploy.sh\"}},{\"detail\":\"После container health и published-port readiness обоих выбранных сервисов атомарно фиксируется current.env. При failure recovery восстанавливает attempted services в обратном порядке; DB/Flyway не откатываются.\",\"label\":\"Readiness → commit release\",\"node\":\"notification\",\"source\":{\"line\":406,\"path\":\"deploy/production/deploy.sh\"}}],\"title\":\"Production rollout и восстановление\"},{\"description\":\"Public JWKS discovery — разрешённая синхронная зависимость. Обновления подписных и encryption keys — разные процессы.\",\"id\":\"infrastructure-jwks-startup\",\"operationIds\":[],\"steps\":[{\"detail\":\"Production требует active EC private signing JWK, retiring public keys и public RSA encryption key Notification. Dev/test могут генерировать временные ключи.\",\"label\":\"Startup KeyMaterial\",\"node\":\"identity\",\"source\":{\"line\":35,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/KeyMaterialConfiguration.kt\"}},{\"detail\":\"URL настроен конфигурацией, connect2с, весь JWKS exchange3с; URL из JWT headers не используется. Cache300с, refresh240с/cooldown30с.\",\"label\":\"Фиксированный HTTPS JWKS endpoint\",\"node\":\"notification\",\"source\":{\"line\":24,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\"}},{\"detail\":\"Тот же public gateway route ведёт к Identity; user bearer и internal workload token для JWKS discovery не нужны.\",\"label\":\"Public GET /v1/auth/jwks\",\"node\":\"gateway\",\"source\":{\"line\":274,\"path\":\"infra/terraform/environments/production/main.tf\"}},{\"detail\":\"Active + retiring keys, Cache-Control:public,max-age300. RSA encryption key и private signing material не выдаются этим endpoint.\",\"label\":\"Только public signing keys\",\"node\":\"identity\",\"source\":{\"line\":130,\"path\":\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\"}},{\"detail\":\"Readiness требует PostgreSQL, fresh JWKS cache и usable JWE keys. Новую private JWE key устанавливают у Notification до переключения public encryption key у Identity.\",\"label\":\"Готовность и rotation\",\"node\":\"notification\",\"source\":{\"line\":138,\"path\":\"deploy/production/README.md\"}}],\"title\":\"Readiness Notification и ключи Identity\"}],\"operationNotes\":{},\"serviceId\":\"infrastructure\",\"source\":{\"line\":1,\"path\":\"docs/architecture/explorer/details/infrastructure.json\"}},{\"facts\":[{\"description\":\"registerDevice, unregisterDevice, getNotificationSettings, updateNotificationSettings; accountId не принимается от клиента.\",\"id\":\"notification-api\",\"label\":\"Публичный API\",\"source\":{\"line\":15,\"path\":\"contracts/openapi/public/notification.yaml\"},\"value\":\"4 операции /v1/notifications\"},{\"description\":\"Маршрут /v1/notifications/{path+}; сохраняет headers и query, удаляет входящий X-Forwarded-For; connect timeout 2 s, read timeout 12 s. Caddy остаётся целевой архитектурой.\",\"id\":\"notification-gateway\",\"label\":\"Production ingress\",\"source\":{\"line\":310,\"path\":\"infra/terraform/environments/production/main.tf\"},\"value\":\"Yandex API Gateway → private TCP/8082\"},{\"description\":\"Общий фильтр ограничивает тело, включая запрос без Content-Length, и возвращает 413. JSON-валидатор дополнительно отвергает null, неизвестные поля и неверные scalar types.\",\"id\":\"notification-body\",\"label\":\"HTTP body\",\"source\":{\"line\":33,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationConfiguration.kt\"},\"value\":\"16 KiB\"},{\"description\":\"Контроллер требует Bearer без whitespace внутри токена и берёт userId только из результата проверки JWT sub.\",\"id\":\"notification-jwt-header\",\"label\":\"Bearer и владелец\",\"source\":{\"line\":79,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationsController.kt\"},\"value\":\"ровно 1 Authorization; token ≤8192 символов\"},{\"description\":\"Проверяются подпись, точный issuer и единственный audience, iat/exp/nbf без clock skew; lifetime ≤24 h; sub/sid/jti — UUIDv7. Token-controlled jwk/jku/x5u и crit запрещены.\",\"id\":\"notification-jwt-profile\",\"label\":\"Профиль access JWT\",\"source\":{\"line\":44,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\"},\"value\":\"ES256 / at+jwt / P-256\"},{\"description\":\"Неизвестный kid или истёкший cache вызывает refresh, ограниченный общим cooldown. Старый cache используется только до expiry; неизвестный kid после успешного refresh даёт 401, отсутствие пригодных ключей — 503. Cache/refresh/cooldown зафиксированы в коде, env overrides для этих интервалов нет.\",\"id\":\"notification-jwks-cache\",\"label\":\"JWKS cache и unknown kid\",\"source\":{\"line\":80,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\"},\"value\":\"TTL 300 s; refresh 240 s; cooldown 30 s\"},{\"description\":\"Источник задан COOKIE_IDENTITY_JWKS_URL, а issuer/audience — COOKIE_IDENTITY_ISSUER / COOKIE_IDENTITY_AUDIENCE. HTTP разрешён только dev/test; production требует HTTPS.\",\"id\":\"notification-jwks-http\",\"label\":\"JWKS HTTP\",\"source\":{\"line\":24,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\"},\"value\":\"полный обмен ≤3 s\"},{\"description\":\"Общий HttpClient. Таймауты transport в коде фиксированы, отдельных env overrides для них нет.\",\"id\":\"notification-http-client\",\"label\":\"HTTP client провайдеров и JWKS\",\"source\":{\"line\":33,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/SecurityConfiguration.kt\"},\"value\":\"connect 2 s; без redirects; HTTP/2\"},{\"description\":\"BoundedHttpExchange ограничивает размер ответа и весь обмен, включая зависшее тело; при timeout отменяет future.\",\"id\":\"notification-http-body\",\"label\":\"Ответы HTTP\",\"source\":{\"line\":15,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/BoundedHttpExchange.kt\"},\"value\":\"≤65536 bytes; deadline включает body\"},{\"description\":\"deviceId — непустой ≤255; token — непрозрачный регистрозависимый FCM registration token ≤4096 без control chars для IOS и ANDROID. Trigger хранит digest32 bytes для bounded unique index; перенос проверяет также полный token. Повторная регистрация обновляет revision и отключает прежнего владельца. V006 отключает старые IOS APNs-привязки до регистрации FCM-токена.\",\"id\":\"notification-devices\",\"label\":\"Устройства\",\"source\":{\"line\":46,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\"},\"value\":\"(user_id,device_id) + уникальный активный (platform,SHA-256(token))\"},{\"description\":\"Все типы включены, locale=ru. timezone отсутствует; scheduled push не запускается до явного PATCH timezone.\",\"id\":\"notification-settings-defaults\",\"label\":\"Настройки по умолчанию\",\"source\":{\"line\":14,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/NotificationModels.kt\"},\"value\":\"food 240 min; water 2 h; weigh 08:00; quiet 23:00–08:00\"},{\"description\":\"Поля сливаются частично; timezone нельзя очистить null. Пустой PATCH/раздел, неизвестные поля, null и coercion отвергаются. Время — HH:mm.\",\"id\":\"notification-settings-validation\",\"label\":\"PATCH\",\"source\":{\"line\":28,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/NotificationModels.kt\"},\"value\":\"IANA timezone; locale ru/en; food 1..10080 min\"},{\"description\":\"Первое timezone и повторное включение food/water начинают соответствующий inactivity baseline с текущего времени БД. Смена уже заданной timezone не сбрасывает elapsed inactivity.\",\"id\":\"notification-settings-activation\",\"label\":\"Начало расписания\",\"source\":{\"line\":28,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\"},\"value\":\"первая timezone задаёт baseline\"},{\"description\":\"Будущий user.profile.updated меняет default locale только пока locale_overridden=false. Явный PATCH locale сохраняет приоритет.\",\"id\":\"notification-locale\",\"label\":\"Язык push\",\"source\":{\"line\":72,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\"},\"value\":\"актуальные настройки; ru fallback\"},{\"description\":\"COOKIE_NOTIFICATION_DATABASE_POOL_SIZE переопределяет pool; statement_timeout=5 s, lock_timeout=2 s, socketTimeout=10 s. URL/user/password — COOKIE_NOTIFICATION_DATABASE_*; configtree /run/secrets поддержан.\",\"id\":\"notification-database\",\"label\":\"PostgreSQL timeouts\",\"source\":{\"line\":2,\"path\":\"backend/services/notification/src/main/resources/application.yaml\"},\"value\":\"pool 12 по умолчанию; acquire 2 s; validation 1 s\"},{\"description\":\"Compose задаёт COOKIE_NOTIFICATION_DATABASE_POOL_SIZE=8, отдельные notification_app / notification_migrator и Flyway connection. Это переопределение application default 12.\",\"id\":\"notification-database-production\",\"label\":\"Production pool\",\"source\":{\"line\":296,\"path\":\"deploy/production/compose.yaml\"},\"value\":\"8 connections\"},{\"description\":\"dirty() увеличивает generation и ставит due_at=min(old,new). Redis вызывается только после commit; ошибка индекса не превращает успешную мутацию в HTTP 500.\",\"id\":\"notification-after-commit\",\"label\":\"Изменение deadline\",\"source\":{\"line\":77,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\"},\"value\":\"PostgreSQL transaction → afterCommit Redis hint\"},{\"description\":\"ZSET member=userId:generation, score=epoch milliseconds. Это одноразовые подсказки: scheduler проверяет due_at и generation в PostgreSQL.\",\"id\":\"notification-redis-key\",\"label\":\"Redis index\",\"source\":{\"line\":23,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/RedisDeadlineIndex.kt\"},\"value\":\"cookie:notification:reminder_deadlines\"},{\"description\":\"SPRING_DATA_REDIS_HOST/PORT/USERNAME/PASSWORD; host default localhost, port 6379. Потеря Redis не удаляет расписание.\",\"id\":\"notification-redis-timeouts\",\"label\":\"Redis connection\",\"source\":{\"line\":20,\"path\":\"backend/services/notification/src/main/resources/application.yaml\"},\"value\":\"connect 1 s; command 1 s\"},{\"description\":\"cookie.notification.poll-millis переопределяет tick; COOKIE_NOTIFICATION_SCHEDULER_ENABLED отключает scheduler. PostgreSQL overdue sweep каждые 30 s действует даже при исправном Redis.\",\"id\":\"notification-scheduler-poll\",\"label\":\"Планировщик\",\"source\":{\"line\":36,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\"},\"value\":\"tick 1000 ms; batch ≤100\"},{\"description\":\"cookie.notification.redis-rebuild-millis переопределяет период. Keyset cursor проходит все deadlines, а после первого успешного чтения вслед за ошибкой начинается немедленный rebuild с начала.\",\"id\":\"notification-redis-rebuild\",\"label\":\"Восстановление индекса\",\"source\":{\"line\":27,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/RedisDeadlineIndex.kt\"},\"value\":\"60 s; до 4 страниц ×500 за проход\"},{\"description\":\"В одной PostgreSQL transaction сохраняются occurrence, задания на активные устройства, время резервирования воды и следующий deadline. Unique(user_id,kind,cycle_key) предотвращает дубли; полностью неотправленный FOOD и отменённые дневные reminders текущей даты можно возобновить с прежними ID; submission evidence запрещает повтор. Providers вызываются отдельно от scheduler/ingestion transaction.\",\"id\":\"notification-scheduler-transaction\",\"label\":\"Атомарный выпуск reminder\",\"source\":{\"line\":49,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\"},\"value\":\"per-user advisory lock + unique occurrence\"},{\"description\":\"Интервал настраивается. Цикл включает activation baseline и mealId. Исправление времени меняет deadline; полностью неотправленный CANCELLED/EXPIRED цикл возобновляется с прежними occurrence/job ID. last_submitted_at сохраняет факт отправки после retention jobs. Без еды используется initial cycle. TTL — 1 day от выпуска.\",\"id\":\"notification-food\",\"label\":\"Food policy\",\"source\":{\"line\":75,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"один раз после 240 min в цикле последнего meal\"},{\"description\":\"Anchor учитывает activation, последнюю воду, резервирование и actual submission. Задержанная отправка сдвигает следующий distinct occurrence минимум на2 h; другие устройства того же occurrence разрешены. Quiet/outage сводят пропущенные интервалы в один reminder. Matching Progress consumed≥positive target подавляет воду; неизвестная цель — нет. TTL — 2 h от выпуска.\",\"id\":\"notification-water\",\"label\":\"Water policy\",\"source\":{\"line\":83,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"2 h с последней записи или reminder\"},{\"description\":\"Запись измерения в текущую local date подавляет reminder; учитываются только extant измерения не из будущего. В первый день время раньше schedulingStartedAt не догоняется; предыдущие даты не восстанавливаются.\",\"id\":\"notification-weigh\",\"label\":\"Weigh policy\",\"source\":{\"line\":93,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"один раз за local date, default 08:00\"},{\"description\":\"Два независимых occurrence за local date. Нужны consumed, positive target и unlimitedCalories=false; null не означает zero. Daily delivery истекает на следующей местной полуночи.\",\"id\":\"notification-calories\",\"label\":\"Calories policies\",\"source\":{\"line\":101,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"выше target + ниже 80% с 20:00\"},{\"description\":\"Timezone принадлежит настройкам Notification. Несовпадение/отсутствие snapshot подавляет calorie warnings, но не generic water. Same-day snapshot не имеет произвольного freshness timeout; direct User goal subscriptions отсутствуют.\",\"id\":\"notification-progress-authority\",\"label\":\"Resolved goals\",\"source\":{\"line\":162,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"только Progress snapshot той же timezone и даты\"},{\"description\":\"Food/water используют elapsed UTC durations, quiet/daily — IANA zone. Gap разрешается в первый валидный instant, overlap — ранний offset; quiet end во втором повторном часу выбирает следующую фактическую границу. Daily reminders не переносятся за local date.\",\"id\":\"notification-quiet-dst\",\"label\":\"Quiet hours и DST\",\"source\":{\"line\":10,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPolicy.kt\"},\"value\":\"[start,end); start=end отключает quiet\"},{\"description\":\"Future meal/water/weight пока не влияют на текущую eligibility, но добавляют wakeup. Пропуски не создают пачку исторических reminder occurrences; daily dedup key — date без timezone.\",\"id\":\"notification-future-records\",\"label\":\"Будущие timestamps и outage\",\"source\":{\"line\":48,\"path\":\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\"},\"value\":\"пересчёт при наступлении record time\"},{\"description\":\"Production требует tls://, workload credentials и JKS truststore с hostname verification. HappyEyeballs сохраняет исходное имя брокера для проверки DNS/IP SAN, включая reconnect. COOKIE_NATS_URL/CREDENTIALS_PATH/TRUSTSTORE_PATH/TRUSTSTORE_PASSWORD; приложение bind-ится к заранее созданному consumer.\",\"id\":\"notification-nats-connection\",\"label\":\"NATS transport\",\"source\":{\"line\":66,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationNatsConnection.kt\"},\"value\":\"connect 2 s; reconnect 1 s; unlimited reconnect\"},{\"description\":\"COOKIE_EVENTS; explicit ACK, deliver all, max_deliver=-1, max_ack_pending=128, max_waiting=16, max_batch=32, max_expires=5 s; 10 точных subject filters, replica=1.\",\"id\":\"notification-nats-production\",\"label\":\"Production durable\",\"source\":{\"line\":2,\"path\":\"deploy/production/config/notification-consumer.json\"},\"value\":\"notification-v1; ACK wait 30 s\"},{\"description\":\"Локальный bootstrap создаёт/обновляет stream и consumer. Эти значения отличаются от production provisioning.\",\"id\":\"notification-nats-local\",\"label\":\"Dev/test durable\",\"source\":{\"line\":47,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationNatsConnection.kt\"},\"value\":\"ACK wait 60 s; max_ack_pending=100\"},{\"description\":\"cookie.notification.consumer-poll-millis переопределяет задержку между poll. COOKIE_NOTIFICATION_CONSUMER_ENABLED включает/выключает consumption. ACK только после завершения handler transaction.\",\"id\":\"notification-nats-pull\",\"label\":\"Pull consumer\",\"source\":{\"line\":29,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\"},\"value\":\"до 20 messages / fetch 1 s; poll 100 ms\"},{\"description\":\"Точный верхний предел этой формулы — 256 s (последующий coerceAtMost(300) его не увеличивает). Все ошибки кроме InvalidNotificationEvent повторяются без лимита; broker delivery count не превращает outage в poison.\",\"id\":\"notification-nats-retry\",\"label\":\"Ошибка ingestion\",\"source\":{\"line\":38,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\"},\"value\":\"NAK с задержкой 2^min(deliveredCount,8) s\"},{\"description\":\"File storage, discard old, single replica; duplicate window 10 min. Original quarantine payload может исчезнуть раньше 7 дней при лимите размера/количества.\",\"id\":\"notification-stream-retention\",\"label\":\"JetStream limits\",\"source\":{\"line\":7,\"path\":\"deploy/production/config/cookie-events.json\"},\"value\":\"7 days / 1 GiB / 1M messages / message 1 MiB\"},{\"description\":\"Проверяются v1, matching subject, expected producer; snapshots требуют положительный целочисленный 64-bit aggregate_version. Старые/равные версии игнорируются; хранится allowlist, не блюда и не valueKg.\",\"id\":\"notification-projections\",\"label\":\"Inbox и projections\",\"source\":{\"line\":52,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\"},\"value\":\"event_id dedup; aggregate_version strictly increasing\"},{\"description\":\"Будущие profile/meal/water/weight/progress события покрыты synthetic contract fixtures. Их production producers и замены producers сейчас не развёрнуты.\",\"id\":\"notification-upstream-status\",\"label\":\"Реализованные producers\",\"source\":{\"line\":33,\"path\":\"backend/services/notification/README.md\"},\"value\":\"Identity — реализован; User/Nutrition/Health/Progress — fixtures\"},{\"description\":\"Расшифровка только в worker memory; matching registrationAttemptId и expiresAt, contentType application/json, без compression/crit/token-controlled key URLs. Compact ≤32768 chars, plaintext ≤16384 bytes; locale ru/en с ru fallback.\",\"id\":\"notification-email-crypto\",\"label\":\"Verification email JWE\",\"source\":{\"line\":43,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/VerificationPayloadDecryptor.kt\"},\"value\":\"RSA-OAEP-256 + A256GCM\"},{\"description\":\"COOKIE_NOTIFICATION_PRIVATE_KEY_PATH и COOKIE_NOTIFICATION_RETIRING_PRIVATE_KEY_PATHS; production проверяет mounts и key material при старте. Отсутствующий kid/key временно ставит канал на паузу, неправильный payload завершает FAILED.\",\"id\":\"notification-email-keys\",\"label\":\"JWE key ring\",\"source\":{\"line\":52,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/SecurityConfiguration.kt\"},\"value\":\"до 16 active/retiring key paths\"},{\"description\":\"COOKIE_NOTIFICATION_DELIVERY_ENABLED управляет worker; maintenance каждые 30 s. Поллинг берёт не больше свободных permits.\",\"id\":\"notification-worker\",\"label\":\"Delivery worker\",\"source\":{\"line\":54,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\"},\"value\":\"8 workers; poll 500 ms; heartbeat 15 s\"},{\"description\":\"Каждый claim получает новый lease_token и увеличивает attempt_count; heartbeat/finish/retry fenced по token и живой lease. beginSmtpSubmission фиксируется отдельной REQUIRES_NEW transaction; её timeout 5 s.\",\"id\":\"notification-lease\",\"label\":\"Delivery leases\",\"source\":{\"line\":57,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notific  SMTP_SUBMITTING → UNKNOWN\"},{\"description\":\"Persistent provider_failure_count увеличивается только при Retry; claim attempt_count остаётся аудитом. Unavailable/auth/key, CHANNEL_PAUSED, quiet hours и water interval не расходуют бюджет и backoff. Exponential cap300 s, jitter, минимум10 s; provider minimum может быть больше300 s. Retry после expiry завершает EXPIRED; unavailable канал ставится на60 s pause; Apple credentials — только IOS, общая FCM авторизация — обе платформы.\",\"id\":\"notification-retry\",\"label\":\"Provider retry\",\"source\":{\"line\":138,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\"},\"value\":\"10 retryable provider failures; jitter 10..300 s + provider minimum\"},{\"description\":\"Firebase выполняет downstream-доставку в APNs. Notification задаёт alert, priority10, collapse-id=occurrenceId, apns-id=deliveryId, expiration=job expiry. Ключ Apple загружается в Firebase; прямого APNs-адаптера и secret mount в Notification нет.\",\"id\":\"notification-apns\",\"label\":\"iOS через FCM → APNs\",\"source\":{\"line\":63,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/PushProviders.kt\"},\"value\":\"Apple payload внутри FCM HTTP v1\"},{\"description\":\"IOS и ANDROID; единый FCM HTTP v1. Android: normal priority, notification tag=occurrenceId, TTL=min(remaining lifetime,3600 s). iOS: apns headers; alert формируется Firebase из notification. 401/403 приостанавливают FCM; THIRD_PARTY_AUTH_ERROR приостанавливает только IOS без отключения устройства; UNREGISTERED отключает только submitted revision. 429 Retry-After≥60 s;5xx≥10 s, верхняя граница24 h.\",\"id\":\"notification-fcm\",\"label\":\"FCM\",\"source\":{\"line\":41,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/PushProviders.kt\"},\"value\":\"send ≤15 s; OAuth ≤10 s; refresh lock ≤5 s\"},{\"description\":\"Official ServiceAccountCredentials signing ay проверяет subject/hash оригинала, вызывает тот же handler без republish. Нет HTTP endpoint и нет reset UNKNOWN; отсутствие original — явная ошибка. Ошибки JDBC/broker выводятся безопасным сообщением без исходных данных; контекст CLI закрывается при любом исходе. Lookup использует только STREAM.MSG.GET с timeout2 s, без STREAM.INFO discovery.\",\"id\":\"notification-replay\",\"label\":\"Operator replay\",\"source\":{\"line\":21,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\"},\"value\":\"profile notification-replay + --notification-replay-id\"},{\"description\":\"Очистка каждую60 s, до500 строк каждой таблицы; cookie.notification.retention-poll-millis меняет период. FOOD cycle evidence и account tombstones не истекают автоматически. Terminal delivery jobs удаляются спустя30 days.\",\"id\":\"notification-retention\",\"label\":\"Retention\",\"source\":{\"line\":8,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationRetention.kt\"},\"value\":\"inbox/quarantine/non-FOOD occurrences:30 days\"},{\"description\":\"account.deletion.requested сериализуется с account operations; удаляются devices/settings/projections/deadlines/occurrences/user delivery jobs и cascade attempts. Поздние события и действующий JWT не могут восстановить state после tombstone.\",\"id\":\"notification-deletion\",\"label\":\"Удаление аккаунта\",\"source\":{\"line\":83,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\"},\"value\":\"permanent tombstone + удаление owned state\"},{\"description\":\"/readyz 200/503 проверяет БД isValid(1), свежие signing keys и decryption ring. Redis/NATS/provider outage не входит в readiness; /healthz отвечает200.\",\"id\":\"notification-readiness\",\"label\":\"Readiness\",\"source\":{\"line\":17,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/SystemController.kt\"},\"value\":\"PostgreSQL + usable JWKS + JWE keys\"},{\"description\":\"Scheduler overdue/oldest age, NATS pending/unacknowledged/healthy, delivery pending/age/unknown/failed/metrics.healthy. При ошибке health=0 и последнее backlog значение становится устаревшим, а не нулевым.\",\"id\":\"notification-metrics\",\"label\":\"Диагностика backlog\",\"source\":{\"line\":29,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationRuntimeMetrics.kt\"},\"value\":\"snapshot каждые10 s\"},{\"description\":\"Invalid input400; invalid JWT401; local deleted account403; missing own device404; body limit413; DB/transaction/unusable signing keys503 с Retry-After:1. Ошибки и successful settings/device responses имеют no-store.\",\"id\":\"notification-http-errors\",\"label\":\"Ошибки API\",\"source\":{\"line\":26,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/ApiExceptionHandler.kt\"},\"value\":\"400 /401 /403 /404 /413 /503\"},{\"description\":\"decrypt перечитывает active/retiring paths, если последняя загрузка старше 5 s; readiness также проверяет ring через этот интервал. Отсутствие ключа не разрешает расшифровку другим способом.\",\"id\":\"notification-key-reload\",\"label\":\"Перечитывание JWE key ring\",\"source\":{\"line\":43,\"path\":\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/VerificationPayloadDecryptor.kt\"},\"value\":\"проверка файлов приблизительно каждые 5 s при использовании\"},{\"description\":\"Отдельная transaction удерживает общие с регистрацией/удалением advisory locks до provider outcome. После token lock владелец и lease перечитываются; eligibility присоединяется к этой transaction. Lock timeout2 s, statement timeout5 s. Provider вызов никогда не входит в ingestion transaction. Push сохраняет at-least-once semantics при rollback.\",\"id\":\"notification-push-submission-fence\",\"label\":\"Граница отправки push\", atedAt\":\"2026-10-20\",\"revision\":\"sha256:45de1783310b\"},\"operations\":[{\"contractPath\":\"contracts/openapi/public/identity.yaml\",\"description\":\"Создаёт proof-bound попытку регистрации и запрашивает доставку одноразового verification token. Клиент до запроса генерирует и атомарно сохраняет стабильный registrationAttemptId и независимый 256-битный registrationProof. Точный повтор того же запроса является no-op и после фиксации попытки не расходует email business bucket. Защитный IP bucket применяется ко всем запросам и поэтому повтор также может получить 429. Повтор того же attempt id или proof с изменённым email, password либо locale отклоняется конфликтом. Exact retry истёкшей или проигравшей конкуренцию попытки также остаётся no-op, пока её scrubbed tombstone хранится не менее 30 дней; чтобы получить новое письмо после 24 часов, клиент всегда создаёт новый id и proof. Email token и registrationProof по отдельности не могут активировать credential. Ответ одинаков для нового и уже зарегистрированного email. Сессия выдаётся только отдельным login после подтверждения.\",\"id\":\"registerWithEmail\",\"method\":\"POST\",\"operationId\":\"registerWithEmail\",\"originalOperationId\":\"registerWithEmail\",\"parameters\":[],\"path\":\"/v1/auth/email/register\",\"requestBody\":{\"content\":{\"application/json\":{\"schema\":{\"properties\":{\"email\":{\"description\":\"Email для новой регистрации: ASCII local-part, Unicode- или ASCII-домен и максимум 254 символа в канонической ASCII-форме после IDNA-преобразования. Итоговый домен верхнего уровня должен быть .ru или .рф (xn--p1ai).\",\"format\":\"email\",\"type\":\"string\",\"x-explorer-source\":{\"line\":435,\"path\":\"contracts/openapi/public/identity.yaml\"}},\"locale\":{\"description\":\"Well-formed BCP 47 language tag. Сервер канонизирует регистр subtags. Ограничение 255 символов является защитным product/storage bound, а не ограничением стандарта BCP 47.\",\"example\":\"ru-RU\",\"maxLength\":255,\"type\":\"st e.identity.domain.InvalidInputException\\nimport com.cookie.identity.domain.PasswordAuthenticationResult\\nimport com.cookie.identity.domain.PasswordPolicy\\nimport java.util.UUID\\n\\nclass RequestAccountDeletionHandler(\\n    private val accounts: AccountRepository,\\n    private val deletionRequests: AccountDeletionRequestRepository,\\n    private val families: RefreshFamilyRepository,\\n    private val transactions: TransactionRunner,\\n    private val accessTokens: AccessTokenVerifier,\\n    private val passwordPolicy: PasswordPolicy,\\n    private val passwordHashing: PasswordHashing,\\n    private val rateLimiter: IdentityRateLimiter,\\n    private val ids: IdGenerator,\\n    private val events: IdentityEventRecorder,\\n    private val currentTime: CurrentTimeProvider,\\n) : RequestAccountDeletionUseCase {\\n    override fun execute(command: AccountDeletionCommand): AccountDeletionResult {\\n        rateLimiter.accountDeletionIp(command.ip)\\n        requireRandomUuidV4(command.idempotencyKey)\\n\\n        val authenticated = accessTokens.verify(command.accessToken, currentTime.now())\\n        rateLimiter.accountDeletionAccount(authenticated.accountId.toString())\\n\\n        val password = passwordPolicy.prepareForAuthentication(command.currentPassword)\\n        var observed = accounts.findById(authenticated.accountId)\\n        repeat(MAX_SNAPSHOT_ATTEMPTS) {\\n            val passwordMatches = passwordHashing.matches(\\n                password.value,\\n                observed?.passwordHash ?: passwordHashing.dummyHash,\\n            )\\n            when (val outcome = transactions.required {\\n                val current = accounts.findByIdForUpdate(authenticated.accountId)\\n                if (!sameCredential(observed, current)) return@required DeletionOutcome.Retry\\n                if (current == null) return@required DeletionOutcome.Invalid\\n\\n                val now = currentTime.now()\\n                deletionRequests.findByAccountId(authenticated.accountId)?.let {\\n                    return@required if (current.authenticateDeletionReceipt(passwordMatches, now)) {\\n                        DeletionOutcome.Success(it)\\n                    } else {\\n                        DeletionOutcome.Invalid\\n                    }\\n                }\\n                when (current.authenticatePassword(passwordMatches, now)) {\\n                    PasswordAuthenticationResult.AUTHENTICATED -> {\\n                        val started = AccountDeletionRequest.start(\\n                            id = ids.next(),\\n                            accountId = current.id,\\n                            idempotencyKey = command.idempotencyKey,\\n                            now = now,\\n                        )\\n                        current.requestDeletion(now)\\n                        accounts.save(current)\\n                        deletionRequests.add(started.request)\\n                        families.revokeAllForAccount(current.id, now)\\n                        events.accountDeletionRequested(started.event)\\n                        DeletionOutcome.Success(started.request)\\n                    }\\n                    PasswordAuthenticationResult.REJECTED_WITH_RECORDED_FAILURE -> {\\n                        accounts.save(current)\\n                        DeletionOutcome.Invalid\\n                    }\\n                    PasswordAuthenticationResult.REJECTED -> DeletionOutcome.Invalid\\n                }\\n            }) {\\n                is DeletionOutcome.Success -> return outcome.request.toResult()\\n                DeletionOutcome.Invalid -> throw InvalidCredentialsException()\\n                DeletionOutcome.Retry -> observed = accounts.findById(authenticated.accountId)\\n            }\\n        }\\n        throw IdentityUnavailableException(\\\"Credential changed during account deletion authentication\\\")\\n    }\\n\\n    private fun sameCredential(observed: Account?, current: Account?): Boolean =\\n        observed?.id == current?.id && observed?.passwordHash == current?.passwordHash\\n\\n    private fun AccountDeletionRequest.toResult(): AccountDeletionResult = AccountDeletionResult(\\n        deletionRequestId = id,\\n        status = status,\\n        requestedAt = requestedAt,\\n    )\\n\\n    private fun requireRandomUuidV4(value: UUID) {\\n        if (value.version() != UUID_V4 || value.variant() != RFC_4122_VARIANT) {\\n            throw InvalidInputException(\\\"Invalid account deletion idempotency key\\\")\\n        }\\n    }\\n\\n    private sealed interface DeletionOutcome {\\n        data class Success(val request: AccountDeletionRequest) : DeletionOutcome\\n        data object Invalid : DeletionOutcome\\n        data object Retry : DeletionOutcome\\n    }\\n\\n    private companion object {\\n        const val MAX_SNAPSHOT_ATTEMPTS = 2\\n        const val UUID_V4 = 4\\n        const val RFC_4122_VARIANT = 2\\n    }\\n}\\n\",\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/AuthenticationUseCases.kt\":\"package com.cookie.identity.application\\n\\nimport com.cookie.identity.application.ports.AccountRepository\\nimport com.cookie.identity.application.ports.ConfirmEmailUseCase\\nimport com.cookie.identity.application.ports.CurrentTimeProvider\\nimport com.cookie.identity.application.ports.IdentityEventRecorder\\nimport com.cookie.identity.application.ports.IdGenerator\\nimport com.cookie.identity.application.ports.LoginWithEmailUseCase\\nimport com.cookie.identity.application.ports.LogoutUseCase\\nimport com.cookie.identity.application.ports.PasswordHashing\\nimport com.cookie.identity.application.ports.RefreshFamilyRepository\\nimport com.cookie.identity.application.ports.RefreshTokenService\\nimport com.cookie.identity.application.ports.RefreshSessionUseCase\\nimport com.cookie.identity.application.ports.RegistrationAttemptRepository\\nimport com.cookie.identity.application.ports.RegistrationSecretService\\nimport com.cookie.identity.application.ports.TransactionRunner\\nimport com.cookie.identity.domain.Account\\nimport com.cookie.identity.domain.AccountStatus\\nimport com.cookie.identity.domain.CanonicalEmail\\nimport com.cookie.identity.domain.DeviceId\\nimport com.cookie.identity.domain.InvalidInputException\\nimport com.cookie.identity.domain.InvalidRegistrationProofException\\nimport com.cookie.identity.domain.PasswordPolicy\\nimport com.cookie.identity.domain.PasswordAuthenticationResult\\nimport com.cookie.identity.domain.RefreshDecision\\nimport com.cookie.identity.domain.RefreshFamilyRevokeReason\\nimport com.cookie.identity.domain.RegistrationProof\\nimport com.cookie.identity.domain.RegistrationTokenDecision\\nimport java.util.UUID\\n\\nclass ConfirmEmailHandler(\\n    private val accounts: AccountRepository,\\n    private val attempts: RegistrationAttemptRepository,\\n    private val transactions: TransactionRunner,\\n    private val registrationSecrets: RegistrationSecretService,\\n    private val ids: IdGenerator,\\n    private val rateLimiter: IdentityRateLimiter,\\n    private val events: IdentityEventRecorder,\\n    private val currentTime: CurrentTimeProvider,\\n) : ConfirmEmailUseCase {\\n    override fun execute(rawToken: String, registrationProof: String, ip: String) {\\n        rateLimiter.confirmIp(ip)\\n        val proofHash = try {\\n            registrationSecrets.hashRegistrationProof(RegistrationProof.parse(registrationProof))\\n        } catch (_: InvalidRegistrationProofException) {\\n            throw InvalidActionTokenException()\\n        }\\n        val parsed = try {\\n            registrationSecrets.parseEmailVerificationToken(rawToken)\\n        } catch (_: InvalidTokenException) {\\n            throw InvalidActionTokenException()\\n        }\\n        val observed = attempts.findByTokenId(parsed.tokenId)\\n        val observedTokenHash = observed?.verificationTokenVerifierHash(parsed.tokenId)\\n        val tokenMatches = observedTokenHash != null &&\\n            registrationSecrets.verifierMatches(observedTokenHash, parsed.verifierHash)\\n        val proofMatches = observed != null &&\\n            registrationSecrets.verifierMatches(observed.registrationProofHash, proofHash)\\n        if (\\n            observed?.id == parsed.registrationAttemptId &&\\n            observed.tokenDecision(parsed.tokenId, tokenMatches, proofMatches, currentTime.now()) ==\\n            RegistrationTokenDecision.EXACT_RETRY\\n        ) {\\n            return\\n        }\\n\\n        if (observed == null || observed.id != parsed.registrationAttemptId || !tokenMatches) {\\n            throw InvalidActionTokenException()\\n        }\\n        rateLimiter.confirm(parsed.tokenId.toString())\\n        if (!proofMatches) {\\n            throw InvalidActionTokenException()\\n        }\\n        val confirmed = transactions.required {\\n            accounts.lockRegistration(observed.email)\\n            val existingAccount = accounts.findByEmailForUpdate(observed.email)\\n            val attempt = attempts.findByTokenIdForUpdate(parsed.tokenId) ?: return@required false\\n            if (attempt.id != parsed.registrationAttemptId || attempt.email != observed.email) return@required false\\n            val currentTokenHash = attempt.verificationTokenVerifierHash(parsed.tokenId) ?: return@required false\\n            val currentTokenMatches = registrationSecrets.verifierMatches(currentTokenHash, parsed.verifierHash)\\n            val currentProofMatches = registrationSecrets.verifierMatches(attempt.registrationProofHash, proofHash)\\n            val now = currentTime.now()\\n            when (attempt.tokenDecision(parsed.tokenId, currentTokenMatches, currentProofMatches, now)) {\\n                RegistrationTokenDecision.INVALID -> return@required false\\n                RegistrationTokenDecision.EXACT_RETRY -> {\\n                    return@required attempt.activatedAccountId == existingAccount?.id\\n                }\\n                RegistrationTokenDecision.COMPLETE -> if (existingAccount != null) return@required false\\n            }\\n            val registration = Account.register(\\n                ids.next(),\\n                attempt.email,\\n                attempt.passwordHashForActivation(),\\n                now,\\n            )\\n            accounts.add(registration.account)\\n            attempt.complete(\\n                tokenId = parsed.tokenId,\\n                tokenVerifierMatches = currentTokenMatches,\\n                registrationProofMatches = currentProofMatches,\\n                accountId = registration.account.id,\\n                now = now,\\n            )\\n            attempts.save(attempt)\\n            attempts.abandonPendingByEmailExcept(attempt.email, attempt.id, now)\\n            events.accountActivated(registration.event)\\n            true\\n        }\\n        if (!confirmed) throw InvalidActionTokenException()\\n    }\\n}\\n\\nclass LoginWithEmailHandler(\\n    private val accounts: AccountRepository,\\n    private val transactions: TransactionRunner,\\n    private val passwordPolicy: PasswordPolicy,\\n    private val passwordHashing: PasswordHashing,\\n    private val rateLimiter: IdentityRateLimiter,\\n    private val sessionIssuer: SessionIssuer,\\n    private val currentTime: CurrentTimeProvider,\\n) : LoginWithEmailUseCase {\\n    override fun execute(rawEmail: String, password: String, rawDeviceId: String?, ip: String): IssuedTokens {\\n        rateLimiter.loginIp(ip)\\n        val deviceId = DeviceId.parseOrNull(rawDeviceId)\\n        val normalizedPassword = passwordPolicy.prepareForAuthentication(password)\\n        val email = CanonicalEmail.parse(rawEmail)\\n        rateLimiter.loginEmail(email.value)\\n\\n        var observed = accounts.findByEmail(email)\\n        repeat(MAX_SNAPSHOT_ATTEMPTS) {\\n            val passwordMatches = passwordHashing.matches(\\n                normalizedPassword.value,\\n                observed?.passwordHash ?: passwordHashing.dummyHash,\\n            )\\n            when (val outcome = transactions.required {\\n                val current = accounts.findByEmailForUpdate(email)\\n                if (!sameCredential(observed, current)) return@required LoginOutcome.Retry\\n                if (current == null) return@required LoginOutcome.Invalid\\n                val now = currentTime.now()\\n                when (current.authenticatePassword(passwordMatches, now)) {\\n                    PasswordAuthenticationResult.AUTHENTICATED -> {\\n                        accounts.save(current)\\n                        return@required LoginOutcome.Success(\\n                            sessionIssuer.createFamily(current.id, deviceId, now),\\n                        )\\n                    }\\n                    PasswordAuthenticationResult.REJECTED_WITH_RECORDED_FAILURE -> accounts.save(current)\\n                    PasswordAuthenticationResult.REJECTED -> Unit\\n                }\\n                LoginOutcome.Invalid\\n            }) {\\n                is LoginOutcome.Success -> return outcome.tokens\\n                LoginOutcome.Invalid -> throw InvalidCredentialsException()\\n                LoginOutcome.Retry -> observed = accounts.findByEmail(email)\\n            }\\n        }\\n        throw IdentityUnavailableException(\\\"Credential changed during authentication\\\")\\n    }\\n\\n    private fun sameCredential(observed: com.cookie.identity.domain.Account?, current: com.cookie.identity.domain.Account?): Boolean =\\n        observed?.id == current?.id && observed?.passwordHash == current?.passwordHash\\n\\n    private sealed interface LoginOutcome {\\n        data class Success(val tokens: IssuedTokens) : LoginOutcome\\n        data object Invalid : LoginOutcome\\n        data object Retry : LoginOutcome\\n    }\\n\\n    companion object {\\n        private const val MAX_SNAPSHOT_ATTEMPTS = 2\\n    }\\n}\\n\\nclass RefreshSessionHandler(\\n    private val accounts: AccountRepository,\\n    private val families: RefreshFamilyRepository,\\n    private val transactions: TransactionRunner,\\n    private val refreshTokens: RefreshTokenService,\\n    private val rateLimiter: IdentityRateLimiter,\\n    private val sessionIssuer: SessionIssuer,\\n    private val currentTime: CurrentTimeProvider,\\n) : RefreshSessionUseCase {\\n    override fun execute(rawToken: String, idempotencyKey: UUID, ip: String): IssuedTokens {\\n        rateLimiter.refreshIp(ip)\\n        requireRandomUuidV4(idempotencyKey)\\n        val parsed = refreshTokens.parse(rawToken)\\n        val observed = families.findCredentialLookup(parsed.id) ?: throw InvalidTokenException()\\n        if (!refreshTokens.verifierMatches(observed.verifierHash, parsed.verifierHash)) {\\n            throw InvalidTokenException()\\n        }\\n        return transactions.required {\\n            val account = accounts.findByIdForUpdate(observed.accountId) ?: return@required RefreshOutcome.Invalid\\n            if (account.status != AccountStatus.ACTIVE) return@required RefreshOutcome.Invalid\\n            val family = families.findByCredentialIdForUpdate(parsed.id) ?: return@required RefreshOutcome.Invalid\\n            if (family.accountId != account.id) return@required RefreshOutcome.Invalid\\n            val expectedVerifier = family.verifierHashFor(parsed.id) ?: return@required RefreshOutcome.Invalid\\n            val matches = refreshTokens.verifierMatches(expectedVerifier, parsed.verifierHash)\\n            val now = currentTime.now()\\n            when (family.refreshDecision(parsed.id, matches, idempotencyKey, now)) {\\n                RefreshDecision.INVALID,\\n                RefreshDecision.STALE_RETRY,\\n                -> RefreshOutcome.Invalid\\n                RefreshDecision.TOKEN_REUSE -> {\\n                    // A verified reuse signal is security-critical: throttling must never\\n                    // prevent the family revocation from committing.\\n                    family.revoke(RefreshFamilyRevokeReason.TOKEN_REUSE_DETECTED, now)\\n                    families.save(family)\\n                    RefreshOutcome.Invalid\\n                }\\n                RefreshDecision.ROTATE -> {\\n                    // Only a new rotation spends the family business bucket. Exact replay\\n                    // remains recoverable after Retry-After or client process death.\\n                    rateLimiter.refresh(family.id.toString())\\n                    RefreshOutcome.Success(sessionIssuer.rotate(family, rawToken, idempotencyKey, now))\\n                }\\n                RefreshDecision.RETRY -> RefreshOutcome.Success(\\n                    sessionIssuer.retry(family, rawToken, idempotencyKey, now),\\n                )\\n            }\\n        }.let { outcome ->\\n            when (outcome) {\\n                is RefreshOutcome.Success -> outcome.tokens\\n                RefreshOutcome.Invalid -> throw InvalidTokenException()\\n            }\\n        }\\n    }\\n\\n    private sealed interface RefreshOutcome {\\n        data class Success(val tokens: IssuedTokens) : RefreshOutcome\\n        data object Invalid : RefreshOutcome\\n    }\\n\\n    private fun requireRandomUuidV4(value: UUID) {\\n        if (value.version() != UUID_V4 || value.variant() != RFC_4122_VARIANT) {\\n            throw InvalidInputException(\\\"Invalid refresh idempotency key\\\")\\n        }\\n    }\\n\\n    private companion object {\\n        const val UUID_V4 = 4\\n        const val RFC_4122_VARIANT = 2\\n    }\\n}\\n\\nclass LogoutHandler(\\n    private val families: RefreshFamilyRepository,\\n    private val transactions: TransactionRunner,\\n    private val refreshTokens: RefreshTokenService,\\n    private val rateLimiter: IdentityRateLimiter,\\n    private val currentTime: CurrentTimeProvider,\\n) : LogoutUseCase {\\n    override fun execute(rawToken: String, ip: String) {\\n        rateLimiter.logoutIp(ip)\\n        val parsed = try {\\n            refreshTokens.parse(rawToken)\\n        } catch (_: InvalidTokenException) {\\n            return\\n        }\\n        val observed = families.findCredentialLookup(parsed.id) ?: return\\n        if (!refreshTokens.verifierMatches(observed.verifierHash, parsed.verifierHash)) return\\n        rateLimiter.logout(observed.familyId.toString())\\n        transactions.requiredUnit {\\n            val family = families.findByCredentialIdForUpdate(parsed.id) ?: return@requiredUnit\\n            val expectedVerifier = family.verifierHashFor(parsed.id) ?: return@requiredUnit\\n            if (!refreshTokens.verifierMatches(expectedVerifier, parsed.verifierHash)) return@requiredUnit\\n            val now = currentTime.now()\\n            family.revoke(RefreshFamilyRevokeReason.LOGOUT, now)\\n            families.save(family)\\n        }\\n    }\\n}\\n\",\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/IdentityRateLimiter.kt\":\"package com.cookie.identity.application\\n\\nimport com.cookie.identity.application.ports.RateLimitRepository\\nimport com.cookie.identity.application.ports.RateLimitScopeHasher\\nimport java.time.Duration\\n\\nclass IdentityRateLimiter(\\n    private val repository: RateLimitRepository,\\n    private val scopeHasher: RateLimitScopeHasher,\\n) {\\n    fun registerIp(ip: String) =\\n        check(\\\"register:ip:${digest(IP_NAMESPACE, ip)}\\\", 20, Duration.ofHours(1))\\n\\n    fun registerEmail(email: String) =\\n        check(\\\"register:email:${digest(EMAIL_NAMESPACE, email)}\\\", 3, Duration.ofHours(1))\\n\\n    fun resendIp(ip: String) =\\n        check(\\\"resend:ip:${digest(IP_NAMESPACE, ip)}\\\", 30, Duration.ofHours(1))\\n\\n    fun resendEmail(email: String) {\\n        consumeAll(\\n            Limit(\\\"resend:email-minute:${digest(EMAIL_NAMESPACE, email)}\\\", 1, Duration.ofMinutes(1)),\\n            Limit(\\\"resend:email-hour:${digest(EMAIL_NAMESPACE, email)}\\\", 5, Duration.ofHours(1)),\\n        )\\n    }\\n\\n    fun loginIp(ip: String) =\\n        check(\\\"login:ip:${digest(IP_NAMESPACE, ip)}\\\", 100, Duration.ofMinutes(15))\\n\\n    fun loginEmail(email: String) =\\n        check(\\\"login:email:${digest(EMAIL_NAMESPACE, email)}\\\", 10, Duration.ofMinutes(15))\\n\\n    fun confirm(tokenId: String) {\\n        check(\\\"confirm:token:${digest(TOKEN_NAMESPACE, tokenId)}\\\", 10, Duration.ofMinutes(15))\\n    }\\n\\n    fun confirmIp(ip: String) =\\n        check(\\\"confirm:ip:${digest(IP_NAMESPACE, ip)}\\\", 60, Duration.ofMinutes(15))\\n\\n    fun refreshIp(ip: String) =\\n        check(\\\"refresh:ip:${digest(IP_NAMESPACE, ip)}\\\", 120, Duration.ofMinutes(1))\\n\\n    fun refresh(familyId: String) {\\n        check(\\\"refresh:family:${digest(FAMILY_NAMESPACE, familyId)}\\\", 30, Duration.ofMinutes(1))\\n    }\\n\\n    fun logoutIp(ip: String) =\\n        check(\\\"logout:ip:${digest(IP_NAMESPACE, ip)}\\\", 120, Duration.ofMinutes(1))\\n\\n    fun logout(familyId: String) {\\n        check(\\\"logout:family:${digest(FAMILY_NAMESPACE, familyId)}\\\", 30, Duration.ofMinutes(1))\\n    }\\n\\n    fun accountDeletionIp(ip: String) =\\n        check(\\\"account-deletion:ip:${digest(IP_NAMESPACE, ip)}\\\", 30, Duration.ofHours(1))\\n\\n    fun accountDeletionAccount(accountId: String) =\\n        check(\\\"account-deletion:account:${digest(ACCOUNT_NAMESPACE, accountId)}\\\", 10, Duration.ofHours(1))\\n\\n    /**\\n     * Consume every applicable scope before reporting rejection, so a saturated\\n     * short window does not prevent the longer window from advancing.\\n     */\\n    private fun consumeAll(vararg limits: Limit) {\\n        val exceeded = limits.map { limit -> limit to repository.consume(limit.scope, limit.window) }\\n            .filter { (limit, result) -> result.attemptCount > limit.maxAttempts }\\n        if (exceeded.isNotEmpty()) {\\n            val retryAfter = exceeded.maxOf { (_, result) -> result.retryAfterSeconds }\\n            throw RateLimitExceededException(retryAfter)\\n        }\\n    }\\n\\n    private fun check(scope: String, limit: Int, window: Duration) {\\n        val result = repository.consume(scope, window)\\n        if (result.attemptCount > limit) {\\n            throw RateLimitExceededException(result.retryAfterSeconds)\\n        }\\n    }\\n\\n    private fun digest(namespace: String, value: String): String = scopeHasher.hash(namespace, value)\\n\\n    private data class Limit(\\n        val scope: String,\\n        val maxAttempts: Int,\\n        val window: Duration,\\n    )\\n\\n    private companion object {\\n        const val IP_NAMESPACE = \\\"ip\\\"\\n        const val EMAIL_NAMESPACE = \\\"email\\\"\\n        const val TOKEN_NAMESPACE = \\\"verification-token\\\"\\n        const val FAMILY_NAMESPACE = \\\"refresh-family\\\"\\n        const val ACCOUNT_NAMESPACE = \\\"account\\\"\\n    }\\n}\\n\",\"backend/services/identity/application/src/main/kotlin/com/cookie/identity/application/RegistrationAttemptIssuer.kt\":\"package com.cookie.identity.application\\n\\nimport com.cookie.identity.application.ports.IdGenerator\\nimport com.cookie.identity.application.ports.IdentityEventRecorder\\nimport com.cookie.identity.application.ports.RegistrationAttemptRepository\\nimport com.cookie.identity.application.ports.RegistrationSecretService\\nimport com.cookie.identity.domain.CanonicalEmail\\nimport com.cookie.identity.domain.LocaleTag\\nimport com.cookie.identity.domain.RegistrationAttempt\\nimport com.cookie.identity.domain.VerifierHash\\nimport java.time.Instant\\nimport java.util.UUID\\n\\n/** Creates and persists email-token children; callers own the transaction. */\\nclass RegistrationAttemptIssuer(\\n    private val attempts: RegistrationAttemptRepository,\\n    private val registrationSecrets: RegistrationSecretService,\\n    private val ids: IdGenerator,\\n    private val events: IdentityEventRecorder,\\n    private val policy: IdentityPolicy,\\n) {\\n    @Suppress(\\\"LongParameterList\\\")\\n    fun start(\\n        attemptId: UUID,\\n        email: CanonicalEmail,\\n        pendingPasswordHash: String,\\n        registrationProofHash: VerifierHash,\\n        requestFingerprint: VerifierHash,\\n        locale: LocaleTag?,\\n        now: Instant,\\n        suppressDelivery: Boolean = false,\\n    ) {\\n        val tokenId = ids.next()\\n        val token = registrationSecrets.createEmailVerificationToken(attemptId, tokenId)\\n        val attemptExpiresAt = now.plus(policy.registrationAttemptTtl)\\n        val tokenExpiresAt = minOf(now.plus(policy.verificationTokenTtl), attemptExpiresAt)\\n        attempts.add(\\n            RegistrationAttempt.start(\\n                id = attemptId,\\n                email = email,\\n                registrationProofHash = registrationProofHash,\\n                requestFingerprint = requestFingerprint,\\n                locale = locale,\\n                pendingPasswordHash = pendingPasswordHash,\\n                expiresAt = attemptExpiresAt,\\n                firstTokenId = tokenId,\\n                firstTokenVerifierHash = token.verifierHash,\\n                firstTokenExpiresAt = tokenExpiresAt,\\n                now = now,\\n            ).also { if (suppressDelivery) it.abandon(now) },\\n        )\\n        if (!suppressDelivery) {\\n            recordVerificationRequest(attemptId, email, locale, token.value, tokenExpiresAt, now)\\n        }\\n    }\\n\\n    fun issueVerificationToken(attempt: RegistrationAttempt, now: Instant) {\\n        val tokenId = ids.next()\\n        val token = registrationSecrets.createEmailVerificationToken(attempt.id, tokenId)\\n        val tokenExpiresAt = minOf(now.plus(policy.verificationTokenTtl), attempt.expiresAt)\\n        attempt.issueVerificationToken(\\n            id = tokenId,\\n            verifierHash = token.verifierHash,\\n            expiresAt = tokenExpiresAt,\\n            cooldown = policy.verificationResendCooldown,\\n
