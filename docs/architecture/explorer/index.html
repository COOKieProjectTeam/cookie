/idle timeout и rate-limit quotas отдельно в этом Terraform specification не установлены; значения cloud defaults здесь не выводятся.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n        \\\"line\\\": 303\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-app-deadline\\\",\\n      \\\"label\\\": \\\"Application HTTP deadline\\\",\\n      \\\"value\\\": \\\"Явно не задан в service YAML\\\",\\n      \\\"description\\\": \\\"Identity server config задаёт port и отключает forward-headers; общего handler request deadline нет. DB, Argon2 и outbound вызовы имеют собственные пределы; framework defaults не объявляются как гарантия.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 31\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-ingress-ports\\\",\\n      \\\"label\\\": \\\"Порты приложений\\\",\\n      \\\"value\\\": \\\"Identity host8080→container8080; Notification host8082→container8080\\\",\\n      \\\"description\\\": \\\"Compose default bind127.0.0.1. Для Terraform gateway runbook требует0.0.0.0; SG разрешает ingress только integration source CIDR198.19.0.0/16.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 22\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-private-network\\\",\\n      \\\"label\\\": \\\"Изоляция backend\\\",\\n      \\\"value\\\": \\\"PostgreSQL/NATS/Redis: internal bridge, без host ports\\\",\\n      \\\"description\\\": \\\"Identity и Notification также подключены к edge bridge. Notification нужен outbound HTTPS/SMTP; это не gateway к чужим таблицам.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 29\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-security-group\\\",\\n      \\\"label\\\": \\\"VM ingress\\\",\\n      \\\"value\\\": \\\"SSH allowlist; HTTP8080/8082 только gateway\\\",\\n      \\\"description\\\": \\\"DB/NATS/Redis host ingress не открыт этими rules. Egress ANY IPv4 разрешён; конкретный внешний provider endpoint определяется приложением.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n        \\\"line\\\": 35\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-container-memory\\\",\\n      \\\"label\\\": \\\"Memory limits\\\",\\n      \\\"value\\\": \\\"Identity1536; Notification1536; PostgreSQL1536; NATS512; Redis256 MiB\\\",\\n      \\\"description\\\": \\\"JVM MaxRAMPercentage70. Это стартовые container limits, не фактическое потребление и не capacity guarantee.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 36\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-container-cpu\\\",\\n      \\\"label\\\": \\\"CPU limits\\\",\\n      \\\"value\\\": \\\"Identity1.5; Notification1.5; PostgreSQL1; NATS0.5; Redis0.25\\\",\\n      \\\"description\\\": \\\"CPU quota задана Compose отдельно для контейнеров; VM и службы разделяют физические ресурсы.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 216\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-jdbc\\\",\\n      \\\"label\\\": \\\"JDBC default → production\\\",\\n      \\\"value\\\": \\\"Identity pool10→8; Notification pool12→12\\\",\\n      \\\"description\\\": \\\"Оба runtime подключаются к своим БД собственными app roles; Flyway использует отдельные migrator roles. Acquire2с, validate1с, socket10с, statement5с, lock2с заданы service YAML.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 298\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-existing-volume\\\",\\n      \\\"label\\\": \\\"Новая БД на существующем volume\\\",\\n      \\\"value\\\": \\\"Повторяемый notification-db-provision\\\",\\n      \\\"description\\\": \\\"Admin credential используется только one-shot job. Создаются/проверяются БД и роли, runtime получает DML/USAGE, migrator владеет схемой; неожиданный existing owner вызывает отказ.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/scripts/postgres-provision-notification.sh\\\",\\n        \\\"line\\\": 26\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-nats-wire\\\",\\n      \\\"label\\\": \\\"NATS server\\\",\\n      \\\"value\\\": \\\"TLS:4222; private health:8222; max_payload1MiB\\\",\\n      \\\"description\\\": \\\"TLS handshake2с; write deadline10с. Certificate client verification отключён на TLS-слое, но workload credentials/JWT account auth на NATS обязательны через operator config.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/nats-server.conf\\\",\\n        \\\"line\\\": 5\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-nats-stream\\\",\\n      \\\"label\\\": \\\"JetStream stream\\\",\\n      \\\"value\\\": \\\"COOKIE_EVENTS; cookie.events.>; file; replicas1\\\",\\n      \\\"description\\\": \\\"Limits retention: max7дней,1GiB,1M сообщений,1MiB/сообщение; discard old. Dedup window10мин. При достижении размерного лимита окно хранения может быть короче7дней.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/cookie-events.json\\\",\\n        \\\"line\\\": 7\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-nats-consumer\\\",\\n      \\\"label\\\": \\\"Notification durable\\\",\\n      \\\"value\\\": \\\"notification-v1; explicit ACK; ack_wait30с\\\",\\n      \\\"description\\\": \\\"10 filter subjects; max_ack_pending128, max_waiting16, batch≤32, pull expiry≤5с; max_deliver=-1. Consumer хранит cursor durably, operational replay ограничен broker retention.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/notification-consumer.json\\\",\\n        \\\"line\\\": 6\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-nats-acl\\\",\\n      \\\"label\\\": \\\"Broker runtime ACL\\\",\\n      \\\"value\\\": \\\"Только собственные consumer INFO/NEXT/ACK и inbox\\\",\\n      \\\"description\\\": \\\"Notification runtime credential не читает весь stream и не создаёт consumers; provisioning/replay используют отдельные operator credentials.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/notification-nats-permissions.json\\\",\\n        \\\"line\\\": 2\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-redis-state\\\",\\n      \\\"label\\\": \\\"Redis — производный индекс\\\",\\n      \\\"value\\\": \\\"6379; no persistence; maxmemory128MiB/noeviction\\\",\\n      \\\"description\\\": \\\"Нет snapshot/AOF/volume. Redis loss допускает rebuild и PostgreSQL deadline fallback; counters Identity живут в PostgreSQL, не здесь.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/redis.conf\\\",\\n        \\\"line\\\": 4\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-redis-acl\\\",\\n      \\\"label\\\": \\\"Redis ACL\\\",\\n      \\\"value\\\": \\\"default off; notification; ~cookie:notification:*\\\",\\n      \\\"description\\\": \\\"Разрешены ограниченные sorted-set/deadline/connection команды, ACL с password hash создаётся в tmpfs. FLUSHALL и произвольный SET не разрешены.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/scripts/redis-entrypoint.sh\\\",\\n        \\\"line\\\": 13\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-redis-timeouts\\\",\\n      \\\"label\\\": \\\"Redis client\\\",\\n      \\\"value\\\": \\\"connect1с · command1с\\\",\\n      \\\"description\\\": \\\"Явные Spring Redis значения Notification; временный сбой индекса не должен блокировать авторитетный PostgreSQL scheduler.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 26\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-probes-identity\\\",\\n      \\\"label\\\": \\\"Identity probes\\\",\\n      \\\"value\\\": \\\"/healthz200; /readyz PostgreSQL200/503\\\",\\n      \\\"description\\\": \\\"KeyMaterial проверяется при startup. NATS не входит в readiness, чтобы outage broker не мешал durable outbox и HTTP.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/SystemController.kt\\\",\\n        \\\"line\\\": 21\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-probes-notification\\\",\\n      \\\"label\\\": \\\"Notification probes\\\",\\n      \\\"value\\\": \\\"/healthz200; /readyz DB + fresh JWKS + JWE keyring\\\",\\n      \\\"description\\\": \\\"Readiness возвращает503 при отсутствии этих prerequisites; Redis, NATS и SMTP/FCM не опрашиваются probe-запросом.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/SystemController.kt\\\",\\n        \\\"line\\\": 19\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-compose-health\\\",\\n      \\\"label\\\": \\\"Container healthchecks\\\",\\n      \\\"value\\\": \\\"Оба приложения: interval5с, timeout3с, retries24, start30с\\\",\\n      \\\"description\\\": \\\"Shell healthcheck обращается к /readyz внутри контейнера. PostgreSQL start20с; NATS start10с; их interval5с/timeout3с/retries24. Redis interval5с/timeout3с/retries12.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 207\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-shutdown\\\",\\n      \\\"label\\\": \\\"Остановка приложений\\\",\\n      \\\"value\\\": \\\"Graceful phase20с; Docker stop grace30с\\\",\\n      \\\"description\\\": \\\"Задано одинаково Identity/Notification. PostgreSQL получает60с stop grace; NATS30с. Это бюджет завершения, не rollback данных.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 150\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-providers-disabled\\\",\\n      \\\"label\\\": \\\"Push channels\\\",\\n      \\\"value\\\": \\\"FCM disabled по default для Android и iOS\\\",\\n      \\\"description\\\": \\\"При включении deploy.sh добавляет compose.fcm.yaml для credential mount. Ключ Apple загружается в Firebase. Disabled channel не симулирует accepted delivery; real provider smoke не выполняется healthcheck.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 111\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-production-smtp\\\",\\n      \\\"label\\\": \\\"SMTP production\\\",\\n      \\\"value\\\": \\\"STARTTLS required; port default587\\\",\\n      \\\"description\\\": \\\"Host, username, from и Message-ID domain обязательны; password приходит из configtree secret. Local Mailpit/default1025 не является production provider.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 313\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-secret-boundaries\\\",\\n      \\\"label\\\": \\\"Ключи и secrets\\\",\\n      \\\"value\\\": \\\"File mounts/configtree; отдельные роли\\\",\\n      \\\"description\\\": \\\"Identity получает private JWT signing key и public Notification RSA key. Notification получает private JWE key и public JWT keys через HTTPS JWKS. Реальные secret values и cloud IDs здесь не приводятся.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 133\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-image-deploy\\\",\\n      \\\"label\\\": \\\"Релизы\\\",\\n      \\\"value\\\": \\\"Immutable digest; per-service deploy; durable journal\\\",\\n      \\\"description\\\": \\\"current.env обновляется только после readiness; pending.env записывается до restart. Rollback восстанавливает только затронутые приложения, не откатывает миграции/broker config/provider effects.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 286\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-deploy-deadlines\\\",\\n      \\\"label\\\": \\\"Deploy waits\\\",\\n      \\\"value\\\": \\\"Health180с default; published-port30с\\\",\\n      \\\"description\\\": \\\"Health timeout переопределяется COOKIE_DEPLOY_HEALTH_TIMEOUT_SECONDS. Published-port probe использует curl max-time3с; это operator rollout budget, не HTTP handler deadline.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n        \\\"line\\\": 11\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-telemetry\\\",\\n      \\\"label\\\": \\\"Telemetry\\\",\\n      \\\"value\\\": \\\"Grafana target; backend TBD\\\",\\n      \\\"description\\\": \\\"Metrics/logs/traces backends в модели не выбраны. Actuator HTTP exposure выключен у сервисов; наличие registry metrics не означает deployed monitoring pipeline.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"docs/architecture/model/services.yaml\\\",\\n        \\\"line\\\": 38\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"infra-java-crypto\\\",\\n      \\\"label\\\": \\\"JVM crypto и noexec\\\",\\n      \\\"value\\\": \\\"BouncyCastle CPU variant = java\\\",\\n      \\\"description\\\": \\\"Production сохраняет /tmp noexec и использует поддерживаемый pure-Java backend BouncyCastle: native CPU probe иначе не может загрузиться из /tmp. Notification pool12 оставляет capacity вне8 push workers. Проверять стоимость Argon2 нагрузкой с этими JVM options.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/README.md\\\",\\n        \\\"line\\\": 45\\n      }\\n    }\\n  ],\\n  \\\"flows\\\": [\\n    {\\n      \\\"id\\\": \\\"infrastructure-ingress\\\",\\n      \\\"title\\\": \\\"Текущий public ingress и private probes\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"Реализованные routes и declared deadlines; отсутствующие конфигурационные значения не заменяются догадками о cloud/framework defaults.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"HTTPS к public gateway\\\",\\n          \\\"detail\\\": \\\"Начальный production использует выданный API Gateway HTTPS domain. Целевой Caddy пока остаётся моделью будущего edge.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"docs/architecture/model/services.yaml\\\",\\n            \\\"line\\\": 24\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"Route только public API\\\",\\n          \\\"detail\\\": \\\"/v1/auth/* →Identity8080; /v1/notifications/* →Notification8082. Connect2с/read12с, execution15с; клиентский XFF удаляется.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Identity boundary\\\",\\n          \\\"detail\\\": \\\"Body≤16KiB; application rate limits и JWT/password/refresh checks выполняет Identity. /healthz и /readyz доступны на service port, но не проксируются gateway.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/IdentityConfiguration.kt\\\",\\n            \\\"line\\\": 231\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Notification boundary\\\",\\n          \\\"detail\\\": \\\"Body≤16KiB; account определяется из проверенного Identity JWT. Service /readyz дополнительно требует свежие JWKS и usable JWE ring.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/SystemController.kt\\\",\\n            \\\"line\\\": 20\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"infrastructure-rollout\\\",\\n      \\\"title\\\": \\\"Production rollout и восстановление\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"Оператор явно выбирает immutable service image. Указание same digest позволяет применить новую конфигурацию; неподанные сервисы сохраняют образ.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"Ingress остаётся на прежнем origin\\\",\\n          \\\"detail\\\": \\\"Добавление Notification расширяет существующий gateway и сохраняет issuer. Health/readiness probes в gateway не добавляются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/README.md\\\",\\n            \\\"line\\\": 24\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity_db\\\",\\n          \\\"label\\\": \\\"Общая инфраструктура готова\\\",\\n          \\\"detail\\\": \\\"Deploy запускает PostgreSQL/NATS и ждёт их health перед provisioning и перезапуском приложений.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n            \\\"line\\\": 386\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Повторяемое provisioning\\\",\\n          \\\"detail\\\": \\\"Отдельный one-shot создаёт отсутствующую Notification DB/роли и converges grants на существующем volume; приложению admin secret не выдаётся.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n            \\\"line\\\": 389\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"Provision stream + consumer\\\",\\n          \\\"detail\\\": \\\"nats-init converges existing stream и consumer без reset cursor; runtime consumer работает с ограниченными credentials.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/scripts/nats-init.sh\\\",\\n            \\\"line\\\": 31\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"Допустимое degraded состояние\\\",\\n          \\\"detail\\\": \\\"Deploy пытается запустить Redis; при отказе сообщает о PostgreSQL scheduler fallback и может продолжить rollout.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n            \\\"line\\\": 391\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Journal до restart\\\",\\n          \\\"detail\\\": \\\"pending.env сохраняет old/new image pair и attempted services. Перезапускаются только выбранные сервисы в порядке Identity, Notification. Notification останавливается перед новым JVM/Flyway, чтобы старые workers не пересекались с V006.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n            \\\"line\\\": 401\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Readiness → commit release\\\",\\n          \\\"detail\\\": \\\"После container health и published-port readiness обоих выбранных сервисов атомарно фиксируется current.env. При failure recovery восстанавливает attempted services в обратном порядке; DB/Flyway не откатываются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/deploy.sh\\\",\\n            \\\"line\\\": 406\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"infrastructure-jwks-startup\\\",\\n      \\\"title\\\": \\\"Readiness Notification и ключи Identity\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"Public JWKS discovery — разрешённая синхронная зависимость. Обновления подписных и encryption keys — разные процессы.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Startup KeyMaterial\\\",\\n          \\\"detail\\\": \\\"Production требует active EC private signing JWK, retiring public keys и public RSA encryption key Notification. Dev/test могут генерировать временные ключи.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/security/KeyMaterialConfiguration.kt\\\",\\n            \\\"line\\\": 35\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Фиксированный HTTPS JWKS endpoint\\\",\\n          \\\"detail\\\": \\\"URL настроен конфигурацией, connect2с, весь JWKS exchange3с; URL из JWT headers не используется. Cache300с, refresh240с/cooldown30с.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n            \\\"line\\\": 24\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"Public GET /v1/auth/jwks\\\",\\n          \\\"detail\\\": \\\"Тот же public gateway route ведёт к Identity; user bearer и internal workload token для JWKS discovery не нужны.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 274\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"Только public signing keys\\\",\\n          \\\"detail\\\": \\\"Active + retiring keys, Cache-Control:public,max-age300. RSA encryption key и private signing material не выдаются этим endpoint.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\\\",\\n            \\\"line\\\": 130\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Готовность и rotation\\\",\\n          \\\"detail\\\": \\\"Readiness требует PostgreSQL, fresh JWKS cache и usable JWE keys. Новую private JWE key устанавливают у Notification до переключения public encryption key у Identity.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/README.md\\\",\\n            \\\"line\\\": 138\\n          }\\n        }\\n      ]\\n    }\\n  ],\\n  \\\"operationNotes\\\": {}\\n}\\n\",\"docs/architecture/explorer/details/notification.json\":\"{\\n  \\\"serviceId\\\": \\\"notification\\\",\\n  \\\"facts\\\": [\\n    {\\n      \\\"id\\\": \\\"notification-api\\\",\\n      \\\"label\\\": \\\"Публичный API\\\",\\n      \\\"value\\\": \\\"4 операции /v1/notifications\\\",\\n      \\\"description\\\": \\\"registerDevice, unregisterDevice, getNotificationSettings, updateNotificationSettings; accountId не принимается от клиента.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"contracts/openapi/public/notification.yaml\\\",\\n        \\\"line\\\": 15\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-gateway\\\",\\n      \\\"label\\\": \\\"Production ingress\\\",\\n      \\\"value\\\": \\\"Yandex API Gateway → private TCP/8082\\\",\\n      \\\"description\\\": \\\"Маршрут /v1/notifications/{path+}; сохраняет headers и query, удаляет входящий X-Forwarded-For; connect timeout 2 s, read timeout 12 s. Caddy остаётся целевой архитектурой.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n        \\\"line\\\": 310\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-body\\\",\\n      \\\"label\\\": \\\"HTTP body\\\",\\n      \\\"value\\\": \\\"16 KiB\\\",\\n      \\\"description\\\": \\\"Общий фильтр ограничивает тело, включая запрос без Content-Length, и возвращает 413. JSON-валидатор дополнительно отвергает null, неизвестные поля и неверные scalar types.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationConfiguration.kt\\\",\\n        \\\"line\\\": 33\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-jwt-header\\\",\\n      \\\"label\\\": \\\"Bearer и владелец\\\",\\n      \\\"value\\\": \\\"ровно 1 Authorization; token ≤8192 символов\\\",\\n      \\\"description\\\": \\\"Контроллер требует Bearer без whitespace внутри токена и берёт userId только из результата проверки JWT sub.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationsController.kt\\\",\\n        \\\"line\\\": 79\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-jwt-profile\\\",\\n      \\\"label\\\": \\\"Профиль access JWT\\\",\\n      \\\"value\\\": \\\"ES256 / at+jwt / P-256\\\",\\n      \\\"description\\\": \\\"Проверяются подпись, точный issuer и единственный audience, iat/exp/nbf без clock skew; lifetime ≤24 h; sub/sid/jti — UUIDv7. Token-controlled jwk/jku/x5u и crit запрещены.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n        \\\"line\\\": 44\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-jwks-cache\\\",\\n      \\\"label\\\": \\\"JWKS cache и unknown kid\\\",\\n      \\\"value\\\": \\\"TTL 300 s; refresh 240 s; cooldown 30 s\\\",\\n      \\\"description\\\": \\\"Неизвестный kid или истёкший cache вызывает refresh, ограниченный общим cooldown. Старый cache используется только до expiry; неизвестный kid после успешного refresh даёт 401, отсутствие пригодных ключей — 503. Cache/refresh/cooldown зафиксированы в коде, env overrides для этих интервалов нет.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n        \\\"line\\\": 80\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-jwks-http\\\",\\n      \\\"label\\\": \\\"JWKS HTTP\\\",\\n      \\\"value\\\": \\\"полный обмен ≤3 s\\\",\\n      \\\"description\\\": \\\"Источник задан COOKIE_IDENTITY_JWKS_URL, а issuer/audience — COOKIE_IDENTITY_ISSUER / COOKIE_IDENTITY_AUDIENCE. HTTP разрешён только dev/test; production требует HTTPS.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n        \\\"line\\\": 24\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-http-client\\\",\\n      \\\"label\\\": \\\"HTTP client провайдеров и JWKS\\\",\\n      \\\"value\\\": \\\"connect 2 s; без redirects; HTTP/2\\\",\\n      \\\"description\\\": \\\"Общий HttpClient. Таймауты transport в коде фиксированы, отдельных env overrides для них нет.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/SecurityConfiguration.kt\\\",\\n        \\\"line\\\": 33\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-http-body\\\",\\n      \\\"label\\\": \\\"Ответы HTTP\\\",\\n      \\\"value\\\": \\\"≤65536 bytes; deadline включает body\\\",\\n      \\\"description\\\": \\\"BoundedHttpExchange ограничивает размер ответа и весь обмен, включая зависшее тело; при timeout отменяет future.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/BoundedHttpExchange.kt\\\",\\n        \\\"line\\\": 15\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-devices\\\",\\n      \\\"label\\\": \\\"Устройства\\\",\\n      \\\"value\\\": \\\"(user_id,device_id) + уникальный активный (platform,SHA-256(token))\\\",\\n      \\\"description\\\": \\\"deviceId — непустой ≤255; token — непрозрачный регистрозависимый FCM registration token ≤4096 без control chars для IOS и ANDROID. Trigger хранит digest32 bytes для bounded unique index; перенос проверяет также полный token. Повторная регистрация обновляет revision и отключает прежнего владельца. V006 отключает старые IOS APNs-привязки до регистрации FCM-токена.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n        \\\"line\\\": 46\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-settings-defaults\\\",\\n      \\\"label\\\": \\\"Настройки по умолчанию\\\",\\n      \\\"value\\\": \\\"food 240 min; water 2 h; weigh 08:00; quiet 23:00–08:00\\\",\\n      \\\"description\\\": \\\"Все типы включены, locale=ru. timezone отсутствует; scheduled push не запускается до явного PATCH timezone.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/NotificationModels.kt\\\",\\n        \\\"line\\\": 14\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-settings-validation\\\",\\n      \\\"label\\\": \\\"PATCH\\\",\\n      \\\"value\\\": \\\"IANA timezone; locale ru/en; food 1..10080 min\\\",\\n      \\\"description\\\": \\\"Поля сливаются частично; timezone нельзя очистить null. Пустой PATCH/раздел, неизвестные поля, null и coercion отвергаются. Время — HH:mm.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/NotificationModels.kt\\\",\\n        \\\"line\\\": 28\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-settings-activation\\\",\\n      \\\"label\\\": \\\"Начало расписания\\\",\\n      \\\"value\\\": \\\"первая timezone задаёт baseline\\\",\\n      \\\"description\\\": \\\"Первое timezone и повторное включение food/water начинают соответствующий inactivity baseline с текущего времени БД. Смена уже заданной timezone не сбрасывает elapsed inactivity.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n        \\\"line\\\": 28\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-locale\\\",\\n      \\\"label\\\": \\\"Язык push\\\",\\n      \\\"value\\\": \\\"актуальные настройки; ru fallback\\\",\\n      \\\"description\\\": \\\"Будущий user.profile.updated меняет default locale только пока locale_overridden=false. Явный PATCH locale сохраняет приоритет.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n        \\\"line\\\": 72\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-database\\\",\\n      \\\"label\\\": \\\"PostgreSQL timeouts\\\",\\n      \\\"value\\\": \\\"pool 12 по умолчанию; acquire 2 s; validation 1 s\\\",\\n      \\\"description\\\": \\\"COOKIE_NOTIFICATION_DATABASE_POOL_SIZE переопределяет pool; statement_timeout=5 s, lock_timeout=2 s, socketTimeout=10 s. URL/user/password — COOKIE_NOTIFICATION_DATABASE_*; configtree /run/secrets поддержан.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 2\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-database-production\\\",\\n      \\\"label\\\": \\\"Production pool\\\",\\n      \\\"value\\\": \\\"8 connections\\\",\\n      \\\"description\\\": \\\"Compose задаёт COOKIE_NOTIFICATION_DATABASE_POOL_SIZE=8, отдельные notification_app / notification_migrator и Flyway connection. Это переопределение application default 12.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/compose.yaml\\\",\\n        \\\"line\\\": 296\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-after-commit\\\",\\n      \\\"label\\\": \\\"Изменение deadline\\\",\\n      \\\"value\\\": \\\"PostgreSQL transaction → afterCommit Redis hint\\\",\\n      \\\"description\\\": \\\"dirty() увеличивает generation и ставит due_at=min(old,new). Redis вызывается только после commit; ошибка индекса не превращает успешную мутацию в HTTP 500.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n        \\\"line\\\": 77\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-redis-key\\\",\\n      \\\"label\\\": \\\"Redis index\\\",\\n      \\\"value\\\": \\\"cookie:notification:reminder_deadlines\\\",\\n      \\\"description\\\": \\\"ZSET member=userId:generation, score=epoch milliseconds. Это одноразовые подсказки: scheduler проверяет due_at и generation в PostgreSQL.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/RedisDeadlineIndex.kt\\\",\\n        \\\"line\\\": 23\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-redis-timeouts\\\",\\n      \\\"label\\\": \\\"Redis connection\\\",\\n      \\\"value\\\": \\\"connect 1 s; command 1 s\\\",\\n      \\\"description\\\": \\\"SPRING_DATA_REDIS_HOST/PORT/USERNAME/PASSWORD; host default localhost, port 6379. Потеря Redis не удаляет расписание.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 20\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-scheduler-poll\\\",\\n      \\\"label\\\": \\\"Планировщик\\\",\\n      \\\"value\\\": \\\"tick 1000 ms; batch ≤100\\\",\\n      \\\"description\\\": \\\"cookie.notification.poll-millis переопределяет tick; COOKIE_NOTIFICATION_SCHEDULER_ENABLED отключает scheduler. PostgreSQL overdue sweep каждые 30 s действует даже при исправном Redis.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n        \\\"line\\\": 36\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-redis-rebuild\\\",\\n      \\\"label\\\": \\\"Восстановление индекса\\\",\\n      \\\"value\\\": \\\"60 s; до 4 страниц ×500 за проход\\\",\\n      \\\"description\\\": \\\"cookie.notification.redis-rebuild-millis переопределяет период. Keyset cursor проходит все deadlines, а после первого успешного чтения вслед за ошибкой начинается немедленный rebuild с начала.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/RedisDeadlineIndex.kt\\\",\\n        \\\"line\\\": 27\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-scheduler-transaction\\\",\\n      \\\"label\\\": \\\"Атомарный выпуск reminder\\\",\\n      \\\"value\\\": \\\"per-user advisory lock + unique occurrence\\\",\\n      \\\"description\\\": \\\"В одной PostgreSQL transaction сохраняются occurrence, задания на активные устройства, время резервирования воды и следующий deadline. Unique(user_id,kind,cycle_key) предотвращает дубли; полностью неотправленный FOOD и отменённые дневные reminders текущей даты можно возобновить с прежними ID; submission evidence запрещает повтор. Providers вызываются отдельно от scheduler/ingestion transaction.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n        \\\"line\\\": 49\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-food\\\",\\n      \\\"label\\\": \\\"Food policy\\\",\\n      \\\"value\\\": \\\"один раз после 240 min в цикле последнего meal\\\",\\n      \\\"description\\\": \\\"Интервал настраивается. Цикл включает activation baseline и mealId. Исправление времени меняет deadline; полностью неотправленный CANCELLED/EXPIRED цикл возобновляется с прежними occurrence/job ID. last_submitted_at сохраняет факт отправки после retention jobs. Без еды используется initial cycle. TTL — 1 day от выпуска.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 75\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-water\\\",\\n      \\\"label\\\": \\\"Water policy\\\",\\n      \\\"value\\\": \\\"2 h с последней записи или reminder\\\",\\n      \\\"description\\\": \\\"Anchor учитывает activation, последнюю воду, резервирование и actual submission. Задержанная отправка сдвигает следующий distinct occurrence минимум на2 h; другие устройства того же occurrence разрешены. Quiet/outage сводят пропущенные интервалы в один reminder. Matching Progress consumed≥positive target подавляет воду; неизвестная цель — нет. TTL — 2 h от выпуска.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 83\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-weigh\\\",\\n      \\\"label\\\": \\\"Weigh policy\\\",\\n      \\\"value\\\": \\\"один раз за local date, default 08:00\\\",\\n      \\\"description\\\": \\\"Запись измерения в текущую local date подавляет reminder; учитываются только extant измерения не из будущего. В первый день время раньше schedulingStartedAt не догоняется; предыдущие даты не восстанавливаются.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 93\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-calories\\\",\\n      \\\"label\\\": \\\"Calories policies\\\",\\n      \\\"value\\\": \\\"выше target + ниже 80% с 20:00\\\",\\n      \\\"description\\\": \\\"Два независимых occurrence за local date. Нужны consumed, positive target и unlimitedCalories=false; null не означает zero. Daily delivery истекает на следующей местной полуночи.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 101\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-progress-authority\\\",\\n      \\\"label\\\": \\\"Resolved goals\\\",\\n      \\\"value\\\": \\\"только Progress snapshot той же timezone и даты\\\",\\n      \\\"description\\\": \\\"Timezone принадлежит настройкам Notification. Несовпадение/отсутствие snapshot подавляет calorie warnings, но не generic water. Same-day snapshot не имеет произвольного freshness timeout; direct User goal subscriptions отсутствуют.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 162\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-quiet-dst\\\",\\n      \\\"label\\\": \\\"Quiet hours и DST\\\",\\n      \\\"value\\\": \\\"[start,end); start=end отключает quiet\\\",\\n      \\\"description\\\": \\\"Food/water используют elapsed UTC durations, quiet/daily — IANA zone. Gap разрешается в первый валидный instant, overlap — ранний offset; quiet end во втором повторном часу выбирает следующую фактическую границу. Daily reminders не переносятся за local date.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPolicy.kt\\\",\\n        \\\"line\\\": 10\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-future-records\\\",\\n      \\\"label\\\": \\\"Будущие timestamps и outage\\\",\\n      \\\"value\\\": \\\"пересчёт при наступлении record time\\\",\\n      \\\"description\\\": \\\"Future meal/water/weight пока не влияют на текущую eligibility, но добавляют wakeup. Пропуски не создают пачку исторических reminder occurrences; daily dedup key — date без timezone.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n        \\\"line\\\": 48\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-nats-connection\\\",\\n      \\\"label\\\": \\\"NATS transport\\\",\\n      \\\"value\\\": \\\"connect 2 s; reconnect 1 s; unlimited reconnect\\\",\\n      \\\"description\\\": \\\"Production требует tls://, workload credentials и JKS truststore с hostname verification. HappyEyeballs сохраняет исходное имя брокера для проверки DNS/IP SAN, включая reconnect. COOKIE_NATS_URL/CREDENTIALS_PATH/TRUSTSTORE_PATH/TRUSTSTORE_PASSWORD; приложение bind-ится к заранее созданному consumer.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationNatsConnection.kt\\\",\\n        \\\"line\\\": 66\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-nats-production\\\",\\n      \\\"label\\\": \\\"Production durable\\\",\\n      \\\"value\\\": \\\"notification-v1; ACK wait 30 s\\\",\\n      \\\"description\\\": \\\"COOKIE_EVENTS; explicit ACK, deliver all, max_deliver=-1, max_ack_pending=128, max_waiting=16, max_batch=32, max_expires=5 s; 10 точных subject filters, replica=1.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/notification-consumer.json\\\",\\n        \\\"line\\\": 2\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-nats-local\\\",\\n      \\\"label\\\": \\\"Dev/test durable\\\",\\n      \\\"value\\\": \\\"ACK wait 60 s; max_ack_pending=100\\\",\\n      \\\"description\\\": \\\"Локальный bootstrap создаёт/обновляет stream и consumer. Эти значения отличаются от production provisioning.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationNatsConnection.kt\\\",\\n        \\\"line\\\": 47\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-nats-pull\\\",\\n      \\\"label\\\": \\\"Pull consumer\\\",\\n      \\\"value\\\": \\\"до 20 messages / fetch 1 s; poll 100 ms\\\",\\n      \\\"description\\\": \\\"cookie.notification.consumer-poll-millis переопределяет задержку между poll. COOKIE_NOTIFICATION_CONSUMER_ENABLED включает/выключает consumption. ACK только после завершения handler transaction.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n        \\\"line\\\": 29\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-nats-retry\\\",\\n      \\\"label\\\": \\\"Ошибка ingestion\\\",\\n      \\\"value\\\": \\\"NAK с задержкой 2^min(deliveredCount,8) s\\\",\\n      \\\"description\\\": \\\"Точный верхний предел этой формулы — 256 s (последующий coerceAtMost(300) его не увеличивает). Все ошибки кроме InvalidNotificationEvent повторяются без лимита; broker delivery count не превращает outage в poison.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n        \\\"line\\\": 38\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-stream-retention\\\",\\n      \\\"label\\\": \\\"JetStream limits\\\",\\n      \\\"value\\\": \\\"7 days / 1 GiB / 1M messages / message 1 MiB\\\",\\n      \\\"description\\\": \\\"File storage, discard old, single replica; duplicate window 10 min. Original quarantine payload может исчезнуть раньше 7 дней при лимите размера/количества.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"deploy/production/config/cookie-events.json\\\",\\n        \\\"line\\\": 7\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-projections\\\",\\n      \\\"label\\\": \\\"Inbox и projections\\\",\\n      \\\"value\\\": \\\"event_id dedup; aggregate_version strictly increasing\\\",\\n      \\\"description\\\": \\\"Проверяются v1, matching subject, expected producer; snapshots требуют положительный целочисленный 64-bit aggregate_version. Старые/равные версии игнорируются; хранится allowlist, не блюда и не valueKg.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n        \\\"line\\\": 52\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-upstream-status\\\",\\n      \\\"label\\\": \\\"Реализованные producers\\\",\\n      \\\"value\\\": \\\"Identity — реализован; User/Nutrition/Health/Progress — fixtures\\\",\\n      \\\"description\\\": \\\"Будущие profile/meal/water/weight/progress события покрыты synthetic contract fixtures. Их production producers и замены producers сейчас не развёрнуты.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/README.md\\\",\\n        \\\"line\\\": 33\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-email-crypto\\\",\\n      \\\"label\\\": \\\"Verification email JWE\\\",\\n      \\\"value\\\": \\\"RSA-OAEP-256 + A256GCM\\\",\\n      \\\"description\\\": \\\"Расшифровка только в worker memory; matching registrationAttemptId и expiresAt, contentType application/json, без compression/crit/token-controlled key URLs. Compact ≤32768 chars, plaintext ≤16384 bytes; locale ru/en с ru fallback.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/VerificationPayloadDecryptor.kt\\\",\\n        \\\"line\\\": 43\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-email-keys\\\",\\n      \\\"label\\\": \\\"JWE key ring\\\",\\n      \\\"value\\\": \\\"до 16 active/retiring key paths\\\",\\n      \\\"description\\\": \\\"COOKIE_NOTIFICATION_PRIVATE_KEY_PATH и COOKIE_NOTIFICATION_RETIRING_PRIVATE_KEY_PATHS; production проверяет mounts и key material при старте. Отсутствующий kid/key временно ставит канал на паузу, неправильный payload завершает FAILED.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/SecurityConfiguration.kt\\\",\\n        \\\"line\\\": 52\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-worker\\\",\\n      \\\"label\\\": \\\"Delivery worker\\\",\\n      \\\"value\\\": \\\"8 workers; poll 500 ms; heartbeat 15 s\\\",\\n      \\\"description\\\": \\\"COOKIE_NOTIFICATION_DELIVERY_ENABLED управляет worker; maintenance каждые 30 s. Поллинг берёт не больше свободных permits.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n        \\\"line\\\": 54\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-lease\\\",\\n      \\\"label\\\": \\\"Delivery leases\\\",\\n      \\\"value\\\": \\\"120 s; FOR UPDATE SKIP LOCKED\\\",\\n      \\\"description\\\": \\\"Каждый claim получает новый lease_token и увеличивает attempt_count; heartbeat/finish/retry fenced по token и живой lease. beginSmtpSubmission фиксируется отдельной REQUIRES_NEW transaction; её timeout 5 s.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/JdbcDeliveryRepository.kt\\\",\\n        \\\"line\\\": 57\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-delivery-states\\\",\\n      \\\"label\\\": \\\"Delivery state\\\",\\n      \\\"value\\\": \\\"PENDING → CLAIMED → terminal / retry\\\",\\n      \\\"description\\\": \\\"Terminal: ACCEPTED, FAILED, UNKNOWN, CANCELLED, EXPIRED. EMAIL дополнительно проходит SMTP_SUBMITTING. ACCEPTED подтверждает принятие provider, не показ/прочтение. Terminal finish удаляет encrypted_payload.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/db/migration/V002__delivery_queue.sql\\\",\\n        \\\"line\\\": 15\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-smtp-timeouts\\\",\\n      \\\"label\\\": \\\"SMTP phases\\\",\\n      \\\"value\\\": \\\"connect 5 s; read/write 30 s; phase deadlines 60 s\\\",\\n      \\\"description\\\": \\\"Отдельные 60 s deadlines подготовки connect/auth и sendMessage закрывают underlying socket. Production требует STARTTLS и hostname verification; настройки host/port/user/password/from/domain задаются COOKIE_SMTP_*.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/SmtpVerificationSender.kt\\\",\\n        \\\"line\\\": 35\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-smtp-retry\\\",\\n      \\\"label\\\": \\\"SMTP certainty\\\",\\n      \\\"value\\\": \\\"4xx retry; 5xx FAILED; ambiguous UNKNOWN\\\",\\n      \\\"description\\\": \\\"Подготовка до DATA может повторяться; перед DATA записывается SMTP_SUBMITTING. Потеря ответа commit не запускает sendMessage. Generic exception после начала submission не доказывает отказ и становится terminal UNKNOWN.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n        \\\"line\\\": 22\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-expired-lease\\\",\\n      \\\"label\\\": \\\"Истёкшая lease\\\",\\n      \\\"value\\\": \\\"CLAIMED → PENDING; SMTP_SUBMITTING → UNKNOWN\\\",\\n      \\\"description\\\": \\\"Maintenance обрабатывает до500 leases, затем до500 просроченных PENDING и до500 старых terminal jobs. UNKNOWN никогда автоматически не сбрасывается; ciphertext удаляется.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/JdbcDeliveryRepository.kt\\\",\\n        \\\"line\\\": 187\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-retry\\\",\\n      \\\"label\\\": \\\"Provider retry\\\",\\n      \\\"value\\\": \\\"10 retryable provider failures; jitter 10..300 s + provider minimum\\\",\\n      \\\"description\\\": \\\"Persistent provider_failure_count увеличивается только при Retry; claim attempt_count остаётся аудитом. Unavailable/auth/key, CHANNEL_PAUSED, quiet hours и water interval не расходуют бюджет и backoff. Exponential cap300 s, jitter, минимум10 s; provider minimum может быть больше300 s. Retry после expiry завершает EXPIRED; unavailable канал ставится на60 s pause; Apple credentials — только IOS, общая FCM авторизация — обе платформы.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n        \\\"line\\\": 138\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-apns\\\",\\n      \\\"label\\\": \\\"iOS через FCM → APNs\\\",\\n      \\\"value\\\": \\\"Apple payload внутри FCM HTTP v1\\\",\\n      \\\"description\\\": \\\"Firebase выполняет downstream-доставку в APNs. Notification задаёт alert, priority10, collapse-id=occurrenceId, apns-id=deliveryId, expiration=job expiry. Ключ Apple загружается в Firebase; прямого APNs-адаптера и secret mount в Notification нет.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/PushProviders.kt\\\",\\n        \\\"line\\\": 63\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-fcm\\\",\\n      \\\"label\\\": \\\"FCM\\\",\\n      \\\"value\\\": \\\"send ≤15 s; OAuth ≤10 s; refresh lock ≤5 s\\\",\\n      \\\"description\\\": \\\"IOS и ANDROID; единый FCM HTTP v1. Android: normal priority, notification tag=occurrenceId, TTL=min(remaining lifetime,3600 s). iOS: apns headers; alert формируется Firebase из notification. 401/403 приостанавливают FCM; THIRD_PARTY_AUTH_ERROR приостанавливает только IOS без отключения устройства; UNREGISTERED отключает только submitted revision. 429 Retry-After≥60 s;5xx≥10 s, верхняя граница24 h.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/PushProviders.kt\\\",\\n        \\\"line\\\": 41\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-google-auth\\\",\\n      \\\"label\\\": \\\"FCM OAuth transport\\\",\\n      \\\"value\\\": \\\"POST fixed Google token endpoint; ≤10 s\\\",\\n      \\\"description\\\": \\\"Official ServiceAccountCredentials signing, firebase.messaging scope; default library retries disabled. Request body≤65536 bytes; network uses bounded shared transport.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/BoundedGoogleAuthTransport.kt\\\",\\n        \\\"line\\\": 14\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-channel-config\\\",\\n      \\\"label\\\": \\\"Provider enablement\\\",\\n      \\\"value\\\": \\\"FCM=false по умолчанию\\\",\\n      \\\"description\\\": \\\"COOKIE_FCM_ENABLED и один fcm-credentials.json mount для Android/iOS. Apple APNs key настраивается в Firebase. Production SMTP port default587 в Compose; application local default1025. Provider HTTP endpoints фиксированы production validation.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/application.yaml\\\",\\n        \\\"line\\\": 72\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-preflight\\\",\\n      \\\"label\\\": \\\"Последняя проверка push\\\",\\n      \\\"value\\\": \\\"current device + settings + projected eligibility\\\",\\n      \\\"description\\\": \\\"Перед provider проверяются lease/expiry, ownership, enabled, deletion, timezone, locale, quiet и актуальные domain snapshots. Устаревший reminder → CANCELLED; quiet → retry до quiet end. Изменение после preflight не позволяет отозвать уже отправленный запрос.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n        \\\"line\\\": 99\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-quarantine\\\",\\n      \\\"label\\\": \\\"Quarantine\\\",\\n      \\\"value\\\": \\\"только metadata; SHA-256 dedup\\\",\\n      \\\"description\\\": \\\"InvalidNotificationEvent сохраняет hash,eventId,subject,reason,stream sequence без payload; ACK только после успешной записи. Недоступная БД оставляет сообщение без ACK.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n        \\\"line\\\": 43\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-replay\\\",\\n      \\\"label\\\": \\\"Operator replay\\\",\\n      \\\"value\\\": \\\"profile notification-replay + --notification-replay-id\\\",\\n      \\\"description\\\": \\\"Отдельный cookie.notification.operator-nats-credentials-path; runtime ACL запрещает stream message GET. Replay проверяет subject/hash оригинала, вызывает тот же handler без republish. Нет HTTP endpoint и нет reset UNKNOWN; отсутствие original — явная ошибка. Ошибки JDBC/broker выводятся безопасным сообщением без исходных данных; контекст CLI закрывается при любом исходе. Lookup использует только STREAM.MSG.GET с timeout2 s, без STREAM.INFO discovery.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\\\",\\n        \\\"line\\\": 21\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-retention\\\",\\n      \\\"label\\\": \\\"Retention\\\",\\n      \\\"value\\\": \\\"inbox/quarantine/non-FOOD occurrences:30 days\\\",\\n      \\\"description\\\": \\\"Очистка каждую60 s, до500 строк каждой таблицы; cookie.notification.retention-poll-millis меняет период. FOOD cycle evidence и account tombstones не истекают автоматически. Terminal delivery jobs удаляются спустя30 days.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationRetention.kt\\\",\\n        \\\"line\\\": 8\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-deletion\\\",\\n      \\\"label\\\": \\\"Удаление аккаунта\\\",\\n      \\\"value\\\": \\\"permanent tombstone + удаление owned state\\\",\\n      \\\"description\\\": \\\"account.deletion.requested сериализуется с account operations; удаляются devices/settings/projections/deadlines/occurrences/user delivery jobs и cascade attempts. Поздние события и действующий JWT не могут восстановить state после tombstone.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n        \\\"line\\\": 83\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-readiness\\\",\\n      \\\"label\\\": \\\"Readiness\\\",\\n      \\\"value\\\": \\\"PostgreSQL + usable JWKS + JWE keys\\\",\\n      \\\"description\\\": \\\"/readyz 200/503 проверяет БД isValid(1), свежие signing keys и decryption ring. Redis/NATS/provider outage не входит в readiness; /healthz отвечает200.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/SystemController.kt\\\",\\n        \\\"line\\\": 17\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-metrics\\\",\\n      \\\"label\\\": \\\"Диагностика backlog\\\",\\n      \\\"value\\\": \\\"snapshot каждые10 s\\\",\\n      \\\"description\\\": \\\"Scheduler overdue/oldest age, NATS pending/unacknowledged/healthy, delivery pending/age/unknown/failed/metrics.healthy. При ошибке health=0 и последнее backlog значение становится устаревшим, а не нулевым.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationRuntimeMetrics.kt\\\",\\n        \\\"line\\\": 29\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-http-errors\\\",\\n      \\\"label\\\": \\\"Ошибки API\\\",\\n      \\\"value\\\": \\\"400 /401 /403 /404 /413 /503\\\",\\n      \\\"description\\\": \\\"Invalid input400; invalid JWT401; local deleted account403; missing own device404; body limit413; DB/transaction/unusable signing keys503 с Retry-After:1. Ошибки и successful settings/device responses имеют no-store.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/ApiExceptionHandler.kt\\\",\\n        \\\"line\\\": 26\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-key-reload\\\",\\n      \\\"label\\\": \\\"Перечитывание JWE key ring\\\",\\n      \\\"value\\\": \\\"проверка файлов приблизительно каждые 5 s при использовании\\\",\\n      \\\"description\\\": \\\"decrypt перечитывает active/retiring paths, если последняя загрузка старше 5 s; readiness также проверяет ring через этот интервал. Отсутствие ключа не разрешает расшифровку другим способом.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/VerificationPayloadDecryptor.kt\\\",\\n        \\\"line\\\": 43\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-push-submission-fence\\\",\\n      \\\"label\\\": \\\"Граница отправки push\\\",\\n      \\\"value\\\": \\\"user + token locks; transaction ≤45 s\\\",\\n      \\\"description\\\": \\\"Отдельная transaction удерживает общие с регистрацией/удалением advisory locks до provider outcome. После token lock владелец и lease перечитываются; eligibility присоединяется к этой transaction. Lock timeout2 s, statement timeout5 s. Provider вызов никогда не входит в ingestion transaction. Push сохраняет at-least-once semantics при rollback.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/JdbcDeliveryRepository.kt\\\",\\n        \\\"line\\\": 86\\n      }\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-ios-fcm-migration\\\",\\n      \\\"label\\\": \\\"Переход iOS на FCM\\\",\\n      \\\"value\\\": \\\"V006; обязательная повторная регистрация токена\\\",\\n      \\\"description\\\": \\\"Старые IOS APNs-привязки отключаются, активные PUSH jobs отменяются, leases и attempts закрываются. Android, terminal outcomes и SMTP сохраняются. До Flyway deploy останавливает старый Notification. Новый IOS FCM token хранится без изменения регистра.\\\",\\n      \\\"source\\\": {\\n        \\\"path\\\": \\\"backend/services/notification/src/main/resources/db/migration/V006__fcm_only_push.sql\\\",\\n        \\\"line\\\": 14\\n      }\\n    }\\n  ],\\n  \\\"flows\\\": [\\n    {\\n      \\\"id\\\": \\\"notification-register-device\\\",\\n      \\\"title\\\": \\\"Регистрация и перенос push-токена\\\",\\n      \\\"operationIds\\\": [\\n        \\\"registerDevice\\\"\\n      ],\\n      \\\"description\\\": \\\"POST /v1/notifications/devices. Новый logical device возвращает201, обновление существующего200. Token никогда не задаёт account ownership.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"mobile_client\\\",\\n          \\\"label\\\": \\\"POST device\\\",\\n          \\\"detail\\\": \\\"HTTPS /v1/notifications; access JWT в Authorization: Bearer. Владелец не передаётся в JSON.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"contracts/openapi/public/notification.yaml\\\",\\n            \\\"line\\\": 20\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"gateway\\\",\\n          \\\"label\\\": \\\"Proxy в Notification\\\",\\n          \\\"detail\\\": \\\"Production gateway сохраняет Authorization и request headers; private TCP/8082, connect2 s/read12 s.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"infra/terraform/environments/production/main.tf\\\",\\n            \\\"line\\\": 328\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Проверить Identity JWT\\\",\\n          \\\"detail\\\": \\\"Ровно один Bearer; ES256 at+jwt, issuer/audience/expiry и UUIDv7 sub/sid/jti. userId=verified sub. Невалидный token401, недоступный пригодный keyset503.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationsController.kt\\\",\\n            \\\"line\\\": 79\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"JWKS только при refresh\\\",\\n          \\\"detail\\\": \\\"Configured JWKS origin; cache300 s, background refresh240 s, общий cooldown30 s также при unknown kid. Запрос не выполняется для каждого API call.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\\\",\\n            \\\"line\\\": 54\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Проверить тело\\\",\\n          \\\"detail\\\": \\\"16 KiB filter; только platform/deviceId/token без null/coercion. Platform IOS/ANDROID, deviceId≤255, token≤4096 и без control characters.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationRequestBodyAdvice.kt\\\",\\n            \\\"line\\\": 24\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Account transaction и token lock\\\",\\n          \\\"detail\\\": \\\"Advisory lock account, запрет tombstone, lazy settings. IOS и ANDROID передают opaque case-sensitive FCM token; lock platform/token отключает прежнего active owner и upsert(user_id,device_id) устанавливает новый token/revision. Trigger-maintained SHA-256 даёт bounded unique index; полная строка тоже проверяется при переносе.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n            \\\"line\\\": 46\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Dirty deadline в той же transaction\\\",\\n          \\\"detail\\\": \\\"due_at становится не позднее текущего времени, generation увеличивается; commit сохраняет device и deadline атомарно.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n            \\\"line\\\": 77\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"After-commit index hint\\\",\\n          \\\"detail\\\": \\\"ZADD userId:generation только после commit; ошибка Redis переносится на PostgreS
