fresh_credentials_family_created']\\n  }\\n\\n  Note: 'Service: Identity aggregate child. At most one unredeemed credential per family (partial unique index); replacement must belong to the same family'\\n}\\n\\nTable rate_limit_buckets as RateLimitBuckets {\\n  scope_key varchar [pk, note: 'route + namespace-separated truncated HMAC-SHA-256 identifier of canonical email, IP, token id or refresh family id']\\n  window_started_at timestamptz [not null]\\n  attempt_count integer [not null]\\n  expires_at timestamptz [not null]\\n\\n  indexes {\\n    (expires_at) [name: 'idx_rate_limit_buckets_expires_at']\\n  }\\n\\n  Note: 'Service: Identity. PostgreSQL-backed counters shared by all replicas'\\n}\\n\\nTable outbox_events as OutboxEvents {\\n  event_id uuid [pk, note: 'UUIDv7 used as JetStream Nats-Msg-Id']\\n  event_type varchar [not null]\\n  event_version integer [not null]\\n  aggregate_type varchar [not null]\\n  aggregate_id varchar [not null]\\n  payload jsonb [not null, note: 'notification payload contains compact JWE only, never the raw token/email']\\n  occurred_at timestamptz [not null]\\n  available_at timestamptz [not null]\\n  correlation_id uuid [null]\\n  causation_id uuid [null]\\n  trace_id varchar [null]\\n  claim_id uuid [null, note: 'fencing token for the current publisher lease']\\n  claimed_until timestamptz [null]\\n  published_at timestamptz [null]\\n  attempt_count integer [not null, default: 0]\\n  last_error varchar [null]\\n\\n  indexes {\\n    (available_at, occurred_at) [name: 'idx_outbox_events_pending']\\n    (claimed_until) [name: 'idx_outbox_events_expired_claims']\\n    (published_at, event_id) [name: 'idx_outbox_events_published_cleanup']\\n  }\\n\\n  Note: 'Service: Identity. Pending and expired-claim indexes are partial on unpublished rows; cleanup index is partial on published rows; claimed and cleaned with FOR UPDATE SKIP LOCKED'\\n}\\n\",\"contracts/dbml/meal-planner.dbml\":\"// COOKie — meal planner service database schema\\n//\\n// This file contains only tables owned by the meal planner service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable jobs as Jobs {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  from_date date [not null]\\n  to_date date [not null]\\n  status varchar [not null, note: 'PENDING | RUNNING | COMPLETED | FAILED']\\n  progress decimal(4,3) [null]\\n  meal_plan_id uuid [null, note: 'logical ref -> meal_plans.id after successful generation']\\n  created_at timestamptz [not null]\\n  started_at timestamptz [null]\\n  completed_at timestamptz [null]\\n  error_code varchar [null]\\n\\n  Note: 'Service: Meal Planner'\\n}\\n\\nTable plans as Plans {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  from_date date [not null]\\n  to_date date [not null]\\n  created_at timestamptz [not null]\\n  algorithm_version varchar [not null]\\n\\n  Note: 'Service: Meal Planner'\\n}\\n\\nTable plan_days as PlanDays {\\n  id uuid [pk]\\n  meal_plan_id uuid [not null, ref: > Plans.id]\\n  local_date date [not null]\\n\\n  Note: 'Service: Meal Planner'\\n}\\n\\nTable plan_items as PlanItems {\\n  id uuid [pk]\\n  meal_plan_day_id uuid [not null, ref: > PlanDays.id]\\n  meal_type varchar [not null, note: 'BREAKFAST | LUNCH | DINNER | SNACK']\\n  recipe_id uuid [not null, note: 'logical ref -> Recipe.recipes.id']\\n  recipe_version integer [not null]\\n  servings decimal(6,2) [not null]\\n  position integer [not null]\\n\\n  Note: 'Service: Meal Planner'\\n}\\n\",\"contracts/dbml/media.dbml\":\"// COOKie — media service database schema\\n//\\n// This file contains only tables owned by the media service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable objects as MediaObjects {\\n  id uuid [pk]\\n  owner_user_id uuid [null, note: 'logical ref -> Identity.accounts.id']\\n  purpose varchar [not null, note: 'DISH_PHOTO | RECIPE_PHOTO | SAVED_DISH_PHOTO']\\n  storage_key varchar [not null]\\n  content_type varchar [not null]\\n  size_bytes bigint [not null]\\n  status varchar [not null, note: 'PENDING | READY | DELETED']\\n  created_at timestamptz [not null]\\n  completed_at timestamptz [null]\\n  deleted_at timestamptz [null]\\n\\n  Note: 'Service: Media. Binary lives in S3-compatible Object Storage, not PostgreSQL'\\n}\\n\",\"contracts/dbml/notification.dbml\":\"// COOKie — Notification Service PostgreSQL schema.\\n// Mirrors V001__notification_core.sql through V006__fcm_only_push.sql.\\n// Cross-service identifiers are logical references only, never foreign keys.\\n\\nTable account_tombstones as AccountTombstones {\\n  user_id uuid [pk, note: 'Logical Identity account id. Prevents late events and residual JWTs from recreating deleted data']\\n  deletion_request_id uuid [not null]\\n  deleted_at timestamptz [not null]\\n  Note: 'Service: Notification. Minimal durable deletion evidence; not removed by ordinary retention'\\n}\\n\\nTable settings as Settings {\\n  user_id uuid [pk, note: 'Logical Identity account id']\\n  water_enabled boolean [not null, default: true]\\n  food_enabled boolean [not null, default: true]\\n  food_inactive_minutes integer [not null, default: 240, note: 'CHECK BETWEEN 1 AND 10080']\\n  weigh_enabled boolean [not null, default: true]\\n  weigh_time time [not null, default: '08:00']\\n  goal_warning_enabled boolean [not null, default: true]\\n  quiet_start time [not null, default: '23:00']\\n  quiet_end time [not null, default: '08:00']\\n  timezone varchar(255) [null, note: 'Notification settings are authoritative. No scheduled push before explicit IANA timezone']\\n  locale varchar(255) [not null, default: 'ru']\\n  locale_overridden boolean [not null, default: false]\\n  scheduling_started_at timestamptz [null]\\n  food_started_at timestamptz [null]\\n  water_started_at timestamptz [null]\\n  last_water_reminder_at timestamptz [null, note: 'Queue reservation time, separate from provider submission']\\n  last_water_submission_at timestamptz [null]\\n  last_water_submission_occurrence_id uuid [null, note: 'Same occurrence may fan out to several devices; different occurrences wait at least two hours']\\n  updated_at timestamptz [not null, default: `clock_timestamp()`]\\n  Note: 'Service: Notification. PostgreSQL owns timer baselines; profile locale only fills a non-overridden default'\\n}\\n\\nTable push_devices as PushDevices {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'Logical Identity account id']\\n  platform varchar(10) [not null, note: 'CHECK IOS | ANDROID']\\n  device_id varchar(255) [not null]\\n  push_token varchar(4096) [not null, note: 'Opaque case-sensitive FCM registration token for IOS and ANDROID; legacy IOS APNs registrations disabled by V006']\\n  push_token_hash bytea [not null, note: '32-byte SHA-256 of exact token; maintained by database trigger']\\n  enabled boolean [not null, default: true]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null, note: 'Revision guard for conditional provider token invalidation']\\n  indexes {\\n    (user_id, device_id) [unique]\\n    (platform, push_token_hash) [unique, name: 'push_devices_active_token', note: 'Partial index WHERE enabled; bounded index entries support the full 4096-character token contract']\\n    user_id [name: 'push_devices_user']\\n  }\\n  Note: 'Service: Notification'\\n}\\n\\nTable inbox_events as InboxEvents {\\n  consumer_name varchar(100) [not null]\\n  event_id uuid [not null]\\n  event_type varchar(100) [not null]\\n  processed_at timestamptz [not null, default: `clock_timestamp()`]\\n  indexes {\\n    (consumer_name, event_id) [pk]\\n    processed_at [name: 'inbox_events_retention']\\n  }\\n  Note: 'Service: Notification. Same transaction as projections and delivery intent; 30-day retention exceeds seven-day stream retention'\\n}\\n\\nTable event_projections as EventProjections {\\n  kind varchar(30) [not null, note: 'PROFILE | MEAL | WATER | WEIGHT | PROGRESS']\\n  user_id uuid [not null]\\n  entity_id varchar(255) [not null, note: 'Aggregate projection key; progress includes timezone and localDate']\\n  version bigint [not null, note: 'CHECK > 0. Older or equal aggregate versions never overwrite a projection']\\n  payload jsonb [not null, note: 'Allowlisted minimal notification snapshot; no dishes or weight values']\\n  deleted boolean [not null, default: false]\\n  updated_at timestamptz [not null, default: `clock_timestamp()`]\\n  indexes {\\n    (kind, user_id, entity_id) [pk]\\n    (user_id, kind) [name: 'event_projections_user']\\n  }\\n  Note: 'Service: Notification. Meal/weight tombstones prevent resurrection after out-of-order delivery'\\n}\\n\\nTable reminder_deadlines as ReminderDeadlines {\\n  user_id uuid [pk]\\n  due_at timestamptz [not null]\\n  generation bigint [not null, default: 1]\\n  indexes {\\n    (due_at, user_id) [name: 'reminder_deadlines_due']\\n  }\\n  Note: 'Service: Notification. Canonical schedule, rebuilds Redis cookie:notification:reminder_deadlines members userId:generation; PostgreSQL fallback scans every 30 seconds'\\n}\\n\\nTable reminder_occurrences as ReminderOccurrences {\\n  id uuid [pk]\\n  user_id uuid [not null]\\n  kind varchar(40) [not null]\\n  cycle_key varchar(255) [not null, note: 'Food activity cycle, water deadline or local date depending on kind']\\n  scheduled_at timestamptz [not null]\\n  last_submitted_at timestamptz [null, note: 'Durable submission evidence survives delivery-job retention; fully unsent FOOD and current-date daily reminders can resume after diary correction']\\n  created_at timestamptz [not null, default: `clock_timestamp()`]\\n  indexes {\\n    (user_id, kind, cycle_key) [unique]\\n    user_id [name: 'reminder_occurrences_user']\\n  }\\n  Note: 'Service: Notification. Logical occurrence deduplication across scheduler replicas'\\n}\\n\\nTable message_quarantine as MessageQuarantine {\\n  id uuid [pk]\\n  message_hash char(64) [not null, unique, note: 'SHA-256 of original envelope bytes']\\n  event_id uuid [null]\\n  subject varchar(255) [not null]\\n  reason varchar(100) [not null, note: 'Safe classified reason, not exception text']\\n  stream_sequence bigint [not null]\\n  created_at timestamptz [not null, default: `clock_timestamp()`]\\n  replay_requested_at timestamptz [null]\\n  replayed_at timestamptz [null]\\n  replay_attempts integer [not null, default: 0]\\n  indexes {\\n    replay_requested_at [name: 'quarantine_replay', note: 'Partial index WHERE replayed_at IS NULL']\\n    created_at [name: 'quarantine_retention']\\n  }\\n  Note: 'Service: Notification. Metadata only. Operator replay uses original retained broker message with separate credentials; no raw payload persisted'\\n}\\n\\nTable delivery_jobs as DeliveryJobs {\\n  id uuid [pk]\\n  dedup_key varchar(200) [not null, unique]\\n  channel varchar(8) [not null, note: 'CHECK EMAIL | PUSH']\\n  user_id uuid [null]\\n  device_id uuid [null, note: 'Logical local push device id; no FK so deletion/retention remains explicit']\\n  registration_attempt_id uuid [null, note: 'Pre-account email aggregate; not an Identity FK']\\n  occurrence_id uuid [null, note: 'Logical local reminder occurrence id']\\n  kind varchar(40) [not null]\\n  locale varchar(64) [not null, default: 'ru']\\n  encrypted_payload text [null, note: 'Compact JWE only; removed after terminal completion']\\n  expires_at timestamptz [not null]\\n  created_at timestamptz [not null, default: `clock_timestamp()`]\\n  next_attempt_at timestamptz [not null, default: `clock_timestamp()`]\\n  status varchar(24) [not null, default: 'PENDING', note: 'CHECK PENDING | CLAIMED | SMTP_SUBMITTING | ACCEPTED | FAILED | UNKNOWN | CANCELLED | EXPIRED']\\n  attempt_count integer [not null, default: 0, note: 'CHECK >= 0; queue claims including technical deferrals']\\n  provider_failure_count integer [not null, default: 0, note: 'CHECK >= 0; retryable provider failures only, separate ten-failure budget and backoff']\\n  lease_token uuid [null]\\n  lease_until timestamptz [null]\\n  provider_message_id varchar(512) [null]\\n  last_code varchar(64) [null]\\n  finished_at timestamptz [null]\\n  indexes {\\n    (next_attempt_at, created_at) [name: 'delivery_jobs_pending', note: 'Partial index WHERE status = PENDING']\\n    expires_at [name: 'delivery_jobs_expiry', note: 'Partial index WHERE status = PENDING']\\n    lease_until [name: 'delivery_jobs_leases', note: 'Partial index WHERE status IN (CLAIMED, SMTP_SUBMITTING)']\\n    user_id [name: 'delivery_jobs_user', note: 'Partial index WHERE user_id IS NOT NULL']\\n    finished_at [name: 'delivery_jobs_finished', note: 'Partial index WHERE finished_at IS NOT NULL']\\n  }\\n  Note: 'Service: Notification. CHECK lease_token/lease_until both null or both set. EMAIL requires registration_attempt_id with null user_id/device_id; PUSH requires user_id/device_id with null registration_attempt_id. SMTP_SUBMITTING expired lease becomes terminal UNKNOWN, never an automatic retry. ACCEPTED means provider accepted, not proof of delivery'\\n}\\n\\nTable delivery_attempts as DeliveryAttempts {\\n  id uuid [pk]\\n  delivery_id uuid [not null]\\n  started_at timestamptz [not null, default: `clock_timestamp()`]\\n  finished_at timestamptz [null]\\n  outcome varchar(24) [null]\\n  safe_code varchar(64) [null]\\n  Note: 'Service: Notification. Id equals delivery claim fencing token; no provider payload or arbitrary errors'\\n}\\nRef: DeliveryAttempts.delivery_id > DeliveryJobs.id [delete: cascade]\\n\",\"contracts/dbml/nutrition.dbml\":\"// COOKie — nutrition service database schema\\n//\\n// This file contains only tables owned by the nutrition service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable meals as Meals {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  local_date date [not null]\\n  eaten_at timestamptz [not null]\\n  timezone varchar [not null]\\n  client_generated_id uuid [null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  indexes {\\n    (user_id, client_generated_id) [unique]\\n    (user_id, local_date) [name: 'idx_meals_user_date']\\n    (user_id, eaten_at) [name: 'idx_meals_user_eaten_at']\\n  }\\n\\n  Note: 'Service: Nutrition'\\n}\\n\\nTable dishes as Dishes {\\n  id uuid [pk]\\n  meal_id uuid [not null, ref: > Meals.id]\\n  name varchar [null]\\n  source_type varchar [not null, note: 'MANUAL | RECIPE | SAVED_DISH | AI']\\n  source_id uuid [null, note: 'logical ref -> Recipe.recipes.id or Nutrition.saved_dishes.id, no FK']\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  Note: 'Service: Nutrition'\\n}\\n\\nTable dish_media as DishMedia {\\n  dish_id uuid [not null, ref: > Dishes.id]\\n  media_id uuid [not null, note: 'logical ref -> Media.media_objects.id']\\n  position integer [not null]\\n\\n  indexes {\\n    (dish_id, media_id) [pk]\\n  }\\n\\n  Note: 'Service: Nutrition'\\n}\\n\\nTable food_entries as FoodEntries {\\n  id uuid [pk]\\n  dish_id uuid [not null, ref: > Dishes.id]\\n  source_type varchar [not null, note: 'OPEN_FOOD_FACTS | CUSTOM | MANUAL | AI; provenance only, never resolved during diary writes']\\n  source_external_id varchar [null]\\n  name_snapshot varchar [not null]\\n  brand_snapshot varchar [null]\\n  base_unit varchar [not null, note: 'G | ML']\\n  amount_base decimal(12,3) [not null]\\n  display_unit varchar [not null, note: 'G | ML | PIECE']\\n  display_quantity decimal(12,3) [not null]\\n  piece_base_amount_snapshot decimal(10,3) [null]\\n  calories_per_100_snapshot decimal(10,3) [null]\\n  protein_per_100_snapshot decimal(10,3) [null]\\n  fat_per_100_snapshot decimal(10,3) [null]\\n  carbs_per_100_snapshot decimal(10,3) [null]\\n  fiber_per_100_snapshot decimal(10,3) [null]\\n  calories_total decimal(10,3) [not null]\\n  protein_total decimal(10,3) [null]\\n  fat_total decimal(10,3) [null]\\n  carbs_total decimal(10,3) [null]\\n  fiber_total decimal(10,3) [null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  Note: 'Service: Nutrition. Client-provided editable snapshot; Nutrition validates and calculates totals locally. Future OFF/CustomFood/AI updates never mutate the entry and diary writes do not call Food Catalog'\\n}\\n\\nTable saved_dishes as SavedDishes {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  name varchar [not null]\\n  media_id uuid [null, note: 'logical ref -> Media.media_objects.id']\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  Note: 'Service: Nutrition'\\n}\\n\\nTable saved_dish_items as SavedDishItems {\\n  id uuid [pk]\\n  saved_dish_id uuid [not null, ref: > SavedDishes.id]\\n  name_snapshot varchar [not null]\\n  source_type varchar [not null]\\n  source_id uuid [null, note: 'logical ref -> Food Catalog/Recipe, no FK']\\n  base_unit varchar [not null]\\n  amount_base decimal(12,3) [not null]\\n  calories_per_100_snapshot decimal(10,3) [null]\\n  protein_per_100_snapshot decimal(10,3) [null]\\n  fat_per_100_snapshot decimal(10,3) [null]\\n  carbs_per_100_snapshot decimal(10,3) [null]\\n  fiber_per_100_snapshot decimal(10,3) [null]\\n  position integer [not null]\\n\\n  Note: 'Service: Nutrition. Snapshot fields make saved-dish previews stable and avoid cross-service reads'\\n}\\n\\nTable water_entries as WaterEntries {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  amount_ml integer [not null]\\n  consumed_at timestamptz [not null]\\n  local_date date [not null]\\n  client_generated_id uuid [null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, local_date) [name: 'idx_water_user_date']\\n    (user_id, client_generated_id) [unique, note: 'Client-generated id is required by the API and makes POST idempotent']\\n  }\\n\\n  Note: 'Service: Nutrition'\\n}\\n\",\"contracts/dbml/progress.dbml\":\"// COOKie — progress service database schema\\n//\\n// This file contains only tables owned by the progress service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable daily_progress as DailyProgress {\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  local_date date [not null]\\n  calories_consumed decimal(10,3)\\n  protein_g decimal(10,3)\\n  fat_g decimal(10,3)\\n  carbs_g decimal(10,3)\\n  fiber_g decimal(10,3)\\n  water_ml integer\\n  steps integer\\n  active_calories decimal(10,3)\\n  calorie_target decimal(10,3)\\n  protein_target_g decimal(10,3)\\n  fat_target_g decimal(10,3)\\n  carbs_target_g decimal(10,3)\\n  fiber_target_g decimal(10,3)\\n  water_target_ml integer\\n  unlimited_calories boolean [not null, default: false]\\n  weight_kg decimal(6,2) [null]\\n  food_logged boolean [not null, default: false]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, local_date) [pk]\\n  }\\n\\n  Note: 'Service: Progress. Built entirely from NATS events (nutrition.*, health.*, user.*) — never queries other service DBs directly'\\n}\\n\\nTable user_streaks as UserStreaks {\\n  user_id uuid [pk, note: 'logical ref -> Identity.accounts.id']\\n  current_streak integer [not null, default: 0]\\n  longest_streak integer [not null, default: 0]\\n  last_logged_date date [null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Progress'\\n}\\n\",\"contracts/dbml/recipe.dbml\":\"// COOKie — recipe service database schema\\n//\\n// This file contains only tables owned by the recipe service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable ingredients as Ingredients {\\n  id uuid [pk]\\n  name varchar [not null]\\n  base_unit varchar [not null, note: 'G | ML']\\n  calories_per_100 decimal(10,3)\\n  protein_per_100 decimal(10,3)\\n  fat_per_100 decimal(10,3)\\n  carbs_per_100 decimal(10,3)\\n  fiber_per_100 decimal(10,3)\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Recipe. Canonical cooking ingredient — distinct from Food Catalog product'\\n}\\n\\nTable ingredient_allergens as IngredientAllergens {\\n  ingredient_id uuid [not null, ref: > Ingredients.id]\\n  allergen varchar [not null]\\n\\n  indexes {\\n    (ingredient_id, allergen) [pk]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable recipes as Recipes {\\n  id uuid [pk]\\n  status varchar [not null, note: 'DRAFT | PUBLISHED | ARCHIVED']\\n  current_version integer [not null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable versions as Versions {\\n  id uuid [pk]\\n  recipe_id uuid [not null, ref: > Recipes.id]\\n  version_number integer [not null]\\n  title varchar [not null]\\n  description text\\n  default_servings decimal(6,2) [not null]\\n  prep_seconds integer\\n  cook_seconds integer\\n  difficulty varchar [note: 'EASY | MEDIUM | HARD']\\n  published_at timestamptz [null]\\n\\n  indexes {\\n    (recipe_id, version_number) [unique]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable version_nutrition as VersionNutrition {\\n  recipe_version_id uuid [pk, ref: - Versions.id]\\n  calories_total decimal(10,3)\\n  protein_total decimal(10,3)\\n  fat_total decimal(10,3)\\n  carbs_total decimal(10,3)\\n  fiber_total decimal(10,3)\\n  calories_per_serving decimal(10,3)\\n  protein_per_serving decimal(10,3)\\n  fat_per_serving decimal(10,3)\\n  carbs_per_serving decimal(10,3)\\n  fiber_per_serving decimal(10,3)\\n\\n  Note: 'Service: Recipe. Precomputed snapshot at publish time — GET does not recalculate every time'\\n}\\n\\nTable version_photos as VersionPhotos {\\n  recipe_version_id uuid [not null, ref: > Versions.id]\\n  media_id uuid [not null, note: 'logical ref -> Media.media_objects.id']\\n  position integer [not null]\\n\\n  indexes {\\n    (recipe_version_id, media_id) [pk]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable version_ingredients as VersionIngredients {\\n  id uuid [pk]\\n  recipe_version_id uuid [not null, ref: > Versions.id]\\n  ingredient_id uuid [not null, ref: > Ingredients.id]\\n  amount_base decimal(12,3) [not null]\\n  position integer [not null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable steps as Steps {\\n  id uuid [pk]\\n  recipe_version_id uuid [not null, ref: > Versions.id]\\n  position integer [not null]\\n  text text [not null]\\n  duration_seconds integer [null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable tags as Tags {\\n  recipe_version_id uuid [not null, ref: > Versions.id]\\n  tag_type varchar [not null]\\n  tag_value varchar [not null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable customizations as UserCustomizations {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  recipe_id uuid [not null, ref: > Recipes.id]\\n  base_recipe_version_id uuid [not null, ref: > Versions.id]\\n  revision bigint [not null, default: 1]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, recipe_id) [unique]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable customization_ingredients as CustomizationIngredients {\\n  customization_id uuid [not null, ref: > UserCustomizations.id]\\n  ingredient_id uuid [not null, ref: > Ingredients.id]\\n  amount_base decimal(12,3) [not null]\\n  position integer [not null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable favorites as Favorites {\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  recipe_id uuid [not null, ref: > Recipes.id]\\n  created_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, recipe_id) [pk]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable feedback as Feedback {\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  recipe_id uuid [not null, ref: > Recipes.id]\\n  feedback varchar [not null, note: 'LIKE | DO_NOT_RECOMMEND']\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, recipe_id) [pk]\\n  }\\n\\n  Note: 'Service: Recipe'\\n}\\n\\nTable cooking_sessions as CookingSessions {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  recipe_id uuid [not null, ref: > Recipes.id]\\n  recipe_version integer [not null]\\n  customization_revision bigint [null]\\n  servings decimal(6,2) [not null]\\n  status varchar [not null, note: 'IN_PROGRESS | COMPLETED | CANCELLED']\\n  started_at timestamptz [not null]\\n  completed_at timestamptz [null]\\n\\n  Note: 'Service: Recipe'\\n}\\n\",\"contracts/dbml/shopping.dbml\":\"// COOKie — shopping service database schema\\n//\\n// This file contains only tables owned by the shopping service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable carts as Carts {\\n  id uuid [pk]\\n  user_id uuid [not null, unique, note: 'logical ref -> Identity.accounts.id']\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Shopping'\\n}\\n\\nTable cart_recipe_items as CartRecipeItems {\\n  id uuid [pk]\\n  cart_id uuid [not null, ref: > Carts.id]\\n  recipe_id uuid [not null, note: 'logical ref -> Recipe.recipes.id']\\n  recipe_version integer [not null]\\n  customization_revision bigint [null]\\n  recipe_title_snapshot varchar [not null]\\n  servings decimal(6,2) [not null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Shopping'\\n}\\n\\nTable cart_import_jobs as CartImportJobs {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  meal_plan_id uuid [not null, note: 'logical ref -> Meal Planner.meal_plans.id']\\n  from_date date [not null]\\n  to_date date [not null]\\n  status varchar [not null, note: 'PENDING | RUNNING | COMPLETED | FAILED']\\n  cart_id uuid [null, ref: > Carts.id]\\n  error_code varchar [null]\\n  created_at timestamptz [not null]\\n  completed_at timestamptz [null]\\n\\n  indexes {\\n    (user_id, created_at) [name: 'idx_cart_import_jobs_user_created']\\n  }\\n\\n  Note: 'Service: Shopping. Tracks asynchronous imports from Meal Planner and provides a pollable result'\\n}\\n\\nTable cart_recipe_ingredients as CartRecipeIngredients {\\n  cart_recipe_item_id uuid [not null, ref: > CartRecipeItems.id]\\n  ingredient_id uuid [not null, note: 'logical ref -> Recipe.ingredients.id']\\n  ingredient_name_snapshot varchar [not null]\\n  base_amount_for_item decimal(12,3) [not null]\\n  base_unit varchar [not null]\\n\\n  Note: 'Service: Shopping. Snapshot — never joins to Recipe DB'\\n}\\n\\nTable adjustments as Adjustments {\\n  cart_id uuid [not null, ref: > Carts.id]\\n  ingredient_id uuid [not null, note: 'logical ref -> Recipe.ingredients.id']\\n  have_deduction decimal(12,3) [not null, default: 0]\\n  extra_amount decimal(12,3) [not null, default: 0]\\n  bought boolean [not null, default: false]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (cart_id, ingredient_id) [pk]\\n  }\\n\\n  Note: 'Service: Shopping. required_amount is NOT stored — derived from shopping_cart_recipe_ingredients'\\n}\\n\",\"contracts/dbml/user.dbml\":\"// COOKie — user service database schema\\n//\\n// This file contains only tables owned by the user service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable profiles as Profiles {\\n  user_id uuid [pk, note: 'logical ref -> Identity.accounts.id, no FK']\\n  sex varchar\\n  birth_date date\\n  height_cm decimal(5,2)\\n  activity_level varchar [note: 'LOW | MODERATE | HIGH']\\n  timezone varchar\\n  locale varchar\\n  onboarding_completed boolean [not null, default: false]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  Note: 'Service: User'\\n}\\n\\nTable nutrition_goal_versions as NutritionGoalVersions {\\n  id uuid [pk]\\n  user_id uuid [not null, ref: > Profiles.user_id]\\n  effective_from date [not null]\\n  target_weight_kg decimal(6,2)\\n  target_weight_change_per_week decimal(4,2)\\n  calorie_target decimal(8,2) [not null]\\n  protein_g decimal(8,2)\\n  fat_g decimal(8,2)\\n  carbs_g decimal(8,2)\\n  fiber_g decimal(8,2)\\n  source varchar [not null, note: 'CALCULATED | MANUAL']\\n  created_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, effective_from) [name: 'idx_goal_versions_user_date']\\n  }\\n\\n  Note: 'Service: User'\\n}\\n\\nTable hydration_goal_versions as HydrationGoalVersions {\\n  id uuid [pk]\\n  user_id uuid [not null, ref: > Profiles.user_id]\\n  effective_from date [not null]\\n  target_ml integer [not null]\\n  source varchar [not null, note: 'CALCULATED | MANUAL']\\n  created_at timestamptz [not null]\\n\\n  Note: 'Service: User'\\n}\\n\\nTable diet_preferences as DietPreferences {\\n  user_id uuid [not null, ref: > Profiles.user_id]\\n  diet_type varchar [not null, note: 'BALANCED | HIGH_PROTEIN | VEGETARIAN | VEGAN | PESCATARIAN | LOW_CARB | KETO | MEDITERRANEAN | GLUTEN_FREE | LACTOSE_FREE']\\n\\n  indexes {\\n    (user_id, diet_type) [pk]\\n  }\\n\\n  Note: 'Service: User'\\n}\\n\\nTable allergies as Allergies {\\n  user_id uuid [not null, ref: > Profiles.user_id]\\n  allergen varchar [not null, note: 'GLUTEN | CRUSTACEANS | EGGS | FISH | PEANUTS | SOY | MILK | TREE_NUTS | CELERY | MUSTARD | SESAME | SULPHITES | LUPIN | MOLLUSCS']\\n\\n  indexes {\\n    (user_id, allergen) [pk]\\n  }\\n\\n  Note: 'Service: User'\\n}\\n\\nTable daily_goal_overrides as DailyGoalOverrides {\\n  id uuid [pk]\\n  user_id uuid [not null, ref: > Profiles.user_id]\\n  local_date date [not null]\\n  calorie_target decimal(8,2) [null]\\n  protein_g decimal(8,2) [null]\\n  fat_g decimal(8,2) [null]\\n  carbs_g decimal(8,2) [null]\\n  fiber_g decimal(8,2) [null]\\n  unlimited_calories boolean [not null, default: false]\\n  type varchar [not null, note: 'CUSTOM | CHEAT_DAY']\\n  cheat_month date [null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, local_date) [unique]\\n    (user_id, cheat_month) [unique, note: 'WHERE type = CHEAT_DAY — enforces 1 cheat day per month at DB level']\\n  }\\n\\n  Note: 'Service: User'\\n}\\n\",\"contracts/openapi/public/identity.yaml\":\"openapi: 3.0.3\\ninfo:\\n  title: COOKie Identity Public API\\n  version: 0.7.0\\n  description: >-\\n    Public email/password authentication, session and account lifecycle owned\\n    by Identity Service.\\nservers:\\n  - url: https://api.cookie.app/v1\\n    description: Production\\n  - url: http://127.0.0.1:8080/v1\\n    description: Local\\ntags:\\n  - name: auth\\n    description: Email/password authentication, session and account lifecycle.\\n\\npaths:\\n  /auth/email/register:\\n    post:\\n      tags: [auth]\\n      operationId: registerWithEmail\\n      summary: Зарегистрироваться по email и паролю\\n      description: >-\\n        Создаёт proof-bound попытку регистрации и запрашивает доставку\\n        одноразового verification token.\\n        Клиент до запроса генерирует и атомарно сохраняет стабильный registrationAttemptId\\n        и независимый 256-битный registrationProof. Точный повтор того же запроса является\\n        no-op и после фиксации попытки не расходует email business bucket. Защитный IP bucket\\n        применяется ко всем запросам и поэтому повтор также может получить 429. Повтор того же attempt id или\\n        proof с изменённым email, password либо locale отклоняется конфликтом.\\n        Exact retry истёкшей или проигравшей конкуренцию попытки также остаётся\\n        no-op, пока её scrubbed tombstone хранится не менее 30 дней; чтобы получить\\n        новое письмо после 24 часов, клиент всегда создаёт новый id и proof.\\n        Email token и registrationProof по отдельности не могут активировать credential. Ответ\\n        одинаков для нового и уже зарегистрированного email. Сессия выдаётся только\\n        отдельным login после подтверждения.\\n      security: []\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/EmailRegistrationRequest\\\"\\n      responses:\\n        \\\"202\\\":\\n          description: Если действие допустимо, письмо подтверждения будет отправлено\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"409\\\":\\n          $ref: \\\"#/components/responses/RegistrationAttemptConflict\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/email/login:\\n    post:\\n      tags: [auth]\\n      operationId: loginWithEmail\\n      summary: Войти по email и паролю\\n      description: >-\\n        Возвращает одинаковую ошибку для неизвестного email, неверного пароля,\\n        неподтверждённого email и недоступного аккаунта, чтобы не позволять\\n        перечислять зарегистрированные адреса.\\n      security: []\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/EmailLoginRequest\\\"\\n      responses:\\n        \\\"200\\\":\\n          description: Токены выданы, refresh-сессия создана\\n          headers:\\n            Cache-Control:\\n              description: Запрещает хранение ответа с bearer credentials\\n              schema:\\n                type: string\\n                example: no-store\\n            Pragma:\\n              description: Совместимый с HTTP/1.0 запрет кэширования\\n              schema:\\n                type: string\\n                example: no-cache\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/TokenPairWithUser\\\"\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"401\\\":\\n          description: Неверные учётные данные\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/Error\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/email/verification/confirm:\\n    post:\\n      tags: [auth]\\n      operationId: confirmEmail\\n      summary: Подтвердить email одноразовым токеном\\n      description: >-\\n        Атомарно проверяет доставленный по email verification token и независимый\\n        client-held registrationProof, после чего активирует связанный с ними password hash.\\n        Token содержит публичный registrationAttemptId, по которому клиент выбирает proof\\n        из защищённого локального хранилища; сам proof не включается ни в email payload,\\n        ни в будущий deep link.\\n        Повтор уже успешно погашенного токена в течение как минимум 30 дней является\\n        безопасным no-op; после удаления audit-записи токен снова считается недействительным. Сессия\\n        создаётся отдельным login-запросом, поэтому неопределённый результат HTTP\\n        confirm не может потерять выданный refresh secret.\\n      security: []\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/EmailVerificationConfirmRequest\\\"\\n      responses:\\n        \\\"204\\\":\\n          description: Email подтверждён или audit-запись уже фиксирует успешное погашение этого токена\\n        \\\"400\\\":\\n          description: Token/proof pair недействительна, погашена другим запросом или истекла\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/Error\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/email/verification/resend:\\n    post:\\n      tags: [auth]\\n      operationId: resendEmailVerification\\n      summary: Повторно отправить подтверждение email\\n      description: >-\\n        Всегда возвращает одинаковый ответ независимо от существования аккаунта и\\n        состояния email. Письмо повторно отправляется только для указанной попытки после проверки\\n        client-held registrationProof. Попытка живёт 24 часа независимо от cleanup, отдельный token —\\n        30 минут. Ранее выданные для этой же попытки неизрасходованные tokens остаются пригодны\\n        до своего expiry независимо от формата доставки; подтверждение одной попытки делает\\n        остальные бесполезными.\\n      security: []\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/EmailActionRequest\\\"\\n      responses:\\n        \\\"202\\\":\\n          description: Если действие допустимо, письмо будет отправлено\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/refresh:\\n    post:\\n      tags: [auth]\\n      operationId: refreshSession\\n      summary: Обновить пару токенов (refresh token rotation)\\n      description: >-\\n        Однократно использует текущий refresh credential и возвращает новую пару.\\n        Для повтора того же логического HTTP-запроса клиент обязан повторить\\n        тот же Idempotency-Key с тем же refresh token. Пока непосредственный\\n        successor остаётся текущим, а family активна и не истекла, Identity\\n        детерминированно вернёт тот же successor refresh token. После следующей\\n        rotation точный retry становится stale и отклоняется без отзыва сессии.\\n        Другой ключ для уже использованного credential считается reuse и атомарно\\n        отзывает всё семейство refresh-сессии.\\n      security: []\\n      parameters:\\n        - name: Idempotency-Key\\n          in: header\\n          required: true\\n          description: >-\\n            Криптографически случайный RFC 4122 UUIDv4 одной логической попытки\\n            refresh. Новый UUIDv4 создаётся для каждой rotation и повторяется\\n            только при сетевом retry того же refresh token. Пара refresh token +\\n            Idempotency-Key является bearer-sensitive recovery material и не\\n            должна попадать в логи.\\n          schema:\\n            type: string\\n            format: uuid\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/RefreshTokenRequest\\\"\\n      responses:\\n        \\\"200\\\":\\n          description: Новая пара токенов\\n          headers:\\n            Cache-Control:\\n              description: Запрещает хранение ответа с bearer credentials\\n              schema:\\n                type: string\\n                example: no-store\\n            Pragma:\\n              description: Совместимый с HTTP/1.0 запрет кэширования\\n              schema:\\n                type: string\\n                example: no-cache\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/TokenPair\\\"\\n        \\\"401\\\":\\n          description: Refresh token недействителен, отозван, уже использован или истёк\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/Error\\\"\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/logout:\\n    post:\\n      tags: [auth]\\n      operationId: logout\\n      summary: Завершить одну логическую сессию устройства\\n      description: >-\\n        Любой криптографически валидный refresh token семейства аутентифицирует\\n        логическую сессию устройства; Identity отзывает всё семейство, включая\\n        токен-замену, созданный конкурентным refresh.\\n      security: []\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/RefreshTokenRequest\\\"\\n      responses:\\n        \\\"204\\\":\\n          description: Сессия завершена или уже была завершена\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/account-deletion-requests:\\n    post:\\n      tags: [auth]\\n      operationId: requestAccountDeletion\\n      summary: Запросить необратимое удаление аккаунта\\n      description: >-\\n        Повторно подтверждает личность текущим паролем, немедленно переводит\\n        аккаунт в DELETION_PENDING, отзывает все refresh-сессии и атомарно\\n        записывает integration event для владельцев распределённых данных.\\n        Физическое удаление и статус завершения не имитируются: до появления\\n        downstream acknowledgements запрос остаётся DELETION_PENDING. После\\n        прохождения authentication, validation, rate-limit и availability gates\\n        один account и один Idempotency-Key возвращают исходные id, status и\\n        requestedAt; другой ключ после принятия удаления возвращает тот же\\n        активный deletion request и не создаёт повторное событие. Retry всё ещё может\\n        получить описанный 429 или retryable 503 и обязан сохранить ключ. Уже выданный\\n        access JWT остаётся криптографически валидным до exp.\\n      security:\\n        - accessToken: []\\n      parameters:\\n        - name: Idempotency-Key\\n          in: header\\n          required: true\\n          description: >-\\n            Криптографически случайный RFC 4122 UUIDv4 одной логической\\n            операции удаления в канонической 36-символьной текстовой форме.\\n            При неопределённом результате клиент повторяет\\n            тот же ключ. Значение не должно попадать в логи или telemetry.\\n          schema:\\n            type: string\\n            format: uuid\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/AccountDeletionRequest\\\"\\n      responses:\\n        \\\"202\\\":\\n          description: Запрос принят или ранее уже был принят для этого аккаунта\\n          headers:\\n            Cache-Control:\\n              description: Запрещает хранение ответа account lifecycle\\n              schema:\\n                type: string\\n                example: no-store\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/AccountDeletionRequestAccepted\\\"\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/BadRequest\\\"\\n        \\\"401\\\":\\n          $ref: \\\"#/components/responses/AccountDeletionUnauthorized\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/PayloadTooLarge\\\"\\n        \\\"429\\\":\\n          $ref: \\\"#/components/responses/TooManyRequests\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\n  /auth/jwks:\\n    get:\\n      tags: [auth]\\n      operationId: getIdentityJwks\\n      summary: Получить публичные ключи подписи access JWT\\n      description: >-\\n        Возвращает активный и retiring ES256 ключи для локальной проверки access JWT.\\n      security: []\\n      responses:\\n        \\\"200\\\":\\n          description: JSON Web Key Set\\n          headers:\\n            Cache-Control:\\n              schema:\\n                type: string\\n              example: public, max-age=300\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/JsonWebKeySet\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/ServiceUnavailable\\\"\\n\\ncomponents:\\n  securitySchemes:\\n    accessToken:\\n      type: http\\n      scheme: bearer\\n      bearerFormat: JWT\\n      description: >-\\n        Identity access JWT: ES256, typ=at+jwt, expected issuer and audience,\\n        and mandatory valid sub, sid, jti, iat and exp claims.\\n\\n  responses:\\n    BadRequest:\\n      description: Ошибка валидации\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n    PayloadTooLarge:\\n      description: Тело запроса превышает серверный лимит 16 KiB\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n    TooManyRequests:\\n      description: Слишком много запросов; повторите позднее\\n      headers:\\n        Retry-After:\\n          description: Число секунд до следующей разрешённой попытки\\n          schema:\\n            type: integer\\n            minimum: 1\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n    ServiceUnavailable:\\n      description: Сервис временно не готов обрабатывать запросы\\n      headers:\\n        Retry-After:\\n          description: Рекомендуемая задержка перед повтором, в секундах\\n          schema:\\n            type: integer\\n            minimum: 1\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n    RegistrationAttemptConflict:\\n      description: Attempt id или registration proof уже связан с другим запросом\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n    AccountDeletionUnauthorized:\\n      description: Access JWT отсутствует/недействителен либо текущий пароль не подтверждён\\n      headers:\\n        WWW-Authenticate:\\n          description: Bearer challenge; присутствует при отсутствующем/недействительном access JWT\\n          schema:\\n            type: string\\n            example: Bearer\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/Error\\\"\\n\\n  schemas:\\n    EmailAddress:\\n      type: string\\n      format: email\\n      description: >-\\n        Структурно корректный email с ASCII local-part и Unicode- или ASCII-доменом.\\n        Перед сравнением пробелы по краям удаляются, домен проходит\\n        non-transitional UTS #46 IDNA-преобразование, а весь адрес приводится к\\n        нижнему регистру. Лимит 254 символа проверяется для канонической ASCII-формы,\\n        а не для исходной JSON-строки. Ограничение новых регистраций доменами .ru и .рф не\\n        применяется к login/resend, чтобы сохранённые credentials оставались\\n        доступны после изменения admission policy.\\n\\n    RegistrationEmailAddress:\\n      type: string\\n      format: email\\n      description: >-\\n        Email для новой регистрации: ASCII local-part, Unicode- или ASCII-домен\\n        и максимум 254 символа в канонической ASCII-форме после IDNA-преобразования.\\n        Итоговый домен верхнего\\n        уровня должен быть .ru или .рф (xn--p1ai).\\n\\n    Password:\\n      type: string\\n      format: password\\n      writeOnly: true\\n      description: >-\\n        От 15 до 128 Unicode code points после NFC-нормализации. Обычные пробелы,\\n        Unicode и emoji разрешены; управляющие символы и разделители строк и\\n        абзацев запрещены. Требования к составу не навязываются. На сервере\\n        хранится только Argon2id encoded hash нормализованного значения.\\n\\n    LoginPassword:\\n      type: string\\n      format: password\\n      writeOnly: true\\n      description: >-\\n        Пароль для проверки существующего credential. Текущая registration\\n        policy намеренно не применяется при login, чтобы её ужесточение не\\n        блокировало ранее созданные аккаунты. Перед проверкой применяется та же\\n        NFC-нормализация и безопасный максимум, что и при регистрации.\\n\\n    RegistrationProof:\\n      type: string\\n      minLength: 43\\n      maxLength: 43\\n      pattern: \\\"^[A-Za-z0-9_-]{43}$\\\"\\n      writeOnly: true\\n      description: >-\\n        Base64url без padding от 32 криптографически случайных байтов. Клиент\\n        генерирует новое значение для каждой логической регистрации, хранит его как secret\\n        и повторяет в resend/confirm. Identity хранит только SHA-256 verifier.\\n\\n    RegistrationAttemptId:\\n      type: string\\n      format: uuid\\n      description: >-\\n        Криптографически случайный UUID одной логической регистрации. Клиент создаёт\\n        его вместе с registrationProof, хранит эту пару до завершения flow и повторяет\\n        идентификатор при register/resend. Он не является secret и встроен в email token,\\n        чтобы полученный через development handoff или будущий deep link token можно\\n        было однозначно сопоставить с сохранённым proof.\\n\\n    LocaleTag:\\n      type: string\\n      maxLength: 255\\n      example: ru-RU\\n      description: >-\\n        Well-formed BCP 47 language tag. Сервер канонизирует регистр subtags.\\n        Ограничение 255 символов является защитным product/storage bound, а не\\n        ограничением стандарта BCP 47.\\n\\n    EmailRegistrationRequest:\\n      type: object\\n      required: [registrationAttemptId, email, password, registrationProof]\\n      properties:\\n        registrationAttemptId:\\n          $ref: \\\"#/components/schemas/RegistrationAttemptId\\\"\\n        email:\\n          $ref: \\\"#/components/schemas/RegistrationEmailAddress\\\"\\n        password:\\n          $ref: \\\"#/components/schemas/Password\\\"\\n        registrationProof:\\n          $ref: \\\"#/components/schemas/RegistrationProof\\\"\\n        locale:\\n          $ref: \\\"#/components/schemas/LocaleTag\\\"\\n\\n    EmailLoginRequest:\\n      type: object\\n      required: [email, password]\\n      properties:\\n        email:\\n          $ref: \\\"#/components/schemas/EmailAddress\\\"\\n        password:\\n          $ref: \\\"#/components/schemas/LoginPassword\\\"\\n        deviceId:\\n          type: string\\n          minLength: 1\\n          maxLength: 255\\n          description: >-\\n            Opaque id установки клиента; непустой, не blank и без control,\\n            format, line/paragraph separator или malformed surrogate code points.\\n\\n    EmailActionRequest:\\n      type: object\\n      required: [registrationAttemptId, email, registrationProof]\\n      properties:\\n        registrationAttemptId:\\n          $ref: \\\"#/components/schemas/RegistrationAttemptId\\\"\\n        email:\\n          $ref: \\\"#/components/schemas/EmailAddress\\\"\\n        registrationProof:\\n          $ref: \\\"#/components/schemas/RegistrationProof\\\"\\n\\n    EmailVerificationConfirmRequest:\\n      type: object\\n      required: [token, registrationProof]\\n      properties:\\n        token:\\n          type: string\\n          minLength: 121\\n          maxLength: 121\\n          description: >-\\n            Opaque email token, содержащий публичные attempt/token UUID и\\n            256-битный secret. Клиент не должен логировать или сохранять его вне flow.\\n        registrationProof:\\n          $ref: \\\"#/components/schemas/RegistrationProof\\\"\\n\\n    RefreshTokenRequest:\\n      type: object\\n      required: [refreshToken]\\n      properties:\\n        refreshToken:\\n          type: string\\n          minLength: 32\\n          maxLength: 512\\n\\n    AccountDeletionRequest:\\n      type: object\\n      required: [currentPassword]\\n      properties:\\n        currentPassword:\\n          $ref: \\\"#/components/schemas/LoginPassword\\\"\\n\\n    AccountDeletionRequestAccepted:\\n      type: object\\n      required: [deletionRequestId, status, requestedAt]\\n      properties:\\n        deletionRequestId:\\n          type: string\\n          format: uuid\\n          description: UUIDv7 стабильного процесса удаления.\\n        status:\\n          type: string\\n          enum: [DELETION_PENDING]\\n        requestedAt:\\n          type: string\\n          format: date-time\\n          description: Момент первого принятия запроса в UTC.\\n\\n    TokenPair:\\n      type: object\\n      description: >-\\n        Access token — короткоживущий JWT и не хранится на сервере. Refresh token —\\n        256-битный opaque secret; клиент хранит его в Keychain/Keystore, а Identity\\n        сохраняет в PostgreSQL только verifier и состояние rotation family.\\n      required: [accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresIn]\\n      properties:\\n        accessToken:\\n          type: string\\n        accessTokenExpiresIn:\\n          type: integer\\n          description: seconds\\n          example: 900\\n        refreshToken:\\n          type: string\\n        refreshTokenExpiresIn:\\n          type: integer\\n          description: seconds\\n\\n    TokenPairWithUser:\\n      allOf:\\n        - $ref: \\\"#/components/schemas/TokenPair\\\"\\n        - type: object\\n          required: [user]\\n          properties:\\n            user:\\n              $ref: \\\"#/components/schemas/AuthenticatedUser\\\"\\n\\n    AuthenticatedUser:\\n      type: object\\n      required: [id]\\n      properties:\\n        id:\\n          type: string\\n          format: uuid\\n          description: UUIDv7 account identifier.\\n\\n    JsonWebKeySet:\\n      type: object\\n      required: [keys]\\n      properties:\\n        keys:\\n          type: array\\n          items:\\n            $ref: \\\"#/components/schemas/JsonWebKey\\\"\\n\\n    JsonWebKey:\\n      type: object\\n      required: [kty, use, alg, kid, crv, x, y]\\n      properties:\\n        kty:\\n          type: string\\n          enum: [EC]\\n        use:\\n          type: string\\n          enum: [sig]\\n        alg:\\n          type: string\\n          enum: [ES256]\\n        kid:\\n          type: string\\n        crv:\\n          type: string\\n          enum: [P-256]\\n        x:\\n          type: string\\n        y:\\n          type: string\\n\\n    Error:\\n      type: object\\n      description: >-\\n        Стабильная публичная ошибка. Для валидации используются коды\\n        INVALID_EMAIL_FORMAT, EMAIL_TOO_LONG, EMAIL_LOCAL_PART_UNSUPPORTED,\\n        EMAIL_DOMAIN_NOT_SUPPORTED, PASSWORD_TOO_SHORT, PASSWORD_TOO_LONG,\\n        PASSWORD_INVALID_CHARACTERS, INVALID_LOCALE, INVALID_DEVICE_ID,\\n        INVALID_REQUEST, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN,\\n        INVALID_VERIFICATION_TOKEN, INVALID_ACCESS_TOKEN,\\n        REGISTRATION_ATTEMPT_CONFLICT и PAYLOAD_TOO_LARGE.\\n      required: [code, message]\\n      properties:\\n        code:\\n          type: string\\n          example: INVALID_REQUEST\\n        message:\\n          type: string\\n          example: Invalid request.\\n        details:\\n          type: object\\n          additionalProperties: true\\n        requestId:\\n          type: string\\n          format: uuid\\n\",\"contracts/openapi/public/notification.yaml\":\"openapi: 3.0.3\\ninfo:\\n  title: COOKie Notification Public API\\n  version: 1.0.0\\n  description: Push devices and notification preferences owned by Notification Service.\\nservers:\\n  - url: https://api.cookie.app/v1\\n    description: Production\\n  - url: http://127.0.0.1:8082/v1\\n    description: Local Notification\\ntags:\\n  - name: notifications\\n    description: Push devices and notification preferences.\\npaths:\\n  /notifications/devices:\\n    post:\\n      tags: [notifications]\\n      security:\\n        - accessToken: []\\n      operationId: registerDevice\\n      summary: Зарегистрировать push-токен устройства\\n      description: >-\\n        Register the Firebase Cloud Messaging registration token for IOS or ANDROID.\\n        Existing IOS clients using direct APNs must obtain and re-register an FCM token;\\n        APNs device tokens cannot be used as FCM registration tokens.\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/PushDeviceInput\\\"\\n      responses:\\n        \\\"403\\\":\\n          $ref: \\\"#/components/responses/NotificationAccountDeleted\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/NotificationPayloadTooLarge\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/NotificationUnavailable\\\"\\n        \\\"200\\\":\\n          description: Токен существующего устройства обновлён\\n          headers:\\n            Cache-Control:\\n              $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/PushDevice\\\"\\n        \\\"201\\\":\\n          description: Устройство зарегистрировано\\n          headers:\\n            Cache-Control:\\n              $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/PushDevice\\\"\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/NotificationBadRequest\\\"\\n        \\\"401\\\":\\n          $ref: \\\"#/components/responses/NotificationUnauthorized\\\"\\n\\n  /notifications/devices/{deviceId}:\\n    parameters:\\n      - name: deviceId\\n        in: path\\n        required: true\\n        schema:\\n          type: string\\n    delete:\\n      tags: [notifications]\\n      security:\\n        - accessToken: []\\n      operationId: unregisterDevice\\n      summary: Удалить push-токен устройства\\n      responses:\\n        \\\"403\\\":\\n          $ref: \\\"#/components/responses/NotificationAccountDeleted\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/NotificationUnavailable\\\"\\n        \\\"204\\\":\\n          description: Удалено\\n        \\\"401\\\":\\n          $ref: \\\"#/components/responses/NotificationUnauthorized\\\"\\n        \\\"404\\\":\\n          $ref: \\\"#/components/responses/NotificationNotFound\\\"\\n\\n  /notifications/settings:\\n    get:\\n      tags: [notifications]\\n      security:\\n        - accessToken: []\\n      operationId: getNotificationSettings\\n      summary: Получить настройки уведомлений\\n      responses:\\n        \\\"403\\\":\\n          $ref: \\\"#/components/responses/NotificationAccountDeleted\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/NotificationUnavailable\\\"\\n        \\\"200\\\":\\n          description: Настройки\\n          headers:\\n            Cache-Control:\\n              $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/NotificationSettings\\\"\\n        \\\"401\\\":\\n          $ref: \\\"#/components/responses/NotificationUnauthorized\\\"\\n    patch:\\n      tags: [notifications]\\n      security:\\n        - accessToken: []\\n      operationId: updateNotificationSettings\\n      summary: Частично обновить настройки уведомлений\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              $ref: \\\"#/components/schemas/NotificationSettingsPatch\\\"\\n      responses:\\n        \\\"403\\\":\\n          $ref: \\\"#/components/responses/NotificationAccountDeleted\\\"\\n        \\\"413\\\":\\n          $ref: \\\"#/components/responses/NotificationPayloadTooLarge\\\"\\n        \\\"503\\\":\\n          $ref: \\\"#/components/responses/NotificationUnavailable\\\"\\n        \\\"200\\\":\\n          description: Обновлённые настройки\\n          headers:\\n            Cache-Control:\\n              $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/NotificationSettings\\\"\\n        \\\"400\\\":\\n          $ref: \\\"#/components/responses/NotificationBadRequest\\\"\\n        \\\"401\\\":\\n          $ref: \\\"#/components/responses/NotificationUnauthorized\\\"\\n\\ncomponents:\\n  securitySchemes:\\n    accessToken:\\n      type: http\\n      scheme: bearer\\n      bearerFormat: JWT\\n      description: >-\\n        Identity access JWT: ES256, typ=at+jwt, expected issuer and audience,\\n        and mandatory valid sub, sid, jti, iat and exp claims.\\n  headers:\\n    NotificationNoStore:\\n      description: Account data and error responses must not be stored in caches.\\n      schema:\\n        type: string\\n        enum: [no-store]\\n  responses:\\n    NotificationBadRequest:\\n      description: Invalid notification input\\n      headers:\\n        Cache-Control:\\n          $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n    NotificationUnauthorized:\\n      description: Missing or invalid access JWT\\n      headers:\\n        Cache-Control:\\n          $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n        WWW-Authenticate:\\n          description: Bearer challenge for missing or invalid access credentials.\\n          schema:\\n            type: string\\n            enum: [Bearer]\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n    NotificationNotFound:\\n      description: Device not found\\n      headers:\\n        Cache-Control:\\n          $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n    NotificationAccountDeleted:\\n      description: Account deletion has been received; access is forbidden\\n      headers:\\n        Cache-Control:\\n          $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n    NotificationPayloadTooLarge:\\n      description: Request exceeds 16 KiB\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n    NotificationUnavailable:\\n      description: Notification dependency unavailable\\n      headers:\\n        Cache-Control:\\n          $ref: \\\"#/components/headers/NotificationNoStore\\\"\\n        Retry-After:\\n          description: Minimum recommended delay before retrying, in seconds.\\n          schema:\\n            type: integer\\n            enum: [1]\\n      content:\\n        application/json:\\n          schema:\\n            $ref: \\\"#/components/schemas/NotificationError\\\"\\n  schemas:\\n    PushDeviceInput:\\n      type: object\\n      additionalProperties: false\\n      required: [platform, token, deviceId]\\n      properties:\\n        platform:\\n          type: string\\n          enum: [IOS, ANDROID]\\n        token:\\n          type: string\\n          minLength: 1\\n          maxLength: 4096\\n          description: >-\\n            Firebase Cloud Messaging registration token on both IOS and ANDROID;\\n            opaque and case-sensitive, including tokens that look hexadecimal.\\n            IOS clients must send the FCM token, never the APNs device token.\\n            Registering an existing token transfers its active binding to this account and device.\\n        deviceId:\\n          type: string\\n          minLength: 1\\n          maxLength: 255\\n\\n    PushDevice:\\n      type: object\\n      required: [platform, token, deviceId, id, enabled]\\n      properties:\\n        platform:\\n          type: string\\n          enum: [IOS, ANDROID]\\n        token:\\n          type: string\\n          minLength: 1\\n          maxLength: 4096\\n          description: Exact opaque FCM registration token as registered, preserving letter case on both platforms.\\n        deviceId:\\n          type: string\\n          minLength: 1\\n          maxLength: 255\\n        id:\\n          type: string\\n          format: uuid\\n        enabled:\\n          type: boolean\\n\\n    NotificationSettings:\\n      type: object\\n      description: Scheduled push stays disabled until timezone is explicitly set.\\n      required: [water, food, weighIn, goalWarning, quietHours, locale]\\n      properties:\\n        timezone:\\n          type: string\\n          description: IANA timezone. Omitted until explicitly configured; null cannot clear it.\\n          example: Europe/London\\n        locale:\\n          type: string\\n          enum: [ru, en]\\n          default: ru\\n        water:\\n          type: object\\n          required: [enabled]\\n          properties:\\n            enabled:\\n              type: boolean\\n        food:\\n          type: object\\n          required: [enabled, inactiveForMinutes]\\n          properties:\\n            enabled:\\n              type: boolean\\n            inactiveForMinutes:\\n              type: integer\\n              minimum: 1\\n              maximum: 10080\\n        weighIn:\\n          type: object\\n          required: [enabled, time]\\n          properties:\\n            enabled:\\n              type: boolean\\n            time:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n              example: \\\"08:00\\\"\\n        goalWarning:\\n          type: object\\n          required: [enabled]\\n          properties:\\n            enabled:\\n              type: boolean\\n        quietHours:\\n          type: object\\n          required: [start, end]\\n          properties:\\n            start:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n              example: \\\"23:00\\\"\\n            end:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n              example: \\\"08:00\\\"\\n\\n    NotificationSettingsPatch:\\n      type: object\\n      additionalProperties: false\\n      minProperties: 1\\n      properties:\\n        timezone:\\n          type: string\\n          description: IANA timezone. Omitted until explicitly configured; null cannot clear it.\\n          example: Europe/London\\n        locale:\\n          type: string\\n          enum: [ru, en]\\n        water:\\n          type: object\\n          minProperties: 1\\n          additionalProperties: false\\n          properties:\\n            enabled:\\n              type: boolean\\n        food:\\n          type: object\\n          minProperties: 1\\n          additionalProperties: false\\n          properties:\\n            enabled:\\n              type: boolean\\n            inactiveForMinutes:\\n              type: integer\\n              minimum: 1\\n              maximum: 10080\\n        weighIn:\\n          type: object\\n          minProperties: 1\\n          additionalProperties: false\\n          properties:\\n            enabled:\\n              type: boolean\\n            time:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n        goalWarning:\\n          type: object\\n          minProperties: 1\\n          additionalProperties: false\\n          properties:\\n            enabled:\\n              type: boolean\\n        quietHours:\\n          type: object\\n          minProperties: 1\\n          additionalProperties: false\\n          properties:\\n            start:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n            end:\\n              type: string\\n              pattern: \\\"^([01]\\\\\\\\d|2[0-3]):[0-5]\\\\\\\\d$\\\"\\n\\n    NotificationError:\\n      type: object\\n      required: [code, message]\\n      properties:\\n        code:\\n          type: string\\n        message:\\n          type: string\\n        requestId:\\n          type: string\\n          format: uuid\\n\",\"contracts/openapi/runtime.yaml\":\"openapi: 3.0.3\\ninfo:\\n  title: COOKie Service Runtime API\\n  version: 0.1.0\\n  description: >-\\n    Internal operational endpoints implemented independently by every deployable\\n    backend component. They are unauthenticated at the application layer so an\\n    orchestrator can probe a component without user credentials, but deployment\\n    networking must restrict them to orchestrator/operator access and a public\\n    gateway must never route them. This contract does not belong to Health Data\\n    Service or to the product public API.\\ntags:\\n  - name: system\\n    description: Component-local liveness and readiness.\\npaths:\\n  /healthz:\\n    get:\\n      tags: [system]\\n      operationId: getLiveness\\n      summary: Process liveness probe\\n      security: []\\n      responses:\\n        \\\"200\\\":\\n          description: Process is alive\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/ProbeStatus\\\"\\n  /readyz:\\n    get:\\n      tags: [system]\\n      operationId: getReadiness\\n      summary: Dependency readiness probe\\n      security: []\\n      responses:\\n        \\\"200\\\":\\n          description: Component is ready to serve traffic\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/ProbeStatus\\\"\\n        \\\"503\\\":\\n          description: Component is alive but not ready\\n          content:\\n            application/json:\\n              schema:\\n                $ref: \\\"#/components/schemas/ProbeStatus\\\"\\ncomponents:\\n  schemas:\\n    ProbeStatus:\\n      type: object\\n      required: [status]\\n      properties:\\n        status:\\n          type: string\\n          enum: [ok, not_ready]\\n\",\"deploy/production/README.md\":\"# Production on one VM\\n\\nThe production bundle runs Identity, Notification, PostgreSQL, NATS JetStream\\nand ephemeral Redis on one non-preemptible Yandex VM. The configured floor is\\n4 vCPU / 8 GiB RAM / 50% core fraction. This remains **non-HA**; external\\nmonitoring, backups, disk snapshots and a tested restore procedure are required\\nbefore storing valuable data. Mailpit, the development notification sink and the\\nlegacy Go API are not production services.\\n\\nChanges in this repository prepare deployable configuration. They do not apply\\nTerraform, deploy a VM, install real secrets or send notifications. Review the\\nTerraform plan before expanding an existing VM; resizing can interrupt service.\\n\\n## Artifact and network boundaries\\n\\nEach service has its own Container Registry repository, scoped IAM grants,\\nDockerfile, CI checks and immutable digest. CI publishes on a successful merge\\nto `main`; an operator deploys separately. The VM never builds source or stores\\nstatic Yandex service-account keys. Its short-lived registry token comes from\\nmetadata using its pull-only service account.\\n\\nIdentity publishes host TCP/8080 and Notification TCP/8082. Terraform permits\\nthese ports only from API Gateway's `198.19.0.0/16` integration range. The existing\\ngateway routes `/v1/auth/*` and `/v1/notifications/*` and preserves authorization,\\nidempotency, request IDs and query parameters. Client-supplied `X-Forwarded-For`\\nis removed. `/healthz` and `/readyz` remain private. Keep the existing gateway\\nresource/issuer when adding Notification; a new public origin is not required.\\n\\nBoth services join the ordinary `edge` bridge. Notification uses it for outbound\\nHTTPS (JWKS and FCM) and SMTP with STARTTLS. PostgreSQL, NATS and Redis join only\\nthe internal `backend` bridge, with no host ports. Redis is authenticated and has\\nno volume, snapshots or AOF: it can be rebuilt from Notification's PostgreSQL\\nstate. The application falls back to its PostgreSQL deadline query during Redis\\nloss, eviction pressure or restart.\\n\\nContainer memory limits are Identity 1536 MiB, Notification 1536 MiB, PostgreSQL\\n1536 MiB, NATS 512 MiB and Redis 256 MiB (128 MiB data limit, `noeviction`). JVM\\nheap is bounded to 70% of its container. These are initial limits; observe actual\\nusage before increasing concurrency or adding services.\\n\\nNotification reserves twelve database connections for up to eight push workers,\\nleaving capacity for HTTP readiness, inbox ingestion and lease heartbeats while\\nbounded provider calls hold their submission locks.\\n\\nThe production JVM options select Bouncy Castle's pure Java implementation with\\n`-Dorg.bouncycastle.native.cpu_variant=java`. The pinned LTS provider otherwise\\nextracts a native CPU probe into `/tmp`, which cannot load on the intentionally\\n`noexec` tmpfs. This preserves the container restriction and the same Argon2/JWE\\nalgorithms; benchmark password hashing with these production JVM options.\\n\\n## Installation and secrets\\n\\nInstall this directory as an immutable root-owned bundle, for example\\n`/opt/cookie/production`. Docker Engine/Compose, curl, jq and flock are required.\\nCreate directories before installing secrets:\\n\\n```bash\\nsudo install -d -m 0750 -o 70 -g 70 /srv/cookie/postgres\\nsudo install -d -m 0750 -o 1000 -g 1000 /srv/cookie/nats\\nsudo install -d -m 0700 -o root -g root /srv/cookie/releases\\nsudo install -d -m 0711 -o root -g root /srv/cookie/secrets\\nsudo install -d -m 0700 -o 70 -g 70 /srv/cookie/secrets/postgres\\nsudo install -d -m 0700 -o 10001 -g 10001 /srv/cookie/secrets/identity /srv/cookie/secrets/identity/retiring\\nsudo install -d -m 0700 -o 10001 -g 10001 /srv/cookie/secrets/notification /srv/cookie/secrets/notification/retiring\\nsudo install -d -m 0700 -o 1000 -g 1000 /srv/cookie/secrets/nats\\nsudo install -d -m 0700 -o 999 -g 999 /srv/cookie/secrets/redis\\nsudo install -d -m 0755 -o root -g root /etc/cookie\\nsudo install -m 0600 -o root -g root .env.example /etc/cookie/production.env\\n```\\n\\nReplace every placeholder in the root-owned static environment file. Set both\\nbind IPs to `0.0.0.0` behind the Terraform gateway, set the exact HTTPS Identity\\nissuer, and use `<issuer>/v1/auth/jwks` for `COOKIE_IDENTITY_JWKS_URL`. Configure a\\nreal application verification-page URL; the email link must not target Identity's\\nJSON POST confirmation operation. Configure the SMTP sender and Message-ID\\ndomain. Configure the Firebase project ID when enabling push for Android and\\niOS. Never put raw passwords, keys or credential JSON in this file, Git or\\nTerraform state.\\n\\nProvision the following files out of band. Private files use mode `0400`; every\\npath in the table is relative to `/srv/cookie/secrets`.\\n\\n| Path | Owner | Purpose |\\n| --- | --- | --- |\\n| `postgres/admin-password` | `70:70` | Bootstrap/emergency PostgreSQL administrator |\\n| `postgres/identity-password`, `postgres/identity-migration-password` | `70:70` | Identity runtime/migrator passwords |\\n| `postgres/notification-password`, `postgres/notification-migration-password` | `70:70` | Notification runtime/migrator passwords |\\n| `identity/spring.datasource.password`, `identity/spring.flyway.password` | `10001:10001` | Exact copies of corresponding PostgreSQL credentials |\\n| `identity/cookie.identity.rate-limit-hmac-key` | `10001:10001` | Canonical base64url 32-byte HMAC key |\\n| `identity/identity-jwt-private.jwk` | `10001:10001` | Active private ES256 P-256 signing JWK |\\n| `identity/notification-public.jwk` | `10001:10001` | Public half of Notification's active RSA-OAEP-256 key |\\n| `identity/retiring/*.jwk` | `10001:10001` | Retiring public signing JWKs |\\n| `identity/nats-identity.creds`, `identity/nats-truststore.jks`, `identity/cookie.identity.nats-truststore-password` | `10001:10001` | Identity NATS identity and trusted CA |\\n| `notification/spring.datasource.password`, `notification/spring.flyway.password` | `10001:10001` | Exact copies of Notification PostgreSQL credentials |\\n| `notification/notification-private.jwk`, `notification/retiring/*.jwk` | `10001:10001` | Active/retiring private JWE decryption JWKs |\\n| `notification/nats-notification.creds`, `notification/nats-truststore.jks`, `notification/cookie.notification.nats-truststore-password` | `10001:10001` | Restricted consumer credential and trusted CA |\\n| `redis/password` | `999:999` | Random Redis ACL password |\\n| `notification/spring.data.redis.password` | `10001:10001` | Exact copy of Redis password |\\n| `notification/cookie.notification.delivery.smtp.password` | `10001:10001` | SMTP password |\\n| `notification/fcm-credentials.json` | `10001:10001` | Firebase service-account credentials for Android and iOS push |\\n| `nats/auth.conf`, `nats/server.key`, `nats/stream-admin.creds` | `1000:1000` | Operator/account config, server TLS key and deployment credential |\\n| `nats/ca.crt`, `nats/server.crt` | `root:root`, `0444` | CA and server certificate with DNS SAN `nats` |\\n\\nUse different database passwords for every role. The deploy script checks that\\nowner-specific copies agree, files are regular/non-symlink, permissions are\\nprivate and owner UIDs match. Spring reads scalar secrets through\\n`configtree:/run/secrets/`; no raw production secret is in a Compose environment\\nvariable. Each JKS contains the NATS CA, and hostname verification remains on.\\nRecheck image UID assumptions when changing pinned images.\\n\\nFCM is the sole push provider called by Notification for both Android and iOS.\\nUpload the Apple APNs authentication key to the Firebase project's Apple app\\nconfiguration; Firebase delivers iOS messages through APNs. Notification does\\nnot mount an Apple key or connect directly to APNs.\\n\\nPush is disabled by default and needs no Firebase credential file while\\ndisabled. To enable both platforms, install `notification/fcm-credentials.json`,\\nset `COOKIE_FCM_PROJECT_ID` and `COOKIE_FCM_ENABLED=true`. The deploy script\\nautomatically adds `compose.fcm.yaml` to mount the credential file. Manual\\nCompose commands m
