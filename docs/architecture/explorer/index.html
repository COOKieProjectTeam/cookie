nio.file.Files\\nimport java.nio.file.Path\\nimport java.time.Clock\\nimport java.time.Duration\\nimport java.time.Instant\\nimport java.time.ZonedDateTime\\nimport java.time.format.DateTimeFormatter\\nimport java.util.concurrent.TimeUnit\\nimport java.util.concurrent.locks.ReentrantLock\\n\\nfun interface FcmAccessToken { fun token(): String }\\n\\nclass GoogleFcmAccessToken(properties: FcmProperties, http: BoundedHttpExchange) : FcmAccessToken {\\n    private val refreshLock = ReentrantLock()\\n    private val credentials = if (properties.enabled) {\\n        val path = Path.of(properties.credentialsPath)\\n        require(Files.size(path) <= 65_536)\\n        Files.newInputStream(path).use { ServiceAccountCredentials.fromStream(it) }.toBuilder()\\n            .setScopes(listOf(\\\"https://www.googleapis.com/auth/firebase.messaging\\\"))\\n            .setTokenServerUri(java.net.URI.create(\\\"https://oauth2.googleapis.com/token\\\"))\\n            .setHttpTransportFactory { BoundedGoogleAuthTransport(http) }\\n            .setDefaultRetriesEnabled(false).build()\\n    } else null\\n    override fun token(): String {\\n        check(refreshLock.tryLock(5, TimeUnit.SECONDS)) { \\\"FCM credential refresh busy\\\" }\\n        try {\\n            val current = requireNotNull(credentials)\\n            current.refreshIfExpired()\\n            return current.accessToken.tokenValue\\n        } finally { refreshLock.unlock() }\\n    }\\n}\\n\\nclass FcmPushSender(\\n    private val properties: FcmProperties, private val tokens: FcmAccessToken, private val http: BoundedHttpExchange,\\n    private val mapper: ObjectMapper, private val templates: NotificationTemplates, private val clock: Clock,\\n) : PushSender {\\n    init { require(!properties.enabled || properties.projectId.matches(Regex(\\\"[a-z][a-z0-9-]{4,62}\\\"))) }\\n    override fun send(job: DeliveryJob, target: PushTarget, beforeSubmission: () -> Unit): ProviderResult {\\n        if (!properties.enabled) return ProviderResult.Unavailable(\\\"FCM_DISABLED\\\")\\n        if (target.platform !in setOf(\\\"IOS\\\", \\\"ANDROID\\\")) return ProviderResult.Failed(\\\"UNSUPPORTED_PLATFORM\\\")\\n        val token = try { tokens.token() } catch (_: Exception) { return ProviderResult.Unavailable(\\\"FCM_AUTH\\\") }\\n        if (!job.expiresAt.isAfter(clock.instant())) return ProviderResult.Failed(\\\"DELIVERY_EXPIRED\\\")\\n        val text = templates.push(job.kind, target.locale)\\n        val body = mapper.createObjectNode().apply {\\n            putObject(\\\"message\\\").apply {\\n                put(\\\"token\\\", target.token)\\n                putObject(\\\"notification\\\").put(\\\"title\\\", text.title).put(\\\"body\\\", text.body)\\n                putObject(\\\"data\\\").put(\\\"deliveryId\\\", job.id.toString())\\n                when (target.platform) {\\n                    \\\"ANDROID\\\" -> putObject(\\\"android\\\").apply {\\n                        put(\\\"ttl\\\", \\\"${Duration.between(clock.instant(), job.expiresAt).seconds.coerceIn(0, 3600)}s\\\")\\n                        put(\\\"priority\\\", \\\"NORMAL\\\")\\n                        putObject(\\\"notification\\\").put(\\\"tag\\\", requireNotNull(job.occurrenceId).toString())\\n                    }\\n                    \\\"IOS\\\" -> putObject(\\\"apns\\\").putObject(\\\"headers\\\").apply {\\n                        put(\\\"apns-push-type\\\", \\\"alert\\\")\\n                        put(\\\"apns-priority\\\", \\\"10\\\")\\n                        put(\\\"apns-id\\\", job.id.toString())\\n                        put(\\\"apns-collapse-id\\\", requireNotNull(job.occurrenceId).toString())\\n                        put(\\\"apns-expiration\\\", job.expiresAt.epochSecond.toString())\\n                    }\\n                }\\n            }\\n        }\\n        return try {\\n            val request = HttpRequest.newBuilder(properties.baseUrl.resolve(\\\"/v1/projects/${properties.projectId}/messages:send\\\"))\\n                .timeout(Duration.ofSeconds(15)).header(\\\"Authorization\\\", \\\"Bearer $token\\\").header(\\\"Content-Type\\\", \\\"application/json\\\")\\n                .POST(HttpRequest.BodyPublishers.ofByteArray(mapper.writeValueAsBytes(body))).build()\\n            beforeSubmission()\\n            val response = http.send(request, Duration.ofSeconds(15))\\n            val json = runCatching { mapper.readTree(response.body()) }.getOrNull()\\n            val fcmErrors = json?.path(\\\"error\\\")?.path(\\\"details\\\")?.filter {\\n                it.path(\\\"@type\\\").takeIf { type -> type.isString }?.stringValue() == \\\"type.googleapis.com/google.firebase.fcm.v1.FcmError\\\"\\n            }?.mapNotNull { it.path(\\\"errorCode\\\").takeIf { code -> code.isString }?.stringValue() }.orEmpty()\\n            when {\\n                response.statusCode() == 200 -> ProviderResult.Accepted(json?.path(\\\"name\\\")?.takeIf { it.isString }?.stringValue())\\n                \\\"THIRD_PARTY_AUTH_ERROR\\\" in fcmErrors -> ProviderResult.Unavailable(\\\"FCM_THIRD_PARTY_AUTH\\\")\\n                \\\"UNREGISTERED\\\" in fcmErrors -> ProviderResult.Failed(\\\"FCM_UNREGISTERED\\\", true)\\n                response.statusCode() == 401 || response.statusCode() == 403 -> ProviderResult.Unavailable(\\\"FCM_AUTH\\\")\\n                response.statusCode() == 429 -> ProviderResult.Retry(\\\"FCM_RATE_LIMIT\\\",\\n                    retryAfter(response.headers().firstValue(\\\"Retry-After\\\").orElse(null), clock.instant()))\\n                response.statusCode() >= 500 -> ProviderResult.Retry(\\\"FCM_UNAVAILABLE\\\",\\n                    retryAfter(response.headers().firstValue(\\\"Retry-After\\\").orElse(null), clock.instant(), 10))\\n                else -> ProviderResult.Failed(\\\"FCM_REJECTED\\\")\\n            }\\n        } catch (_: Exception) { ProviderResult.Retry(\\\"FCM_NETWORK\\\") }\\n    }\\n}\\n\\ninternal fun retryAfter(value: String?, now: Instant, minimumSeconds: Long = 60): Duration {\\n    val normalized = value?.trim()\\n    val seconds = normalized?.toLongOrNull() ?: runCatching {\\n        val delay = Duration.between(now, ZonedDateTime.parse(normalized, DateTimeFormatter.RFC_1123_DATE_TIME).toInstant())\\n        // Round up so a fractional clock instant never retries before the HTTP-date.\\n        delay.seconds + if (delay.nano > 0) 1 else 0\\n    }.getOrDefault(minimumSeconds)\\n    return Duration.ofSeconds(seconds.coerceIn(minimumSeconds, 86_400))\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/SmtpVerificationSender.kt\":\"package com.cookie.notification.delivery\\n\\nimport com.cookie.notification.config.SmtpProperties\\nimport com.cookie.notification.security.VerificationEmail\\nimport jakarta.mail.Message\\nimport jakarta.mail.MessagingException\\nimport jakarta.mail.Session\\nimport jakarta.mail.internet.InternetAddress\\nimport jakarta.mail.internet.MimeBodyPart\\nimport jakarta.mail.internet.MimeMessage\\nimport jakarta.mail.internet.MimeMultipart\\nimport org.eclipse.angus.mail.smtp.SMTPAddressFailedException\\nimport org.eclipse.angus.mail.smtp.SMTPSendFailedException\\nimport org.eclipse.angus.mail.smtp.SMTPTransport\\nimport java.util.Properties\\nimport java.util.UUID\\nimport java.net.InetAddress\\nimport java.net.Socket\\nimport java.util.concurrent.Executors\\nimport java.util.concurrent.TimeUnit\\nimport java.util.concurrent.atomic.AtomicReference\\nimport javax.net.SocketFactory\\nimport jakarta.annotation.PreDestroy\\n\\nclass SmtpPreparationException(val result: ProviderResult) : RuntimeException(\\\"SMTP preparation failed\\\")\\n\\ninterface PreparedEmail : AutoCloseable { fun submit(): ProviderResult }\\nfun interface VerificationSender { fun prepare(job: DeliveryJob, email: VerificationEmail): PreparedEmail }\\n\\n/** Connect/authenticate before the durable SMTP_SUBMITTING marker; never retry inside this adapter. */\\nclass SmtpVerificati ets.UTF_8.name())\\n            val multipart = MimeMultipart(\\\"alternative\\\")\\n            multipart.addBodyPart(MimeBodyPart().apply { setText(content.text, \\\"UTF-8\\\") })\\n            multipart.addBodyPart(MimeBodyPart().apply { setContent(content.html, \\\"text/html; charset=UTF-8\\\") })\\n            setContent(multipart)\\n            saveChanges()\\n        }\\n        val transport = session.getTransport(\\\"smtp\\\") as SMTPTransport\\n        val preparationDeadline = timeouts.schedule({ socketFactory.abort() }, 60, TimeUnit.SECONDS)\\n        try {\\n            transport.connect(properties.host, properties.port, properties.username.takeIf(String::isNotBlank),\\n                properties.password.takeIf(String::isNotBlank))\\n        } catch (_: jakarta.mail.AuthenticationFailedException) {\\n            runCatching { transport.close() }\\n            throw SmtpPreparationException(ProviderResult.Unavailable(\\\"SMTP_AUTH\\\"))\\n        } catch (_: Exception) {\\n            runCatching { transport.close() }\\n            throw SmtpPreparationException(ProviderResult.Retry(\\\"SMTP_CONNECT\\\"))\\n        } finally {\\n            preparationDeadline.cancel(false)\\n        }\\n        return object : PreparedEmail {\\n            override fun submit(): ProviderResult {\\n                // Closing the underlying socket is independent of SMTPTransport's synchronized send/close lock.\\n                val deadline = timeouts.schedule({ socketFactory.abort() }, 60, TimeUnit.SECONDS)\\n                return try {\\n                    transport.sendMessage(message, message.allRecipients)\\n                    ProviderResult.Accepted(message.messageID)\\n                } catch (exception: Exception) { classifySmtpFailure(exception) }\\n                finally { deadline.cancel(false) }\\n            }\\n            override fun close() { runCatching { transport.close() } }\\n        }\\n    }\\n    @PreDestroy fun close() { timeouts.shutdownNow( end/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\":\"package com.cookie.notification.messaging\\n\\nimport io.micrometer.core.instrument.MeterRegistry\\nimport io.nats.client.JetStreamSubscription\\nimport io.nats.client.Message\\nimport io.nats.client.PullSubscribeOptions\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport org.springframework.stereotype.Component\\nimport org.springframework.context.annotation.Profile\\nimport tools.jackson.databind.ObjectMapper\\nimport java.security.MessageDigest\\nimport java.time.Duration\\nimport java.util.UUID\\n\\n@Component\\n@Profile(\\\"!notification-replay\\\")\\nclass NotificationConsumer(\\n    private val nats:NotificationNatsConnection,\\n    private val properties:NotificationMessagingProperties,\\n    private val handler:NotificationEventHandler,\\n    private val quarantine:NotificationQuarantine,\\n    registry:MeterRegistry,\\n) {\\n    private var subscription:JetStreamSubscription?=null\\n    private val processed=registry.counter(\\\"notification.inbox.processed\\\")\\n    private val failures=registry.counter(\\\"notification.inbox.failures\\\")\\n    private val quarantined=registry.counter(\\\"notification.inbox.quarantined\\\")\\n    @Scheduled(fixedDelayString=\\\"\\\\${cookie.notification.consumer-poll-millis:100}\\\")\\n    fun poll() {\\n        if(!properties.consumerEnabled) return\\n        try {\\n            val active=subscription?.takeIf { it.isActive }?:nats.connection().jetStream()\\n                .subscribe(null,PullSubscribeOptions.bind(NotificationNatsConnection.STREAM,NotificationEventHandler.CONSUMER)).also { subscription=it }\\n            active.fetch(20,Duration.ofSeconds(1)).forEach(::consume)\\n        } catch (_:Exception) { failures.increment() }\\n    }\\n    fun consume(message:Message) {\\n        try {\\n            handler.handle(message.subject,message.data)\\n            message.ack()\\n            processed.increment()\\n        } catch (invalid:InvalidNotificationEvent) {\\n            // If durable quarantine fails, do not acknowledge: a DB outage cannot lose evidence.\\n            quarantine.record(message.subject,message.data,message.metaData().streamSequence(),invalid.reason)\\n            message.ack()\\n            quarantined.increment()\\n        } catch (_:Exception) {\\n            failures.increment()\\n            // Broker delivery count includes infrastructure outages, not just handler failures.\\n            // Only explicit InvalidNotificationEvent is poison; all other failures retry indefinitely.\\n            val seconds=(1L shl message.metaData().deliveredCount().coerceIn(0,8).toInt()).coerceAtMost(300)\\n            message.nakWithDelay(Duration.ofSeconds(seconds))\\n        }\\n    }\\n}\\n\\n@Component\\nclass NotificationQuarantine(private val jdbc:JdbcTemplate,private val mapper:ObjectMapper) {\\n    fun record(subject:String,data:ByteArray,sequence:Long,reason:String) {\\n        require(reason.matches(Regex(\\\"[a-zA-Z0-9_]{1,100}\\\")))\\n        val eventId=runCatching { UUID.fromString(mapper.readTree(data).path(\\\"event_id\\\").stringValue()) }.getOrNull()\\n        jdbc.update(\\\"\\\"\\\"INSERT INTO message_quarantine(id,message_hash,event_id,subject,reason,stream_sequence)\\n            VALUES (?,?,?,?,?,?) ON CONFLICT(message_hash) DO NOTHING\\\"\\\"\\\",UUID.randomUUID(),digest(data),eventId,subject,reason,sequence)\\n    }\\n    companion object { fun digest(data:ByteArray):String=MessageDigest.getInstance(\\\"SHA-256\\\").digest(data).joinToString(\\\"\\\") { \\\"%02x\\\".format(it) } }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\":\"package com.cookie.notification.messaging\\n\\nimport com.cookie.notification.application.ports.DeliveryQueue\\nimport com.cookie.notification.persistence.JdbcNotificationRepository\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Component\\nimport org.springframework.transaction.support.TransactionTemplate\\nimport tools.jackson.databind.JsonNode\\nimport tools.jackson.databind.ObjectMapper\\nimport java.sql.Timestamp\\nimport java.time.Instant\\nimport java.time.LocalDate\\nimport java.time.ZoneId\\nimport java.util.UUID\\n\\nclass InvalidNotificationEvent(val reason: String) : RuntimeException(reason)\\n\\n@Component\\nclass NotificationEventHandler(\\n    private val jdbc: JdbcTemplate,\\n    private val transactions: TransactionTemplate,\\n    private val repository: JdbcNotificationRepository,\\n    private val deliveries: DeliveryQueue,\\n    private val mapper: ObjectMapper,\\n) {\\n    fun handle(subject: String, data: ByteArray) {\\n        val event = try { mapper.readTree(data) } catch (_: Exception) { throw InvalidNotificationEvent(\\\"invalid_json\\\") }\\n        val id = uuid(event,\\\"event_id\\\")\\n        val type = text(event,\\\"event_type\\\")\\n        val version = event.path(\\\"event_version\\\")\\n        if (!version.isIntegralNumber || !version.canConvertToInt() || version.intValue() != 1) invalid(\\\"unsupported_event_version\\\")\\n        if (subject != \\\"cookie.events.$type.v1\\\") invalid(\\\"subject_mismatch\\\")\\n        val expectedProducer = PRODUCERS[type] ?: invalid(\\\"unsupported_event_type\\\")\\n        if (text(event,\\\"producer\\\") != expectedProducer) invalid(\\\"producer_mismatch\\\")\\n        text(event,\\\"aggregate_type\\\")\\n        val aggregateId = text(event,\\\"aggregate_id\\\")\\n        val occurredAt = instant(event,\\\"occurred_at\\\")\\n        val payload = event.path(\\\"payload\\\")\\n        if (!payload.isObject) invalid(\\\"invalid_payload\\\")\\n        val userId = if (type == \\\"notification.email.requested\\\") null else uuid(payload,if (type == \\\"account.deletion.requested\\\") \\\"accountId\\\" else \\\"userId\\\")\\n        val projection = when(type) {\\n            \\\"account.activated\\\", \\\"account.deletion.requested\\\", \\\"notification.email.requested\\\" -> null\\n            else -> validateProjection(type,event,payload)\\n        }\\n        if(type == \\\"notification.email.requested\\\") {\\n            if (text(payload,\\\"template\\\") != \\\"EMAIL_VERIFICATION\\\") invalid(\\\"unsupported_template\\\")\\n            text(payload,\\\"encryptedPayload\\\")\\n            instant(payload,\\\"expiresAt\\\")\\n            try { UUID.fromString(aggregateId) } catch (_: Exception) { invalid(\\\"invalid_registration_attempt\\\") }\\n        }\\n        if(type == \\\"account.deletion.requested\\\") { uuid(payload,\\\"deletionRequestId\\\"); instant(payload,\\\"requestedAt\\\") }\\n        transactions.executeWithoutResult {\\n            userId?.let(repository::lockUser)\\n            val added = jdbc.update(\\\"INSERT INTO inbox_events(consumer_name,event_id,event_type) VALUES (?,?,?) ON CONFLICT DO NOTHING\\\",CONSUMER,id,type)\\n            if(added == 0) return@executeWithoutResult\\n            if(userId != null && repository.isDeleted(userId)) return@executeWithoutResult\\n            when(type) {\\n                \\\"notification.email.requested\\\" -> {\\n                    val expiresAt = instant(payload,\\\"expiresAt\\\")\\n                    if(expiresAt.isAfter(repository.now())) deliveries.enqueueEmail(id,UUID.fromString(aggregateId),text(payload,\\\"encryptedPayload\\\"),expiresAt,occurredAt)\\n                }\\n                \\\"account.deletion.requested\\\" -> deleteAccount(requireNotNull(userId),payload)\\n                \\\"account.activated\\\" -> repository.ensureSettings(requireNotNull(userId))\\n                else -> {\\n                    val projectionValue = requireNotNull(projection)\\n                    repository.ensureSettings(requireNotNull(userId))\\n                    val updated = jdbc.update(\\\"\\\"\\\"INSERT INTO event_projections(kind,user_id,entity_id,version,payload,deleted) VALUES (?,?,?,?,?::jsonb,?)\\n                        ON CONFLICT(kind,user_id,entity_id) DO UPDATE SET version=EXCLUDED.version,payload=EXCLUDED.payload,deleted=EXCLUDED.deleted,updated_at=clock_timestamp()\\n                        WHERE event_projections.version < EXCLUDED.version\\\"\\\"\\\",\\n                        projectionValue.kind,userId,projectionValue.key,projectionValue.version,mapper.writeValueAsString(minimalPayload(type,payload)),projectionValue.deleted)\\n                    if(updated > 0) {\\n                        if(type==\\\"user.profile.updated\\\") {\\n                            val locale=payload.path(\\\"locale\\\").takeIf { it.isString }?.stringValue()?.substringBefore('-')?.lowercase()\\n                            if(locale in setOf(\\\"ru\\\",\\\"en\\\")) jdbc.update(\\\"UPDATE settings SET locale=?,updated_at=clock_timestamp() WHERE user_id=? AND NOT locale_overridden\\\",locale,userId)\\n                        }\\n                        repository.dirty(userId,repository.now())\\n                    }\\n                }\\n            }\\n        }\\n    }\\n\\n    private fun deleteAccount(userId: UUID,payload: JsonNode) {\\n        jdbc.update(\\\"INSERT INTO account_tombstones(user_id,deletion_request_id,deleted_at) VALUES (?,?,?) ON CONFLICT DO NOTHING\\\",userId,uuid(payload,\\\"deletionRequestId\\\"),Timestamp.from(instant(payload,\\\"requestedAt\\\")))\\n        deliveries.cancelUser(userId)\\n        listOf(\\\"push_devices\\\",\\\"settings\\\",\\\"event_projections\\\",\\\"reminder_deadlines\\\",\\\"reminder_occurrences\\\").forEach { table -> jdbc.update(\\\"DELETE FROM $table WHERE user_id=?\\\",userId) }\\n    }\\n\\n    private fun validateProjection(type: String,event: JsonNode,payload: JsonNode): Projection {\\n        val versionNode = event.path(\\\"aggregate_version\\\")\\n        if(!versionNode.isIntegralNumber || !versionNode.canConvertToLong() || versionNode.longValue() <= 0) invalid(\\\"missing_aggregate_version\\\")\\n        val version = versionNode.longValue()\\n        return when(type) {\\n            \\\"user.profile.updated\\\" -> {\\n                // Notification settings are the sole scheduling timezone authority.\\n                if(payload.has(\\\"locale\\\") && !payload.path(\\\"locale\\\").isNull) text(payload,\\\"locale\\\")\\n                Projection(\\\"PROFILE\\\",uuid(payload,\\\"userId\\\").toString(),version,false)\\n            }\\n            \\\"nutrition.meal.created\\\", \\\"nutrition.meal.updated\\\", \\\"nutrition.meal.deleted\\\" -> {\\n                val deleted = type.endsWith(\\\"deleted\\\")\\n                val key = uuid(payload,\\\"mealId\\\").toString()\\n                if(!deleted) instant(payload,\\\"eatenAt\\\")\\n                Projection(\\\"MEAL\\\",key,version,deleted)\\n            }\\n            \\\"nutrition.water.changed\\\" -> {\\n                val date = date(payload,\\\"localDate\\\")\\n                number(payload,\\\"totalMl\\\",false,true)\\n                nullableInstant(payload,\\\"lastConsumedAt\\\")\\n                Projection(\\\"WATER\\\",date.toString(),version,false)\\n            }\\n            \\\"health.weight.changed\\\" -> {\\n                val key = uuid(payload,\\\"measurementId\\\").toString()\\n                val deleted = boolean(payload,\\\"deleted\\\")\\n                if(!deleted) { instant(payload,\\\"measuredAt\\\"); number(payload,\\\"valueKg\\\",false,false) }\\n                Projection(\\\"WEIGHT\\\",key,version,deleted)\\n            }\\n            \\\"progress.day.updated\\\" -> {\\n                val day = date(payload,\\\"localDate\\\")\\n                val zone = text(payload,\\\"timezone\\\")\\n                if(zone !in ZoneId.getAvailableZoneIds()) invalid(\\\"invalid_timezone\\\")\\n                val calories = payload.path(\\\"calories\\\")\\n                val water = payload.path(\\\"water\\\")\\n                if(!calories.isObject || !water.isObject) invalid(\\\"incomplete_progress_snapshot\\\")\\n                number(calories,\\\"consumed\\\",true,false); number(calories,\\\"target\\\",true,false)\\n                if(!calories.has(\\\"unlimitedCalories\\\") || (!calories.path(\\\"unlimitedCalories\\\").isNull && !calories.path(\\\"unlimitedCalories\\\").isBoolean)) invalid(\\\"invalid_unlimited_calories\\\")\\n                number(water,\\\"consumedMl\\\",true,true); number(water,\\\"targetMl\\\",true,true)\\n                Projection(\\\"PROGRESS\\\",\\\"$zone:$day\\\",version,false)\\n            }\\n            else -> invalid(\\\"unsupported_event_type\\\")\\n        }\\n    }\\n    private fun minimalPayload(type:String,payload:JsonNode):JsonNode {\\n        val fields=when(type) {\\n            \\\"user.profile.updated\\\" -> listOf(\\\"userId\\\",\\\"locale\\\")\\n            \\\"nutrition.meal.created\\\",\\\"nutrition.meal.updated\\\" -> listOf(\\\"mealId\\\",\\\"userId\\\",\\\"eatenAt\\\")\\n            \\\"nutrition.meal.deleted\\\" -> listOf(\\\"mealId\\\",\\\"userId\\\")\\n            \\\"nutrition.water.changed\\\" -> listOf(\\\"userId\\\",\\\"localDate\\\",\\\"totalMl\\\",\\\"lastConsumedAt\\\")\\n            \\\"health.weight.changed\\\" -> if(payload.path(\\\"deleted\\\").booleanValue()) listOf(\\\"measurementId\\\",\\\"userId\\\",\\\"deleted\\\") else listOf(\\\"measurementId\\\",\\\"userId\\\",\\\"deleted\\\",\\\"measuredAt\\\")\\n            \\\"progress.day.updated\\\" -> listOf(\\\"userId\\\",\\\"localDate\\\",\\\"timezone\\\")\\n            else -> emptyList()\\n        }\\n        val result=mapper.createObjectNode()\\n        fields.forEach { field -> if(payload.has(field)) result.set(field,payload.path(field)) }\\n        if(type==\\\"progress.day.updated\\\") {\\n            val calories=mapper.createObjectNode()\\n            listOf(\\\"consumed\\\",\\\"target\\\",\\\"unlimitedCalories\\\").forEach { calories.set(it,payload.path(\\\"calories\\\").path(it)) }\\n            val water=mapper.createObjectNode()\\n            listOf(\\\"consumedMl\\\",\\\"targetMl\\\").forEach { water.set(it,payload.path(\\\"water\\\").path(it)) }\\n            result.set(\\\"calories\\\",calories); result.set(\\\"water\\\",water)\\n        }\\n        return result\\n    }\\n    private data class Projection(val kind:String,val key:String,val version:Long,val deleted:Boolean)\\n    private fun text(node:JsonNode,name:String):String { val value=node.path(name); if(!value.isString || value.stringValue().isBlank()) invalid(\\\"invalid_$name\\\"); return value.stringValue() }\\n    private fun uuid(node:JsonNode,name:String):UUID = try { UUID.fromString(text(node,name)) } catch (_: IllegalArgumentException) { invalid(\\\"invalid_$name\\\") }\\n    private fun instant(node:JsonNode,name:String):Instant = try { Instant.parse(text(node,name)) } catch (_: java.time.DateTimeException) { invalid(\\\"invalid_$name\\\") }\\n    private fun nullableInstant(node:JsonNode,name:String) { if(!node.has(name)) invalid(\\\"missing_$name\\\"); if(!node.path(name).isNull) instant(node,name) }\\n    private fun date(node:JsonNode,name:String):LocalDate = try { LocalDate.parse(text(node,name)) } catch (_: java.time.DateTimeException) { invalid(\\\"invalid_$name\\\") }\\n    private fun boolean(node:JsonNode,name:String):Boolean { if(!node.path(name).isBoolean) invalid(\\\"invalid_$name\\\"); return node.path(name).booleanValue() }\\n    private fun number(node:JsonNode,name:String,nullable:Boolean,integer:Boolean) {\\n        val value=node.path(name)\\n        if(nullable && value.isNull) return\\n        if(!value.isNumber || (integer && (!value.isIntegralNumber || !value.canConvertToInt())) || value.decimalValue().signum()<0) invalid(\\\"invalid_$name\\\")\\n    }\\n    private fun invalid(reason:String):Nothing = throw InvalidNotificationEvent(reason)\\n    companion object {\\n        const val CONSUMER=\\\"notification-v1\\\"\\n        val PRODUCERS=mapOf(\\n            \\\"account.activated\\\" to \\\"identity\\\",\\\"account.deletion.requested\\\" to \\\"identity\\\",\\\"notification.email.requested\\\" to \\\"identity\\\",\\n            \\\"nutrition.meal.created\\\" to \\\"nutrition\\\",\\\"nutrition.meal.updated\\\" to \\\"nutrition\\\",\\\"nutrition.meal.deleted\\\" to \\\"nutrition\\\",\\\"nutrition.water.changed\\\" to \\\"nutrition\\\",\\n            \\\"health.weight.changed\\\" to \\\"health\\\",\\\"user.profile.updated\\\" to \\\"user\\\",\\\"progress.day.updated\\\" to \\\"progress\\\")\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationNatsConnection.kt\":\"package com.cookie.notification.messaging\\n\\nimport io.nats.client.*\\nimport io.nats.client.api.*\\nimport jakarta.annotation.PreDestroy\\nimport org.springframework.boot.context.properties.ConfigurationProperties\\nimport org.springframework.core.env.Environment\\nimport org.springframework.core.env.Profiles\\nimport org.springframework.stereotype.Component\\nimport java.nio.file.Files\\nimport java.nio.file.Path\\nimport java.security.KeyStore\\nimport java.time.Duration\\n\\n@Component\\n@ConfigurationProperties(\\\"cookie.notification\\\")\\nclass NotificationMessagingProperties {\\n    var natsUrl=\\\"nats://localhost:4222\\\"\\n    var natsCredentialsPath=\\\"\\\"\\n    var natsTruststorePath=\\\"\\\"\\n    var natsTruststorePassword=\\\"\\\"\\n    var consumerEnabled=true\\n}\\n\\n@Component\\nclass NotificationNatsConnection(private val properties:NotificationMessagingProperties,environment:Environment) {\\n    val development=environment.acceptsProfiles(Profiles.of(\\\"dev\\\",\\\"test\\\"))\\n    @Volatile private var connection:Connection?=null\\n    init {\\n        if(!development) {\\n            require(properties.natsUrl.startsWith(\\\"tls://\\\")) { \\\"Production NATS requires TLS\\\" }\\n            require(properties.natsCredentialsPath.isNotBlank() && Files.isRegularFile(Path.of(properties.natsCredentialsPath)) && Files.isReadable(Path.of(properties.natsCredentialsPath))) { \\\"NATS workload credentials are required\\\" }\\n            require(properties.natsTruststorePath.isNotBlank() && Files.isRegularFile(Path.of(properties.natsTruststorePath)) && Files.isReadable(Path.of(properties.natsTruststorePath))) { \\\"NATS truststore is required\\\" }\\n            require(properties.natsTruststorePassword.isNotBlank()) { \\\"NATS truststore password is required\\\" }\\n            val store=KeyStore.getInstance(\\\"JKS\\\")\\n            Files.newInputStream(Path.of(properties.natsTruststorePath)).use { store.load(it,properties.natsTruststorePassword.toCharArray()) }\\n            require(store.size()>0) { \\\"NATS truststore is empty\\\" }\\n        }\\n    }\\n    @Synchronized fun connection():Connection {\\n        connection?.let {\\n            if(it.status==Connection.Status.CONNECTED) return it\\n            if(it.status!=Connection.Status.CLOSED) throw IllegalStateException(\\\"NATS recovering\\\")\\n        }\\n        return Nats.connect(options()).also { connected ->\\n            try {\\n            if(development) {\\n                val manager=connected.jetStreamManagement()\\n                if(runCatching { manager.getStreamInfo(STREAM) }.isFailure) {\\n                    runCatching { manager.addStream(StreamConfiguration.builder().name(STREAM).subjects(\\\"cookie.events.>\\\")\\n                        .storageType(StorageType.File).retentionPolicy(RetentionPolicy.Limits).maxAge(Duration.ofDays(7))\\n                        .maxBytes(1_073_741_824).maxMessages(1_000_000).maximumMessageSize(1_048_576).replicas(1).build()) }\\n                        .getOrElse { manager.getStreamInfo(STREAM) }\\n                }\\n                manager.addOrUpdateConsumer(STREAM,ConsumerConfiguration.builder().durable(NotificationEventHandler.CONSUMER)\\n                    .ackPolicy(AckPolicy.Explicit).deliverPolicy(DeliverPolicy.All).ackWait(Duration.ofSeconds(60)).maxAckPending(100)\\n                    .maxDeliver(-1).filterSubjects(NotificationEventHandler.PRODUCERS.keys.map { \\\"cookie.events.$it.v1\\\" }).build())\\n            }\\n            connection=connected\\n            } catch(exception:Exception) {\\n                connected.runCatching { close() }\\n                throw exception\\n            }\\n        }\\n    }\\n    fun options(operatorCredentials:String?=null):Options = Options.Builder().server(properties.natsUrl)\\n        .connectionName(if(operatorCredentials==null) \\\"cookie-notification\\\" else \\\"cookie-notification-replay\\\")\\n        .connectionTimeout(Duration.ofSeconds(2)).reconnectWait(Duration.ofSeconds(1)).maxReconnects(-1)\\n        .inboxPrefix(if(operatorCredentials==null) \\\"_INBOX.cookie.notification\\\" else \\\"_INBOX.cookie.notification_operator\\\")\\n        .apply {\\n            val path=operatorCredentials?:properties.natsCredentialsPath\\n            if(path.isNotBlank()) credentialPath(path)\\n            if(!development) {\\n                truststorePath(properties.natsTruststorePath)\\n                truststorePassword(properties.natsTruststorePassword.toCharArray())\\n                // Resolve inside SocketDataPort so TLS verifies the broker URI's DNS name, not an IP.\\n                hostnameResolveMode(Options.HostnameResolveMode.HappyEyeballs)\\n                dataPortType(HostnameVerifyingSocketDataPort::class.java.name)\\n            }\\n        }.build()\\n    @PreDestroy @Synchronized fun close() { connection?.runCatching { close() }; connection=null }\\n    companion object { const val STREAM=\\\"COOKIE_EVENTS\\\" }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationRetention.kt\":\"package com.cookie.notification.messaging\\n\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport org.springframework.stereotype.Component\\nimport org.springframework.context.annotation.Profile\\n\\n/** Thirty days exceeds the seven-day stream/redelivery horizon. User tombstones never age out. */\\n@Component\\n@Profile(\\\"!notification-replay\\\")\\nclass NotificationRetention(private val jdbc:JdbcTemplate) {\\n    @Scheduled(fixedDelayString=\\\"\\\\${cookie.notification.retention-poll-millis:60000}\\\")\\n    fun clean() {\\n        jdbc.update(\\\"\\\"\\\"DELETE FROM inbox_events WHERE (consumer_name,event_id) IN (\\n            SELECT consumer_name,event_id FROM inbox_events WHERE processed_at<clock_timestamp()-interval '30 days'\\n            ORDER BY processed_at LIMIT 500)\\\"\\\"\\\")\\n        jdbc.update(\\\"\\\"\\\"DELETE FROM message_quarantine WHERE id IN (\\n            SELECT id FROM message_quarantine WHERE created_at<clock_timestamp()-interval '30 days'\\n            ORDER BY created_at LIMIT 500)\\\"\\\"\\\")\\n        // Only dated daily occurrences expire. FOOD cycle evidence survives until account deletion.\\n        jdbc.update(\\\"\\\"\\\"DELETE FROM reminder_occurrences WHERE id IN (\\n            SELECT id FROM reminder_occurrences WHERE kind<>'FOOD' AND created_at<clock_timestamp()-interval '30 days'\\n            ORDER BY created_at LIMIT 500)\\\"\\\"\\\")\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\":\"package com.cookie.notification.messaging\\n\\nimport io.nats.client.Nats\\nimport io.nats.client.JetStreamApiException\\nimport io.nats.client.api.MessageGetRequest\\nimport io.nats.client.api.MessageInfo\\nimport org.springframework.beans.factory.annotation.Value\\nimport org.springframework.boot.ApplicationArguments\\nimport org.springframework.boot.ApplicationRunner\\nimport org.springframework.context.ConfigurableApplicationContext\\nimport org.springframework.context.annotation.Profile\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Component\\nimport java.nio.file.Files\\nimport java.nio.file.Path\\nimport java.time.Duration\\nimport java.util.UUID\\n\\n/** One-off operator process, never an HTTP route or an automated retry of UNKNOWN SMTP. */\\n@Component\\n@Profile(\\\"notification-replay\\\")\\nclass OperatorQuarantineReplay(\\n    private val jdbc:JdbcTemplate,\\n    private val handler:NotificationEventHandler,\\n    private val nats:NotificationNatsConnection,\\n    private val context:ConfigurableApplicationContext,\\n    @param:Value(\\\"\\\\${cookie.notification.operator-nats-credentials-path:}\\\") private val credentials:String,\\n) : ApplicationRunner {\\n    override fun run(args:ApplicationArguments) {\\n        try {\\n            val id=runCatching { UUID.fromString(args.getOptionValues(\\\"notification-replay-id\\\")?.single()) }.getOrNull()\\n                ?:throw ReplayFailure(\\\"A single valid --notification-replay-id is required\\\")\\n            if(credentials.isBlank() || !Files.isRegularFile(Path.of(credentials)) || !Files.isReadable(Path.of(credentials)))\\n                throw ReplayFailure(\\\"Separate operator NATS credentials are required\\\")\\n            val row=jdbc.query(\\\"SELECT stream_sequence,message_hash,subject FROM message_quarantine WHERE id=? AND replayed_at IS NULL\\\",\\n                {rs,_->Triple(rs.getLong(1),rs.getString(2),rs.getString(3))},id).singleOrNull()\\n                ?:throw ReplayFailure(\\\"Replay record not found or already replayed\\\")\\n            jdbc.update(\\\"UPDATE message_quarantine SET replay_requested_at=clock_timestamp(),replay_attempts=replay_attempts+1 WHERE id=?\\\",id)\\n            Nats.connect(nats.options(credentials)).use { connection ->\\n                val original=try {\\n                    // getMessage() also probes STREAM.INFO in a fresh JVM. The operator deliberately\\n                    // has only MSG.GET, so issue that exact request without broader discovery grants.\\n                    val response=connection.request(\\\"\\\\$JS.API.STREAM.MSG.GET.${NotificationNatsConnection.STREAM}\\\",\\n                        MessageGetRequest.forSequence(row.first).serialize(),Duration.ofSeconds(2))\\n                        ?:throw ReplayFailure(\\\"Replay lookup timed out; quarantine remains available for retry\\\")\\n                    MessageInfo(response,NotificationNatsConnection.STREAM,false).throwOnHasError()\\n                }\\n                catch(exception:JetStreamApiException) {\\n                    if(exception.errorCode==404) throw ReplayFailure(\\\"Original message no longer retained; cannot recover or replay\\\")\\n                    throw exception\\n                }\\n                val originalSubject=original.subject?:throw ReplayFailure(\\\"Original message no longer retained; cannot recover or replay\\\")\\n                val originalData=original.data?:throw ReplayFailure(\\\"Original message no longer retained; cannot recover or replay\\\")\\n                if(originalSubject!=row.third || NotificationQuarantine.digest(originalData)!=row.second)\\n                    throw ReplayFailure(\\\"Original message does not match quarantine record\\\")\\n                handler.handle(originalSubject,originalData)\\n                jdbc.update(\\\"UPDATE message_quarantine SET replayed_at=clock_timestamp() WHERE id=?\\\",id)\\n            }\\n        } catch(failure:ReplayFailure) {\\n            throw failure\\n        } catch(invalid:InvalidNotificationEvent) {\\n            throw ReplayFailure(\\\"Replay rejected: ${invalid.reason}\\\")\\n        } catch(_:Exception) {\\n            // JDBC/broker exception details can contain event bytes or failed-row contents.\\n            // The operator gets a safe failure and can retry the same durable record.\\n            throw ReplayFailure(\\\"Replay failed due to broker or database error; quarantine remains available for retry\\\")\\n        } finally { context.close() }\\n    }\\n\\n    private class ReplayFailure(message:String):IllegalStateException(message)\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\":\"package com.cookie.notification.persistence\\n\\nimport com.cookie.notification.application.ports.NotificationRepository\\nimport com.cookie.notification.application.ports.ReminderDeadlineIndex\\nimport com.cookie.notification.domain.*\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Repository\\nimport org.springframework.transaction.support.TransactionTemplate\\nimport org.springframework.transaction.support.TransactionSynchronization\\nimport org.springframework.transaction.support.TransactionSynchronizationManager\\nimport java.sql.ResultSet\\nimport java.sql.Timestamp\\nimport java.time.Instant\\nimport java.time.LocalTime\\nimport java.util.UUID\\n\\n@Repository\\nclass JdbcNotificationRepository(\\n    private val jdbc: JdbcTemplate,\\n    private val transactions: TransactionTemplate,\\n    private val deadlineIndex: ReminderDeadlineIndex? = null,\\n) : NotificationRepository {\\n    override fun settings(userId: UUID): NotificationSettings = transaction(userId) {\\n        ensureSettings(userId)\\n        readSettings(userId)!!\\n    }\\n\\n    override fun updateSettings(userId: UUID, patch: SettingsPatch): NotificationSettings = transaction(userId) {\\n        ensureSettings(userId)\\n        val old = readSettings(userId)!!\\n        val now = now()\\n        val updated = old.apply(patch, now)\\n        jdbc.update(\\\"\\\"\\\"UPDATE settings SET water_enabled=?,food_enabled=?,food_inactive_minutes=?,weigh_enabled=?,weigh_time=?,\\n            goal_warning_enabled=?,quiet_start=?,quiet_end=?,timezone=?,locale=?,locale_overridden=(locale_overridden OR ?),scheduling_started_at=?,\\n            food_started_at=CASE WHEN ? THEN ? ELSE food ebuildCursor=null }\\n            rebuild()\\n        }\\n        members.mapNotNull { member->runCatching { val parts=member.split(':');DeadlineHint(UUID.fromString(parts[0]),parts[1].toLong()) }.getOrNull() }\\n    } catch (_:Exception) { unavailable=true;failures.increment();emptyList() }\\n\\n    @Synchronized\\n    @Scheduled(fixedDelayString=\\\"\\\\${cookie.notification.redis-rebuild-millis:60000}\\\")\\n    fun rebuild() {\\n        try {\\n            repeat(4) {\\n                val page=if(rebuildCursor==null) jdbc.query(\\\"SELECT user_id,due_at,generation FROM reminder_deadlines ORDER BY user_id LIMIT 500\\\",::mapDeadline)\\n                    else jdbc.query(\\\"SELECT user_id,due_at,generation FROM reminder_deadlines WHERE user_id>? ORDER BY user_id LIMIT 500\\\",::mapDeadline,rebuildCursor)\\n                if(page.isEmpty()) { rebuildCursor=null;return }\\n                for((id,at,generation) in page) {\\n                    if(!write(id,at,generation)) return\\n                    rebuildCursor=id\\n                }\\n                if(page.size<500) { rebuildCursor=null;return }\\n            }\\n        } catch (_:Exception) { rebuildFailures.increment() }\\n    }\\n    private fun mapDeadline(rs:java.sql.ResultSet,@Suppress(\\\"UNUSED_PARAMETER\\\") row:Int)=Triple(rs.getObject(\\\"user_id\\\",UUID::class.java),rs.getTimestamp(\\\"due_at\\\").toInstant(),rs.getLong(\\\"generation\\\"))\\n    companion object { const val KEY=\\\"cookie:notification:reminder_deadlines\\\" }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\":\"package com.cookie.notification.scheduler\\n\\nimport com.cookie.notification.application.ports.DeliveryQueue\\nimport com.cookie.notification.domain.ReminderKind\\nimport com.cookie.notification.domain.ReminderPlanner\\nimport com.cookie.notification.persistence.JdbcNotificationRepository\\nimport io.micrometer.core.instrument.MeterRegistry\\nimport org.springframework.beans.factory.annotation.Value\\nimport org.springframework.context.annotation.Profile\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport org.springframework.stereotype.Component\\nimport org.springframework.transaction.support.TransactionTemplate\\nimport tools.jackson.databind.ObjectMapper\\nimport java.sql.Timestamp\\nimport java.time.Duration\\nimport java.time.Instant\\nimport java.util.UUID\\n\\n@Component\\n@Profile(\\\"!notification-replay\\\")\\nclass ReminderScheduler(\\n    private val jdbc:JdbcTemplate,\\n    private val repository:JdbcNotificationRepository,\\n    private val transactions:TransactionTemplate,\\n    private val queue:DeliveryQueue,\\n    private val index:RedisDeadlineIndex,\\n    mapper:ObjectMapper,\\n    registry:MeterRegistry,\\n    @param:Value(\\\"\\\\${cookie.notification.scheduler-enabled:true}\\\") private val enabled:Boolean,\\n) {\\n    private val loader=JdbcReminderStateLoader(jdbc,repository,mapper)\\n    private val failures=registry.counter(\\\"notification.scheduler.failures\\\")\\n    private val occurrences=registry.counter(\\\"notification.scheduler.occurrences\\\")\\n    private var lastSweep=Instant.EPOCH\\n    @Scheduled(fixedDelayString=\\\"\\\\${cookie.notification.poll-millis:1000}\\\")\\n    fun tick() {\\n        if(!enabled)return\\n        try {\\n            val now=repository.now()\\n            val hints=index.due(now,100)\\n            val fallback=if(Duration.between(lastSweep,now)>=Duration.ofSeconds(30)) {\\n                lastSweep=now\\n                jdbc.query(\\\"SELECT user_id,generation FROM reminder_deadlines WHERE due_at<=? ORDER BY due_at LIMIT 100\\\",{rs,_->DeadlineHint(rs.getObject(\\\"user_id\\\",UUID::class.java),rs.getLong(\\\"generation\\\"))},Timestamp.from(now))\\n            } else emptyList()\\n            (hints+fallback).distinctBy { it.userId }.take(100).forEach { hint -> try { process(hint. tatus='CANCELLED' OR (reminder_occurrences.kind='FOOD' AND j.status='EXPIRED'))) RETURNING id\\\"\\\"\\\",\\n                    {rs,_->rs.getObject(1,UUID::class.java)},UUID.randomUUID(),userId,candidate.kind.name,candidate.cycle,\\n                    Timestamp.from(candidate.scheduledAt)).singleOrNull()\\n                if(id!=null) {\\n                    devices.forEach { device ->\\n                        // Keep occurrence/provider dedup identity when corrected diary data makes it due again.\\n                        if(candidate.kind!=ReminderKind.WATER) jdbc.update(\\\"\\\"\\\"UPDATE delivery_jobs\\n                            SET status='PENDING',expires_at=?,next_attempt_at=clock_timestamp(),finished_at=NULL,\\n                                last_code=NULL,locale=? WHERE occurrence_id=? AND device_id=?\\n                                AND (status='CANCELLED' OR (?='FOOD' AND status='EXPIRED'))\\\"\\\"\\\",\\n                            Timestamp.from(candidate.expiresAt),state.settings.locale,id,device.id,candidate.kind.name)\\n                        queue.enqueuePush(id,userId,device.id,candidate.kind.name,state.settings.locale,candidate.expiresAt)\\n                    }\\n                    if(candidate.kind==ReminderKind.WATER) jdbc.update(\\\"UPDATE settings SET last_water_reminder_at=? WHERE user_id=?\\\",Timestamp.from(now),userId)\\n                    occurrences.increment()\\n                }\\n            }\\n            jdbc.update(\\\"UPDATE reminder_deadlines SET due_at=?,generation=generation+1 WHERE user_id=?\\\",Timestamp.from(nextWakeup),userId)\\n            nextWakeup to current.second+1\\n        }\\n        if(next!=null)index.put(userId,next.first,next.second)\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/BoundedHttpExchange.kt\":\"package com.cookie.notification.security\\n\\nimport java.io.ByteArrayOutputStream\\nimport java.net.http.HttpClient\\nimport java.net.http.HttpRequest\\nimport java.net.http.HttpResponse\\nimport java.nio.ByteBuffer\\nimport java.time.Duration\\nimport java.util.concurrent.CompletableFuture\\nimport java.util.concurrent.CompletionStage\\nimport java.util.concurrent.Flow\\nimport java.util.concurrent.TimeUnit\\n\\n/** Bounds both body size and the complete exchange, including a stalled response body. */\\nclass BoundedHttpExchange(private val client: HttpClient) {\\n    fun send(request: HttpRequest, timeout: Duration, maximumBytes: Int = 65_536): HttpResponse<ByteArray> {\\n        val pending = client.sendAsync(request, HttpResponse.BodyHandler { LimitedBody(maximumBytes) })\\n        return try {\\n            pending.get(timeout.toMillis(), TimeUnit.MILLISECONDS)\\n        } catch (exception: Exception) {\\n            pending.cancel(true)\\n            if (exception is InterruptedException) Thread.currentThread().interrupt()\\n            throw exception\\n        }\\n    }\\n\\n    private class LimitedBody(private val maximumBytes: Int) : HttpResponse.BodySubscriber<ByteArray> {\\n        private val result = CompletableFuture<ByteArray>()\\n        private val bytes = ByteArrayOutputStream()\\n        private var subscription: Flow.Subscription? = null\\n        override fun getBody(): CompletionStage<ByteArray> = result\\n        override fun onSubscribe(value: Flow.Subscription) {\\n            subscription = value\\n            value.request(1)\\n        }\\n        override fun onNext(buffers: List<ByteBuffer>) {\\n            for (buffer in buffers) {\\n                if (buffer.remaining() > maximumBytes - bytes.size()) {\\n                    subscription?.cancel()\\n                    result.completeExceptionally(IllegalStateException(\\\"HTTP response exceeds configured limit\\\"))\\n                    return\\n                }\\n                val part = ByteArray(buffer.remaining())\\n                buffer.get(part)\\n                bytes.write(part)\\n            }\\n            subscription?.request(1)\\n        }\\n        override fun onError(throwable: Throwable) { result.completeExceptionally(throwable) }\\n        override fun onComplete() { result.complete(bytes.toByteArray()) }\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/security/RemoteJwksAccessTokenVerifier.kt\":\"package com.cookie.notification.security\\n\\nimport com.nimbusds.jose.JOSEObjectType\\nimport com.nimbusds.jose.JWSAlgorithm\\nimport com.nimbusds.jose.crypto.ECDSAVerifier\\nimport com.nimbusds.jose.jwk.Curve\\nimport com.nimbusds.jose.jwk.ECKey\\nimport com.nimbusds.jose.jwk.JWKSet\\nimport com.nimbusds.jose.jwk.KeyUse\\nimport com.nimbusds.jwt.SignedJWT\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport java.net.URI\\nimport java.net.http.HttpRequest\\nimport java.time.Clock\\nimport java.time.Duration\\nimport java.time.Instant\\nimport java.util.UUID\\n\\nclass InvalidAccessTokenException : RuntimeException(\\\"Invalid access token\\\")\\nclass AuthenticationUnavailableException : RuntimeException(\\\"Authentication key source unavailable\\\")\\n\\nfun interface JwksSource { fun fetch(): String }\\n\\nclass HttpJwksSource(private val uri: URI, private val http: BoundedHttpExchange) : JwksSource {\\n    override fun fetch(): String {\\n        val request = HttpRequest.newBuilder(uri).timeout(Duration.ofSeconds(3)).GET().build()\\n        val response = http.send(request, Duration.ofSeconds(3))\\n        check(response.statusCode() == 200) { \\\"JWKS request failed\\\" }\\n        return response.body().toString(Charsets.UTF_8)\\n    }\\n}\\n\\n/** The configured issuer determines the key URL; token-controlled jku/x5u/jwk are never used. */\\nclass RemoteJwksAccessTokenVerifier(\\n    private val source: JwksSource,\\n    private val issuer: String,\\n    private val audience: String,\\n    private val clock: Clock,\\n) {\\n    @Volatile private var snapshot: Snapshot? = null\\n    @Volatile private var lastRefreshSucceeded = false\\n    private var lastRefreshAttempt: Instant? = null\\n\\n    fun verify(rawToken: String): UUID {\\n        val token = try {\\n            require(rawToken.length in 1..16_384)\\n            SignedJWT.parse(rawToken).also {\\n                require(it.header.algorithm == JWSAlgorithm.ES256 && it.header.type == JOSEObjectType(\\\"at+jwt\\\"))\\n                require(it.header.criticalParams.isNullOrEmpty())\\n                require(it.header.jwk == null && it.header.getJWKURL() == null && it.header.x509CertURL == null)\\n                require(!it.header.keyID.isNullOrBlank() && it.header.keyID.length <= 128)\\n            }\\n        } catch (_: Exception) { throw InvalidAccessTokenException() }\\n        val now = clock.instant()\\n        var current = snapshot\\n        if (current == null || !current.expiresAt.isAfter(now) || token.header.keyID !in current.keys) {\\n            refresh()\\n            current = snapshot\\n        }\\n        if (current == null || !current.expiresAt.isAfter(now)) throw AuthenticationUnavailableException()\\n        val key = current.keys[token.header.keyID] ?: if (lastRefreshSucceeded) throw InvalidAccessTokenException()\\n            else throw AuthenticationUnavailableException()\\n        return try {\\n            require(token.verify(ECDSAVerifier(key.toECPublicKey())))\\n            val claims = token.jwtClaimsSet\\n            require(claims.issuer == issuer && claims.audience == listOf(audience))\\n            val issued = requireNotNull(claims.issueTime).toInstant()\\n            val expires = requireNotNull(claims.expirationTime).toInstant()\\n            require(!issued.isAfter(now) && expires.isAfter(now) && expires.isAfter(issued))\\n            require(Duration.between(issued, expires) <= Duration.ofHours(24))\\n            claims.notBeforeTime?.toInstant()?.let { require(!it.isAfter(now)) }\\n            uuidV7(requireNotNull(claims.getStringClaim(\\\"sid\\\")))\\n            uu ificationDeviceNotFound\\nimport com.cookie.notification.generated.model.NotificationError\\nimport com.cookie.notification.security.AuthenticationUnavailableException\\nimport com.cookie.notification.security.InvalidAccessTokenException\\nimport com.cookie.platform.web.RequestIdFilter\\nimport jakarta.servlet.http.HttpServletRequest\\nimport org.slf4j.LoggerFactory\\nimport org.springframework.dao.DataAccessException\\nimport org.springframework.http.CacheControl\\nimport org.springframework.http.HttpHeaders\\nimport org.springframework.http.HttpStatus\\nimport org.springframework.http.ResponseEntity\\nimport org.springframework.http.converter.HttpMessageNotReadableException\\nimport org.springframework.transaction.TransactionException\\nimport org.springframework.web.ErrorResponse\\nimport org.springframework.web.bind.annotation.ExceptionHandler\\nimport org.springframework.web.bind.annotation.RestControllerAdvice\\nimport java.util.UUID\\n\\n@RestControllerAdvice\\nclass ApiExceptionHandler {\\n    @ExceptionHandler(InvalidNotificationInput::class, HttpMessageNotReadableException::class)\\n    fun invalid(request: HttpServletRequest): ResponseEntity<NotificationError> =\\n        response(400, \\\"INVALID_REQUEST\\\", \\\"Invalid notification input\\\", request)\\n\\n    @ExceptionHandler(InvalidAccessTokenException::class)\\n    fun unauthorized(request: HttpServletRequest): ResponseEntity<NotificationError> =\\n        ResponseEntity.status(HttpStatus.UNAUTHORIZED).header(HttpHeaders.WWW_AUTHENTICATE, \\\"Bearer\\\")\\n            .cacheControl(CacheControl.noStore()).body(error(\\\"INVALID_ACCESS_TOKEN\\\", \\\"Invalid or expired access token\\\", request))\\n\\n    @ExceptionHandler(NotificationAccountDeleted::class)\\n    fun deleted(request: HttpServletRequest): ResponseEntity<NotificationError> =\\n        response(403, \\\"ACCOUNT_DELETED\\\", \\\"Account deletion has been received\\\", request)\\n\\n    @ExceptionHandler(NotificationDeviceNotFound::class a) }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationRequestBodyAdvice.kt\":\"package com.cookie.notification.transport\\n\\nimport com.cookie.notification.domain.InvalidNotificationInput\\nimport com.cookie.notification.generated.model.NotificationSettingsPatch\\nimport com.cookie.notification.generated.model.PushDeviceInput\\nimport org.springframework.core.MethodParameter\\nimport org.springframework.http.HttpHeaders\\nimport org.springframework.http.HttpInputMessage\\nimport org.springframework.http.converter.HttpMessageConverter\\nimport org.springframework.web.bind.annotation.ControllerAdvice\\nimport org.springframework.web.servlet.mvc.method.annotation.RequestBodyAdviceAdapter\\nimport tools.jackson.databind.JsonNode\\nimport tools.jackson.databind.ObjectMapper\\nimport java.io.ByteArrayInputStream\\nimport java.io.InputStream\\nimport java.lang.reflect.Type\\n\\n/** Reject scalar coercion, null and unknown fields before binding the generated transport models. */\\n@ControllerAdvice\\nclass NotificationRequestBodyAdvice(private val mapper: ObjectMapper) : RequestBodyAdviceAdapter() {\\n    override fun supports(parameter: MethodParameter, targetType: Type, converterType: Class<out HttpMessageConverter<*>>) =\\n        targetType == NotificationSettingsPatch::class.java || targetType == PushDeviceInput::class.java\\n\\n    override fun beforeBodyRead(inputMessage: HttpInputMessage, parameter: MethodParameter, targetType: Type,\\n                                converterType: Class<out HttpMessageConverter<*>>): HttpInputMessage {\\n        val bytes = inputMessage.body.readNBytes(16 * 1024 + 1)\\n        if (bytes.size > 16 * 1024) throw InvalidNotificationInput(\\\"Settings request is too large\\\")\\n        val tree = try { mapper.readTree(bytes) } catch (_: Exception) { throw InvalidNotificationInput(\\\"Invalid JSON\\\") }\\n        if (tree == null || !tree.isObject || hasNull(tree)) throw InvalidNo alue.canConvertToInt()\\n                Kind.OBJECT -> value.isObject\\n                null -> false\\n            }\\n            if (!valid) throw InvalidNotificationInput(\\\"Unknown field or invalid JSON value type\\\")\\n        }\\n    }\\n\\n    private enum class Kind { STRING, BOOLEAN, INTEGER, OBJECT }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/transport/NotificationsController.kt\":\"package com.cookie.notification.transport\\n\\nimport com.cookie.notification.application.NotificationService\\nimport com.cookie.notification.domain.DevicePlatform\\nimport com.cookie.notification.domain.InvalidNotificationInput\\nimport com.cookie.notification.domain.RegisterDevice\\nimport com.cookie.notification.domain.SettingsPatch\\nimport com.cookie.notification.generated.api.NotificationsApi\\nimport com.cookie.notification.generated.model.NotificationSettings\\nimport com.cookie.notification.generated.model.NotificationSettingsFood\\nimport com.cookie.notification.generated.model.NotificationSettingsPatch\\nimport com.cookie.notification.generated.model.NotificationSettingsQuietHours\\nimport com.cookie.notification.generated.model.NotificationSettingsWater\\nimport com.cookie.notification.generated.model.NotificationSettingsWeighIn\\nimport com.cookie.notification.generated.model.PushDevice\\nimport com.cookie.notification.generated.model.PushDeviceInput\\nimport com.cookie.notification.security.InvalidAccessTokenException\\nimport com.cookie.notification.security.RemoteJwksAccessTokenVerifier\\nimport jakarta.servlet.http.HttpServletRequest\\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnWebApplication\\nimport org.springframework.http.CacheControl\\nimport org.springframework.http.HttpStatus\\nimport org.springframework.http.ResponseEntity\\nimport org.springframework.stereotype.Controller\\nimport java.time.LocalTime\\nimport java.time.format.DateTimeFormatter\\nimport java.util.UUID\\n\\n@Controller\\n@ConditionalOnWebApplication(type = ConditionalOnWebApplication.Type.SERVLET)\\nclass NotificationsController(\\n    private val service: NotificationService,\\n    private val verifier: RemoteJwksAccessTokenVerifier,\\n    private val request: HttpServletRequest,\\n) : NotificationsApi {\\n    override fun getNotificationSettings(): ResponseEntity<NotificationSettings> =\\n        ResponseEntity.ok().cacheControl(CacheControl.noStore()).body(service.getSettings(accountId()).transport())\\n\\n    override fun updateNotificationSettings(notificationSettingsPatch: NotificationSettingsPatch): ResponseEntity<NotificationSettings> {\\n        val userId = accountId()\\n        val value = notificationSettingsPatch\\n        if (value.water != null && value.water.enabled == null ||\\n            value.food != null && value.food.enabled == null && value.food.inactiveForMinutes == null ||\\n            value.weighIn != null && value.weighIn.enabled == null && value.weighIn.time == null ||\\n            value.goalWarning != null && value.goalWarning.enabled == null ||\\n            value.quietHours != null && value.quietHours.start == null && value.quietHours.end == null\\n        ) throw InvalidNotificationInput(\\\"Empty settings section\\\")\\n        val patch = SettingsPatch(\\n            waterEnabled = value.water?.enabled,\\n            foodEnabled = value.food?.enabled,\\n            foodInactiveMinutes = value.food?.inactiveForMinutes,\\n            weighEnabled = value.weighIn?.enabled,\\n            weighTime = value.weighIn?.time?.let(::parseTime),\\n            goalWarningEnabled = value.goalWarning?.enabled,\\n            quietStart = value.quietHours?.start?.let(::parseTime),\\n            quietEnd = value.quietHours?.end?.let(::parseTime),\\n            timezone = value.timezone,\\n            locale = value.locale?.value,\\n        )\\n        if (patch == SettingsPatch()) throw InvalidNotificationInput(\\\"Empty settings patch\\\")\\n        return ResponseEntity.ok().cacheControl(CacheControl.noStore()).body(service.updateSettings(userId, patch).transport())\\n    }\\n\\n    override fun registerDevice(pushDeviceInput: PushDeviceInput): ResponseEntity<PushDevice> {\\n        val result = service.registerDevice(accountId(), RegisterDevice(\\n            DevicePlatform.valueOf(pushDeviceInput.platform.value), pushDeviceInput.deviceId, pushDeviceInput.token,\\n        ))\\n        val device = result.device\\n        return ResponseEntity.status(if (result.created) HttpStatus.CREATED else HttpStatus.OK)\\n            .cacheControl(CacheControl.noStore())\\n            .body(PushDevice(PushDevice.Platform.valueOf(device.platform.name), device.token, device.deviceId, device.id, device.enabled))\\n    }\\n\\n    override fun unregisterDevice(deviceId: String): ResponseEntity<Unit> {\\n        service.unregisterDevice(accountId(), deviceId)\\n        return ResponseEntity.noContent().build()\\n    }\\n\\n    private fun accountId(): UUID {\\n        val headers = request.getHeaders(\\\"Authorization\\\").toList()\\n        if (headers.size != 1) throw InvalidAccessTokenException()\\n        val header = headers.single()\\n        if (!header.startsWith(\\\"Bearer \\\", ignoreCase = true)) throw InvalidAccessTokenException()\\n        val token = header.substring(7)\\n        if (token.isBlank() || token.length > 8192 || token.any(Char::isWhitespace)) throw InvalidAccessTokenException()\\n        return verifier.verify(token)\\n    }\\n\\n    private fun parseTime(value: String): LocalTime {\\n        if (!TIME.matches(value)) throw InvalidNotificationInput(\\\"Time must use HH:mm\\\")\\n        return LocalTime.parse(value)\\n    }\\n\\n    private fun com.cookie.notification.domain.NotificationSettings.transport() = NotificationSettings(\\n        locale = NotificationSettings.Locale.forValue(locale),\\n        water = NotificationSettingsWater(waterEnabled),\\n        food = NotificationSettingsFood(foodEnabled, foodIn /secrets/\\n  application:\\n    name: notification\\n  datasource:\\n    url: ${COOKIE_NOTIFICATION_DATABASE_URL}\\n    username: ${COOKIE_NOTIFICATION_DATABASE_USER}\\n    password: ${COOKIE_NOTIFICATION_DATABASE_PASSWORD:}\\n    hikari:\\n      maximum-pool-size: ${COOKIE_NOTIFICATION_DATABASE_POOL_SIZE:12}\\n      connection-timeout: 2000\\n      validation-timeout: 1000\\n      data-source-properties:\\n        options: \\\"-c statement_timeout=5000 -c lock_timeout=2000\\\"\\n        socketTimeout: 10\\n        tcpKeepAlive: true\\n  flyway:\\n    enabled: true\\n  data:\\n    redis:\\n      host: ${SPRING_DATA_REDIS_HOST:localhost}\\n      port: ${SPRING_DATA_REDIS_PORT:6379}\\n      username: ${SPRING_DATA_REDIS_USERNAME:}\\n      password: ${SPRING_DATA_REDIS_PASSWORD:}\\n      connect-timeout: 1s\\n      timeout: 1s\\n  jackson:\\n    default-property-inclusion: non_null\\n  task:\\n    scheduling:\\n      pool:\\n        size: 6\\n      thread-name-prefix: notification-scheduler-\\n\\nserver:\\n  port: ${PORT:8080}\\n  forward-headers-strategy: none\\n\\nmanagement:\\n  endpoints:\\n    web:\\n      exposure:\\n        exclude: \\\"*\\\"\\n\\ncookie:\\n  notification:\\n    nats-url: ${COOKIE_NATS_URL:nats://localhost:4222}\\n    nats-credentials-path: ${COOKIE_NATS_CREDENTIALS_PATH:}\\n    nats-truststore-path: ${COOKIE_NATS_TRUSTSTORE_PATH:}\\n    nats-truststore-password: ${COOKIE_NATS_TRUSTSTORE_PASSWORD:}\\n    consumer-enabled: ${COOKIE_NOTIFICATION_CONSUMER_ENABLED:true}\\n    scheduler-enabled: ${COOKIE_NOTIFICATION_SCHEDULER_ENABLED:true}\\n    poll-millis: 1000\\n    security:\\n      issuer: ${COOKIE_IDENTITY_ISSUER:https://api.cookie.app}\\n      audience: ${COOKIE_IDENTITY_AUDIENCE:cookie-api}\\n      jwks-url: ${COOKIE_IDENTITY_JWKS_URL:https://api.cookie.app/v1/auth/jwks}\\n      private-key-path: ${COOKIE_NOTIFICATION_PRIVATE_KEY_PATH:}\\n      retiring-private-key-paths: ${COOKIE_NOTIFICATION_RETIRING_PRIVATE_KEY_PATHS:}\\n    delivery:\\n      enabled: ${COOKIE_NOTIFICATION_DELIVERY_ENABLED:true}\\n      verification-link-base-url: ${COOKIE_NOTIFICATION_VERIFICATION_LINK_BASE_URL:https://cookie.invalid/verify-email}\\n      smtp:\\n        host: ${COOKIE_SMTP_HOST:localhost}\\n        port: ${COOKIE_SMTP_PORT:1025}\\n        username: ${COOKIE_SMTP_USERNAME:}\\n        password: ${COOKIE_SMTP_PASSWORD:}\\n        from: ${COOKIE_SMTP_FROM:noreply@cookie.invalid}\\n        message-id-domain: ${COOKIE_SMTP_MESSAGE_ID_DOMAIN:notification.cookie.invalid}\\n        starttls-required: ${COOKIE_SMTP_STARTTLS_REQUIRED:true}\\n      fcm:\\n        enabled: ${COOKIE_FCM_ENABLED:false}\\n        project-id: ${COOKIE_FCM_PROJECT_ID:}\\n        credentials-path: ${COOKIE_FCM_CREDENTIALS_PATH:}\\n        base-url: ${COOKIE_FCM_BASE_URL:https://fcm.googleapis.com}\\n\\nlogging:\\n  pattern:\\n    level: \\\"%5p [requestId=%X{requestId:-}]\\\"\\n\",\"backend/services/notification/src/main/resources/db/migration/V002__delivery_queue.sql\":\"CREATE TABLE delivery_jobs (\\n    id uuid PRIMARY KEY,\\n    dedup_key varchar(200) NOT NULL UNIQUE,\\n    channel varchar(8) NOT NULL CHECK (channel IN ('EMAIL','PUSH')),\\n    user_id uuid,\\n    device_id uuid,\\n    registration_attempt_id uuid,\\n    occurrence_id uuid,\\n    kind varchar(40) NOT NULL,\\n    locale varchar(64) NOT NULL DEFAULT 'ru',\\n    encrypted_payload text,\\n    expires_at timestamptz NOT NULL,\\n    created_at timestamptz NOT NULL DEFAULT clock_timestamp(),\\n    next_attempt_at timestamptz NOT NULL DEFAULT clock_timestamp(),\\n    status varchar(24) NOT NULL DEFAULT 'PENDING' CHECK (status IN\\n      ('PENDING','CLAIMED','SMTP_SUBMITTING','ACCEPTED','FAILED','UNKNOWN','CANCELLED','EXPIRED')),\\n    attempt_count integer NOT NULL DEFAULT 0 CHECK (attempt_count >= 0),\\n    lease_token uuid,\\n    lease_until timestamptz,\\n    provider_message_id varchar(512),\\n    last_code varchar(64),\\n    finished_at timestamptz,\\n    CHECK ((lease_token IS NULL) = (lease_until IS NULL)),\\n    CHECK ((channel = 'EMAIL' AND registration_attempt_id IS NOT NULL AND user_id IS NULL AND device_id IS NULL)\\n      OR (channel = 'PUSH' AND user_id IS NOT NULL AND device_id IS NOT NULL AND registration_attempt_id IS NULL))\\n);\\nCREATE INDEX delivery_jobs_pending ON delivery_jobs(next_attempt_at,created_at) WHERE status = 'PENDING';\\nCREATE INDEX delivery_jobs_expiry ON delivery_jobs(expires_at) WHERE status = 'PENDING';\\nCREATE INDEX delivery_jobs_leases ON delivery_jobs(lease_until) WHERE status IN ('CLAIMED','SMTP_SUBMITTING');\\nCREATE INDEX delivery_jobs_user ON delivery_jobs(user_id) WHERE user_id IS NOT NULL;\\nCREATE INDEX delivery_jobs_finished ON delivery_jobs(finished_at) WHERE finished_at IS NOT NULL;\\n\\nCREATE TABLE delivery_attempts (\\n    id uuid PRIMARY KEY,\\n    delivery_id uuid NOT NULL REFERENCES delivery_jobs(id) ON DELETE CASCADE,\\n    started_at timestamptz NOT NULL DEFAULT clock_timestamp(),\\n    finished_at timestamptz,\\n    outcome varchar(24),\\n    safe_code varchar(64)\\n);\\n\",\"backend/services/notification/src/main/resources/db/migration/V006__fcm_only_push.sql\":\"-- Both IOS and ANDROID now register opaque, case-sensitive FCM tokens.\\n-- Keep V004's bounded digest index, but never normalize incoming token bytes.\\nCREATE OR REPLACE FUNCTION notification_set_push_token_identity() RETURNS trigger\\nLANGUAGE plpgsql AS $$\\nBEGIN\\n    NEW.push_token_hash := sha256(convert_to(NEW.push_token,'UTF8'));\\n    RETURN NEW;\\nEND;\\n$$;\\n\\n-- APNs device tokens cannot be converted into FCM registration tokens. Every\\n-- existing iOS installation must register its FCM token after this migration.\\n-- Updating the revision also fences late invalid-token responses.\\nUPDATE push_devices SET enabled=false,updated_at=clock_timestamp()\\nWHERE platform='IOS';\\n\\n-- Re-registration can re-arm eligible unsent reminders through the normal\\n-- scheduler. Preserve submission evidence, terminal outcomes and all email jobs.\\nWITH legacy_ios_jobs AS MATERIALIZED (\\n    SELECT j.id,j.lease_token\\n    FROM delivery_jobs j JOIN push_devices d ON d.id=j.device_id\\n    WHERE j.channel='PUSH' AND d.platform='IOS' AND j.status IN ('PENDING','CLAIMED')\\n    FOR UPDATE OF j\\n), cancelled AS (\\n    UPDATE delivery_jobs j SET status='CANCELLED',finished_at=clock_timestamp(),\\n        lease_token=NULL,lease_until=NULL,last_code='IOS_FCM_REREGISTRATION_REQUIRED'\\n    FROM legacy_ios_jobs old WHERE j.id=old.id\\n    RETURNING old.lease_token\\n)\\nUPDATE delivery_attempts a SET outcome='CANCELLED',\\n    safe_code='IOS_FCM_REREGISTRATION_REQUIRED',finished_at=clock_timestamp()\\nFROM cancelled c WHERE a.id=c.lease_token AND a.finished_at IS NULL;\\n\",\"contracts/dbml/food-catalog.dbml\":\"// COOKie — food catalog service database schema\\n//\\n// This file contains only tables owned by the food catalog service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable custom_foods as CustomFoods {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  name varchar [not null]\\n  brand varchar [null]\\n  base_unit varchar [not null, note: 'G | ML']\\n  calories_per_100 decimal(10,3)\\n  protein_per_100 decimal(10,3)\\n  fat_per_100 decimal(10,3)\\n  carbs_per_100 decimal(10,3)\\n  fiber_per_100 decimal(10,3)\\n  archived boolean [not null, default: false]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n  version bigint [not null, default: 1]\\n\\n  Note: 'Service: Food Catalog. Open Food Facts data is NOT persisted — Redis cache only (off:search:<hash> TTL 10m, off:barcode:<code> TTL 1h)'\\n}\\n\\nTable custom_food_serving as CustomFoodServing {\\n  food_id uuid [pk, ref: - CustomFoods.id]\\n  name varchar [not null, default: 'piece']\\n  base_amount decimal(10,3) [not null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Food Catalog'\\n}\\n\",\"contracts/dbml/health.dbml\":\"// COOKie — health service database schema\\n//\\n// This file contains only tables owned by the health service.\\n// Cross-service references are logical IDs only; never add cross-service foreign keys.\\n\\nTable sources as Sources {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  type varchar [not null, note: 'APPLE_HEALTH | HEALTH_CONNECT']\\n  device_id varchar [null]\\n  created_at timestamptz [not null]\\n  last_sync_at timestamptz [null]\\n\\n  Note: 'Service: Health'\\n}\\n\\nTable daily_activity_sources as DailyActivitySources {\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  local_date date [not null]\\n  source varchar [not null]\\n  steps integer\\n  active_calories decimal(10,3)\\n  source_updated_at timestamptz [not null]\\n  received_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, local_date, source) [pk]\\n  }\\n\\n  Note: 'Service: Health'\\n}\\n\\nTable weight_measurements as WeightMeasurements {\\n  id uuid [pk]\\n  user_id uuid [not null, note: 'logical ref -> Identity.accounts.id']\\n  value_kg decimal(6,2) [not null]\\n  measured_at timestamptz [not null]\\n  source varchar [not null, note: 'MANUAL | APPLE_HEALTH']\\n  external_id varchar [null]\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  indexes {\\n    (user_id, source, external_id) [unique]\\n  }\\n\\n  Note: 'Service: Health'\\n}\\n\",\"contracts/dbml/identity.dbml\":\"// COOKie — Identity Service database schema\\n//\\n// Only Identity owns these tables. IDs carried to other services are logical\\n// references; cross-service foreign keys are forbidden.\\n\\nTable accounts as Accounts {\\n  id uuid [pk, note: 'UUIDv7 generated by Identity']\\n  status varchar [not null, default: 'ACTIVE', note: 'ACTIVE | DELETION_PENDING; deletion is irreversible in v1']\\n  created_at timestamptz [not null]\\n\\n  Note: 'Service: Identity aggregate root. A row exists only after proof-bound email registration succeeds; v1 transitions only ACTIVE -> DELETION_PENDING'\\n}\\n\\nTable email_credentials as EmailCredentials {\\n  account_id uuid [pk, ref: - Accounts.id]\\n  email varchar [not null, unique, note: 'canonical structural value: ASCII local part + UTS #46 IDNA lower-case domain; new registrations currently admit ru or xn--p1ai']\\n  password_hash varchar [not null, note: 'Argon2id PHC copied from the winning registration attempt']\\n  failed_login_count integer [not null, default: 0]\\n  locked_until timestamptz [null, note: 'Login backoff; account deletion also writes a far-future value so rolling old binaries deny login while they still ignore Accounts.status']\\n  created_at timestamptz [not null]\\n  updated_at timestamptz [not null]\\n\\n  Note: 'Service: Identity. One email/password credential per account; email and Argon2id hash are retained while distributed deletion is pending'\\n}\\n\\nTable account_deletion_requests as AccountDeletionRequests {\\n  id uuid [pk, note: 'Server-generated UUIDv7 returned as deletionRequestId']\\n  account_id uuid [not null, ref: > Accounts.id, note: 'Restrictive/default NO ACTION ownership FK; deletion must never cascade away workflow evidence']\\n  idempotency_key uuid [not null, note: 'Client-generated RFC 4122 UUIDv4 scoped to the account; never logged or copied into events']\\n  status varchar [not null, note: 'DELETION_PENDING is the only state implemented in v1']\\n  requested_at timestamptz [not null, note: 'PostgreSQL-backed command time returned unchanged on every accepted retry']\\n\\n  indexes {\\n    (account_id, idempotency_key) [unique, name: 'uq_account_deletion_requests_account_key', note: 'One account + one key always identifies the same accepted request']\\n    (account_id) [unique, name: 'uq_account_deletion_requests_pending_account', note: 'Partial: WHERE status = DELETION_PENDING; prevents concurrent active deletion processes for one account']\\n    (requested_at, id) [name: 'idx_account_deletion_requests_requested_at', note: 'Supports deterministic lifecycle/reconciliation scans without deleting pending evidence']\\n  }\\n\\n  Note: 'Service: Identity aggregate root. Exact retries and later keys return this row; wrong-password attempts create no row. There is no v1 completion, grace period or cancellation'\\n}\\n\\nTable registration_attempts as RegistrationAttempts {\\n  id uuid [pk, note: 'Client-generated cryptographically random idempotency/correlation UUID for one logical signup attempt']\\n  email varchar [not null, note: 'canonical target email; no Account exists yet']\\n  registration_proof_hash varchar [not null, note: 'SHA-256 of the independent 256-bit client-held proof']\\n  request_fingerprint varchar [not null, note: 'keyed fingerprint used to distinguish an exact retry from conflicting proof reuse']\\n  locale varchar [null, note: 'canonical BCP 47 tag retained for localized resend and scrubbed on completion or abandonment']\\n  pending_password_hash varchar [null, note: 'Argon2id PHC while active; scrubbed atomically on completion or abandonment']\\n  expires_at timestamptz [not null, note: 'absolute attempt lifetime; resend never extends it']\\n  completed_at timestamptz [null, note: 'first successful completion time']\\n  abandoned_at timestamptz [null, note: 'terminal time for natural expiry or superseding confirmation; mutually exclusive with completed_at']\\n  activated_account_id uuid [null, note: 'logical winning account id retained as bounded idempotency evidence; deliberately no FK so account privacy deletion neither blocks nor removes the tombstone']\\n  created_at timestamptz [not null]\\n\\n  indexes {\\n    (id, expires_at) [unique, name: 'uq_registration_attempts_id_expiry', note: 'Supports the child composite FK for immutable aggregate expiry']\\n    (registration_proof_hash) [unique, name: 'uq_registration_attempts_registration_proof', note: 'A client proof belongs to exactly one registration request globally']\\n    (expires_at, id) [name: 'idx_registration_attempts_pending_expiry', note: 'Partial: WHERE completed_at IS NULL AND abandoned_at IS NULL']\\n    (completed_at, id) [name: 'idx_registration_attempts_completed_at', note: 'Partial: WHERE completed_at IS NOT NULL']\\n    (abandoned_at, id) [name: 'idx_registration_attempts_abandoned_at', note: 'Partial: WHERE abandoned_at IS NOT NULL']\\n    (activated_account_id) [unique, name: 'uq_registration_attempts_activated_account', note: 'Partial: WHERE activated_account_id IS NOT NULL']\\n  }\\n\\n  Note: 'Service: Identity aggregate root. Registration proof reuse is rejected while evidence is retained; resends add child tokens; terminal rows scrub password/locale and completed or abandoned tombstones remain for at least 30 days'\\n}\\n\\nTable registration_verification_tokens as RegistrationVerificationTokens {\\n  id uuid [pk, note: 'Server-generated UUIDv7 token id embedded with attempt id in v1e.<attempt-id>.<token-id>.<secret>']\\n  attempt_id uuid [not null, note: 'part of composite FK -> RegistrationAttempts.(id, expires_at)']\\n  attempt_expires_at timestamptz [not null, note: 'immutable parent expiry copied for the composite FK and lifetime CHECK']\\n  verifier_hash varchar [not null, note: 'SHA-256 of the emailed random verifier; raw token is never stored']\\n  issued_at timestamptz [not null]\\n  expires_at timestamptz [not null, note: 'per-delivery lifetime bounded by the parent attempt lifetime']\\n  redeemed_at timestamptz [null, note: 'only the winning token is marked redeemed']\\n\\n  indexes {\\n    (attempt_id, issued_at, id) [name: 'idx_registration_verification_tokens_attempt_issued']\\n    (attempt_id) [name: 'uq_registration_verification_tokens_redeemed', note: 'Partial unique: WHERE redeemed_at IS NOT NULL']\\n  }\\n\\n  Note: 'Service: Identity aggregate child. Composite FK (attempt_id, attempt_expires_at) enforces the parent expiry copy and cascades deletion; raw verifier is never persisted'\\n}\\n\\nTable refresh_families as RefreshFamilies {\\n  id uuid [pk, note: 'stable UUIDv7 id of one logical device session']\\n  account_id uuid [not null, ref: > Accounts.id]\\n  device_id varchar [null, note: 'Opaque client-installation id; 1..255 Unicode code points, non-blank and without control characters']\\n  status varchar [not null, note: 'ACTIVE | REVOKED']\\n  expires_at timestamptz [not null, note: 'absolute 30-day lifetime; credential rotation never extends it']\\n  created_at timestamptz [not null]\\n  last_activity_at timestamptz [not null]\\n  revoked_at timestamptz [null]\\n  revoke_reason varchar [null, note: 'LOGOUT | TOKEN_REUSE_DETECTED; v1 account deletion persists LOGOUT as a rolling-compatible technical reason while Accounts.status carries the lifecycle cause']\\n  reuse_detected_at timestamptz [null]\\n\\n  indexes {\\n    (account_id, status) [name: 'idx_refresh_families_account_status']\\n    (expires_at) [name: 'idx_refresh_families_expires_at']\\n  }\\n\\n  Note: 'Service: Identity aggregate root. Credential reuse atomically revokes this logical device session'\\n}\\n\\nTable refresh_credentials as RefreshCredentials {\\n  id uuid [pk, note: 'UUIDv7 credential id embedded in v1.<id>.<secret>']\\n  family_id uuid [not null, ref: > RefreshFamilies.id]\\n  verifier_hash varchar [not null, note: 'SHA-256 verifier; raw refresh token is never persisted']\\n  created_at timestamptz [not null]\\n  redeemed_at timestamptz [null]\\n  replaced_by_credential_id uuid [null, unique, ref: > RefreshCredentials.id]\\n  rotation_idempotency_key uuid [null, note: 'same key permits exact replay while the immediate successor remains current']\\n  retry_until timestamptz [null, note: 'compatibility deadline; new rotations set it to family expiry']\\n\\n  indexes {\\n    (family_id, id) [unique, name: 'uq_refresh_credentials_family_id_id']\\n    (family_id, created_at, id) [name: 'idx_re
