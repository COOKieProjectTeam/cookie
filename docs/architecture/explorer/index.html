        \\\"line\\\": 117\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"Точные v1 subjects\\\",\\n          \\\"detail\\\": \\\"Consumer принимает только10 перечисленных subject filters, producer field дополнительно проверяется handler.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/config/notification-consumer.json\\\",\\n            \\\"line\\\": 9\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Atomic inbox + monotonic projection\\\",\\n          \\\"detail\\\": \\\"Per-user lock; eventId dedup; только version>stored version меняет allowlisted projection. Сохраняются entity tombstones; account tombstone блокирует любые поздние updates.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n            \\\"line\\\": 52\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"После commit — подсказка пересчёта\\\",\\n          \\\"detail\\\": \\\"Применённая новая версия вызывает dirty и afterCommit hint; stale/equal version не меняет deadline. Внешний provider в ingest transaction не вызывается.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n            \\\"line\\\": 67\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"ACK durable result\\\",\\n          \\\"detail\\\": \\\"Duplicate/старое событие также безопасно ACK после transaction; неисправность инфраструктуры даёт unlimited retry.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n            \\\"line\\\": 38\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-reminder-delivery\\\",\\n      \\\"title\\\": \\\"Расписание → occurrence → FCM → устройство\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"PostgreSQL — источник истины; Redis — ускоряющий индекс. Планировщик использует чистый ReminderPlanner, а worker повторно проверяет те же правила перед provider.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"Извлечь due hints\\\",\\n          \\\"detail\\\": \\\"Tick1000 ms выбирает до100 ZSET userId:generation с score≤now и удаляет выбранные hints. Redis failure возвращает пустую выборку и счётчик ошибки.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/RedisDeadlineIndex.kt\\\",\\n            \\\"line\\\": 27\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Независимый overdue sweep\\\",\\n          \\\"detail\\\": \\\"Каждые30 s выбираются до100 due deadlines. Невзятые/stale hints не являются потерей authoritative schedule.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n            \\\"line\\\": 40\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Account lock и authoritative check\\\",\\n          \\\"detail\\\": \\\"pg_try_advisory_xact_lock; проверить timezone/tombstone, due_at≤now и expected generation. Другая реплика не выпускает occurrence одновременно.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n            \\\"line\\\": 49\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Pure plan текущего состояния\\\",\\n          \\\"detail\\\": \\\"Minimal projections, baselines, occurrences → food/water/weigh/calorie candidates и next wakeup; quiet/DST/day rollover и текущая timezone учтены.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\\\",\\n            \\\"line\\\": 48\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Occurrence + per-device delivery jobs\\\",\\n          \\\"detail\\\": \\\"В одной transaction unique(user,kind,cycle), enqueue на каждое enabled устройство, last_water_reminder_at и следующий deadline/generation. Без устройств cycle не потребляется; повторная проверка≤60 s.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n            \\\"line\\\": 60\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"Записать следующий deadline после transaction\\\",\\n          \\\"detail\\\": \\\"PostgreSQL commit предшествует обновлению ZSET; периодический/reconnect rebuild восстановит индекс при потерянной записи.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n            \\\"line\\\": 86\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Claim с lease и fencing\\\",\\n          \\\"detail\\\": \\\"До8 worker slots; lease120 s, heartbeat15 s; jobs остаются durable при падении процесса.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/JdbcDeliveryRepository.kt\\\",\\n            \\\"line\\\": 57\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Final eligibility и quiet recheck\\\",\\n          \\\"detail\\\": \\\"Отдельная push transaction≤45 s удерживает user/token locks до outcome; transfer/deletion сериализованы с отправкой. После lock перечитываются owner/revision/lease, projections и настройки. Quiet и интервал воды переносят отправку.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/JdbcDeliveryRepository.kt\\\",\\n            \\\"line\\\": 86\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"fcm\\\",\\n          \\\"label\\\": \\\"Android и iOS: FCM bounded request\\\",\\n          \\\"detail\\\": \\\"Refresh lock≤5 s, OAuth≤10 s, send≤15 s; generic text + deliveryId. Android: tag=occurrenceId, TTL≤1 h. iOS: expiration/collapse headers и alert из общего notification. Retry-After и UNREGISTERED учитываются; Apple credentials error приостанавливает только IOS и не отключает устройство.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/PushProviders.kt\\\",\\n            \\\"line\\\": 41\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"apns\\\",\\n          \\\"label\\\": \\\"iOS: Firebase пересылает в APNs\\\",\\n          \\\"detail\\\": \\\"Внешний участок доставки, управляемый Firebase. Ключ Apple настроен в Firebase; Notification не делает отдельный HTTP-запрос в APNs. ACCEPTED — подтверждение FCM, не показ и не прочтение.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"docs/architecture/notification.md\\\",\\n            \\\"line\\\": 35\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Fenced outcome\\\",\\n          \\\"detail\\\": \\\"ACCEPTED/FAILED/CANCELLED/EXPIRED или scheduled retry; provider unavailable pause60 s, transient max10 persistent provider failures, технические отсрочки вне бюджета, jitter и expiry ограничивают повтор.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n            \\\"line\\\": 138\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-quarantine-replay\\\",\\n      \\\"title\\\": \\\"Poison, outage и operator replay\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"Невалидный контракт и временная ошибка разделены; quarantine хранит metadata, оригинал ограничен retention JetStream. Replay не является повтором SMTP UNKNOWN.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Классифицировать сбой\\\",\\n          \\\"detail\\\": \\\"Только InvalidNotificationEvent считается poison. Все остальные exceptions дают unlimited NAK, задержка по deliveredCount максимум256 s.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n            \\\"line\\\": 38\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Durable quarantine metadata\\\",\\n          \\\"detail\\\": \\\"SHA-256,message eventId,subject,reason,stream sequence; no raw envelope. Failed DB insert оставляет сообщение не ACKed.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationConsumer.kt\\\",\\n            \\\"line\\\": 59\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"ACK после сохранения quarantine\\\",\\n          \\\"detail\\\": \\\"Оператор может исправить причину и запросить replay; runtime credentials разрешают только own consumer INFO/NEXT/ACK, не shared stream GET.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/config/notification-nats-permissions.json\\\",\\n            \\\"line\\\": 2\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Одноразовый operator process\\\",\\n          \\\"detail\\\": \\\"Profile notification-replay отключает web/consumer/scheduler/delivery. --notification-replay-id выбирает запись, отдельный operator credentials path обязателен.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\\\",\\n            \\\"line\\\": 31\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"Прочитать original по sequence\\\",\\n          \\\"detail\\\": \\\"Operator credential делает прямой STREAM.MSG.GET с timeout2 s, без STREAM.INFO; отсутствие original даёт явное cannot recover/replay. Subject и SHA-256 должны совпасть с quarantine.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\\\",\\n            \\\"line\\\": 43\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Тот же handler и eventId\\\",\\n          \\\"detail\\\": \\\"После успешного handler помечается replayed_at. Inbox/queue dedup остаются; direct re-publish и reset terminal UNKNOWN не выполняются.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/OperatorQuarantineReplay.kt\\\",\\n            \\\"line\\\": 56\\n          }\\n        }\\n      ]\\n    },\\n    {\\n      \\\"id\\\": \\\"notification-account-deletion\\\",\\n      \\\"title\\\": \\\"Account deletion и защита от поздних событий\\\",\\n      \\\"operationIds\\\": [],\\n      \\\"description\\\": \\\"После получения deletion request Notification запрещает доступ даже с ещё не истёкшим Identity JWT. Завершённый внешний provider request отозвать невозможно.\\\",\\n      \\\"steps\\\": [\\n        {\\n          \\\"node\\\": \\\"identity\\\",\\n          \\\"label\\\": \\\"account.deletion.requested v1\\\",\\n          \\\"detail\\\": \\\"Реальный producer формирует accountId,deletionRequestId,requestedAt и пишет transactional outbox.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxIdentityEventRecorder.kt\\\",\\n            \\\"line\\\": 76\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"nats\\\",\\n          \\\"label\\\": \\\"Durable delivery deletion request\\\",\\n          \\\"detail\\\": \\\"Точный subject включён в notification-v1; обработка следует общим inbox/ACK правилам.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"deploy/production/config/notification-consumer.json\\\",\\n            \\\"line\\\": 10\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification_db\\\",\\n          \\\"label\\\": \\\"Account lock + inbox + permanent tombstone\\\",\\n          \\\"detail\\\": \\\"В одной transaction INSERT tombstone, удалить user delivery_jobs (attempts cascade), devices/settings/projections/deadlines/occurrences.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/messaging/NotificationEventHandler.kt\\\",\\n            \\\"line\\\": 83\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Поздние события и API\\\",\\n          \\\"detail\\\": \\\"Handler записывает dedup и игнорирует mutation для tombstoned account; repository transactions отвечают ACCOUNT_DELETED403. Tombstone не истекает.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/persistence/JdbcNotificationRepository.kt\\\",\\n            \\\"line\\\": 91\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"redis\\\",\\n          \\\"label\\\": \\\"Устаревшие hints безопасны\\\",\\n          \\\"detail\\\": \\\"Оставшийся Redis member не создаёт state: scheduler перечитывает PostgreSQL, видит отсутствующие settings/deleted account и не выпускает reminder.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/scheduler/ReminderScheduler.kt\\\",\\n            \\\"line\\\": 49\\n          }\\n        },\\n        {\\n          \\\"node\\\": \\\"notification\\\",\\n          \\\"label\\\": \\\"Preflight отменяет pending delivery\\\",\\n          \\\"detail\\\": \\\"Worker проверяет current target и projections перед submit; если account удалён, CANCELLED/отсутствующая job не допускает отправку.\\\",\\n          \\\"source\\\": {\\n            \\\"path\\\": \\\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\\\",\\n            \\\"line\\\": 99\\n          }\\n        }\\n      ]\\n    }\\n  ],\\n  \\\"operationNotes\\\": {\\n    \\\"registerDevice\\\": {\\n      \\\"notes\\\": [\\n        \\\"POST /v1/notifications/devices; body≤16 KiB: {platform: IOS|ANDROID,deviceId,token}.\\\",\\n        \\\"201 новый logical device;200 upsert того же (JWT sub,deviceId). Enabled platform/token переносится с прежнего владельца; FCM-токен регистрозависимый и сохраняется без изменения для IOS и ANDROID.\\\",\\n        \\\"JWT sub — единственный источник account ownership. PostgreSQL account/token locks и unique active token; Redis hint только after commit.\\\",\\n        \\\"Invalid JSON400; invalid JWT401; deleted account403; body413; dependency503 с Retry-After:1.\\\",\\n        \\\"После V006 старые IOS APNs-привязки отключены: приложение должно передать FCM registration token, сырой APNs token не подходит.\\\"\\n      ],\\n      \\\"flowId\\\": \\\"notification-register-device\\\"\\n    },\\n    \\\"unregisterDevice\\\": {\\n      \\\"notes\\\": [\\n        \\\"DELETE /v1/notifications/devices/{deviceId}; path — клиентский deviceId, не внутренний UUID.\\\",\\n        \\\"Удаляется только запись текущего JWT sub:204 success,404 отсутствующее/чужое устройство.\\\",\\n        \\\"Account transaction проверяет tombstone; Redis не обновляется. Уже queued jobs проверят device перед provider и будут отменены.\\\"\\n      ],\\n      \\\"flowId\\\": \\\"notification-unregister-device\\\"\\n    },\\n    \\\"getNotificationSettings\\\": {\\n      \\\"notes\\\": [\\n        \\\"GET /v1/notifications/settings lazily создаёт default settings под account lock.\\\",\\n        \\\"200 + Cache-Control:no-store; timezone отсутствует до первого явного PATCH, scheduled push пока paused.\\\",\\n        \\\"ru default; all types enabled, food240 min, water2 h, weigh08:00, quiet23:00–08:00. GET не dirty-ит schedule.\\\"\\n      ],\\n      \\\"flowId\\\": \\\"notification-get-settings\\\"\\n    },\\n    \\\"updateNotificationSettings\\\": {\\n      \\\"notes\\\": [\\n        \\\"PATCH /v1/notifications/settings с частичным nested merge; null/unknown fields/coercion/empty patch/empty section→400.\\\",\\n        \\\"timezone — IANA; locale ru/en; food.inactiveForMinutes1..10080; weighIn.time и quietHours — HH:mm.\\\",\\n        \\\"Первое timezone и re-enable food/water задают текущий baseline. Последующая смена timezone пересчитывает local schedules, не сбрасывая inactivity.\\\",\\n        \\\"В одной transaction settings+generation deadline; afterCommit Redis hint. 200 полные merged settings/no-store.\\\"\\n      ],\\n      \\\"flowId\\\": \\\"notification-update-settings\\\"\\n    }\\n  }\\n}\\n\",\"docs/architecture/model/events.yaml\":\"schema_version: 1\\nmodel_status: target\\nupdated_at: 2026-09-17\\nsource:\\n  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/\\n\\ntransport:\\n  broker: nats_jetstream\\n  guarantee: at_least_once\\n  producer_pattern: transactional_outbox\\n  consumer_pattern: idempotent_inbox\\n  ordering: no global ordering assumption\\n  subject_mapping: cookie.events.<event_type>.v<event_version>\\n  stream: COOKIE_EVENTS\\n  retry_policy: producer retries forever with exponential backoff from 1s to 5m and jitter\\n  dead_letter_policy: consumer-owned PostgreSQL metadata quarantine; original broker replay while retained\\n\\nenvelope:\\n  required:\\n    event_id: uuid\\n    event_type: string\\n    event_version: positive_integer\\n    occurred_at: rfc3339_utc\\n    producer: service_id\\n    aggregate_type: string\\n    aggregate_id: string\\n    payload: object\\n  optional:\\n    aggregate_version: integer\\n    correlation_id: uuid\\n    causation_id: uuid\\n    trace_id: string\\n\\nevents:\\n  - type: account.activated\\n    version: 1\\n    producer: identity\\n    consumers: [user, notification]\\n    payload: [userId, accountMetadata]\\n\\n  - type: account.deletion.requested\\n    version: 1\\n    producer: identity\\n    consumers: [user, food_catalog, nutrition, recipe, shopping, health, progress, notification, media, meal_planner]\\n    payload: [accountId, deletionRequestId, requestedAt]\\n    implementation_note: >-\\n      Identity publishes the request; Notification consumes it and erases its\\n      owned data with a minimal tombstone. Other listed consumers are target\\n      data owners. No acknowledgement/finalization protocol exists; the account\\n      therefore remains DELETION_PENDING. event_id and\\n      occurred_at are mandatory envelope fields and are intentionally not\\n      duplicated in this PII-free business payload.\\n\\n  - type: notification.email.requested\\n    version: 1\\n    producer: identity\\n    consumers: [notification]\\n    payload: [template, encryptedPayload, expiresAt]\\n    security_note: >-\\n      encryptedPayload is compact JWE using RSA-OAEP-256 and A256GCM. Only the\\n      Notification Service decrypts registrationAttemptId, recipientEmail, locale\\n      and the one-time token;\\n      raw delivery secrets never enter outbox rows, JetStream or logs.\\n\\n  - type: user.profile.updated\\n    version: 1\\n    producer: user\\n    consumers: [progress, notification]\\n    payload: [userId, changedFields, timezone, locale, onboardingCompleted]\\n\\n    aggregate_version_required: true\\n\\n  - type: user.goal.changed\\n    version: 1\\n    producer: user\\n    consumers: [progress]\\n    payload: [userId, nutritionGoalVersion]\\n\\n  - type: user.goal_override.changed\\n    version: 1\\n    producer: user\\n    consumers: [progress]\\n    payload: [userId, localDate, override]\\n\\n  - type: user.hydration_goal.changed\\n    version: 1\\n    producer: user\\n    consumers: [progress]\\n    payload: [userId, targetMl]\\n\\n  - type: nutrition.meal.created\\n    version: 1\\n    producer: nutrition\\n    consumers: [notification]\\n    payload: [mealId, userId, eatenAt, dishes]\\n\\n    aggregate_version_required: true\\n\\n  - type: nutrition.meal.updated\\n    version: 1\\n    producer: nutrition\\n    consumers: [notification]\\n    payload: [mealId, userId, eatenAt, changedFields]\\n\\n    aggregate_version_required: true\\n\\n  - type: nutrition.meal.deleted\\n    version: 1\\n    producer: nutrition\\n    consumers: [notification]\\n    payload: [mealId, userId]\\n\\n    aggregate_version_required: true\\n\\n  - type: nutrition.day.changed\\n    version: 1\\n    producer: nutrition\\n    consumers: [progress]\\n    payload: [userId, localDate, nutritionTotals]\\n\\n  - type: nutrition.water.changed\\n    version: 1\\n    producer: nutrition\\n    consumers: [progress, notification]\\n    payload: [userId, localDate, totalMl, lastConsumedAt]\\n\\n    aggregate_version_required: true\\n\\n  - type: recipe.customization.updated\\n    version: 1\\n    producer: recipe\\n    consumers: [shopping]\\n    payload: [recipeId, userId, revision, ingredients]\\n\\n  - type: recipe.customization.deleted\\n    version: 1\\n    producer: recipe\\n    consumers: [shopping]\\n    payload: [recipeId, userId]\\n\\n  - type: health.weight.changed\\n    version: 1\\n    producer: health\\n    consumers: [progress, notification]\\n    payload: [measurementId, userId, deleted, valueKg, measuredAt]\\n\\n    aggregate_version_required: true\\n\\n  - type: health.activity.changed\\n    version: 1\\n    producer: health\\n    consumers: [progress]\\n    payload: [userId, localDate, steps, activeCalories]\\n\\n  - type: progress.day.updated\\n    version: 1\\n    producer: progress\\n    consumers: [notification]\\n    payload: [userId, localDate, timezone, calories, water]\\n\\n    aggregate_version_required: true\\n\",\"docs/architecture/model/services.yaml\":\"schema_version: 1\\nmodel_status: target\\nupdated_at: 2026-10-20\\nsource:\\n  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/\\n  authority: docs/architecture/README.md\\n\\ndefaults:\\n  backend_runtime: kotlin_jvm\\n  backend_framework: spring_boot_mvc\\n  jdk_version: 25\\n  state_store: postgresql\\n  event_bus: nats_jetstream\\n  delivery_semantics: at_least_once\\n  transactional_outbox: required_for_event_publishers\\n  idempotent_inbox: required_for_event_consumers\\n  database_access: owner_only\\n  operational_http_contract: contracts/openapi/runtime.yaml\\n  operational_endpoint_owner: each_deployable_component\\n\\ninfrastructure:\\n  edge_gateway:\\n    product: caddy\\n    initial_production_ingress: yandex_api_gateway_default_https_domain\\n    initial_production_ingress_scope: identity /v1/auth/* and notification /v1/notifications/*; temporary until a custom domain and Caddy TLS edge exist\\n  relational_database:\\n    product: postgresql\\n    rule: each stateful domain service owns an isolated database or schema\\n    initial_production_topology: one non-HA instance on the production VM; isolated Identity and Notification databases\\n    target_deployment_topology: TBD after the single-VM bootstrap\\n  event_bus:\\n    product: nats_jetstream\\n    stream_topology: COOKIE_EVENTS captures cookie.events.> for v1 domain events\\n    initial_production_topology: one non-HA node on the production VM\\n  ephemeral_store:\\n    product: redis\\n    rule: not a system of record; only declared uses are allowed\\n  observability_ui:\\n    product: grafana\\n    metrics_backend: TBD\\n    logs_backend: TBD\\n    traces_backend: TBD\\n  object_storage:\\n    protocol: s3_compatible\\n    product: TBD\\n\\ndeployment:\\n  active_environments: [local_dev, production]\\n  persistent_test_environment: disabled\\n  production:\\n    cloud: yandex_cloud\\n    topology: single_vm_non_ha\\n    deployed_services: [identity, notification]\\n    artifact_source: yandex_container_registry\\n    artifact_identity: immutable_digest\\n\\nservices:\\n  - id: api_gateway\\n    name: Caddy API Gateway\\n    kind: edge\\n    runtime: caddy\\n    stateful: false\\n    purpose: TLS termination, routing and edge rate limiting\\n    openapi_tags: []\\n    redis:\\n      - keyspace: rate_limit\\n        data: short-lived counters by IP, account and route\\n    inbound: [mobile_client]\\n    outbound:\\n      - mobile_bff\\n      - identity\\n      - user\\n      - food_catalog\\n      - nutrition\\n      - recipe\\n      - shopping\\n      - health\\n      - notification\\n      - media\\n      - meal_planner\\n\\n  - id: mobile_bff\\n    name: Mobile BFF\\n    kind: backend_for_frontend\\n    runtime: kotlin_jvm\\n    stateful: false\\n    purpose: aggregate domain APIs into mobile screen responses such as /today\\n    openapi_tags: [bff]\\n    synchronous_dependencies: [user, progress, recipe, nutrition]\\n\\n  - id: identity\\n    name: Identity Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: email/password account lifecycle, credentials and access/refresh sessions\\n    openapi_tags: [auth]\\n    dbml: contracts/dbml/identity.dbml\\n    publishes:\\n      - account.activated\\n      - account.deletion.requested\\n      - notification.email.requested\\n    consumes: []\\n\\n  - id: user\\n    name: User Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: profile, onboarding, nutrition goals, allergies, diet and goal overrides\\n    openapi_tags: [profile]\\n    dbml: contracts/dbml/user.dbml\\n    publishes:\\n      - user.profile.updated\\n      - user.goal.changed\\n      - user.goal_override.changed\\n      - user.hydration_goal.changed\\n    consumes: [account.activated, account.deletion.requested]\\n\\n  - id: food_catalog\\n    name: Food Catalog Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: custom foods and proxy search/barcode lookup in Open Food Facts\\n    openapi_tags: [food]\\n    dbml: contracts/dbml/food-catalog.dbml\\n    consumes: [account.deletion.requested]\\n    synchronous_dependencies: [open_food_facts]\\n    redis:\\n      - keyspace: off_search\\n        data: Open Food Facts search response cache\\n        ttl: 10m\\n      - keyspace: off_barcode\\n        data: Open Food Facts barcode response cache\\n        ttl: 1h\\n\\n  - id: nutrition\\n    name: Nutrition Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: food diary, meals, dishes, food entries, saved dishes and water\\n    openapi_tags: [diary]\\n    dbml: contracts/dbml/nutrition.dbml\\n    publishes:\\n      - nutrition.meal.created\\n      - nutrition.meal.updated\\n      - nutrition.meal.deleted\\n      - nutrition.day.changed\\n      - nutrition.water.changed\\n    consumes: [account.deletion.requested]\\n    synchronous_dependencies: [recipe, media]\\n\\n  - id: recipe\\n    name: Recipe Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: recipes, versions, personal customizations, favorites and cooking history\\n    openapi_tags: [recipes]\\n    dbml: contracts/dbml/recipe.dbml\\n    publishes:\\n      - recipe.customization.updated\\n      - recipe.customization.deleted\\n    consumes: [account.deletion.requested]\\n    synchronous_dependencies: [media]\\n\\n  - id: shopping\\n    name: Shopping Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: recipe cart, ingredient snapshots and shopping list\\n    openapi_tags: [shopping]\\n    dbml: contracts/dbml/shopping.dbml\\n    consumes:\\n      - account.deletion.requested\\n      - recipe.customization.updated\\n      - recipe.customization.deleted\\n    synchronous_dependencies: [recipe]\\n\\n  - id: health\\n    name: Health Data Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: domain activity and weight data synchronized from platform health providers; never operational probes\\n    openapi_tags: [health]\\n    dbml: contracts/dbml/health.dbml\\n    publishes:\\n      - health.activity.changed\\n      - health.weight.changed\\n    consumes: [account.deletion.requested]\\n    external_dependencies: [apple_healthkit, android_health_connect]\\n\\n  - id: progress\\n    name: Progress Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: event-driven daily nutrition and health progress read models\\n    openapi_tags: [progress]\\n    dbml: contracts/dbml/progress.dbml\\n    publishes:\\n      - progress.day.updated\\n    consumes:\\n      - account.deletion.requested\\n      - nutrition.day.changed\\n      - nutrition.water.changed\\n      - health.activity.changed\\n      - health.weight.changed\\n      - user.profile.updated\\n      - user.goal.changed\\n      - user.goal_override.changed\\n      - user.hydration_goal.changed\\n\\n  - id: notification\\n    name: Notification Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: push, email, reminder scheduling and delivery state\\n    openapi_tags: [notifications]\\n    dbml: contracts/dbml/notification.dbml\\n    consumes:\\n      - account.deletion.requested\\n      - notification.email.requested\\n      - account.activated\\n      - nutrition.meal.created\\n      - nutrition.meal.updated\\n      - nutrition.meal.deleted\\n      - nutrition.water.changed\\n      - health.weight.changed\\n      - user.profile.updated\\n      - progress.day.updated\\n    redis:\\n      - keyspace: reminder_deadlines\\n        data: ephemeral queue/index of due reminder deadlines\\n    synchronous_dependencies: [identity]\\n    external_dependencies: [fcm, smtp]\\n\\n  - id: media\\n    name: Media Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: media metadata, ownership, lifecycle and pre-signed object access\\n    openapi_tags: [media]\\n    dbml: contracts/dbml/media.dbml\\n    consumes: [account.deletion.requested]\\n    synchronous_dependencies: [object_storage]\\n\\n  - id: meal_planner\\n    name: Meal Planner Service\\n    kind: domain_service\\n    stateful: true\\n    purpose: asynchronous generation and execution of 14-day meal plans\\n    openapi_tags: [meal-plan]\\n    dbml: contracts/dbml/meal-planner.dbml\\n    consumes: [account.deletion.requested]\\n    synchronous_dependencies: [user, recipe, shopping]\\n\\nexternal_systems:\\n  - id: mobile_client\\n    name: Kotlin Multiplatform mobile client\\n  - id: open_food_facts\\n    name: Open Food Facts\\n  - id: object_storage\\n    name: S3-compatible object storage\\n  - id: apple_healthkit\\n    name: Apple HealthKit\\n  - id: android_health_connect\\n    name: Android Health Connect\\n  - id: apns\\n    name: Apple Push Notification service\\n    purpose: downstream iOS delivery managed by FCM, not a direct Notification dependency\\n  - id: fcm\\n    name: Firebase Cloud Messaging\\n  - id: smtp\\n    name: SMTP provider\\n\",\"docs/architecture/model/sync-calls.yaml\":\"schema_version: 1\\nmodel_status: target\\nupdated_at: 2026-10-20\\nsource:\\n  miro_board: https://miro.com/app/board/uXjVGuhJKXc=/\\n\\nrules:\\n  - calls not listed here are forbidden until the model is updated\\n  - every internal operation is owned and authorized by the callee service\\n  - internal protected operations require cryptographic workload identity with callee audience\\n  - explicitly public signing-key discovery uses fixed authenticated TLS origin and no workload token\\n  - client module availability does not grant permission to call the callee\\n  - callee operation grants must be a subset of calls declared here\\n  - callers must set timeouts and propagate trace context\\n  - a synchronous failure must not be hidden by writing another service database\\n  - cross-service transactions are forbidden\\n\\ncalls:\\n  - caller: mobile_bff\\n    callee: user\\n    purpose: profile and current goal for /today\\n  - caller: mobile_bff\\n    callee: progress\\n    purpose: daily progress for /today\\n  - caller: mobile_bff\\n    callee: recipe\\n    purpose: recommended recipes for /today\\n  - caller: mobile_bff\\n    callee: nutrition\\n    purpose: daily diary for /today\\n\\n  - caller: meal_planner\\n    callee: shopping\\n    purpose: create asynchronous add-to-cart import job and poll its status\\n  - caller: meal_planner\\n    callee: recipe\\n    purpose: retrieve and filter recipe candidates for plan generation\\n  - caller: meal_planner\\n    callee: user\\n    purpose: retrieve current profile, goals, diet and allergies\\n\\n  - caller: nutrition\\n    callee: recipe\\n    purpose: resolve a personalized immutable recipe snapshot before creating a dish\\n  - caller: nutrition\\n    callee: media\\n    purpose: validate ownership/readiness and resolve media URLs for dishes\\n  - caller: shopping\\n    callee: recipe\\n    purpose: retrieve recipe version and ingredient snapshot\\n  - caller: recipe\\n    callee: media\\n    purpose: resolve temporary recipe photo URLs\\n\\n  - caller: food_catalog\\n    callee: open_food_facts\\n    purpose: product search and barcode lookup; responses are cached in Redis\\n  - caller: media\\n    callee: object_storage\\n    purpose: create pre-signed URLs, verify uploaded object metadata and delete objects\\n  - caller: mobile_client\\n    callee: object_storage\\n    purpose: direct pre-signed PUT/GET without proxying bytes through backend services\\n  - caller: notification\\n    callee: fcm\\n    purpose: send Android and iOS push through FCM HTTP v1; Firebase manages downstream APNs delivery\\n  - caller: notification\\n    callee: smtp\\n    purpose: authenticated TLS email submission\\n  - caller: notification\\n    callee: identity\\n    purpose: public signing-key discovery at /v1/auth/jwks\\n    authentication: public_jwks_over_tls\\n    user_context: none\\n    implementation: fixed-origin bounded JWKS cache, not an internal domain client\\n\",\"docs/architecture/notification.md\":\"# Notification Service\\n\\nNotification owns email/push delivery, devices, preferences and reminder state.\\nIts runtime has independent API, consumer, scheduler and delivery roles in one\\ndeployable application. PostgreSQL is authoritative; Redis is recoverable.\\n\\n## Public API\\n\\n`contracts/openapi/public/notification.yaml` generates server interfaces/models\\nand the active mobile client. The four stable operations are `registerDevice`,\\n`unregisterDevice`, `getNotificationSettings`, `updateNotificationSettings` under\\n`/v1/notifications`. Only a verified Identity JWT `sub` selects an account.\\nProbes remain `/healthz` and `/readyz` outside the public API/gateway.\\n\\nGET lazily creates default settings unless a deletion tombstone exists. PATCH\\nmerges supplied nested fields and rejects unknown fields, scalar type coercion,\\nempty sections, explicit nulls, invalid\\nIANA timezones, invalid `HH:mm` times and food intervals outside 1..10080 minutes.\\nTimezone is absent until explicitly set; all scheduled push remains paused until\\nthen. Locale supports `ru` and `en`, with Russian fallback. Devices are scoped to\\ntheir account, and an enabled platform/token is bound to only one account at a\\ntime. Both IOS and ANDROID register opaque, case-sensitive FCM registration tokens;\\ntokens are never lowercased, including hexadecimal-looking strings. A trigger-maintained\\nSHA-256 digest bounds the unique index entry while preserving the 4096-character\\nAPI limit. Migration V006 disables existing IOS APNs registrations and cancels their\\nactive push jobs; the client must re-register with an FCM token. Android registrations\\nare preserved. Invalid-token provider responses are conditional on the submitted token\\nrevision, so a delayed response cannot disable a newly registered token.\\n\\nAndroid and iOS mobile apps must obtain Firebase Messaging registration tokens,\\nregister them after sign-in and token refresh, and request OS notification permission.\\nThe generated client exposes the device/settings API; native push SDK integration\\nis a separate mobile prerequisite. For iOS, upload the Apple APNs authentication key\\nto the Firebase project. Notification stores only FCM credentials and sends both\\nplatforms through FCM HTTP v1; Firebase delivers the iOS message through APNs.\\n\\n## Reminder rules\\n\\nDefaults enable each type, with food inactivity 240 minutes, water inactivity\\n120 minutes, weigh time 08:00, and quiet hours `[23:00,08:00)`. Equal quiet start/end\\ndisables the quiet interval. First timezone configuration records a scheduling\\nbaseline; existing historical records never trigger an immediate catch-up burst.\\n\\n- Food: one occurrence per latest-meal cycle; changing the same meal time moves\\n  a pending deadline, and a newer latest meal starts another cycle. With no meals,\\n  one initial cycle starts from scheduling activation. A fully unsent cancelled\\n  occurrence can resume at the corrected deadline with the same delivery IDs;\\n  recorded submission evidence prevents a delivered cycle from being rearmed.\\n- Water: at least two hours since the latest water activity/reminder. Quiet hours\\n  and outages coalesce missed reminders into one current occurrence. A matching\\n  Progress snapshot with consumed water at or above the positive target suppresses\\n  reminders. An unknown target does not suppress generic water reminders.\\n  Queue reservation and actual provider submission have separate timestamps:\\n  delayed delivery moves the next reminder at least two hours forward. Fanout\\n  to other devices of the same occurrence is allowed.\\n- Weigh: once per local date at the selected time, unless an extant measurement\\n  belongs to that date. Previous dates are not caught up.\\n- Calories exceeded: once per local date when consumed calories exceed the known\\n  positive effective target and `unlimitedCalories=false`.\\n- Calories under target: independently once per date from 20:00 when consumed\\n  calories are below 80% of that target. Missing data never means zero.\\n\\nFood/water use elapsed UTC durations; daily schedules and quiet hours use the\\nchosen IANA zone. A DST gap uses the first valid instant after the gap, an overlap\\nuses its first occurrence. Timezone changes recalculate future local deadlines\\nwithout resetting inactivity; daily deduplication does not include timezone.\\nDelivery rechecks current preferences, quiet hours, token ownership/revision,\\ndeletion and relevant projections. Invalidated diary data cancels pending pushes.\\nFully unsent cancelled daily occurrences can resume when a correction makes them\\neligible again on the same local date, reusing their occurrence and delivery IDs.\\nSubmission evidence prevents rearming after provider submission. Daily reminders\\nnever cross into another local date.\\n\\n## Event contracts\\n\\nAll subjects use `cookie.events.<event_type>.v1`. Every message validates its\\nenvelope, expected producer and matching subject before use. Unknown additive\\npayload fields are ignored. Required Identity events retain their existing shape:\\nactivation, deletion request and encrypted email request. Other events require\\npositive monotonic `aggregate_version` and the following full snapshots:\\n\\n| Event | Required Notification data |\\n|---|---|\\n| `user.profile.updated` | `userId`; locale updates affect defaults, not an explicitly chosen locale; settings timezone stays authoritative |\\n| `nutrition.meal.created/updated` | `mealId,userId,eatenAt`; version belongs to the meal |\\n| `nutrition.meal.deleted` | `mealId,userId`; higher-version tombstone |\\n| `nutrition.water.changed` | `userId,localDate,totalMl,lastConsumedAt`; the timestamp is explicitly null for an empty day |\\n| `health.weight.changed` | `measurementId,userId,deleted`; live measurements also contain `measuredAt,valueKg` |\\n| `progress.day.updated` | `userId,localDate,timezone,calories,water`; version belongs to the daily snapshot |\\n\\nProgress `calories` contains `consumed,target,unlimitedCalories`; `water` contains\\n`consumedMl,targetMl`. Each field is present, with explicit null for unknown values.\\nNegative quantities are invalid. Only a snapshot matching Notification's timezone\\nand current local date can drive goal warnings or water-goal suppression. There is\\nno arbitrary freshness timeout on an otherwise valid same-day snapshot. Future\\nProgress integration must provide a matching daily projection; Notification cannot\\nrecalculate another service's timezone-dependent totals itself.\\n\\nStore only minimal allowlisted projection fields, not dishes, health values or\\narbitrary event payloads. Ignore older/equal versions and retain entity tombstones.\\nDeletion serializes with user updates, removes owned data, cancels pending jobs and\\nretains a minimal lifecycle tombstone against late replay. Existing Identity JWTs\\nmay remain valid until expiry; the local tombstone closes Notification access once\\nthe deletion event is received. An already submitted provider request cannot be\\nrecalled.\\n\\n## Reliability and operations\\n\\nInbox uniqueness is `(consumer_name,event_id)`. Ingestion atomically updates the\\ninbox, projections and schedules/jobs, then acknowledges JetStream. Providers and\\nRedis are never called inside that transaction. Metadata-only quarantine is\\noperator-visible, with separately authorized original-message replay; runtime\\ncredentials cannot fetch arbitrary messages from the shared stream.\\n\\nRedis `cookie:notification:reminder_deadlines` stores opaque deadline identifiers\\nand versions. Startup/reconnect and bounded periodic reconciliation rebuild it.\\nA PostgreSQL overdue sweep remains active regardless of Redis health. Workers\\nrecheck authoritative deadlines and occurrence uniqueness before issuing work.\\n\\nSMTP uses mandatory production STARTTLS, certificate/hostname checks, one recipient\\nand a stable Message-ID. Only proven pre-submission failures/negative transient\\nreplies can retry. Ambiguous submission is terminal `UNKNOWN`; replay never resets\\nit. FCM is the sole bounded push adapter for Android and iOS. Its platform-specific\\npayload preserves Android TTL/tag and Apple expiration/collapse ID. FCM honors\\n`Retry-After` as seconds or an HTTP date, with a one-minute minimum for throttling,\\na ten-second minimum for server errors and a one-day maximum.\\nFCM authentication failures pause both platforms. Apple credential failures pause\\nonly iOS, keeping Android delivery available; neither disables the device.\\n`UNREGISTERED` disables only the submitted token revision.\\nOnly retryable provider failures consume the persistent ten-failure budget and\\nadvance exponential backoff. Queue claims, unavailable channels, authentication or\\nkey outages, quiet hours and water-interval deferrals do not consume that budget.\\nProvider acceptance does not prove display or reading. Templates never put diary\\ndetails into push payloads, logs or broker headers.\\n\\nJWE decrypts only in memory, requires the Identity RSA-OAEP-256/A256GCM profile,\\nmatching attempt/expiry metadata, and accepts active/retiring keys by `kid`.\\nTerminal email jobs erase ciphertext. Secret mounts and key rotation procedures\\nare documented in the production runbook. JWKS retrieval uses a configured origin,\\nno redirects/token-controlled key URLs, a five-minute cache and bounded refresh.\\nMissing usable keys gives `503`; invalid credentials give `401`.\\n\\nReadiness requires PostgreSQL, completed migrations, validated configuration,\\nusable Identity signing keys and the mounted Notification decryption key ring.\\nRedis, NATS and provider outages leave readiness available while their durable\\nbacklogs and error metrics expose the degradation.\\n\\nMetrics distinguish ingest failures/quarantine, scheduler lag, Redis errors,\\nprovider outcomes, UNKNOWN SMTP and delivery backlog. Grafana remains the target\\nUI; selecting/deploying telemetry backends is a separate architectural decision.\\nInitial alerts should include `cookie.notification.delivery.unknown > 0`,\\n`cookie.notification.delivery.oldest.age.seconds > 60`, growing failed/attempt\\ncounts and `cookie.notification.delivery.metrics.healthy = 0`; tune the backlog\\nthreshold against actual load and provider rate limits.\\nScheduler backlog/age is exposed as `cookie.notification.scheduler.overdue` and\\n`cookie.notification.scheduler.oldest.age.seconds`; NATS reports `pending`,\\n`unacknowledged` and `healthy` under `cookie.notification.nats`. A zero health\\ngauge makes the associated last known backlog value stale, not an empty queue.\\nThe real Identity flow is integration-tested; future domain producers are covered\\nby contract fixtures until their implementation exists.\\n\",\"infra/terraform/environments/production/main.tf\":\"locals {\\n  labels = {\\n    application = \\\"cookie\\\"\\n    environment = \\\"production\\\"\\n    managed-by  = \\\"terraform\\\"\\n  }\\n\\n  github_owner            = split(\\\"/\\\", var.github_repository)[0]\\n  api_gateway_source_cidr = \\\"198.19.0.0/16\\\"\\n}\\n\\ndata \\\"yandex_compute_image\\\" \\\"ubuntu\\\" {\\n  family = var.ubuntu_image_family\\n}\\n\\nresource \\\"yandex_vpc_network\\\" \\\"production\\\" {\\n  folder_id   = var.folder_id\\n  name        = \\\"${var.name_prefix}-network\\\"\\n  description = \\\"COOKie production network\\\"\\n  labels      = local.labels\\n}\\n\\nresource \\\"yandex_vpc_subnet\\\" \\\"production\\\" {\\n  for_each = var.subnet_cidrs\\n\\n  folder_id      = var.folder_id\\n  name           = \\\"${var.name_prefix}-subnet-${replace(each.key, \\\"ru-central1-\\\", \\\"\\\")}\\\"\\n  description    = \\\"COOKie production subnet in ${each.key}; required by API Gateway connectivity\\\"\\n  zone           = each.key\\n  network_id     = yandex_vpc_network.production.id\\n  v4_cidr_blocks = [each.value]\\n  labels         = local.labels\\n}\\n\\nresource \\\"yandex_vpc_security_group\\\" \\\"production_vm\\\" {\\n  folder_id   = var.folder_id\\n  name        = \\\"${var.name_prefix}-vm-sg\\\"\\n  description = \\\"SSH allowlist plus service ingress from API Gateway only\\\"\\n  network_id  = yandex_vpc_network.production.id\\n  labels      = local.labels\\n\\n  ingress {\\n    description    = \\\"Operator SSH from explicitly trusted addresses\\\"\\n    protocol       = \\\"TCP\\\"\\n    port           = 22\\n    v4_cidr_blocks = var.ssh_allowed_cidrs\\n  }\\n\\n  ingress {\\n    description    = \\\"Identity HTTP from API Gateway VPC integration only\\\"\\n    protocol       = \\\"TCP\\\"\\n    port           = 8080\\n    v4_cidr_blocks = [local.api_gateway_source_cidr]\\n  }\\n\\n  ingress {\\n    description    = \\\"Notification HTTP from API Gateway VPC integration only\\\"\\n    protocol       = \\\"TCP\\\"\\n    port           = 8082\\n    v4_cidr_blocks = [local.api_gateway_source_cidr]\\n  }\\n\\n  egress {\\n    description    = \\\"Outbound updates, Yandex APIs, and Container Registry pulls\\\"\\n    protocol       = \\\"ANY\\\"\\n    v4_cidr_blocks = [\\\"0.0.0.0/0\\\"]\\n  }\\n}\\n\\nresource \\\"yandex_vpc_address\\\" \\\"production_vm\\\" {\\n  folder_id           = var.folder_id\\n  name                = \\\"${var.name_prefix}-vm-ip\\\"\\n  description         = \\\"Stable SSH address for the initial production VM\\\"\\n  deletion_protection = true\\n  labels              = local.labels\\n\\n  external_ipv4_address {\\n    zone_id = var.zone\\n  }\\n}\\n\\nresource \\\"yandex_container_registry\\\" \\\"production\\\" {\\n  folder_id = var.folder_id\\n  name      = \\\"${var.name_prefix}-registry\\\"\\n  labels    = local.labels\\n}\\n\\nresource \\\"yandex_container_repository\\\" \\\"identity\\\" {\\n  name = \\\"${yandex_container_registry.production.id}/identity\\\"\\n}\\n\\nresource \\\"yandex_container_repository\\\" \\\"notification\\\" {\\n  name = \\\"${yandex_container_registry.production.id}/notification\\\"\\n}\\n\\nresource \\\"yandex_iam_service_account\\\" \\\"ci_registry_pusher\\\" {\\n  folder_id   = var.folder_id\\n  name        = \\\"${var.name_prefix}-ci-pusher\\\"\\n  description = \\\"GitHub Actions image publisher scoped to the Identity and Notification repositories\\\"\\n}\\n\\nresource \\\"yandex_iam_service_account\\\" \\\"vm_registry_puller\\\" {\\n  folder_id   = var.folder_id\\n  name        = \\\"${var.name_prefix}-vm-puller\\\"\\n  description = \\\"Production VM image puller scoped to the Identity and Notification repositories\\\"\\n}\\n\\nresource \\\"yandex_container_repository_iam_binding\\\" \\\"ci_identity_pusher\\\" {\\n  repository_id = yandex_c     if(!asArray(parameters).length)return '<p class="response-description">Дополнительные параметры не объявлены.</p>';

    let result=Object.entries(names).filter(([k])=>Object.hasOwn(s,k)).map(([k,name])=>`<span class="constraint">${esc(name)}: ${esc(text(s[k]))}</span>`).join("");

    return result ? `<div>${result}</div>` : "";

  function schemaMarkup(schema,depth=0) {

    } else if(schema.type==="array"||schema.items) html+=`<div class="schema-nesting"><p class="field-type">Элемент массива</p>${schemaMarkup(schema.items,depth+1)}</div>`;

  function schemaExample(s,depth=0,key="") {
    if(!s||depth>8)return "...";
    if(Object.hasOwn(s,"example"))return s.example;
    if(Object.hasOwn(s,"default"))return s.default;
    if(s.enum)return s.enum[0];
    if(s.allOf)return Object.assign({},...s.allOf.map(x=>schemaExample(x,depth+1)));
    if(s.oneOf||s.anyOf)return schemaExample((s.oneOf||s.anyOf)[0],depth+1);
    if(s.type==="object"||s.properties)return Object.fromEntries(Object.entries(s.properties||{}).map(([k,v])=>[k,schemaExample(v,depth+1,k)]));
    if(s.type==="array")return [schemaExample(s.items,depth+1)];

    if(["integer","number"].includes(s.type))return s.minimum??1;

    if(s.format==="date-time")return "2026-10-20T09:00:00Z";

    try { await navigator.clipboard.writeText(value);notify("Скопировано"); }
    catch { const input=document.createElement("textarea");input.value=value;input.style.position="fixed";input.style.left="-9999px";document.body.append(input);input.select();const success=document.execCommand("copy");input.remove();notify(success?"Скопировано":"Выделите и скопируйте пример вручную"); }
  }
  function redrawMap(action,step) {
    const inspectorScroll=document.querySelector(".inspector")?.scrollTop||0;
    const stage=document.querySelector(".map-stage");
    const stageScroll=[stage?.scrollLeft||0,stage?.scrollTop||0];
    renderMap();
    const inspector=document.querySelector(".inspector");if(inspector)inspector.scrollTop=inspectorScroll;
    const newStage=document.querySelector(".map-stage");if(newStage){newStage.scrollLeft=stageScroll[0];newStage.scrollTop=stageScroll[1];}
    const selector=`[data-action="${action}"]${step!=null?`[data-step="${Number(step)}"]`:""}`;
    const control=document.querySelector(selector);
    if(control&&!control.disabled)control.focus({preventScroll:true});
    else document.querySelector('[data-action="prev-step"]:not(:disabled)')?.focus({preventScroll:true});
    if(["step","prev-step","next-step"].includes(action))panToSelectedNode();
  }
  function panToSelectedNode() {
    const stage=document.querySelector(".map-stage"),node=document.querySelector(".diagram-node.selected");
    if(!stage||!node)return;
    const box=node.getBoundingClientRect(),viewport=stage.getBoundingClientRect();
    if(box.top<viewport.top||box.bottom>viewport.bottom)stage.scrollTop+=box.top-viewport.top-40;
    if(box.left<viewport.left||box.right>viewport.right)stage.scrollLeft+=box.left-viewport.left-40;
  }
  document.addEventListener("click",event=>{
    const anchor=event.target.closest('a[href^="#"]');
    if(anchor && anchor.getAttribute("href")===location.hash && state.query){event.preventDefault();readHash();return;}
    const source=event.target.closest("[data-source]");if(source){showSource(source.dataset.source,source.dataset.line);return;}
    const el=event.target.closest("[data-action]");if(!el)return;
    switch(el.dataset.action){
      case "about":about();break;
      case "close-dialog":$("source-dialog").close();break;
      case "filter":go(state.view,state.view==="map"?el.dataset.service:"",{service:state.service===el.dataset.service?"":el.dataset.service});break;
      case "catalog-filter":filterFocus=`[data-action="catalog-filter"][data-service="${CSS.escape(el.dataset.service)}"]`;go(state.view,"",{service:el.dataset.service,direction:el.dataset.service?state.direction:""});break;
      case "event-direction":filterFocus=`[data-action="event-direction"][data-direction="${CSS.escape(el.dataset.direction)}"]`;go("events","",{direction:el.dataset.direction==="all"?"":el.dataset.direction});break;
      case "fact-filter":state.service=el.dataset.service;go("facts","",{service:state.service});break;
      case "reset-filter":go(state.view,"",{service:""});break;
      case "node":go("map",el.dataset.node);break;
      case "edge":go("map","edge:"+el.dataset.edge);break;
      case "clear-flow":go("map");break;
      case "step":state.step=Number(el.dataset.step);redrawMap("step",state.step);break;
      case "next-step":state.step++;redrawMap("next-step");break;
      case "prev-step":state.step=Math.max(0,state.step-1);redrawMap("prev-step");break;
      case "zoom-in":state.zoom=Math.min(2.5,state.zoom+.25);redrawMap("zoom-in");break;
      case "zoom-out":state.zoom=Math.max(.75,state.zoom-.25);redrawMap("zoom-out");break;
      case "fit":state.zoom=1;redrawMap("fit");break;
      case "response":state.response=el.dataset.response;{const ops=D.operations.filter(o=>matchesService(o.service));const op=ops.find(o=>o.id===state.item)||ops[0];if(op){$("response-body").innerHTML=responseMarkup(op.responses[state.response]);document.querySelectorAll(".response-tab").forEach(b=>{b.classList.toggle("active",b.dataset.response===state.response);b.setAttribute("aria-selected",String(b.dataset.response===state.response));});}}break;
      case "copy-curl":{const op=D.operations.find(o=>o.id===el.dataset.operation);if(op)copy(curlExample(op));}break;
    }
  });
  document.addEventListener("keydown",event=>{
    if((event.key==="Enter"||event.key===" ")&&event.target.matches("g[role=button]")){event.preventDefault();event.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}
    if(event.key==="/"&&!event.ctrlKey&&!event.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("source-dialog").open){event.preventDefault();$("search").focus();}
    if(event.key==="Escape"&&state.query&&!$("source-dialog").open){state.query="";$("search").value="";render();}
  });
  $("source-dialog").addEventListener("click",event=>{if(event.target===$("source-dialog"))$("source-dialog").close();});
  $("search").addEventListener("input",event=>{state.query=event.target.value.trim();render();});
  $("show-planned").addEventListener("change",event=>{const item=!event.target.checked&&state.view==="events"&&D.events.find(e=>e.type===state.item)?.status!=="implemented"?"":state.item;go(state.view,item,{plan:event.target.checked?"1":"",flow:state.flow,service:!event.target.checked&&serviceById.get(state.service)?.status==="planned"?"":state.service});});
  window.addEventListener("hashchange",readHash);
  readHash();
})();

</script>
</body>
</html>
