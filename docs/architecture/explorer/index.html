strationBean<BoundedRequestBodyFilter> =\\n        FilterRegistrationBean(BoundedRequestBodyFilter(MAX_REQUEST_BODY_BYTES)).apply {\\n            order = Int.MIN_VALUE + 1\\n        }\\n\\n    private companion object {\\n        const val MAX_REQUEST_BODY_BYTES = 16 * 1_024\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/config/SpringTransactionRunner.kt\":\"package com.cookie.identity.config\\n\\nimport com.cookie.identity.application.ports.TransactionRunner\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Component\\nimport org.springframework.transaction.PlatformTransactionManager\\nimport org.springframework.transaction.support.TransactionTemplate\\n\\n@Component\\nclass SpringTransactionRunner(\\n    transactionManager: PlatformTransactionManager,\\n    private val jdbc: JdbcTemplate,\\n    private val properties: IdentityDatabaseProperties,\\n) : TransactionRunner {\\n    private val template = TransactionTemplate(transactionManager).apply {\\n        timeout = properties.transactionTimeoutSeconds\\n    }\\n\\n    override fun <T : Any> required(block: () -> T): T =\\n        requireNotNull(template.execute { configureDatabaseTimeouts(); block() }) { \\\"Transaction returned null\\\" }\\n\\n    override fun requiredUnit(block: () -> Unit) {\\n        template.executeWithoutResult { configureDatabaseTimeouts(); block() }\\n    }\\n\\n    private fun configureDatabaseTimeouts() {\\n        jdbc.queryForObject(\\n            \\\"SELECT set_config('lock_timeout', ?, true)\\\",\\n            String::class.java,\\n            \\\"${properties.lockTimeoutMilliseconds}ms\\\",\\n        )\\n        jdbc.queryForObject(\\n            \\\"SELECT set_config('statement_timeout', ?, true)\\\",\\n            String::class.java,\\n            \\\"${properties.statementTimeoutMilliseconds}ms\\\",\\n        )\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/NatsJetStreamConnection.kt\":\"package com.cookie.identity.messaging\\n\\nimport com.cookie.identity.config.IdentityProperties\\nimport io.nats.client.Connection\\nimport io.nats.client.JetStream\\nimport io.nats.client.Nats\\nimport io.nats.client.Options\\nimport io.nats.client.api.RetentionPolicy\\nimport io.nats.client.api.StorageType\\nimport io.nats.client.api.StreamConfiguration\\nimport jakarta.annotation.PreDestroy\\nimport org.springframework.core.env.Environment\\nimport org.springframework.core.env.Profiles\\nimport org.springframework.stereotype.Component\\nimport java.nio.file.Files\\nimport java.nio.file.Path\\nimport java.security.KeyStore\\nimport java.time.Duration\\n\\n@Component\\nclass NatsJetStreamConnection(\\n    private val properties: IdentityProperties,\\n    environment: Environment,\\n) {\\n    private val localProvisioning = environment.acceptsProfiles(Profiles.of(\\\"dev\\\", \\\"test\\\"))\\n    private val connectionMonitor = Any()\\n\\n    init {\\n        if (!localProvisioning) {\\n            require(properties.natsUrl.startsWith(\\\"tls://\\\")) {\\n                \\\"Production NATS URL must use TLS\\\"\\n            }\\n            require(properties.natsCredentialsPath.isNotBlank()) {\\n                \\\"Production NATS credentials are required\\\"\\n            }\\n            val credentials = runCatching { Path.of(properties.natsCredentialsPath) }\\n                .getOrElse { throw IllegalArgumentException(\\\"Production NATS credentials path is invalid\\\", it) }\\n            require(Files.isRegularFile(credentials) && Files.isReadable(credentials)) {\\n                \\\"Production NATS credentials must point to a readable file\\\"\\n            }\\n            val truststore = runCatching { Path.of(properties.natsTruststorePath) }\\n                .getOrElse { throw IllegalArgumentException(\\\"Production NATS truststore path is invalid\\\", it) }\\n            require(Files.isRegularFile(truststore) && Files.isReadable(truststore)) {\\n                \\\"Production NATS truststore must point to a readable file\\\"\\n            }\\n            require(properties.natsTruststorePassword.isNotBlank()) {\\n                \\\"Production NATS truststore password is required\\\"\\n            }\\n            validateTruststore(truststore, properties.natsTruststorePassword)\\n        }\\n    }\\n\\n    @Volatile\\n    private var connection: Connection? = null\\n\\n    fun jetStream(): JetStream {\\n        connection?.let { current ->\\n            if (current.status == Connection.Status.CONNECTED) return current.jetStream()\\n        }\\n\\n        return synchronized(connectionMonitor) {\\n            connection?.let { current ->\\n                when (existingConnectionAction(current.status)) {\\n                    ExistingConnectionAction.USE -> return@synchronized current.jetStream()\\n                    ExistingConnectionAction.AWAIT_RECOVERY -> throw NatsConnectionRecoveringException(current.status)\\n                    ExistingConnectionAction.REPLACE -> connection = null\\n                }\\n            }\\n\\n            val connected = try {\\n                Nats.connect(connectionOptions())\\n            } catch (interrupted: InterruptedException) {\\n                Thread.currentThread().interrupt()\\n                throw interrupted\\n            }\\n            try {\\n                if (localProvisioning) ensureDevelopmentStream(connected)\\n                val jetStream = connected.jetStream()\\n                connection = connected\\n                jetStream\\n            } catch (interrupted: InterruptedException) {\\n                connected.runCatching { close() }\\n                Thread.currentThread().interrupt()\\n                throw interrupted\\n            } catch (exception: Exception) {\\n                connected.runCatching { close() }\\n                throw exception\\n            }\\n        }\\n    }\\n\\n    @PreDestroy\\n    fun close() {\\n        synchronized(connectionMonitor) {\\n            connection?.runCatching { close() }\\n            connection = null\\n        }\\n    }\\n\\n    internal fun connectionOptions(): Options = Options.Builder()\\n        .server(properties.natsUrl)\\n        .connectionName(\\\"cookie-identity\\\")\\n        .connectionTimeout(Duration.ofSeconds(2))\\n        .reconnectWait(Duration.ofSeconds(1))\\n        .maxReconnects(-1)\\n        .inboxPrefix(INBOX_PREFIX)\\n        .apply {\\n            if (properties.natsCredentialsPath.isNotBlank()) {\\n                credentialPath(properties.natsCredentialsPath)\\n            }\\n            if (!localProvisioning) {\\n                truststorePath(properties.natsTruststorePath)\\n                truststorePassword(properties.natsTruststorePassword.toCharArray())\\n                // Resolve inside SocketDataPort so TLS verifies the broker URI's DNS name, not an IP.\\n                hostnameResolveMode(Options.HostnameResolveMode.HappyEyeballs)\\n                dataPortType(HostnameVerifyingSocketDataPort::class.java.name)\\n            }\\n        }\\n        .build()\\n\\n    private fun validateTruststore(path: Path, password: String) {\\n        val passwordChars = password.toCharArray()\\n        try {\\n            val truststore = KeyStore.getInstance(\\\"JKS\\\")\\n            Files.newInputStream(path).use { input -> truststore.load(input, passwordChars) }\\n            val aliases = truststore.aliases()\\n            var hasCertificate = false\\n            while (aliases.hasMoreElements()) {\\n                if (truststore.getCertificate(aliases.nextElement()) != null) {\\n                    hasCertificate = true\\n                    break\\n                }\\n            }\\n            require(hasCertificate) { \\\"Production NATS truststore must contain a trusted certificate\\\" }\\n        } catch (exception: Exception) {\\n            if (exception is IllegalArgumentException) throw exception\\n            throw IllegalArgumentException(\\\"Production NATS truststore could not be loaded\\\", exception)\\n        } finally {\\n            passwordChars.fill('\\\\u0000')\\n        }\\n    }\\n\\n    private fun ensureDevelopmentStream(connected: Connection) {\\n        val management = connected.jetStreamManagement()\\n        val exists = runCatching { management.getStreamInfo(STREAM_NAME) }.isSuccess\\n        if (!exists) {\\n            runCatching {\\n                management.addStream(\\n                    StreamConfiguration.builder()\\n                        .name(STREAM_NAME)\\n                        .description(\\\"COOKie domain events\\\")\\n                        .subjects(\\\"cookie.events.>\\\")\\n                        .retentionPolicy(RetentionPolicy.Limits)\\n                        .storageType(StorageType.File)\\n                        .maxAge(Duration.ofDays(7))\\n                        .maxBytes(1_073_741_824)\\n                        .maxMessages(1_000_000)\\n                        .maximumMessageSize(1_048_576)\\n                        .replicas(1)\\n                        .duplicateWindow(Duration.ofMinutes(10))\\n                        .build(),\\n                )\\n            }.getOrElse {\\n                management.getStreamInfo(STREAM_NAME)\\n            }\\n        }\\n    }\\n\\n    companion object {\\n        const val STREAM_NAME = \\\"COOKIE_EVENTS\\\"\\n        const val INBOX_PREFIX = \\\"_INBOX.cookie.identity\\\"\\n\\n        internal fun existingConnectionAction(status: Connection.Status): ExistingConnectionAction = when (status) {\\n            Connection.Status.CONNECTED -> ExistingConnectionAction.USE\\n            Connection.Status.CLOSED -> ExistingConnectionAction.REPLACE\\n            Connection.Status.CONNECTING,\\n            Connection.Status.RECONNECTING,\\n            Connection.Status.DISCONNECTED,\\n            -> ExistingConnectionAction.AWAIT_RECOVERY\\n        }\\n    }\\n}\\n\\ninternal enum class ExistingConnectionAction {\\n    USE,\\n    AWAIT_RECOVERY,\\n    REPLACE,\\n}\\n\\nprivate class NatsConnectionRecoveringException(status: Connection.Status) :\\n    IllegalStateException(\\\"NATS connection is recovering (status=$status)\\\")\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxIdentityEventRecorder.kt\":\"package com.cookie.identity.messaging\\n\\nimport com.cookie.identity.application.ports.IdGenerator\\nimport com.cookie.identity.application.ports.IdentityEventRecorder\\nimport com.cookie.identity.domain.LocaleTag\\nimport com.cookie.identity.domain.AccountActivated\\nimport com.cookie.identity.domain.AccountDeletionRequested\\nimport com.cookie.identity.domain.CanonicalEmail\\nimport com.cookie.identity.persistence.JdbcOutboxRepository\\nimport com.cookie.identity.security.NotificationPayloadEncryptor\\nimport com.cookie.identity.security.VerificationDelivery\\nimport com.cookie.platform.web.RequestIdFilter\\nimport org.slf4j.MDC\\nimport org.springframework.stereotype.Component\\nimport tools.jackson.databind.ObjectMapper\\nimport java.time.Instant\\nimport java.util.UUID\\n\\n@Component\\nclass OutboxIdentityEventRecorder(\\n    private val outbox: JdbcOutboxRepository,\\n    private val encryptor: NotificationPayloadEncryptor,\\n    private val objectMapper: ObjectMapper,\\n    private val ids: IdGenerator,\\n) : IdentityEventRecorder {\\n    override fun verificationRequested(\\n        registrationAttemptId: UUID,\\n        email: CanonicalEmail,\\n        locale: LocaleTag?,\\n        rawToken: String,\\n        expiresAt: Instant,\\n        now: Instant,\\n    ) {\\n        val encryptedPayload = encryptor.encrypt(\\n            VerificationDelivery(registrationAttemptId, email.value, locale, rawToken, expiresAt),\\n        )\\n        val payload = objectMapper.createObjectNode()\\n            .put(\\\"template\\\", \\\"EMAIL_VERIFICATION\\\")\\n            .put(\\\"encryptedPayload\\\", encryptedPayload)\\n            .put(\\\"expiresAt\\\", expiresAt.toString())\\n        outbox.insert(\\n            eventId = ids.next(),\\n            eventType = \\\"notification.email.requested\\\",\\n            eventVersion = 1,\\n            aggregateType = \\\"registration_attempt\\\",\\n            aggregateId = registrationAttemptId.toString(),\\n            payloadJson = objectMapper.writeValueAsString(payload),\\n            occurredAt = now,\\n            correlationId = correlationId(),\\n            causationId = null,\\n            traceId = traceId(),\\n        )\\n    }\\n\\n    override fun accountActivated(event: AccountActivated) {\\n        val metadata = objectMapper.createObjectNode()\\n            .put(\\\"registeredWith\\\", \\\"email\\\")\\n            .put(\\\"createdAt\\\", event.registeredAt.toString())\\n        val payload = objectMapper.createObjectNode()\\n            .put(\\\"userId\\\", event.accountId.toString())\\n            .set(\\\"accountMetadata\\\", metadata)\\n        outbox.insert(\\n            eventId = ids.next(),\\n            eventType = \\\"account.activated\\\",\\n            eventVersion = 1,\\n            aggregateType = \\\"account\\\",\\n            aggregateId = event.accountId.toString(),\\n            payloadJson = objectMapper.writeValueAsString(payload),\\n            occurredAt = event.activatedAt,\\n            correlationId = correlationId(),\\n            causationId = null,\\n            traceId = traceId(),\\n        )\\n    }\\n\\n    override fun accountDeletionRequested(event: AccountDeletionRequested) {\\n        val payload = objectMapper.createObjectNode()\\n            .put(\\\"accountId\\\", event.accountId.toString())\\n            .put(\\\"deletionRequestId\\\", event.deletionRequestId.toString())\\n            .put(\\\"requestedAt\\\", event.requestedAt.toString())\\n        outbox.insert(\\n            eventId = ids.next(),\\n            eventType = \\\"account.deletion.requested\\\",\\n            eventVersion = 1,\\n            aggregateType = \\\"account\\\",\\n            aggregateId = event.accountId.toString(),\\n            payloadJson = objectMapper.writeValueAsString(payload),\\n            occurredAt = event.requestedAt,\\n            correlationId = correlationId(),\\n            causationId = null,\\n            traceId = traceId(),\\n        )\\n    }\\n\\n    private fun correlationId(): UUID? = MDC.get(RequestIdFilter.REQUEST_ID_MDC)\\n        ?.let { runCatching { UUID.fromString(it) }.getOrNull() }\\n\\n    private fun traceId(): String? = MDC.get(TRACE_ID_MDC)?.take(MAX_TRACE_ID_LENGTH)\\n\\n    private companion object {\\n        const val TRACE_ID_MDC = \\\"traceId\\\"\\n        const val MAX_TRACE_ID_LENGTH = 128\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/messaging/OutboxPublisher.kt\":\"package com.cookie.identity.messaging\\n\\nimport com.cookie.identity.persistence.JdbcOutboxRepository\\nimport com.cookie.identity.persistence.OutboxRecord\\nimport com.cookie.platform.messaging.EventEnvelope\\nimport com.cookie.platform.messaging.subject\\nimport io.nats.client.impl.Headers\\nimport org.slf4j.LoggerFactory\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport org.springframework.stereotype.Component\\nimport tools.jackson.databind.ObjectMapper\\nimport java.nio.charset.StandardCharsets\\nimport java.security.SecureRandom\\nimport java.time.Duration\\nimport java.util.UUID\\nimport java.util.concurrent.TimeUnit\\nimport kotlin.math.min\\n\\n@Component\\nclass OutboxPublisher(\\n    private val repository: JdbcOutboxRepository,\\n    private val nats: NatsJetStreamConnection,\\n    private val objectMapper: ObjectMapper,\\n    private val random: SecureRandom,\\n    private val metrics: OutboxMetrics,\\n) {\\n    @Scheduled(fixedDelayString = \\\"\\\\${cookie.identity.outbox-poll-delay:500}\\\")\\n    fun publishAvailable() {\\n        val claimed = repository.claim(BATCH_SIZE, LEASE, UUID.randomUUID())\\n        publishBatch(claimed)\\n    }\\n\\n    private fun publishBatch(records: List<OutboxRecord>) {\\n        if (records.isEmpty()) return\\n        records.forEach { metrics.recordPublishAttempt(it.eventType) }\\n        val jetStream = try {\\n            nats.jetStream()\\n        } catch (interrupted: InterruptedException) {\\n            try {\\n                records.forEach { record -> release(record, interrupted) }\\n            } finally {\\n                Thread.currentThread().interrupt()\\n            }\\n            return\\n        } catch (exception: Exception) {\\n            records.forEach { record -> release(record, exception) }\\n            return\\n        }\\n        val pending = records.mapNotNull { record ->\\n            try {\\n                val payloadNode = objectMapper.readTree(record.payload)\\n                val envelope = EventEnvelope(\\n                    eventId = record.eventId,\\n                    eventType = record.eventType,\\n                    eventVersion = record.eventVersion,\\n                    occurredAt = record.occurredAt,\\n                    producer = \\\"identity\\\",\\n                    aggregateType = record.aggregateType,\\n                    aggregateId = record.aggregateId,\\n                    payload = payloadNode,\\n                    correlationId = record.correlationId,\\n                    causationId = record.causationId,\\n                    traceId = record.traceId,\\n                )\\n                val headers = Headers().add(\\\"Nats-Msg-Id\\\", record.eventId.toString())\\n                val subject = envelope.subject()\\n                val body = objectMapper.writeValueAsString(envelope).toByteArray(StandardCharsets.UTF_8)\\n                record to jetStream.publishAsync(subject, headers, body)\\n            } catch (exception: Exception) {\\n                release(record, exception)\\n                null\\n            }\\n        }\\n        val acknowledgementDeadline = System.nanoTime() + ACK_TIMEOUT.toNanos()\\n        pending.forEachIndexed { index, (record, acknowledgement) ->\\n            try {\\n                val remainingNanos = (acknowledgementDeadline - System.nanoTime()).coerceAtLeast(0)\\n                acknowledgement.get(remainingNanos, TimeUnit.NANOSECONDS)\\n                if (!repository.markPublished(record.eventId, record.claimId)) {\\n                    metrics.recordStaleCompletion(record.eventType)\\n                    logger.info(\\\"Ignored stale outbox acknowledgement eventId={}\\\", record.eventId)\\n                } else {\\n                    metrics.recordPublishSuccess(record.eventType)\\n                }\\n            } catch (interrupted: InterruptedException) {\\n                try {\\n                    pending.subList(index, pending.size).forEach { (unresolved, _) ->\\n                        release(unresolved, interrupted)\\n                    }\\n                } finally {\\n                    Thread.currentThread().interrupt()\\n                }\\n                return\\n            } catch (exception: Exception) {\\n                release(record, exception)\\n            }\\n        }\\n    }\\n\\n    private fun release(record: OutboxRecord, exception: Exception) {\\n        metrics.recordPublishFailure(record.eventType)\\n        val retryAt = repository.release(\\n            record.eventId,\\n            record.claimId,\\n            outboxRetryBackoff(record.attemptCount) { bound -> random.nextLong(bound) },\\n            exception.message ?: exception.javaClass.simpleName,\\n        )\\n        if (retryAt == null) {\\n            logger.info(\\\"Ignored stale outbox release eventId={}\\\", record.eventId)\\n            return\\n        }\\n        logger.warn(\\n            \\\"Outbox publish failed eventId={} attempt={} retryAt={}\\\",\\n            record.eventId,\\n            record.attemptCount,\\n            retryAt,\\n        )\\n    }\\n\\n    companion object {\\n        private val LEASE: Duration = Duration.ofSeconds(30)\\n        private val ACK_TIMEOUT: Duration = Duration.ofSeconds(10)\\n        private const val BATCH_SIZE = 100\\n        private val logger = LoggerFactory.getLogger(OutboxPublisher::class.java)\\n    }\\n}\\n\\ninternal fun outboxRetryBackoff(attempt: Int, nextLong: (Long) -> Long): Duration {\\n    val exponent = min((attempt - 1).coerceAtLeast(0), MAX_BACKOFF_EXPONENT)\\n    val exponentialMillis = min(MAX_BACKOFF_MILLIS, MIN_BACKOFF_MILLIS shl exponent)\\n    if (exponentialMillis == MIN_BACKOFF_MILLIS) return Duration.ofMillis(MIN_BACKOFF_MILLIS)\\n\\n    // Equal jitter avoids synchronized retries while retaining an exponential lower bound.\\n    val lowerBoundMillis = exponentialMillis / 2\\n    val randomRange = exponentialMillis - lowerBoundMillis\\n    val jitterMillis = nextLong(randomRange + 1)\\n    require(jitterMillis in 0..randomRange) { \\\"Random jitter must be within the requested bound\\\" }\\n    return Duration.ofMillis(lowerBoundMillis + jitterMillis)\\n}\\n\\nprivate const val MIN_BACKOFF_MILLIS = 1_000L\\nprivate const val MAX_BACKOFF_MILLIS = 300_000L\\nprivate const val MAX_BACKOFF_EXPONENT = 9\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/persistence/JdbcMaintenanceRepository.kt\":\"package com.cookie.identity.persistence\\n\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Repository\\nimport java.time.Instant\\n\\n@Repository\\nclass JdbcMaintenanceRepository(\\n    private val jdbc: JdbcTemplate,\\n) {\\n    fun deleteExpiredRateLimitBuckets(expiredBefore: Instant, batchSize: Int): Int = deleteBatch(\\n        batchSize,\\n        \\\"\\\"\\\"\\n        WITH expired AS (\\n            SELECT scope_key\\n            FROM rate_limit_buckets\\n            WHERE expires_at < ?\\n            ORDER BY expires_at, scope_key\\n            FOR UPDATE SKIP LOCKED\\n            LIMIT ?\\n        )\\n        DELETE FROM rate_limit_buckets b\\n        USING expired e\\n        WHERE b.scope_key = e.scope_key\\n        \\\"\\\"\\\".trimIndent(),\\n        expiredBefore,\\n    )\\n\\n    /**\\n     * Scrubs expired active attempts without deleting their idempotency keys.\\n     *\\n     * The row lock makes expiry race safely with confirmation/resend. Child token\\n     * verifier hashes are intentionally retained with the bounded tombstone.\\n     */\\n    fun abandonExpiredRegistrationAttempts(now: Instant, batchSize: Int): Int {\\n        require(batchSize > 0) { \\\"Maintenance batch size must be positive\\\" }\\n        return jdbc.update(\\n            \\\"\\\"\\\"\\n            WITH expired AS (\\n                SELECT id\\n                FROM registration_attempts\\n                WHERE completed_at IS NULL\\n                  AND abandoned_at IS NULL\\n                  AND expires_at <= ?\\n                ORDER BY expires_at, id\\n                FOR UPDATE SKIP LOCKED\\n                LIMIT ?\\n            )\\n            UPDATE registration_attempts a\\n            SET locale = NULL,\\n                pending_password_hash = NULL,\\n                abandoned_at = ?\\n            FROM expired e\\n            WHERE a.id = e.id\\n              AND a.completed_at IS NULL\\n              AND a.abandoned_at IS NULL\\n            \\\"\\\"\\\".trimIndent(),\\n            now.asJdbcTimestamp(),\\n            batchSize,\\n            now.asJdbcTimestamp(),\\n        )\\n    }\\n\\n    /** Deletes only bounded terminal evidence; active rows are never removed here. */\\n    fun deleteRegistrationAttemptTombstones(\\n        abandonedBefore: Instant,\\n        completedBefore: Instant,\\n        batchSize: Int,\\n    ): Int {\\n        require(batchSize > 0) { \\\"Maintenance batch size must be positive\\\" }\\n        return jdbc.update(\\n            \\\"\\\"\\\"\\n            WITH removable AS (\\n                SELEC okie.identity.persistence\\n\\nimport com.cookie.identity.application.RateLimitWindow\\nimport com.cookie.identity.application.ports.RateLimitRepository\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.stereotype.Repository\\nimport java.time.Duration\\n\\n@Repository\\nclass JdbcRateLimitRepository(\\n    private val jdbc: JdbcTemplate,\\n) : RateLimitRepository {\\n    override fun consume(scopeKey: String, window: Duration): RateLimitWindow {\\n        require(scopeKey.isNotBlank() && scopeKey.length <= 255) { \\\"Invalid rate-limit scope key\\\" }\\n        require(!window.isZero && !window.isNegative) { \\\"Rate-limit window must be positive\\\" }\\n        val windowMillis = window.toMillis().also { require(it > 0) { \\\"Rate-limit window is too small\\\" } }\\n\\n        return requireNotNull(\\n            jdbc.query(\\n                \\\"\\\"\\\"\\n                INSERT INTO rate_limit_buckets(scope_key, window_started_at, attempt_count, expires_at)\\n                VALUES (?, statement_timestamp(), 1, statement_timestamp() + (? * interval '1 millisecond'))\\n                ON CONFLICT (scope_key) DO UPDATE SET\\n                    window_started_at = CASE\\n                        WHEN rate_limit_buckets.expires_at <= statement_timestamp() THEN statement_timestamp()\\n                        ELSE rate_limit_buckets.window_started_at\\n                    END,\\n                    attempt_count = CASE\\n                        WHEN rate_limit_buckets.expires_at <= statement_timestamp() THEN 1\\n                        ELSE rate_limit_buckets.attempt_count + 1\\n                    END,\\n                    expires_at = CASE\\n                        WHEN rate_limit_buckets.expires_at <= statement_timestamp()\\n                            THEN statement_timestamp() + (? * interval '1 millisecond')\\n                        ELSE rate_limit_buckets.expires_at\\n                    END\\n                RETURNING attempt_c ailBytes = email.value.toByteArray(StandardCharsets.US_ASCII)\\n        val passwordBytes = password.value.toByteArray(StandardCharsets.UTF_8)\\n        val localeBytes = locale?.value?.toByteArray(StandardCharsets.US_ASCII) ?: ByteArray(0)\\n        val mac = Mac.getInstance(HMAC_SHA_256)\\n        return try {\\n            mac.init(SecretKeySpec(proofBytes, HMAC_SHA_256))\\n            mac.update(REGISTRATION_FINGERPRINT_CONTEXT)\\n            mac.updateUuid(attemptId)\\n            mac.updateField(emailBytes)\\n            mac.updateField(passwordBytes)\\n            mac.updateField(localeBytes)\\n            VerifierHash.fromSha256Hex(HexFormat.of().formatHex(mac.doFinal()))\\n        } finally {\\n            proofBytes.fill(0)\\n            emailBytes.fill(0)\\n            passwordBytes.fill(0)\\n            localeBytes.fill(0)\\n        }\\n    }\\n\\n    private fun decode(value: String): DecodedToken {\\n        if (value.length != TOKEN_LENGTH) throw InvalidTokenException()\\n        val parts = value.split('.', limit = TOKEN_PARTS)\\n        if (parts.size != TOKEN_PARTS || parts[0] != TOKEN_VERSION || parts[2].length != ENCODED_SECRET_LENGTH) {\\n            throw InvalidTokenException()\\n        }\\n        val id = parseUuid(parts[1])\\n        val secretBytes = decodeSecret(parts[2])\\n        return DecodedToken(id, parts[2], secretBytes)\\n    }\\n\\n    private fun parseUuid(value: String): UUID {\\n        if (value.length != UUID_TEXT_LENGTH) throw InvalidTokenException()\\n        val parsed = try {\\n            UUID.fromString(value)\\n        } catch (_: IllegalArgumentException) {\\n            throw InvalidTokenException()\\n        }\\n        if (parsed.toString() != value) throw InvalidTokenException()\\n        return parsed\\n    }\\n\\n    private fun decodeSecret(encodedSecret: String): ByteArray = try {\\n        Base64.getUrlDecoder().decode(encodedSecret).also {\\n            if (it.size != SECRET_BYTES || Base64.getUrlEncoder().withoutPadding().encodeToString(it) != encodedSecret) {\\n                throw InvalidTokenException()\\n            }\\n        }\\n    } catch (_: IllegalArgumentException) {\\n        throw InvalidTokenException()\\n    }\\n\\n    override fun verifierMatches(expected: VerifierHash, actual: VerifierHash): Boolean =\\n        MessageDigest.isEqual(\\n            expected.value.toByteArray(StandardCharsets.US_ASCII),\\n            actual.value.toByteArray(StandardCharsets.US_ASCII),\\n        )\\n\\n    private fun hash(secret: String): VerifierHash =\\n        VerifierHash.fromSha256Hex(\\n            HexFormat.of().formatHex(\\n                MessageDigest.getInstance(\\\"SHA-256\\\").digest(secret.toByteArray(StandardCharsets.US_ASCII)),\\n            ),\\n        )\\n\\n    private fun token(id: UUID, secretBytes: ByteArray): GeneratedSecretToken {\\n        check(secretBytes.size == SECRET_BYTES) { \\\"Opaque token secret must contain 256 bits\\\" }\\n        val secret = Base64.getUrlEncoder().withoutPadding().encodeToString(secretBytes)\\n        return GeneratedSecretToken(id, \\\"$TOKEN_VERSION.$id.$secret\\\", hash(secret))\\n    }\\n\\n    private fun ByteBuffer.putUuid(value: UUID): ByteBuffer =\\n        putLong(value.mostSignificantBits).putLong(value.leastSignificantBits)\\n\\n    private fun Mac.updateUuid(value: UUID) {\\n        val bytes = ByteBuffer.allocate(UUID_BYTES).putUuid(value).array()\\n        try {\\n            update(bytes)\\n        } finally {\\n            bytes.fill(0)\\n        }\\n    }\\n\\n    private fun Mac.updateField(value: ByteArray) {\\n        val length = ByteBuffer.allocate(Int.SIZE_BYTES).putInt(value.size).array()\\n        try {\\n            update(length)\\n            update(value)\\n        } finally {\\n            length.fill(0)\\n        }\\n    }\\n\\n    private class DecodedToken(\\n        val id: UUID,\\n        val encodedSecret: String,\\n        val secretBytes: ByteArray,\\n    )\\n\\n    companion object {\\n        private val SUCCESSOR_CONTEXT = \\\"cookie.identity.refresh.successor.v1\\\\u0000\\\"\\n            .toByteArray(StandardCharsets.US_ASCII)\\n        private val REGISTRATION_FINGERPRINT_CONTEXT = \\\"cookie.identity.registration.request.v1\\\\u0000\\\"\\n            .toByteArray(StandardCharsets.US_ASCII)\\n        private const val HMAC_SHA_256 = \\\"HmacSHA256\\\"\\n        private const val EMAIL_TOKEN_VERSION = \\\"v1e\\\"\\n        private const val EMAIL_TOKEN_PARTS = 4\\n        private const val EMAIL_TOKEN_LENGTH = 121\\n        private const val TOKEN_VERSION = \\\"v1\\\"\\n        private const val TOKEN_PARTS = 3\\n        private const val SECRET_BYTES = 32\\n        private const val ENCODED_SECRET_LENGTH = 43\\n        private const val TOKEN_LENGTH = 83\\n        private const val UUID_BYTES = 16\\n        private const val UUID_TEXT_LENGTH = 36\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/AuthController.kt\":\"package com.cookie.identity.transport\\n\\nimport com.cookie.identity.application.AccountDeletionCommand\\nimport com.cookie.identity.application.InvalidAccessTokenException\\nimport com.cookie.identity.application.InvalidRequestException\\nimport com.cookie.identity.application.IssuedTokens\\nimport com.cookie.identity.application.PublicJwk\\nimport com.cookie.identity.application.ports.ConfirmEmailUseCase\\nimport com.cookie.identity.application.ports.GetIdentityJwksUseCase\\nimport com.cookie.identity.application.ports.LoginWithEmailUseCase\\nimport com.cookie.identity.application.ports.LogoutUseCase\\nimport com.cookie.identity.application.ports.RefreshSessionUseCase\\nimport com.cookie.identity.application.ports.RegisterWithEmailUseCase\\nimport com.cookie.identity.application.ports.RequestAccountDeletionUseCase\\nimport com.cookie.identity.application.ports.ResendEmailVerificationUseCase\\nimport com.cookie.identity.generated.api.AuthApi\\nimport com.cookie.identity.generated.model.AccountDeletionRequest\\nimport com.cookie.identity.generated.model.AccountDeletionRequestAccepted\\nimport com.cookie.identity.generated.model.AuthenticatedUser\\nimport com.cookie.identity.generated.model.EmailActionRequest\\nimport com.cookie.identity.generated.model.EmailLoginRequest\\nimport com.cookie.identity.generated.model.EmailRegistrationRequest\\nimport com.cookie.identity.generated.model.EmailVerificationConfirmRequest\\nimport com.cookie.identity.generated.model.JsonWebKeySet\\nimport com.cookie.identity.generated.model.RefreshTokenRequest\\nimport com.cookie.identity.generated.model.TokenPair\\nimport com.cookie.identity.generated.model.TokenPairWithUser\\nimport jakarta.servlet.http.HttpServletRequest\\nimport org.springframework.http.CacheControl\\nimport org.springframework.http.HttpHeaders\\nimport org.springframework.http.ResponseEntity\\nimport org.springframework.stereotype.Controller\\nimport java.time.Duration\\nimport java.time.ZoneOffset\\nimport java.util.UUID\\n\\n@Controller\\nclass AuthController(\\n    private val registerWithEmail: RegisterWithEmailUseCase,\\n    private val resendEmailVerification: ResendEmailVerificationUseCase,\\n    private val confirmEmail: ConfirmEmailUseCase,\\n    private val loginWithEmail: LoginWithEmailUseCase,\\n    private val refreshSession: RefreshSessionUseCase,\\n    private val logout: LogoutUseCase,\\n    private val requestAccountDeletion: RequestAccountDeletionUseCase,\\n    private val getIdentityJwks: GetIdentityJwksUseCase,\\n    private val request: HttpServletRequest,\\n    private val clientIpResolver: ClientIpResolver,\\n) : AuthApi {\\n    override fun registerWithEmail(emailRegistrationRequest: EmailRegistrationRequest): ResponseEntity<Unit> {\\n        registerWithEmail.execute(\\n            emailRegistrationRequest.registrationAttemptId,\\n            emailRegistrationRequest.email,\\n            emailRegistrationRequest.password,\\n            emailRegistrationRequest.registrationProof,\\n            emailRegistrationRequest.locale,\\n            clientIp(),\\n        )\\n        return ResponseEntity.accepted().build()\\n    }\\n\\n    override fun resendEmailVerification(emailActionRequest: EmailActionRequest): ResponseEntity<Unit> {\\n        resendEmailVerification.execute(\\n            emailActionRequest.registrationAttemptId,\\n            emailActionRequest.email,\\n            emailActionRequest.registrationProof,\\n            clientIp(),\\n        )\\n        return ResponseEntity.accepted().build()\\n    }\\n\\n    override fun confirmEmail(\\n        emailVerificationConfirmRequest: EmailVerificationConfirmRequest,\\n    ): ResponseEntity<Unit> {\\n        confirmEmail.execute(\\n            emailVerificationConfirmRequest.token,\\n            emailVerificationConfirmRequest.registrationProof,\\n            clientIp(),\\n        )\\n        return ResponseEntity.noContent().build()\\n    }\\n\\n    override fun loginWithEmail(emailLoginRequest: EmailLoginRequest): ResponseEntity<TokenPairWithUser> =\\n        secretResponse(\\n            loginWithEmail.execute(\\n                emailLoginRequest.email,\\n                emailLoginRequest.password,\\n                emailLoginRequest.deviceId,\\n                clientIp(),\\n            ).toTransportWithUser(),\\n        )\\n\\n    override fun refreshSession(\\n        idempotencyKey: UUID,\\n        refreshTokenRequest: RefreshTokenRequest,\\n    ): ResponseEntity<TokenPair> =\\n        secretResponse(\\n            refreshSession.execute(refreshTokenRequest.refreshToken, idempotencyKey, clientIp()).toTransport(),\\n        )\\n\\n    override fun logout(refreshTokenRequest: RefreshTokenRequest): ResponseEntity<Unit> {\\n        logout.execute(refreshTokenRequest.refreshToken, clientIp())\\n        return ResponseEntity.noContent().build()\\n    }\\n\\n    override fun requestAccountDeletion(\\n        idempotencyKey: UUID,\\n        accountDeletionRequest: AccountDeletionRequest,\\n    ): ResponseEntity<AccountDeletionRequestAccepted> {\\n        val result = requestAccountDeletion.execute(\\n            AccountDeletionCommand(\\n                accessToken = bearerAccessToken(),\\n                currentPassword = accountDeletionRequest.currentPassword,\\n                idempotencyKey = strictDeletionIdempotencyKey(idempotencyKey),\\n                ip = clientIp(),\\n            ),\\n        )\\n        return ResponseEntity.accepted()\\n            .cacheControl(CacheControl.noStore())\\n            .header(HttpHeaders.PRAGMA, \\\"no-cache\\\")\\n            .body(\\n                AccountDeletionRequestAccepted(\\n                    deletionRequestId = result.deletionRequestId,\\n                    status = AccountDeletionRequestAccepted.Status.valueOf(result.status.name),\\n                    requestedAt = result.requestedAt.atOffset(ZoneOffset.UTC),\\n                ),\\n            )\\n    }\\n\\n    override fun getIdentityJwks(): ResponseEntity<JsonWebKeySet> = ResponseEntity.ok()\\n        .cacheControl(CacheControl.maxAge(Duration.ofMinutes(5)).cachePublic())\\n        .body(JsonWebKeySet(propertyKeys = getIdentityJwks.execute().map { it.toTransport() }))\\n\\n    private fun clientIp(): String = clientIpResolver.resolve(request)\\n\\n    private fun bearerAccessToken(): String {\\n        val values = request.getHeaders(HttpHeaders.AUTHORIZATION).toList()\\n        if (values.size != 1) throw InvalidAccessTokenException()\\n        return BEARER_ACCESS_TOKEN.matchEntire(values.single())?.groupValues?.get(1)\\n            ?: throw InvalidAccessTokenException()\\n    }\\n\\n    /** Spring's UUID converter accepts abbreviated input, so preserve the RFC 4122 wire contract explicitly. */\\n    private fun strictDeletionIdempotencyKey(converted: UUID): UUID {\\n        val values = request.getHeaders(IDEMPOTENCY_KEY_HEADER).toList()\\n        if (values.size != 1 || !CANONICAL_UUID_V4.matches(values.single())) {\\n            throw InvalidRequestException()\\n        }\\n        return converted\\n    }\\n\\n    /** Token-bearing responses must never be stored by browsers or intermediaries. */\\n    private fun <T : Any> secretResponse(body: T): ResponseEntity<T> = ResponseEntity.ok()\\n        .cacheControl(CacheControl.noStore())\\n        .header(HttpHeaders.PRAGMA, \\\"no-cache\\\")\\n        .body(body)\\n\\n    private fun IssuedTokens.toTransport() = TokenPair(\\n        accessToken = accessToken,\\n        accessTokenExpiresIn = accessTokenExpiresIn,\\n        refreshToken = refreshToken,\\n        refreshTokenExpiresIn = refreshTokenExpiresIn,\\n    )\\n\\n    private fun IssuedTokens.toTransportWithUser() = TokenPairWithUser(\\n        accessToken = accessToken,\\n        accessTokenExpiresIn = accessTokenExpiresIn,\\n        refreshToken = refreshToken,\\n        refreshTokenExpiresIn = refreshTokenExpiresIn,\\n        user = AuthenticatedUser(accountId),\\n    )\\n\\n    private fun PublicJwk.toTransport() = com.cookie.identity.generated.model.JsonWebKey(\\n        kty = com.cookie.identity.generated.model.JsonWebKey.Kty.EC,\\n        use = com.cookie.identity.generated.model.JsonWebKey.Use.SIG,\\n        alg = com.cookie.identity.generated.model.JsonWebKey.Alg.ES256,\\n        kid = keyId,\\n        crv = com.cookie.identity.generated.model.JsonWebKey.Crv.P_256,\\n        x = x,\\n        y = y,\\n    )\\n\\n    private companion object {\\n        const val IDEMPOTENCY_KEY_HEADER = \\\"Idempotency-Key\\\"\\n        val CANONICAL_UUID_V4 = Regex(\\n            \\\"^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$\\\",\\n            RegexOption.IGNORE_CASE,\\n        )\\n        val BEARER_ACCESS_TOKEN = Regex(\\n            \\\"^Bearer ([A-Za-z0-9_-]+\\\\\\\\.[A-Za-z0-9_-]+\\\\\\\\.[A-Za-z0-9_-]+)$\\\",\\n            RegexOption.IGNORE_CASE,\\n        )\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/ClientIpResolver.kt\":\"package com.cookie.identity.transport\\n\\nimport com.cookie.identity.config.IdentityProperties\\nimport jakarta.servlet.http.HttpServletRequest\\nimport org.springframework.stereotype.Component\\nimport java.net.InetAddress\\n\\n/**\\n * Resolves an end-user address without trusting client-controlled forwarding\\n * headers. A forwarding chain is considered only when the direct peer belongs\\n * to an explicitly configured proxy network.\\n */\\n@Component\\nclass ClientIpResolver(properties: IdentityProperties) {\\n    private val trustedProxies = properties.trustedProxyCidrs.map(IpNetwork::parse)\\n\\n    fun resolve(request: HttpServletRequest): String {\\n        val peer = parseAddress(request.remoteAddr) ?: return UNKNOWN\\n        if (!isTrusted(peer)) return peer.hostAddress\\n\\n        val forwarded = forwardedChain(request) ?: return peer.hostAddress\\n        for (candidate in forwarded.asReversed()) {\\n            if (!isTrusted(candidate)) return candidate.hostAddress\\n        }\\n        return forwarded.firstOrNull()?.hostAddress ?: peer.hostAddress\\n    }\\n\\n    private fun forwardedChain(request: HttpServletRequest): List<InetAddress>? {\\n        val values = request.getHeaders(FORWARDED_FOR_HEADER)?.toList().orEmpty()\\n        if (values.isEmpty()) return emptyList()\\n        val combined = values.joinToString(\\\",\\\")\\n        if (combined.length > MAX_FORWARDED_HEADER_LENGTH) return null\\n        val tokens = combined.split(',')\\n        if (tokens.size > MAX_FORWARDED_HOPS) return null\\n        return tokens.map { token -> parseAddress(token.trim()) ?: return null }\\n    }\\n\\n    private fun isTrusted(address: InetAddress): Boolean = trustedProxies.any { it.contains(address) }\\n\\n    private fun parseAddress(value: String?): InetAddress? {\\n        val literal = value?.trim()?.takeIf { it.isNotEmpty() } ?: return null\\n        return runCatching { InetAddress.ofLiteral(literal) }.getOrNull()\\n    }\\n\\n    private class IpNetwork private constructor(\\n        private val network: ByteArray,\\n        private val prefixLength: Int,\\n    ) {\\n        fun contains(candidate: InetAddress): Boolean {\\n            val bytes = candidate.address\\n            if (bytes.size != network.size) return false\\n            val fullBytes = prefixLength / Byte.SIZE_BITS\\n            val remainingBits = prefixLength % Byte.SIZE_BITS\\n            for (index in 0 until fullBytes) {\\n                if (bytes[index] != network[index]) return false\\n            }\\n            if (remainingBits == 0) return true\\n            val mask = (0xFF shl (Byte.SIZE_BITS - remainingBits)) and 0xFF\\n            return (bytes[fullBytes].toInt() and mask) == (network[fullBytes].toInt() and mask)\\n        }\\n\\n        companion object {\\n            fun parse(raw: String): IpNetwork {\\n                val parts = raw.trim().split('/', limit = 2)\\n                require(parts.size == 2) { \\\"Trusted proxy network must use CIDR notation: $raw\\\" }\\n                val address = runCatching { InetAddress.ofLiteral(parts[0]) }\\n                    .getOrElse { throw IllegalArgumentException(\\\"Trusted proxy CIDR has an invalid address: $raw\\\", it) }\\n                val prefix = parts[1].toIntOrNull()\\n                    ?: throw IllegalArgumentException(\\\"Trusted proxy CIDR has an invalid prefix: $raw\\\")\\n                require(prefix in 0..address.address.size * Byte.SIZE_BITS) {\\n                    \\\"Trusted proxy CIDR prefix is out of range: $raw\\\"\\n                }\\n                return IpNetwork(address.address.masked(prefix), prefix)\\n            }\\n\\n            private fun ByteArray.masked(prefixLength: Int): ByteArray = copyOf().also { bytes ->\\n                val fullBytes = prefixLength / Byte.SIZE_BITS\\n                val remainingBits = prefixLength % Byte.SIZE_BITS\\n                if (remainingBits != 0 && fullBytes < bytes.size) {\\n                    val mask = (0xFF shl (Byte.SIZE_BITS - remainingBits)) and 0xFF\\n                    bytes[fullBytes] = (bytes[fullBytes].toInt() and mask).toByte()\\n                }\\n                for (index in (fullBytes + if (remainingBits == 0) 0 else 1) until bytes.size) {\\n                    bytes[index] = 0\\n                }\\n            }\\n        }\\n    }\\n\\n    private companion object {\\n        const val FORWARDED_FOR_HEADER = \\\"X-Forwarded-For\\\"\\n        const val MAX_FORWARDED_HOPS = 32\\n        const val MAX_FORWARDED_HEADER_LENGTH = 2_048\\n        const val UNKNOWN = \\\"unknown\\\"\\n    }\\n}\\n\",\"backend/services/identity/src/main/kotlin/com/cookie/identity/transport/SystemController.kt\":\"package com.cookie.identity.transport\\n\\nimport com.cookie.identity.config.JdbcReadinessProperties\\nimport com.cookie.identity.generated.runtime.api.SystemApi\\nimport com.cookie.identity.generated.runtime.model.ProbeStatus\\nimport com.cookie.identity.security.KeyMaterial\\nimport org.springframework.http.HttpStatus\\nimport org.springframework.http.ResponseEntity\\nimport org.springframework.stereotype.Controller\\nimport javax.sql.DataSource\\n\\n@Controller\\nclass SystemController(\\n    private val dataSource: DataSource,\\n    @Suppress(\\\"unused\\\") private val keyMaterial: KeyMaterial,\\n    private val jdbcReadinessProperties: JdbcReadinessProperties,\\n) : SystemApi {\\n    override fun getLiveness(): ResponseEntity<ProbeStatus> =\\n        ResponseEntity.ok(ProbeStatus(ProbeStatus.Status.ok))\\n\\n    override fun getReadiness(): ResponseEntity<ProbeStatus> {\\n        val ready = postgresReady()\\n        val body = ProbeStatus(if (ready) ProbeStatus.Status.ok else ProbeStatus.Status.not_ready)\\n        return if (ready) ResponseEntity.ok(body) else ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE).body(body)\\n    }\\n\\n    private fun postgresReady(): Boolean = runCatching {\\n        dataSource.connection.use { connection ->\\n            connection.isValid(jdbcReadinessProperties.validationTimeoutSeconds)\\n        }\\n    }.getOrDefault(false)\\n}\\n\",\"backend/services/identity/src/main/resources/application.yaml\":\"spring:\\n  config:\\n    # Production mounts server-owned secret files using Spring Boot configtree\\n    # names such as `spring.datasource.password`. The directory is optional for\\n    # local development and tests.\\n    import: optional:configtree:/run/secrets/\\n  application:\\n    name: identity\\n  datasource:\\n    url: ${COOKIE_IDENTITY_DATABASE_URL}\\n    username: ${COOKIE_IDENTITY_DATABASE_USER}\\n    password: ${COOKIE_IDENTITY_DATABASE_PASSWORD}\\n    hikari:\\n      maximum-pool-size: ${COOKIE_IDENTITY_DATABASE_POOL_SIZE:10}\\n      connection-timeout: ${COOKIE_IDENTITY_DATABASE_CONNECTION_TIMEOUT_MS:2000}\\n      validation-timeout: ${COOKIE_IDENTITY_DATABASE_VALIDATION_TIMEOUT_MS:1000}\\n      data-source-properties:\\n        options: \\\"${COOKIE_IDENTITY_DATABASE_OPTIONS:-c statement_timeout=5000 -c lock_timeout=2000}\\\"\\n        socketTimeout: ${COOKIE_IDENTITY_DATABASE_SOCKET_TIMEOUT_SECONDS:10}\\n        tcpKeepAlive: true\\n  flyway:\\n    enabled: true\\n  jackson:\\n    default-property-inclusion: non_null\\n  task:\\n    scheduling:\\n      pool:\\n        size: 3\\n      thread-name-prefix: identity-scheduler-\\n\\nserver:\\n  port: ${PORT:8080}\\n  # ClientIpResolver applies the trusted proxy boundary; servlet forwarding stays disabled.\\n  forward-headers-strategy: none\\n\\nmanagement:\\n  endpoints:\\n    web:\\n      # Runtime probes are implemented by SystemController. Do not publish the\\n      # duplicate Actuator transport on the service port.\\n      exposure:\\n        exclude: \\\"*\\\"\\n\\ncookie:\\n  identity:\\n    access-token-ttl: PT15M\\n    refresh-family-ttl: P30D\\n    registration-attempt-ttl: P1D\\n    verification-token-ttl: PT30M\\n    verification-resend-cooldown: PT1M\\n    issuer: ${COOKIE_IDENTITY_ISSUER:https://api.cookie.app}\\n    audience: ${COOKIE_IDENTITY_AUDIENCE:cookie-api}\\n    jwt-private-key-path: ${COOKIE_IDENTITY_JWT_PRIVATE_KEY_PATH:}\\n    jwt-retiring-public-key-paths: ${COOKIE_IDENTITY_JWT_RETIRING_PUBLIC_KEY_PATHS:}\\n    notification-public-key-path: ${COOKIE_NOTIFICATION_PUBLIC_KEY_PATH:}\\n    dev-notification-private-key-output-path: ${COOKIE_DEV_NOTIFICATION_PRIVATE_KEY_OUTPUT_PATH:}\\n    nats-url: ${COOKIE_NATS_URL}\\n    nats-credentials-path: ${COOKIE_NATS_CREDENTIALS_PATH:}\\n    nats-truststore-path: ${COOKIE_NATS_TRUSTSTORE_PATH:}\\n    nats-truststore-password: ${COOKIE_NATS_TRUSTSTORE_PASSWORD:}\\n    # Shared base64url-encoded 32-byte secret for pseudonymous rate-limit scopes.\\n    # Production fails closed when it is absent; dev/test use a fixed non-secret fallback.\\n    rate-limit-hmac-key: ${COOKIE_IDENTITY_RATE_LIMIT_HMAC_KEY:}\\n    # Comma-separated CIDRs of ingress proxies allowed to supply X-Forwarded-For.\\n    # Keep empty when clients connect directly to Identity.\\n    trusted-proxy-cidrs: ${COOKIE_IDENTITY_TRUSTED_PROXY_CIDRS:}\\n    database:\\n      transaction-timeout: PT5S\\n      lock-timeout: PT2S\\n    retention:\\n      poll-delay: PT1M\\n      rate-limit-grace: P1D\\n      completed-registration-attempt-audit: P30D\\n      abandoned-registration-attempt-audit: P30D\\n      refresh-family-audit: P90D\\n      published-outbox: P7D\\n      batch-size: 500\\n      max-batches-per-run: 400\\n      max-run-duration: PT30S\\n\\nlogging:\\n  pattern:\\n    level: \\\"%5p [requestId=%X{requestId:-}]\\\"\\n\",\"backend/services/notification/README.md\":\"# Notification\\n\\nKotlin/JDK 25 Spring MVC service with framework-free `domain` and `application`\\nmodules. Its PostgreSQL database owns inbox, preferences, device bindings,\\nminimal projections, deadlines and delivery state; Redis is a disposable index.\\n\\nThe authoritative behavior and event contracts are documented in\\n[Notification architecture](../../../docs/architecture/notification.md) and\\n[ADR 0013](../../../docs/adr/0013-notification-service.md).\\nThe public contract is [notification.yaml](../../../contracts/openapi/public/notification.yaml).\\nRun commands below from the repository root.\\n\\n```bash\\nmake dev-up\\n./gradlew :backend:services:notification:check\\n./gradlew :backend:services:notification:integrationTest\\n```\\n\\nCompose starts Identity, Notification, independent databases/roles in PostgreSQL,\\nJetStream, Redis and Mailpit. Notification is on `127.0.0.1:8082`, Mailpit on\\n`127.0.0.1:8025`. An explicit timezone is required before scheduled push is enabled.\\nBoth Android and iOS push use FCM and require Firebase project/service-account\\ncredentials. For iOS, configure the APNs authentication key in Firebase, not in\\nNotification. Both platforms register opaque FCM tokens; V006 disables legacy iOS\\nAPNs bindings until the client re-registers. Local email uses Mailpit.\\n\\nThe integration task requires a working Docker-compatible daemon. It builds and\\nstarts the real Identity and Notification artifacts, then checks registration,\\nencrypted event consumption, SMTP, confirmation, JWT API access and deletion.\\nIt also verifies rollback before ACK, duplicate events, independent accounts,\\ntoken transfer, versioned projections, concurrent workers, Redis recovery,\\ndelivery leases and terminal SMTP `UNKNOWN`. Future domain producers use synthetic\\ncontract fixtures; no replacement producers are deployed.\\n\\nDeployment, channel enablement, operator replay, key rotation and independent\\nimage rollback are in the [production runbook](../../../deploy/production/README.md).\\nProduction requires real SMTP credentials and a verified HTTPS link origin with\\nthe mobile handler. Provider acceptance is recorded as `ACCEPTED`; it does not\\nprove that a message was displayed or read.\\n\",\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/NotificationModels.kt\":\"package com.cookie.notification.domain\\n\\nimport java.time.Instant\\nimport java.time.LocalTime\\nimport java.time.ZoneId\\nimport java.util.UUID\\n\\nenum class DevicePlatform { IOS, ANDROID }\\nenum class ReminderKind { FOOD, WATER, WEIGH, CALORIES_EXCEEDED, CALORIES_UNDER_TARGET }\\nclass InvalidNotificationInput(message: String) : RuntimeException(message)\\nclass NotificationAccountDeleted : RuntimeException(\\\"Account is deleted\\\")\\nclass NotificationDeviceNotFound : RuntimeException(\\\"Device not found\\\")\\n\\ndata class NotificationSettings(\\n    val userId: UUID,\\n    val waterEnabled: Boolean = true,\\n    val foodEnabled: Boolean = true,\\n    val foodInactiveMinutes: Int = 240,\\n    val weighEnabled: Boolean = true,\\n    val weighTime: LocalTime = LocalTime.of(8, 0),\\n    val goalWarningEnabled: Boolean = true,\\n    val quietStart: LocalTime = LocalTime.of(23, 0),\\n    val quietEnd: LocalTime = LocalTime.of(8, 0),\\n    val timezone: String? = null,\\n    val locale: String = \\\"ru\\\",\\n    val schedulingStartedAt: Instant? = null,\\n) {\\n    fun apply(patch: SettingsPatch, now: Instant): NotificationSettings {\\n        patch.timezone?.let {\\n            if (it !in ZoneId.getAvailableZoneIds()) throw InvalidNotificationInput(\\\"timezone must be an IANA zone\\\")\\n        }\\n        patch.foodInactiveMinutes?.let { if (it !in 1..10080) throw InvalidNotificationInput(\\\"food interval must be 1..10080 minutes\\\") }\\n        patch.locale?.let { if (it !in setOf(\\\"ru\\\", \\\"en\\\")) throw InvalidNotificationInput(\\\"locale must be ru or en\\\") }\\n        return copy(\\n            waterEnabled = patch.waterEnabled ?: waterEnabled,\\n            foodEnabled = patch.foodEnabled ?: foodEnabled,\\n            foodInactiveMinutes = patch.foodInactiveMinutes ?: foodInactiveMinutes,\\n            weighEnabled = patch.weighEnabled ?: weighEnabled,\\n            weighTime = patch.weighTime ?: weighTime,\\n            goalWarningEnabled = patch.goalWarningEnabled ?: goalWarningEnabled,\\n            quietStart = patch.quietStart ?: quietStart,\\n            quietEnd = patch.quietEnd ?: quietEnd,\\n            timezone = patch.timezone ?: timezone,\\n            locale = patch.locale ?: locale,\\n            schedulingStartedAt = schedulingStartedAt ?: if (patch.timezone != null) now else null,\\n        )\\n    }\\n}\\n\\ndata class SettingsPatch(\\n    val waterEnabled: Boolean? = null,\\n    val foodEnabled: Boolean? = null,\\n    val foodInactiveMinutes: Int? = null,\\n    val weighEnabled: Boolean? = null,\\n    val weighTime: LocalTime? = null,\\n    val goalWarningEnabled: Boolean? = null,\\n    val quietStart: LocalTime? = null,\\n    val quietEnd: LocalTime? = null,\\n    val timezone: String? = null,\\n    val locale: String? = null,\\n)\\n\\ndata class PushDevice(val id: UUID, val userId: UUID, val platform: DevicePlatform, val deviceId: String, val token: String, val enabled: Boolean = true) {\\n    override fun toString() = \\\"PushDevice(id=$id,platform=$platform,token=[redacted])\\\"\\n}\\n\\ndata class RegisterDevice(val platform: DevicePlatform, val deviceId: String, val token: String) {\\n    init {\\n        if (deviceId.isBlank() || deviceId.length > 255 || token.isBlank() || token.length > 4096 || token.any { it.isISOControl() }) {\\n            throw InvalidNotificationInput(\\\"Invalid push device\\\")\\n        }\\n    }\\n    override fun toString() = \\\"RegisterDevice(platform=$platform,token=[redacted])\\\"\\n}\\ndata class DeviceRegistration(val device: PushDevice, val created: Boolean)\\n\",\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPlanner.kt\":\"package com.cookie.notification.domain\\n\\nimport java.math.BigDecimal\\nimport java.time.Duration\\nimport java.time.Instant\\nimport java.time.LocalDate\\nimport java.time.LocalTime\\nimport java.time.ZoneId\\n\\ndata class MealSnapshot(val id: String, val eatenAt: Instant)\\n\\ndata class ProgressSnapshot(\\n    val localDate: LocalDate,\\n    val timezone: String,\\n    val caloriesConsumed: BigDecimal?,\\n    val calorieTarget: BigDecimal?,\\n    val unlimitedCalories: Boolean?,\\n    val waterConsumedMl: Int?,\\n    val waterTargetMl: Int?,\\n)\\n\\ndata class OccurrenceKey(val kind: ReminderKind, val cycle: String)\\n\\ndata class PlannedReminder(\\n    val kind: ReminderKind,\\n    val cycle: String,\\n    val scheduledAt: Instant,\\n    val expiresAt: Instant,\\n)\\n\\ndata class ReminderPlanningState(\\n    val settings: NotificationSettings,\\n    val foodStartedAt: Instant?,\\n    val waterStartedAt: Instant?,\\n    val lastWaterReminderAt: Instant?,\\n    val meals: List<MealSnapshot> = emptyList(),\\n    val waterRecords: List<Instant> = emptyList(),\\n    val weightMeasurements: List<Instant> = emptyList(),\\n    val progress: List<ProgressSnapshot> = emptyList(),\\n    val emitted: Set<OccurrenceKey> = emptySet(),\\n    val lastWaterSubmissionAt: Instant? = null,\\n)\\n\\ndata class ReminderPlan(val due: List<PlannedReminder>, val nextWakeup: Instant?)\\n\\n/** Pure reminder decisions. Clock, storage, broker and delivery providers remain outside this model. */\\nobject ReminderPlanner {\\n    fun plan(state: ReminderPlanningState, now: Instant): ReminderPlan {\\n        val settings = state.settings\\n        val timezone = settings.timezone ?: return ReminderPlan(emptyList(), null)\\n        val started = settings.schedulingStartedAt ?: return ReminderPlan(emptyList(), null)\\n        val zone = ZoneId.of(timezone)\\n        val day = now.atZone(zone).toLocalDate()\\n        val dayEnd = day.plusDays(1).atStartOfDay(zone).toInstant()\\n        val wakeups = mutableListOf(dayEnd)\\n        val due = mutableListOf<PlannedReminder>()\\n\\n        // A future-dated record becomes relevant when its actual timestamp arrives.\\n        (state.meals.map { it.eatenAt } + state.waterRecords + state.weightMeasurements)\\n            .filter { it > now }\\n            .forEach(wakeups::add)\\n\\n        fun candidate(kind: ReminderKind, cycle: String, scheduled: Instant, expiry: Instant) {\\n            if (OccurrenceKey(kind, cycle) in state.emitted || expiry <= now) return\\n            val effective = ReminderPolicy.afterQuiet(maxOf(scheduled, now), settings)\\n            val daily = kind != ReminderKind.FOOD && kind != ReminderKind.WATER\\n            if (daily && effective >= expiry) return\\n            if (effective > now) {\\n                wakeups += effective\\n                return\\n            }\\n            due += PlannedReminder(kind, cycle, scheduled, expiry)\\n        }\\n\\n        if (settings.foodEnabled) {\\n            val meal = latestMeal(state, now)\\n            val baseline = state.foodStartedAt ?: started\\n            val scheduled = maxOf(baseline, meal?.eatenAt ?: baseline)\\n                .plusSeconds(settings.foodInactiveMinutes * 60L)\\n            candidate(ReminderKind.FOOD, foodCycle(state, meal), scheduled, now.plus(Duration.ofDays(1)))\\n        }\\n\\n        val progress = progressForDay(state, now)\\n        if (settings.waterEnabled && !waterGoalReached(progress)) {\\n            val baseline = state.waterStartedAt ?: started\\n            val anchor = maxOf(baseline, lastWater(state, now) ?: baseline,\\n                state.lastWaterReminderAt ?: baseline, state.lastWaterSubmissionAt ?: baseline)\\n            val scheduled = anchor.plus(Duration.ofHours(2))\\n            candidate(ReminderKind.WATER, scheduled.toString(), scheduled, now.plus(Duration.ofHours(2)))\\n            if (due.any { it.kind == ReminderKind.WATER }) wakeups += now.plus(Duration.ofHours(2))\\n        }\\n\\n        if (settings.weighEnabled) {\\n            val scheduled = ReminderPolicy.atLocalTime(day, settings.weighTime, zone)\\n            if (scheduled >= started && !weighedToday(state, now)) {\\n                candidate(ReminderKind.WEIGH, day.toString(), scheduled, dayEnd)\\n            }\\n            wakeups += ReminderPolicy.atLocalTime(day.plusDays(1), settings.weighTime, zone)\\n        }\\n\\n        if (settings.goalWarningEnabled) {\\n            if (exceeded(progress)) candidate(ReminderKind.CALORIES_EXCEEDED, day.toString(), now, dayEnd)\\n            val underTime = ReminderPolicy.atLocalTime(day, LocalTime.of(20, 0), zone)\\n            if (underTarget(progress)) {\\n                candidate(ReminderKind.CALORIES_UNDER_TARGET, day.toString(), underTime, dayEnd)\\n            }\\n            wakeups += if (underTime > now) underTime\\n                else ReminderPolicy.atLocalTime(day.plusDays(1), LocalTime.of(20, 0), zone)\\n        }\\n\\n        return ReminderPlan(due, wakeups.filter { it > now }.minOrNull())\\n    }\\n\\n    /** Re-evaluates a durable occurrence just before provider submission, without consuming its cycle. */\\n    fun isEligible(\\n        state: ReminderPlanningState,\\n        kind: ReminderKind,\\n        cycle: String,\\n        scheduledAt: Instant,\\n        now: Instant,\\n    ): Boolean {\\n        val settings = state.settings\\n        val zone = settings.timezone?.let(ZoneId::of) ?: return false\\n        val started = settings.schedulingStartedAt ?: return false\\n        val day = now.atZone(zone).toLocalDate()\\n        val progress = progressForDay(state, now)\\n\\n        return when (kind) {\\n            ReminderKind.FOOD -> {\\n                val meal = latestMeal(state, now)\\n                val baseline = state.foodStartedAt ?: started\\n                settings.foodEnabled && cycle == foodCycle(state, meal) &&\\n                    maxOf(baseline, meal?.eatenAt ?: baseline).plusSeconds(settings.foodInactiveMinutes * 60L) <= now\\n            }\\n            ReminderKind.WATER -> {\\n                val baseline = state.waterStartedAt ?: started\\n                settings.waterEnabled && scheduledAt >= baseline &&\\n                    maxOf(baseline, lastWater(state, now) ?: baseline).plusSeconds(7200) <= now &&\\n                    !waterGoalReached(progress)\\n            }\\n            ReminderKind.WEIGH ->\\n                settings.weighEnabled && cycle == day.toString() &&\\n                    ReminderPolicy.atLocalTime(day, settings.weighTime, zone) <= now && !weighedToday(state, now)\\n            ReminderKind.CALORIES_EXCEEDED ->\\n                settings.goalWarningEnabled && cycle == day.toString() && exceeded(progress)\\n            ReminderKind.CALORIES_UNDER_TARGET ->\\n                settings.goalWarningEnabled && cycle == day.toString() &&\\n                    now.atZone(zone).toLocalTime() >= LocalTime.of(20, 0) && underTarget(progress)\\n        }\\n    }\\n\\n    private fun latestMeal(state: ReminderPlanningState, now: Instant): MealSnapshot? = state.meals\\n        .filter { it.eatenAt <= now }\\n        .maxWithOrNull(compareBy<MealSnapshot> { it.eatenAt }.thenBy { it.id })\\n\\n    private fun foodCycle(state: ReminderPlanningState, meal: MealSnapshot?): String =\\n        \\\"${state.foodStartedAt ?: state.settings.schedulingStartedAt}:${meal?.id ?: \\\"initial\\\"}\\\"\\n\\n    private fun lastWater(state: ReminderPlanningState, now: Instant): Instant? =\\n        state.waterRecords.filter { it <= now }.maxOrNull()\\n\\n    private fun progressForDay(state: ReminderPlanningState, now: Instant): ProgressSnapshot? {\\n        val zone = state.settings.timezone ?: return null\\n        val day = now.atZone(ZoneId.of(zone)).toLocalDate()\\n        return state.progress.firstOrNull { it.timezone == zone && it.localDate == day }\\n    }\\n\\n    private fun weighedToday(state: ReminderPlanningState, now: Instant): Boolean {\\n        val zone = ZoneId.of(requireNotNull(state.settings.timezone))\\n        val day = now.atZone(zone).toLocalDate()\\n        return state.weightMeasurements.any { it <= now && it.atZone(zone).toLocalDate() == day }\\n    }\\n\\n    private fun waterGoalReached(progress: ProgressSnapshot?): Boolean =\\n        ReminderPolicy.waterGoalReached(progress?.waterConsumedMl, progress?.waterTargetMl)\\n\\n    private fun exceeded(progress: ProgressSnapshot?): Boolean =\\n        ReminderPolicy.caloriesExceeded(progress?.caloriesConsumed, progress?.calorieTarget, progress?.unlimitedCalories)\\n\\n    private fun underTarget(progress: ProgressSnapshot?): Boolean =\\n        ReminderPolicy.caloriesUnderTarget(progress?.caloriesConsumed, progress?.calorieTarget, progress?.unlimitedCalories)\\n}\\n\",\"backend/services/notification/domain/src/main/kotlin/com/cookie/notification/domain/ReminderPolicy.kt\":\"package com.cookie.notification.domain\\n\\nimport java.math.BigDecimal\\nimport java.time.Instant\\nimport java.time.LocalDate\\nimport java.time.LocalTime\\nimport java.time.ZoneId\\n\\nobject ReminderPolicy {\\n    fun isQuiet(now: Instant, settings: NotificationSettings): Boolean {\\n        val zone = settings.timezone?.let(ZoneId::of) ?: return true\\n        val time = now.atZone(zone).toLocalTime()\\n        val start = settings.quietStart\\n        val end = settings.quietEnd\\n        return if (start == end) false else if (start < end) time >= start && time < end else time >= start || time < end\\n    }\\n\\n    fun afterQuiet(deadline: Instant, settings: NotificationSettings): Instant {\\n        if (!isQuiet(deadline, settings)) return deadline\\n        val zone = ZoneId.of(requireNotNull(settings.timezone))\\n        val local = deadline.atZone(zone)\\n        val nextDate = if (settings.quietStart > settings.quietEnd && local.toLocalTime() >= settings.quietStart) local.toLocalDate().plusDays(1) else local.toLocalDate()\\n        return localTimeAfter(nextDate, settings.quietEnd, zone, deadline)\\n    }\\n\\n    /** A quiet interval in a repeated hour ends at the first matching boundary still ahead. */\\n    fun localTimeAfter(date: LocalDate, time: LocalTime, zone: ZoneId, after: Instant): Instant {\\n        val local = date.atTime(time)\\n        val offsets = zone.rules.getValidOffsets(local)\\n        val candidates = if (offsets.isEmpty()) listOf(zone.rules.getTransition(local).instant) else offsets.map(local::toInstant)\\n        return candidates.filter { it > after }.minOrNull() ?: atLocalTime(date.plusDays(1), time, zone)\\n    }\\n\\n    fun atLocalTime(date: LocalDate, time: LocalTime, zone: ZoneId): Instant {\\n        val local=date.atTime(time)\\n        val offsets=zone.rules.getValidOffsets(local)\\n        return if(offsets.isEmpty()) zone.rules.getTransition(local).instant else local.toInstant(offsets.first())\\n    }\\n\\n    fun caloriesExceeded(consumed: BigDecimal?, target: BigDecimal?, unlimited: Boolean?): Boolean =\\n        consumed != null && target != null && target.signum() > 0 && unlimited == false && consumed > target\\n\\n    fun caloriesUnderTarget(consumed: BigDecimal?, target: BigDecimal?, unlimited: Boolean?): Boolean =\\n        consumed != null && target != null && target.signum() > 0 && unlimited == false && consumed < target.multiply(BigDecimal(\\\"0.8\\\"))\\n\\n    fun waterGoalReached(consumed: Int?, target: Int?): Boolean = consumed != null && target != null && target > 0 && consumed >= target\\n}\\n\",\"backend/services/notification/service.yaml\":\"schema_version: 1\\nid: notification\\nruntime: kotlin_jvm\\nstateful: true\\ndatabase: notification\\npublic_openapi:\\n  source: contracts/openapi/public/notification.yaml\\nruntime_openapi: contracts/openapi/runtime.yaml\\nmessaging:\\n  publishes: []\\n  consumes:\\n    - type: account.deletion.requested\\n      version: 1\\n    - type: notification.email.requested\\n      version: 1\\n    - type: account.activated\\n      version: 1\\n    - type: nutrition.meal.created\\n      version: 1\\n    - type: nutrition.meal.updated\\n      version: 1\\n    - type: nutrition.meal.deleted\\n      version: 1\\n    - type: nutrition.water.changed\\n      version: 1\\n    - type: health.weight.changed\\n      version: 1\\n    - type: user.profile.updated\\n      version: 1\\n    - type: progress.day.updated\\n      version: 1\\nsynchronous_dependencies: [identity]\\ninfrastructure_dependencies: [postgresql, nats_jetstream, redis, notification_decryption_key, identity_jwks]\\nprobes:\\n  liveness: /healthz\\n  readiness: /readyz\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationConfiguration.kt\":\"package com.cookie.notification.config\\n\\nimport com.cookie.notification.application.NotificationService\\nimport com.cookie.notification.application.ports.NotificationRepository\\nimport com.cookie.platform.web.BoundedRequestBodyFilter\\nimport com.cookie.platform.web.RequestIdFilter\\nimport org.springframework.boot.web.servlet.FilterRegistrationBean\\nimport org.springframework.context.annotation.Bean\\nimport org.springframework.context.annotation.Configuration\\nimport org.springframework.core.env.Environment\\nimport org.springframework.scheduling.annotation.EnableScheduling\\nimport java.time.Clock\\n\\n@Configuration\\n@EnableScheduling\\nclass NotificationConfiguration(environment: Environment) {\\n    init {\\n        require(environment.getProperty(\\\"api.base-path\\\") == null) {\\n            \\\"api.base-path must remain unset: public and runtime probes have separate boundaries\\\"\\n        }\\n    }\\n\\n    @Bean\\n    fun clock(): Clock = Clock.systemUTC()\\n\\n    @Bean\\n    fun notificationService(repository: NotificationRepository) = NotificationService(repository)\\n\\n    @Bean\\n    fun requestIdFilter() = FilterRegistrationBean(RequestIdFilter()).apply { order = Int.MIN_VALUE }\\n\\n    @Bean\\n    fun requestBodyLimitFilter() = FilterRegistrationBean(BoundedRequestBodyFilter(16 * 1024)).apply {\\n        order = Int.MIN_VALUE + 1\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/NotificationRuntimeMetrics.kt\":\"package com.cookie.notification.config\\n\\nimport com.cookie.notification.messaging.NotificationEventHandler\\nimport com.cookie.notification.messaging.NotificationMessagingProperties\\nimport com.cookie.notification.messaging.NotificationNatsConnection\\nimport io.micrometer.core.instrument.MeterRegistry\\nimport org.springframework.context.annotation.Profile\\nimport org.springframework.jdbc.core.JdbcTemplate\\nimport org.springframework.scheduling.annotation.Scheduled\\nimport org.springframework.stereotype.Component\\nimport java.util.concurrent.atomic.AtomicLong\\n\\n/** Fixed-cardinality metadata only; infrastructure failures must never disclose event contents. */\\n@Component\\n@Profile(\\\"!notification-replay\\\")\\nclass NotificationRuntimeMetrics(\\n    private val jdbc: JdbcTemplate,\\n    private val nats: NotificationNatsConnection,\\n    private val properties: NotificationMessagingProperties,\\n    registry: MeterRegistry,\\n) {\\n    private val overdue = AtomicLong()\\n    private val oldestSeconds = AtomicLong()\\n    private val databaseHealthy = AtomicLong()\\n    private val natsHealthy = AtomicLong()\\n    private val pending = AtomicLong()\\n    private val unacknowledged = AtomicLong()\\n\\n    init {\\n        registry.gauge(\\\"cookie.notification.scheduler.overdue\\\", overdue)\\n        registry.gauge(\\\"cookie.notification.scheduler.oldest.age.seconds\\\", oldestSeconds)\\n        registry.gauge(\\\"cookie.notification.scheduler.metrics.healthy\\\", databaseHealthy)\\n        registry.gauge(\\\"cookie.notification.nats.healthy\\\", natsHealthy)\\n        registry.gauge(\\\"cookie.notification.nats.pending\\\", pending)\\n        registry.gauge(\\\"cookie.notification.nats.unacknowledged\\\", unacknowledged)\\n    }\\n\\n    @Scheduled(fixedDelay = 10_000)\\n    fun refresh() {\\n        try {\\n            jdbc.query(\\\"\\\"\\\"SELECT count(*) AS overdue,\\n                COALESCE(GREATEST(0,EXTRACT(EPOCH FROM (clock_timestamp()-min(due_at)))),0)::bigint AS age\\n                FROM reminder_deadlines WHERE due_at<=clock_timestamp()\\\"\\\"\\\", { row, _ ->\\n                overdue.set(row.getLong(\\\"overdue\\\"))\\n                oldestSeconds.set(row.getLong(\\\"age\\\"))\\n            })\\n            databaseHealthy.set(1)\\n        } catch (_: Exception) { databaseHealthy.set(0) }\\n        if (!properties.consumerEnabled) return\\n        try {\\n            val consumer = nats.connection().jetStreamManagement()\\n                .getConsumerInfo(NotificationNatsConnection.STREAM, NotificationEventHandler.CONSUMER)\\n            pending.set(consumer.numPending)\\n            unacknowledged.set(consumer.numAckPending)\\n            natsHealthy.set(1)\\n        } catch (_: Exception) { natsHealthy.set(0) }\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/config/SecurityConfiguration.kt\":\"package com.cookie.notification.config\\n\\nimport com.cookie.notification.security.BoundedHttpExchange\\nimport com.cookie.notification.security.HttpJwksSource\\nimport com.cookie.notification.security.RemoteJwksAccessTokenVerifier\\nimport com.cookie.notification.security.VerificationPayloadDecryptor\\nimport org.springframework.boot.context.properties.ConfigurationProperties\\nimport org.springframework.boot.context.properties.EnableConfigurationProperties\\nimport org.springframework.context.annotation.Bean\\nimport org.springframework.context.annotation.Configuration\\nimport org.springframework.core.env.Environment\\nimport org.springframework.core.env.Profiles\\nimport tools.jackson.databind.ObjectMapper\\nimport java.net.URI\\nimport java.net.http.HttpClient\\nimport java.nio.file.Path\\nimport java.time.Clock\\nimport java.time.Duration\\n\\n@ConfigurationProperties(\\\"cookie.notification.security\\\")\\nclass NotificationSecurityProperties(\\n    val issuer: String = \\\"https://api.cookie.app\\\",\\n    val audience: String = \\\"cookie-api\\\",\\n    val jwksUrl: URI = URI.create(\\\"https://api.cookie.app/v1/auth/jwks\\\"),\\n    val privateKeyPath: String = \\\"\\\",\\n    val retiringPrivateKeyPaths: List<String> = emptyList(),\\n)\\n\\n@Configuration\\n@EnableConfigurationProperties(NotificationSecurityProperties::class)\\nclass SecurityConfiguration {\\n    @Bean\\n    fun boundedHttpExchange(): BoundedHttpExchange = BoundedHttpExchange(\\n        HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(2))\\n            .followRedirects(HttpClient.Redirect.NEVER).version(HttpClient.Version.HTTP_2).build(),\\n    )\\n\\n    @Bean\\n    fun accessTokenVerifier(properties: NotificationSecurityProperties, http: BoundedHttpExchange,\\n                            clock: Clock, environment: Environment): RemoteJwksAccessTokenVerifier {\\n        val local = environment.acceptsProfiles(Profiles.of(\\\"dev\\\", \\\"test\\\"))\\n        require(properties.jwksUrl.isAbsolute && properties.jwksUrl.host != null)\\n        require(properties.jwksUrl.userInfo == null && properties.jwksUrl.fragment == null)\\n        require(properties.jwksUrl.scheme == \\\"https\\\" || (local && properties.jwksUrl.scheme == \\\"http\\\"))\\n        val issuer = URI.create(properties.issuer)\\n        require(issuer.scheme == \\\"https\\\" && !issuer.host.isNullOrBlank() && issuer.userInfo == null && issuer.query == null && issuer.fragment == null)\\n        require(properties.audience.length in 1..255 && properties.audience.none { it.isWhitespace() || it.isISOControl() })\\n        return RemoteJwksAccessTokenVerifier(HttpJwksSource(properties.jwksUrl, http), properties.issuer,\\n            properties.audience, clock)\\n    }\\n\\n    @Bean\\n    fun verificationPayloadDecryptor(properties: NotificationSecurityProperties, mapper: ObjectMapper,\\n                                     clock: Clock, environment: Environment): VerificationPayloadDecryptor {\\n        val local = environment.acceptsProfiles(Profiles.of(\\\"dev\\\", \\\"test\\\"))\\n        require(local || properties.privateKeyPath.isNotBlank()) { \\\"Notification private key is required\\\" }\\n        val paths = (listOf(properties.privateKeyPath) + properties.retiringPrivateKeyPaths).filter(String::isNotBlank)\\n        require(paths.size <= 16 && paths.distinct().size == paths.size)\\n        return VerificationPayloadDecryptor(paths.map(Path::of), mapper, clock, !local)\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/BoundedGoogleAuthTransport.kt\":\"package com.cookie.notification.delivery\\n\\nimport com.cookie.notification.security.BoundedHttpExchange\\nimport com.google.api.client.http.HttpTransport\\nimport com.google.api.client.http.LowLevelHttpRequest\\nimport com.google.api.client.http.LowLevelHttpResponse\\nimport java.io.ByteArrayOutputStream\\nimport java.io.IOException\\nimport java.net.URI\\nimport java.net.http.HttpRequest\\nimport java.time.Duration\\n\\n/** The official credential library performs signing; its network exchange uses our bounded transport. */\\ninternal class BoundedGoogleAuthTransport(private val http: BoundedHttpExchange) : HttpTransport() {\\n    override fun buildRequest(method: String, url: String): LowLevelHttpRequest {\\n        require(method == \\\"POST\\\" && url == \\\"https://oauth2.googleapis.com/token\\\")\\n        return object : LowLevelHttpRequest() {\\n            private val headers = mutableListOf<Pair<String, String>>()\\n            override fun addHeader(name: String, value: String) { headers += name to value }\\n            override fun execute(): LowLevelHttpResponse {\\n                try {\\n                    val body = ByteArrayOutputStream().also { streamingContent?.writeTo(it) }.toByteArray()\\n                    require(body.size <= 65_536)\\n                    val builder = HttpRequest.newBuilder(URI.create(url)).timeout(Duration.ofSeconds(10))\\n                    headers.filterNot { it.first.equals(\\\"Content-Length\\\", true) }.forEach { builder.header(it.first, it.second) }\\n                    contentType?.let { builder.header(\\\"Content-Type\\\", it) }\\n                    contentEncoding?.let { builder.header(\\\"Content-Encoding\\\", it) }\\n                    val response = http.send(builder.POST(HttpRequest.BodyPublishers.ofByteArray(body)).build(), Duration.ofSeconds(10))\\n                    val responseHeaders = response.headers().map().flatMap { (name, values) -> values.map { name to it } }\\n                    return object : LowLevelHttpResponse() {\\n                        override fun getContent() = response.body().inputStream()\\n                        override fun getContentEncoding(): String? = response.headers().firstValue(\\\"Content-Encoding\\\").orElse(null)\\n                        override fun getContentLength(): Long = response.body().size.toLong()\\n                        override fun getContentType(): String? = response.headers().firstValue(\\\"Content-Type\\\").orElse(null)\\n                        override fun getStatusLine(): String = \\\"HTTP ${response.statusCode()}\\\"\\n                        override fun getStatusCode(): Int = response.statusCode()\\n                        override fun getReasonPhrase(): String = \\\"\\\"\\n                        override fun getHeaderCount(): Int = responseHeaders.size\\n                        override fun getHeaderName(index: Int): String = responseHeaders[index].first\\n                        override fun getHeaderValue(index: Int): String = responseHeaders[index].second\\n                    }\\n                } catch (_: Exception) { throw IOException(\\\"OAuth token exchange unavailable\\\") }\\n            }\\n        }\\n    }\\n}\\n\",\"backend/services/notification/src/main/kotlin/com/cookie/notification/delivery/DeliveryWorker.kt\":\"package com.cookie.notification.delivery\\n\\nimport com.cookie.notification.application.ports.PushEligibility\\nimport com.cookie.notification.config.Del
