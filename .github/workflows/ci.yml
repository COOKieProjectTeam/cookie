name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      go_api: ${{ steps.scope.outputs.go_api }}
      platform: ${{ steps.scope.outputs.platform }}
      platform_web: ${{ steps.scope.outputs.platform_web }}
      platform_postgres: ${{ steps.scope.outputs.platform_postgres }}
      platform_messaging: ${{ steps.scope.outputs.platform_messaging }}
      platform_testing: ${{ steps.scope.outputs.platform_testing }}
      identity: ${{ steps.scope.outputs.identity }}
      nutrition: ${{ steps.scope.outputs.nutrition }}
      notification: ${{ steps.scope.outputs.notification }}
      notification_image: ${{ steps.scope.outputs.notification_image }}
      notification_container: ${{ steps.scope.outputs.notification_container }}
      notification_sink: ${{ steps.scope.outputs.notification_sink }}
      service_contracts: ${{ steps.scope.outputs.service_contracts }}
      planned_openapi: ${{ steps.scope.outputs.planned_openapi }}
      public_client: ${{ steps.scope.outputs.public_client }}
      mobile: ${{ steps.scope.outputs.mobile }}
      compose: ${{ steps.scope.outputs.compose }}
      terraform: ${{ steps.scope.outputs.terraform }}
      identity_image: ${{ steps.scope.outputs.identity_image }}
      identity_container: ${{ steps.scope.outputs.identity_container }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI scope mapping
        run: |
          bash .github/scripts/test-detect-ci-scope.sh
          PYTHONPYCACHEPREFIX=.cache/python python3 -m py_compile backend/tools/service-template/create-service.py
      - name: Select affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/detect-ci-scope.sh "$BASE_SHA" "$HEAD_SHA" "$EVENT_NAME"

  legacy_api:
    name: Legacy Go API
    if: needs.changes.outputs.go_api == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
      - name: Test
        run: go test ./apps/api/...
      - name: Vet
        run: go vet ./apps/api/...

  backend_platform:
    name: Backend platform
    if: needs.changes.outputs.platform == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Test affected platform modules
        env:
          CHECK_WEB: ${{ needs.changes.outputs.platform_web }}
          CHECK_POSTGRES: ${{ needs.changes.outputs.platform_postgres }}
          CHECK_MESSAGING: ${{ needs.changes.outputs.platform_messaging }}
          CHECK_TESTING: ${{ needs.changes.outputs.platform_testing }}
        run: |
          tasks=()
          [[ "$CHECK_WEB" == "true" ]] && tasks+=(":backend:platform:starter-web:check")
          [[ "$CHECK_POSTGRES" == "true" ]] && tasks+=(":backend:platform:starter-postgres:check")
          [[ "$CHECK_MESSAGING" == "true" ]] && tasks+=(":backend:platform:starter-messaging:check")
          [[ "$CHECK_TESTING" == "true" ]] && tasks+=(":backend:platform:starter-testing:check")
          ./gradlew "${tasks[@]}"

  identity:
    name: Identity service
    if: needs.changes.outputs.identity == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Require Docker for Testcontainers
        run: docker info
      - name: Run Identity unit and integration tests
        run: >-
          ./gradlew
          :backend:services:identity:check
          :backend:services:identity:integrationTest

  notification:
    name: Notification service
    if: needs.changes.outputs.notification == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Require Docker for Testcontainers
        run: docker info
      - name: Run Notification unit and integration tests
        run: >-
          ./gradlew
          :backend:services:notification:check
          :backend:services:notification:integrationTest

  nutrition:
    name: Nutrition service
    if: needs.changes.outputs.nutrition == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Require Docker for Testcontainers
        run: docker info
      - name: Run Nutrition unit and integration tests
        run: >-
          ./gradlew
          :backend:services:nutrition:check
          :backend:services:nutrition:integrationTest
          :backend:services:nutrition:bootJar
      - name: Build standalone Nutrition image
        run: docker build -f deploy/docker/nutrition.Dockerfile -t cookie-nutrition:ci .

  notification_sink:
    name: Notification sink
    if: needs.changes.outputs.notification_sink == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run Notification sink tests
        run: ./gradlew :backend:tools:notification-sink:check

  service_contracts:
    name: Service contracts
    if: needs.changes.outputs.service_contracts == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Validate service descriptors
        run: ./gradlew validateServiceDescriptors

  planned_openapi:
    name: Planned OpenAPI
    if: needs.changes.outputs.planned_openapi == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Validate planned OpenAPI
        run: ./gradlew validatePlannedOpenApi

  mobile:
    name: Mobile shared client
    if: needs.changes.outputs.mobile == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Check Mobile shared
        run: ./gradlew :apps:mobile:shared:check

  public_client:
    name: Public client contract
    if: needs.changes.outputs.public_client == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Generate and compile the public KMP client
        run: ./gradlew compileKmpPublicClient

  identity_container:
    name: Identity image build
    if: github.event_name == 'pull_request' && needs.changes.outputs.identity_container == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/identity.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cookie/identity-ci:${{ github.sha }}
          cache-from: type=gha,scope=identity-linux-amd64

  notification_container:
    name: Notification image build
    if: github.event_name == 'pull_request' && needs.changes.outputs.notification_container == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/notification.Dockerfile
          platforms: linux/amd64
          push: false
          tags: cookie/notification-ci:${{ github.sha }}
          cache-from: type=gha,scope=notification-linux-amd64

  compose:
    name: Deployment bundle
    if: needs.changes.outputs.compose == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Dockerfiles
        run: |
          for dockerfile in deploy/docker/*.Dockerfile; do
            docker buildx build --check --file "$dockerfile" .
          done
      - name: Validate local development Compose
        run: docker compose -f deploy/docker/compose.yaml config
      - name: Validate Make targets
        run: >-
          make --dry-run
          dev-build-identity
          dev-build-notification
          dev-build-notification-sink
          dev-up
          dev-down
      - name: Validate production deployment bundle
        env:
          IDENTITY_IMAGE: cr.yandex/crp00000000000000000/identity@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NOTIFICATION_IMAGE: cr.yandex/crp00000000000000000/notification@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          set -Eeuo pipefail
          docker compose \
            --env-file deploy/production/.env.example \
            --file deploy/production/compose.yaml \
            config
          COOKIE_FCM_ENABLED=true docker compose \
            --env-file deploy/production/.env.example \
            --file deploy/production/compose.yaml \
            --file deploy/production/compose.fcm.yaml config
          for script in \
            deploy/production/deploy.sh \
            deploy/production/scripts/identity-healthcheck.sh \
            deploy/production/scripts/notification-healthcheck.sh \
            deploy/docker/verify-pinned-images.sh; do
            bash -n "$script"
          done
          for script in \
            deploy/production/scripts/nats-init.sh \
            deploy/production/scripts/postgres-init-identity.sh \
            deploy/production/scripts/postgres-provision-notification.sh \
            deploy/production/scripts/redis-entrypoint.sh; do
            sh -n "$script"
          done
          jq --exit-status . deploy/production/config/cookie-events.json >/dev/null
          jq --exit-status . deploy/production/config/notification-consumer.json >/dev/null
      - name: Test production deployment lifecycle
        env:
          COOKIE_DEPLOY_CONTAINER_TESTS: "1"
        run: |
          python3 .github/scripts/test-production-deploy.py
          python3 .github/scripts/test-notification-deployment.py
      - name: Test immutable image verification
        run: python3 .github/scripts/test-pinned-images.py
      - name: Verify immutable external image manifests
        run: >-
          deploy/docker/verify-pinned-images.sh
          deploy/docker/compose.yaml
          deploy/production/compose.yaml
          deploy/docker/*.Dockerfile

  production_rehearsal:
    name: Production deployment rehearsal
    if: >-
      needs.changes.outputs.compose == 'true' ||
      needs.changes.outputs.identity_container == 'true' ||
      needs.changes.outputs.notification_container == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the actual Identity image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/identity.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: cookie/identity-rehearsal:${{ github.sha }}
          cache-from: type=gha,scope=identity-linux-amd64
      - name: Build and load the actual Notification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/notification.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: cookie/notification-rehearsal:${{ github.sha }}
          cache-from: type=gha,scope=notification-linux-amd64
      - name: Prepare synthetic fixture tooling
        run: |
          python3 -m venv .cache/production-test-venv
          .cache/production-test-venv/bin/pip install -r .github/scripts/production-test-requirements.txt
      - name: Exercise the production bundle on the disposable runner
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,PATH .cache/production-test-venv/bin/python
          .github/scripts/test-production-containers.py
          --identity-image cookie/identity-rehearsal:${{ github.sha }}
          --notification-image cookie/notification-rehearsal:${{ github.sha }}

  terraform:
    name: Terraform
    if: needs.changes.outputs.terraform == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
      - name: Test production cloud-init
        run: python3 .github/scripts/test-cloud-init.py
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/dev init -backend=false
      - run: terraform -chdir=infra/terraform/environments/dev validate
      - run: terraform -chdir=infra/terraform/environments/production init -backend=false
      - run: terraform -chdir=infra/terraform/environments/production validate

  architecture_explorer:
    name: Architecture snapshot and generator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline architecture documentation
        run: make architecture-check

  ci_required:
    name: CI required
    if: always()
    needs:
      - changes
      - legacy_api
      - backend_platform
      - identity
      - nutrition
      - notification
      - notification_sink
      - service_contracts
      - planned_openapi
      - public_client
      - mobile
      - identity_container
      - notification_container
      - compose
      - production_rehearsal
      - terraform
      - architecture_explorer
    runs-on: ubuntu-24.04
    steps:
      - name: Require every affected check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ARCHITECTURE_EXPLORER_RESULT: ${{ needs.architecture_explorer.result }}
          LEGACY_API_EXPECTED: ${{ needs.changes.outputs.go_api }}
          LEGACY_API_RESULT: ${{ needs.legacy_api.result }}
          BACKEND_PLATFORM_EXPECTED: ${{ needs.changes.outputs.platform }}
          BACKEND_PLATFORM_RESULT: ${{ needs.backend_platform.result }}
          PLATFORM_WEB_SELECTED: ${{ needs.changes.outputs.platform_web }}
          PLATFORM_POSTGRES_SELECTED: ${{ needs.changes.outputs.platform_postgres }}
          PLATFORM_MESSAGING_SELECTED: ${{ needs.changes.outputs.platform_messaging }}
          PLATFORM_TESTING_SELECTED: ${{ needs.changes.outputs.platform_testing }}
          NUTRITION_EXPECTED: ${{ needs.changes.outputs.nutrition }}
          NUTRITION_RESULT: ${{ needs.nutrition.result }}
          IDENTITY_EXPECTED: ${{ needs.changes.outputs.identity }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          NOTIFICATION_EXPECTED: ${{ needs.changes.outputs.notification }}
          NOTIFICATION_RESULT: ${{ needs.notification.result }}
          NOTIFICATION_CONTAINER_EXPECTED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.notification_container == 'true' }}
          NOTIFICATION_CONTAINER_RESULT: ${{ needs.notification_container.result }}
          NOTIFICATION_IMAGE_SELECTED: ${{ needs.changes.outputs.notification_image }}
          NOTIFICATION_CONTAINER_SELECTED: ${{ needs.changes.outputs.notification_container }}
          NOTIFICATION_SINK_EXPECTED: ${{ needs.changes.outputs.notification_sink }}
          NOTIFICATION_SINK_RESULT: ${{ needs.notification_sink.result }}
          SERVICE_CONTRACTS_EXPECTED: ${{ needs.changes.outputs.service_contracts }}
          SERVICE_CONTRACTS_RESULT: ${{ needs.service_contracts.result }}
          PLANNED_OPENAPI_EXPECTED: ${{ needs.changes.outputs.planned_openapi }}
          PLANNED_OPENAPI_RESULT: ${{ needs.planned_openapi.result }}
          PUBLIC_CLIENT_EXPECTED: ${{ needs.changes.outputs.public_client }}
          PUBLIC_CLIENT_RESULT: ${{ needs.public_client.result }}
          MOBILE_EXPECTED: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          IDENTITY_CONTAINER_EXPECTED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.identity_container == 'true' }}
          IDENTITY_CONTAINER_RESULT: ${{ needs.identity_container.result }}
          COMPOSE_EXPECTED: ${{ needs.changes.outputs.compose }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          PRODUCTION_REHEARSAL_EXPECTED: ${{ needs.changes.outputs.compose == 'true' || needs.changes.outputs.identity_container == 'true' || needs.changes.outputs.notification_container == 'true' }}
          PRODUCTION_REHEARSAL_RESULT: ${{ needs.production_rehearsal.result }}
          TERRAFORM_EXPECTED: ${{ needs.changes.outputs.terraform }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          IDENTITY_IMAGE_SELECTED: ${{ needs.changes.outputs.identity_image }}
          IDENTITY_CONTAINER_SELECTED: ${{ needs.changes.outputs.identity_container }}
        run: |
          failures=()

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            failures+=("changes:${CHANGES_RESULT}")
          else
            for selection in \
              "go_api:${LEGACY_API_EXPECTED}" \
              "platform:${BACKEND_PLATFORM_EXPECTED}" \
              "platform_web:${PLATFORM_WEB_SELECTED}" \
              "platform_postgres:${PLATFORM_POSTGRES_SELECTED}" \
              "platform_messaging:${PLATFORM_MESSAGING_SELECTED}" \
              "platform_testing:${PLATFORM_TESTING_SELECTED}" \
              "nutrition:${NUTRITION_EXPECTED}" \
              "identity:${IDENTITY_EXPECTED}" \
              "notification:${NOTIFICATION_EXPECTED}" \
              "notification_image:${NOTIFICATION_IMAGE_SELECTED}" \
              "notification_container:${NOTIFICATION_CONTAINER_SELECTED}" \
              "notification_sink:${NOTIFICATION_SINK_EXPECTED}" \
              "service_contracts:${SERVICE_CONTRACTS_EXPECTED}" \
              "planned_openapi:${PLANNED_OPENAPI_EXPECTED}" \
              "public_client:${PUBLIC_CLIENT_EXPECTED}" \
              "mobile:${MOBILE_EXPECTED}" \
              "compose:${COMPOSE_EXPECTED}" \
              "terraform:${TERRAFORM_EXPECTED}" \
              "identity_image:${IDENTITY_IMAGE_SELECTED}" \
              "identity_container:${IDENTITY_CONTAINER_SELECTED}"; do
              IFS=: read -r name selected <<< "$selection"
              if [[ "$selected" != "true" && "$selected" != "false" ]]; then
                failures+=("${name}:invalid-selector-output-${selected:-empty}")
              fi
            done

            if [[ "$BACKEND_PLATFORM_EXPECTED" == "true" && \
              "$PLATFORM_WEB_SELECTED" != "true" && \
              "$PLATFORM_POSTGRES_SELECTED" != "true" && \
              "$PLATFORM_MESSAGING_SELECTED" != "true" && \
              "$PLATFORM_TESTING_SELECTED" != "true" ]]; then
              failures+=("platform:no-module-selected")
            fi
            if [[ "$BACKEND_PLATFORM_EXPECTED" == "false" && ( \
              "$PLATFORM_WEB_SELECTED" == "true" || \
              "$PLATFORM_POSTGRES_SELECTED" == "true" || \
              "$PLATFORM_MESSAGING_SELECTED" == "true" || \
              "$PLATFORM_TESTING_SELECTED" == "true" ) ]]; then
              failures+=("platform:module-selected-without-job")
            fi
            if [[ "$NOTIFICATION_IMAGE_SELECTED" == "true" && "$NOTIFICATION_CONTAINER_SELECTED" != "true" ]]; then
              failures+=("notification_image:container-validation-not-selected")
            fi
            if [[ "$IDENTITY_IMAGE_SELECTED" == "true" && "$IDENTITY_CONTAINER_SELECTED" != "true" ]]; then
              failures+=("identity_image:container-validation-not-selected")
            fi
          fi

          for check in \
            "architecture_explorer:true:${ARCHITECTURE_EXPLORER_RESULT}" \
            "legacy_api:${LEGACY_API_EXPECTED}:${LEGACY_API_RESULT}" \
            "backend_platform:${BACKEND_PLATFORM_EXPECTED}:${BACKEND_PLATFORM_RESULT}" \
            "nutrition:${NUTRITION_EXPECTED}:${NUTRITION_RESULT}" \
            "identity:${IDENTITY_EXPECTED}:${IDENTITY_RESULT}" \
            "notification:${NOTIFICATION_EXPECTED}:${NOTIFICATION_RESULT}" \
            "notification_container:${NOTIFICATION_CONTAINER_EXPECTED}:${NOTIFICATION_CONTAINER_RESULT}" \
            "notification_sink:${NOTIFICATION_SINK_EXPECTED}:${NOTIFICATION_SINK_RESULT}" \
            "service_contracts:${SERVICE_CONTRACTS_EXPECTED}:${SERVICE_CONTRACTS_RESULT}" \
            "planned_openapi:${PLANNED_OPENAPI_EXPECTED}:${PLANNED_OPENAPI_RESULT}" \
            "public_client:${PUBLIC_CLIENT_EXPECTED}:${PUBLIC_CLIENT_RESULT}" \
            "mobile:${MOBILE_EXPECTED}:${MOBILE_RESULT}" \
            "identity_container:${IDENTITY_CONTAINER_EXPECTED}:${IDENTITY_CONTAINER_RESULT}" \
            "compose:${COMPOSE_EXPECTED}:${COMPOSE_RESULT}" \
            "production_rehearsal:${PRODUCTION_REHEARSAL_EXPECTED}:${PRODUCTION_REHEARSAL_RESULT}" \
            "terraform:${TERRAFORM_EXPECTED}:${TERRAFORM_RESULT}"; do
            IFS=: read -r name expected result <<< "$check"
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              failures+=("${name}:expected-${expected}:got-${result}")
            elif [[ "$expected" != "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              failures+=("${name}:expected-${expected:-false}:got-${result}")
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf 'Required CI check failed: %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "Every affected check passed."

  publish_identity:
    name: Publish Identity image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.identity_image == 'true' &&
      needs.ci_required.result == 'success'
    needs: [changes, ci_required]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-service-image.yml
    with:
      service_name: identity
      image_repository: identity
      context: .
      dockerfile: deploy/docker/identity.Dockerfile

  publish_notification:
    name: Publish Notification image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.notification_image == 'true' &&
      needs.ci_required.result == 'success'
    needs: [changes, ci_required]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-service-image.yml
    with:
      service_name: notification
      image_repository: notification
      context: .
      dockerfile: deploy/docker/notification.Dockerfile
