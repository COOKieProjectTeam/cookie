schema_version: 1
id: notification
runtime: kotlin_jvm
stateful: true
database: notification
public_openapi:
  source: contracts/openapi/public/notification.yaml
runtime_openapi: contracts/openapi/runtime.yaml
messaging:
  publishes: []
  consumes:
    - type: account.deletion.requested
      version: 1
    - type: notification.email.requested
      version: 1
    - type: account.activated
      version: 1
    - type: nutrition.meal.created
      version: 1
    - type: nutrition.meal.updated
      version: 1
    - type: nutrition.meal.deleted
      version: 1
    - type: nutrition.water.changed
      version: 1
    - type: health.weight.changed
      version: 1
    - type: user.profile.updated
      version: 1
    - type: progress.day.updated
      version: 1
synchronous_dependencies: [identity]
infrastructure_dependencies: [postgresql, nats_jetstream, redis, notification_decryption_key, identity_jwks]
probes:
  liveness: /healthz
  readiness: /readyz
ci: {
  "check": "notification",
  "image": "notification_image",
  "runtime_inputs": [
    "backend/platform/starter-web/**",
    "backend/platform/starter-postgres/**",
    "backend/platform/starter-messaging/**",
    "backend/clients/identity/**",
    "contracts/openapi/public/notification.yaml",
    "contracts/openapi/runtime.yaml",
    "contracts/openapi/generation.yaml"
  ],
  "test_inputs": [
    "backend/platform/starter-testing/**",
    "backend/services/identity/**/src/main/**",
    "backend/services/identity/src/main/**",
    "backend/services/identity/**/build.gradle.kts",
    "backend/services/identity/build.gradle.kts",
    "contracts/openapi/public/identity.yaml",
    "docs/architecture/model/events.yaml"
  ],
  "descriptor_outputs": ["service_contracts", "compose"]
}
