spring:
  application:
    name: identity
  datasource:
    url: ${COOKIE_IDENTITY_DATABASE_URL}
    username: ${COOKIE_IDENTITY_DATABASE_USER}
    password: ${COOKIE_IDENTITY_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${COOKIE_IDENTITY_DATABASE_POOL_SIZE:10}
      connection-timeout: ${COOKIE_IDENTITY_DATABASE_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${COOKIE_IDENTITY_DATABASE_VALIDATION_TIMEOUT_MS:1000}
      data-source-properties:
        options: "${COOKIE_IDENTITY_DATABASE_OPTIONS:-c statement_timeout=5000 -c lock_timeout=2000}"
        socketTimeout: ${COOKIE_IDENTITY_DATABASE_SOCKET_TIMEOUT_SECONDS:10}
        tcpKeepAlive: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: identity-scheduler-

server:
  port: ${PORT:8080}
  # Forwarded headers are ignored until the deployment defines a trusted proxy boundary.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      # Runtime probes are implemented by SystemController. Do not publish the
      # duplicate Actuator transport on the service port.
      exposure:
        exclude: "*"

cookie:
  identity:
    access-token-ttl: PT15M
    refresh-family-ttl: P30D
    registration-attempt-ttl: P1D
    verification-token-ttl: PT30M
    verification-resend-cooldown: PT1M
    issuer: https://api.cookie.app
    audience: cookie-api
    jwt-private-key-path: ${COOKIE_IDENTITY_JWT_PRIVATE_KEY_PATH:}
    jwt-retiring-public-key-paths: ${COOKIE_IDENTITY_JWT_RETIRING_PUBLIC_KEY_PATHS:}
    notification-public-key-path: ${COOKIE_NOTIFICATION_PUBLIC_KEY_PATH:}
    dev-notification-private-key-output-path: ${COOKIE_DEV_NOTIFICATION_PRIVATE_KEY_OUTPUT_PATH:}
    nats-url: ${COOKIE_NATS_URL}
    nats-credentials-path: ${COOKIE_NATS_CREDENTIALS_PATH:}
    nats-truststore-path: ${COOKIE_NATS_TRUSTSTORE_PATH:}
    nats-truststore-password: ${COOKIE_NATS_TRUSTSTORE_PASSWORD:}
    # Shared base64url-encoded 32-byte secret for pseudonymous rate-limit scopes.
    # Production fails closed when it is absent; dev/test use a fixed non-secret fallback.
    rate-limit-hmac-key: ${COOKIE_IDENTITY_RATE_LIMIT_HMAC_KEY:}
    # Comma-separated CIDRs of ingress proxies allowed to supply X-Forwarded-For.
    # Keep empty when clients connect directly to Identity.
    trusted-proxy-cidrs: ${COOKIE_IDENTITY_TRUSTED_PROXY_CIDRS:}
    database:
      transaction-timeout: PT5S
      lock-timeout: PT2S
    retention:
      poll-delay: PT1M
      rate-limit-grace: P1D
      completed-registration-attempt-audit: P30D
      abandoned-registration-attempt-audit: P30D
      refresh-family-audit: P90D
      published-outbox: P7D
      batch-size: 500
      max-batches-per-run: 400
      max-run-duration: PT30S

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
