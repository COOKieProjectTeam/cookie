schema_version: 1
id: health
runtime: kotlin_jvm
stateful: true
database: health
public_openapi:
  source: contracts/openapi/public/health.yaml
runtime_openapi: contracts/openapi/runtime.yaml
messaging:
  publishes:
    - type: health.goal_assessment.resolved
      version: 1
    - type: health.weight.changed
      version: 2
    - type: health.connection_summary.changed
      version: 1
    - type: health.activity.changed
      version: 2
  consumes:
    - type: user.goal_assessment.requested
      version: 1
    - type: account.deletion.requested
      version: 1
    - type: account.activated
      version: 1
synchronous_dependencies: [identity]
infrastructure_dependencies: [postgresql, nats_jetstream, identity_jwks]
probes:
  liveness: /healthz
  readiness: /readyz
ci: {
  "check": "health",
  "image": null,
  "runtime_inputs": [
    "backend/contracts/health-assessment/**",
    "backend/platform/starter-web/**",
    "backend/platform/starter-postgres/**",
    "backend/platform/starter-messaging/**",
    "contracts/openapi/public/health.yaml",
    "contracts/openapi/runtime.yaml",
    "contracts/openapi/generation.yaml"
  ],
  "test_inputs": [
    "backend/services/identity/**",
    "backend/services/user/**",
    "backend/services/notification/**",
    "contracts/openapi/public/identity.yaml",
    "contracts/openapi/public/user.yaml",
    "contracts/openapi/public/notification.yaml",
    "deploy/docker/health.Caddyfile",
    "backend/platform/starter-testing/**",
    "docs/architecture/model/events.yaml"
  ],
  "descriptor_outputs": ["service_contracts"]
}
