server_name: cookie-production-nats
listen: 0.0.0.0:4222
http_port: 8222

max_payload: 1MiB
write_deadline: 10s
lame_duck_duration: 30s
lame_duck_grace_period: 10s

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MiB
  max_file_store: 2GiB
}

tls {
  cert_file: /run/secrets/nats-server.crt
  key_file: /run/secrets/nats-server.key
  ca_file: /run/secrets/nats-ca.crt
  verify: false
  timeout: 2s
}

# Generated and installed on the server. It must configure an operator, a
# system account and an in-memory resolver containing the application account.
include /run/secrets/nats-auth.conf
