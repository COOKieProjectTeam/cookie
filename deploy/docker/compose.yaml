services:
  legacy-api:
    profiles: [legacy]
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"

  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - identity-postgres:/var/lib/postgresql

  nats:
    image: nats:2.14.6-alpine3.22@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/identity.Dockerfile
    environment:
      COOKIE_IDENTITY_DATABASE_URL: jdbc:postgresql://postgres:5432/identity
      COOKIE_IDENTITY_DATABASE_USER: identity
      COOKIE_IDENTITY_DATABASE_PASSWORD: identity
      COOKIE_NATS_URL: nats://nats:4222
      SPRING_PROFILES_ACTIVE: dev
      COOKIE_IDENTITY_BIND_ADDRESS: 0.0.0.0
      COOKIE_DEV_NOTIFICATION_PRIVATE_KEY_OUTPUT_PATH: /keys/notification-private.jwk
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dev-keys:/keys

  notification-db-provision:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    entrypoint: ["/bin/sh", "/config/provision.sh"]
    environment:
      COOKIE_DEV_DATABASE_PROVISIONING: "true"
      PGHOST: postgres
      PGUSER: identity
      PGDATABASE: identity
      PGPASSWORD: identity
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../production/scripts/postgres-provision-notification.sh:/config/provision.sh:ro

  redis:
    image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

  notification:
    build:
      context: ../..
      dockerfile: deploy/docker/notification.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      COOKIE_NOTIFICATION_BIND_ADDRESS: 0.0.0.0
      PORT: "8080"
      COOKIE_NOTIFICATION_DATABASE_URL: jdbc:postgresql://postgres:5432/notification
      COOKIE_NOTIFICATION_DATABASE_USER: notification_app
      COOKIE_NOTIFICATION_DATABASE_PASSWORD: notification
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_FLYWAY_USER: notification_migrator
      SPRING_FLYWAY_PASSWORD: notification_migrator
      COOKIE_NATS_URL: nats://nats:4222
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      COOKIE_IDENTITY_JWKS_URL: http://identity:8080/v1/auth/jwks
      COOKIE_NOTIFICATION_PRIVATE_KEY_PATH: /keys/notification-private.jwk
      COOKIE_SMTP_HOST: mailpit
      COOKIE_SMTP_PORT: "1025"
      COOKIE_SMTP_FROM: noreply@cookie.local
      COOKIE_SMTP_MESSAGE_ID_DOMAIN: cookie.local
      COOKIE_SMTP_STARTTLS_REQUIRED: "false"
      COOKIE_NOTIFICATION_VERIFICATION_LINK_BASE_URL: https://cookie.invalid/verify-email
      COOKIE_FCM_ENABLED: "false"
    depends_on:
      notification-db-provision:
        condition: service_completed_successfully
      identity:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - dev-keys:/keys:ro

  notification-sink:
    profiles: [legacy-sink]
    build:
      context: ../..
      dockerfile: deploy/docker/notification-sink.Dockerfile
    environment:
      COOKIE_NATS_URL: nats://nats:4222
      COOKIE_NOTIFICATION_PRIVATE_KEY_PATH: /keys/notification-private.jwk
      COOKIE_SMTP_HOST: mailpit
      COOKIE_SMTP_PORT: "1025"
    depends_on:
      identity:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - dev-keys:/keys:ro

volumes:
  identity-postgres:
  nats-data:
  dev-keys:
