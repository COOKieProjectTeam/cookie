openapi: 3.0.3
x-contract-status: roadmap-only
info:
  title: COOKie API roadmap (non-active)
  version: 0.2.0
  description: >
    Неактивный roadmap целевого API; этот файл не используется для генерации
    server interfaces или клиентов. Публичный контракт мобильного/админ клиента к API Gateway / Mobile BFF.
    Все ручки проходят через Gateway; клиент никогда не обращается к
    внутренним сервисам, PostgreSQL, Redis или NATS напрямую.
servers:
  - url: https://api.cookie.app/v1
    description: Production
  - url: http://127.0.0.1:8080/v1
    description: Local
tags:
  - name: system
    description: API Gateway operational availability; not owned by Health Data Service.
  - name: auth
    description: Email/password authentication and session lifecycle.
  - name: profile
    description: Profile, goals, and dietary preferences.
  - name: food
    description: Food catalog and product lookup.
  - name: diary
    description: Meals, food entries, saved dishes, and water.
  - name: recipes
    description: Recipe discovery, personalization, and cooking.
  - name: shopping
    description: Shopping cart and ingredient list.
  - name: health
    description: Domain health data such as activity and weight measurements.
  - name: progress
    description: Event-driven nutrition and health progress read models.
  - name: notifications
    description: Push devices and notification preferences.
  - name: media
    description: Media upload, retrieval, and deletion.
  - name: meal-plan
    description: Asynchronous meal-plan generation and execution.
  - name: bff
    description: Aggregated Mobile BFF screens.

paths:
  # ---------------------------------------------------------------- system
  /healthz:
    get:
      tags: [system]
      operationId: getGatewayHealth
      summary: Проверить liveness публичного API Gateway
      description: >-
        Эксплуатационная проба Gateway. Она не вызывает и не относится к
        доменному Health Data Service.
      security: []
      responses:
        "200":
          description: API доступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"

  # ---------------------------------------------------------------- bff
  /today:
    get:
      tags: [bff]
      operationId: getToday
      summary: Агрегированный экран "Сегодня" (Mobile BFF)
      parameters:
        - $ref: "#/components/parameters/DateQuery"
      responses:
        "200":
          description: Сводка дня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- auth
  /auth/email/register:
    post:
      tags: [auth]
      operationId: registerWithEmail
      summary: Зарегистрироваться по email и паролю
      description: >-
        Создаёт аккаунт с неподтверждённым email и отправляет одноразовую ссылку
        подтверждения. Ответ одинаков для нового и уже зарегистрированного email,
        чтобы не раскрывать наличие аккаунта. Токены выдаются только после
        подтверждения email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRegistrationRequest"
      responses:
        "202":
          description: Если действие допустимо, письмо подтверждения будет отправлено
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/email/login:
    post:
      tags: [auth]
      operationId: loginWithEmail
      summary: Войти по email и паролю
      description: >-
        Возвращает одинаковую ошибку для неизвестного email, неверного пароля,
        неподтверждённого email и недоступного аккаунта, чтобы не позволять
        перечислять зарегистрированные адреса.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginRequest"
      responses:
        "200":
          description: Токены выданы, refresh-сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairWithUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/email/verification/confirm:
    post:
      tags: [auth]
      operationId: confirmEmail
      summary: Подтвердить email одноразовым токеном
      description: >-
        Одноразово поглощает verification token, помечает email подтверждённым и
        создаёт первую refresh-сессию.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationConfirmRequest"
      responses:
        "200":
          description: Email подтверждён, токены выданы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairWithUser"
        "400":
          description: Токен недействителен, уже использован или истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/email/verification/resend:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Повторно отправить подтверждение email
      description: >-
        Всегда возвращает одинаковый ответ независимо от существования аккаунта и
        состояния email. Предыдущие неиспользованные verification tokens отзываются.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailActionRequest"
      responses:
        "202":
          description: Если действие допустимо, письмо будет отправлено
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Обновить пару токенов (refresh token rotation)
      description: >-
        Одноразово использует текущий refresh token и возвращает новую пару.
        Повторное использование уже ротированного токена считается replay:
        Identity отзывает всё семейство refresh-сессии.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token недействителен, отозван, уже использован или истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить одну сессию
      description: Refresh token сам аутентифицирует завершаемую сессию.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Сессия завершена или уже была завершена
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/jwks:
    get:
      tags: [auth]
      operationId: getIdentityJwks
      summary: Получить публичные ключи подписи access JWT
      description: Возвращает активный и retiring ES256 ключи для локальной проверки access JWT.
      security: []
      responses:
        "200":
          description: JSON Web Key Set
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebKeySet"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------- profile
  /me/onboarding:
    post:
      tags: [profile]
      operationId: completeOnboarding
      summary: Завершить онбординг и рассчитать первоначальную норму
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Профиль и рассчитанная цель
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: Получить профиль пользователя
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [profile]
      operationId: updateProfile
      summary: Частично обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/goals/current:
    get:
      tags: [profile]
      operationId: getCurrentGoal
      summary: Получить текущую цель по КБЖУ
      responses:
        "200":
          description: Текущая цель
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionGoal"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [profile]
      operationId: setCurrentGoal
      summary: Задать новую цель (создаёт новую версию, не перезаписывает старую)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionGoalInput"
      responses:
        "200":
          description: Новая версия цели создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionGoal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/goals/history:
    get:
      tags: [profile]
      operationId: getGoalHistory
      summary: Получить историю версий цели
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Список версий цели
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/goals/overrides/{date}:
    parameters:
      - $ref: "#/components/parameters/DatePath"
    put:
      tags: [profile]
      operationId: setDailyGoalOverride
      summary: Задать override целей на конкретный день (в т.ч. cheat day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyGoalOverrideInput"
      responses:
        "200":
          description: Override создан/обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyGoalOverride"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Лимит cheat day на месяц уже достигнут
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: CHEAT_DAY_LIMIT_REACHED
                message: Only one cheat day is allowed per calendar month.
    delete:
      tags: [profile]
      operationId: deleteDailyGoalOverride
      summary: Удалить override на день
      responses:
        "204":
          description: Override удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- food
  /foods/search:
    get:
      tags: [food]
      operationId: searchFoods
      summary: Поиск продуктов (custom foods + Open Food Facts)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Результаты поиска
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /foods/barcodes/{barcode}:
    get:
      tags: [food]
      operationId: getFoodByBarcode
      summary: Найти продукт по штрихкоду через Open Food Facts
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Найденный продукт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenFoodFactsItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /foods/custom:
    get:
      tags: [food]
      operationId: listCustomFoods
      summary: Список пользовательских продуктов
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Список продуктов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFoodPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [food]
      operationId: createCustomFood
      summary: Создать пользовательский продукт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFoodInput"
      responses:
        "201":
          description: Продукт создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFood"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /foods/custom/{foodId}:
    parameters:
      - name: foodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [food]
      operationId: getCustomFood
      summary: Получить пользовательский продукт
      responses:
        "200":
          description: Продукт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFood"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [food]
      operationId: updateCustomFood
      summary: Частично обновить пользовательский продукт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFoodPatch"
      responses:
        "200":
          description: Обновлённый продукт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFood"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [food]
      operationId: deleteCustomFood
      summary: Удалить пользовательский продукт (soft delete / archived)
      responses:
        "204":
          description: Продукт архивирован
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- diary
  /diary/days/{date}:
    get:
      tags: [diary]
      operationId: getDiaryDay
      summary: Получить дневник за день
      parameters:
        - $ref: "#/components/parameters/DatePath"
      responses:
        "200":
          description: Дневник дня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryDay"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /diary/meals:
    post:
      tags: [diary]
      operationId: createMeal
      summary: Создать приём пищи целиком (meal + dishes + items)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealInput"
      responses:
        "200":
          description: Ранее созданный приём пищи возвращён по clientGeneratedId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealCreatedResponse"
        "201":
          description: Приём пищи создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /diary/meals/{mealId}:
    parameters:
      - name: mealId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [diary]
      operationId: updateMeal
      summary: Изменить приём пищи (optimistic locking по version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPatch"
      responses:
        "200":
          description: Обновлённый приём пищи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [diary]
      operationId: deleteMeal
      summary: Удалить приём пищи
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "204":
          description: Приём пищи удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /diary/meals/{mealId}/dishes:
    parameters:
      - name: mealId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [diary]
      operationId: addDishToMeal
      summary: Добавить блюдо в приём пищи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishInput"
      responses:
        "201":
          description: Блюдо создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /diary/dishes/{dishId}:
    parameters:
      - name: dishId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [diary]
      operationId: updateDish
      summary: Изменить блюдо
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishPatch"
      responses:
        "200":
          description: Обновлённое блюдо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [diary]
      operationId: deleteDish
      summary: Удалить блюдо
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "204":
          description: Блюдо удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /diary/dishes/{dishId}/items:
    parameters:
      - name: dishId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [diary]
      operationId: addFoodEntry
      summary: Добавить редактируемый снапшот продукта в блюдо
      description: >-
        Клиент передаёт данные продукта и КБЖУ на 100 г/мл целиком. Nutrition
        сохраняет собственный снапшот и не обращается к Food Catalog при записи.
        Поле source используется только как provenance и не считается доверенным
        источником нутриентов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntryInput"
      responses:
        "201":
          description: Запись создана со снапшотом нутриентов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /diary/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [diary]
      operationId: updateFoodEntry
      summary: Изменить количество или снапшот записи о еде
      description: >-
        Позволяет исправить название, бренд, размер порции и КБЖУ даже после
        создания записи. Nutrition пересчитывает итоговые нутриенты из актуального
        снапшота и количества; повторного resolve в Food Catalog нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodEntryPatch"
      responses:
        "200":
          description: Обновлённая запись
          content:
            application/json:
