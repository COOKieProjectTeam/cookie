  # ---------------------------------------------------------------- recipes
  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      summary: Список рецептов с фильтрами
      parameters:
        - name: mealType
          in: query
          schema:
            $ref: "#/components/schemas/MealType"
        - name: diet
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/DietType"
        - name: maxCookingMinutes
          in: query
          schema:
            type: integer
            minimum: 1
        - name: maxCalories
          in: query
          schema:
            type: integer
            minimum: 1
        - name: minProteinG
          in: query
          schema:
            type: integer
            minimum: 0
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/Difficulty"
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: liked
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [TOTAL_TIME_ASC, CALORIES_ASC, CALORIES_DESC, PROTEIN_DESC]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница рецептов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /recipes/{recipeId}:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [recipes]
      operationId: getRecipe
      summary: Получить рецепт (персонализированный, с учётом кастомизации пользователя)
      responses:
        "200":
          description: Рецепт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ingredients/search:
    get:
      tags: [recipes]
      operationId: searchIngredients
      summary: Поиск канонических ингредиентов (для редактирования рецепта)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Результаты поиска
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /recipes/{recipeId}/customization:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [recipes]
      operationId: setRecipeCustomization
      summary: Задать пользовательскую кастомизацию ингредиентов рецепта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCustomizationInput"
      responses:
        "200":
          description: Рецепт с пересчитанным КБЖУ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [recipes]
      operationId: deleteRecipeCustomization
      summary: Сбросить кастомизацию, вернуться к оригинальному рецепту
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      responses:
        "204":
          description: Кастомизация удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/favorite:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [recipes]
      operationId: setRecipeFavorite
      summary: Добавить/убрать рецепт из избранного
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeUserState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /recipes/{recipeId}/feedback:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [recipes]
      operationId: setRecipeFeedback
      summary: Оставить фидбек по рекомендации (не влияет на favorite)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
                  enum: [LIKE, DO_NOT_RECOMMEND, NONE]
      responses:
        "200":
          description: Фидбек сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeUserState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /recipes/{recipeId}/cooking-sessions:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recipes]
      operationId: startCookingSession
      summary: Начать готовку по рецепту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servings]
              properties:
                servings:
                  type: number
                  format: double
                  minimum: 0.1
      responses:
        "201":
          description: Сессия готовки создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cooking-sessions/{sessionId}/complete:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recipes]
      operationId: completeCookingSession
      summary: Завершить сессию готовки
      responses:
        "200":
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cooking-sessions/{sessionId}/cancel:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recipes]
      operationId: cancelCookingSession
      summary: Отменить незавершённую сессию готовки
      responses:
        "200":
          description: Сессия отменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /cooking-history:
    get:
      tags: [recipes]
      operationId: getCookingHistory
      summary: История сессий готовки
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CookingSession"
                  nextCursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- shopping
  /cart:
    get:
      tags: [shopping]
      operationId: getCart
      summary: Получить корзину рецептов и список покупок
      responses:
        "200":
          description: Корзина
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart/recipes:
    post:
      tags: [shopping]
      operationId: addRecipeToCart
      summary: Добавить рецепт в корзину (снапшот ингредиентов через Recipe Service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              required: [recipeId, servings]
              properties:
                recipeId:
                  type: string
                  format: uuid
                servings:
                  type: number
                  format: double
                  minimum: 0.1
      responses:
        "201":
          description: Рецепт добавлен в корзину
          content:
            application/json:
              schema:
                type: object
                properties:
                  cartRecipe:
                    $ref: "#/components/schemas/CartRecipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart/recipes/{cartRecipeId}:
    parameters:
      - name: cartRecipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [shopping]
      operationId: updateCartRecipeServings
      summary: Изменить количество порций рецепта в корзине
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servings]
              properties:
                servings:
                  type: number
                  format: double
                  minimum: 0.1
      responses:
        "200":
          description: Обновлённая позиция корзины
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartRecipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [shopping]
      operationId: removeCartRecipe
      summary: Удалить рецепт из корзины
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart/ingredients/{ingredientId}:
    parameters:
      - name: ingredientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [shopping]
      operationId: adjustShoppingIngredient
      summary: Скорректировать позицию списка покупок (что уже есть/докупить)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                haveDeduction:
                  type: number
                  format: double
                  minimum: 0
                extraAmount:
                  type: number
                  format: double
                  minimum: 0
      responses:
        "200":
          description: Обновлённая позиция. buyAmount = max(required-haveDeduction,0)+extraAmount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart/ingredients/{ingredientId}/bought:
    parameters:
      - name: ingredientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [shopping]
      operationId: setIngredientBought
      summary: >
        Отметить позицию купленной. Если требуемое количество выросло после
        отметки, сервер автоматически сбрасывает bought=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bought]
              properties:
                bought:
                  type: boolean
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

