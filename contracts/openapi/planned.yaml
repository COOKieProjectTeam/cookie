    # ------------------------------------------------------------ diary
    FoodRef:
      description: >-
        Неизменяемая ссылка на происхождение данных. Используется для аналитики и
        повторного выбора, но не для получения или проверки КБЖУ во время записи
        в дневник: переданный клиентом снапшот остаётся редактируемым.
      oneOf:
        - type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [CUSTOM]
            id:
              type: string
              format: uuid
        - type: object
          required: [type, barcode]
          properties:
            type:
              type: string
              enum: [OPEN_FOOD_FACTS]
            barcode:
              type: string
              minLength: 1
              maxLength: 32
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [MANUAL]
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [AI]
            recognitionId:
              type: string
              nullable: true
              format: uuid
      discriminator:
        propertyName: type

    FoodEntryInput:
      type: object
      description: >-
        Полный редактируемый снапшот продукта. Его можно получить из Food Catalog,
        ручного ввода или AI, затем скорректировать до отправки. Nutrition валидирует
        значения, сохраняет снапшот и вычисляет nutrition для указанного amount без
        синхронного вызова Food Catalog. Для unit=PIECE нужно передать serving.
      required: [source, name, baseUnit, amount, nutritionPer100]
      properties:
        source:
          $ref: "#/components/schemas/FoodRef"
        name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          nullable: true
          maxLength: 200
        baseUnit:
          type: string
          enum: [G, ML]
        serving:
          $ref: "#/components/schemas/Serving"
        amount:
          $ref: "#/components/schemas/Amount"
        nutritionPer100:
          $ref: "#/components/schemas/NutritionInput"

    FoodEntry:
      type: object
      description: >-
        Сохранённый снапшот. nutrition содержит итог для amount, а
        nutritionPer100 — редактируемую основу расчёта.
      required: [id, source, name, baseUnit, amount, nutritionPer100, nutrition, version]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/FoodRef"
        name:
          type: string
        brand:
          type: string
          nullable: true
        baseUnit:
          type: string
          enum: [G, ML]
        serving:
          $ref: "#/components/schemas/Serving"
        amount:
          $ref: "#/components/schemas/Amount"
        nutritionPer100:
          $ref: "#/components/schemas/Nutrition"
        nutrition:
          $ref: "#/components/schemas/Nutrition"
        version:
          type: integer

    FoodEntryPatch:
      type: object
      description: >-
        Частичное изменение сохранённого снапшота. source не меняется: он хранит
        происхождение первоначальных данных, а не их текущую редакцию. При изменении
        amount, serving или nutritionPer100 Nutrition заново вычисляет nutrition.
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          nullable: true
          maxLength: 200
        baseUnit:
          type: string
          enum: [G, ML]
        serving:
          $ref: "#/components/schemas/Serving"
        amount:
          $ref: "#/components/schemas/Amount"
        nutritionPer100:
          $ref: "#/components/schemas/NutritionInput"

    DishInput:
      type: object
      required: [items]
      properties:
        name:
          type: string
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FoodEntryInput"

    DishPatch:
      type: object
      required: [version]
