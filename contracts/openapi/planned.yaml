      tags: [health]
      operationId: syncDailyActivity
      summary: Синхронизировать агрегированную активность за день (Apple Health / Health Connect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyActivityInput"
      responses:
        "200":
          description: Активность сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyActivity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health/weight:
    get:
