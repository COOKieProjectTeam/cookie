    # ------------------------------------------------------------ progress
    DailyProgress:
      type: object
      required: [date, calories, protein, fat, carbs, fiber, water, activity, weightKg]
      properties:
        date:
          type: string
          format: date
        calories:
          type: object
          required: [consumed, target, burned, unlimitedCalories]
          properties:
            consumed:
              type: number
            target:
              type: number
            burned:
              type: number
            unlimitedCalories:
              type: boolean
        protein:
          type: object
          properties:
            consumedG:
              type: number
            targetG:
              type: number
        fat:
          type: object
          properties:
            consumedG:
              type: number
            targetG:
              type: number
        carbs:
          type: object
          properties:
            consumedG:
              type: number
            targetG:
              type: number
        fiber:
          type: object
          properties:
            consumedG:
              type: number
            targetG:
              type: number
        water:
          type: object
          properties:
            consumedMl:
              type: integer
            targetMl:
              type: integer
        activity:
          type: object
          properties:
            steps:
              type: integer
            activeCalories:
              type: number
        weightKg:
          type: number
          nullable: true

    ProgressRange:
      type: object
      required: [days, summary]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyProgress"
        summary:
          type: object
          required: [averageCalories, averageProteinG, averageFatG, averageCarbsG, averageFiberG, weightChangeKg, averageWaterMl]
          properties:
            averageCalories:
              type: number
            averageProteinG:
              type: number
            averageFatG:
              type: number
            averageCarbsG:
              type: number
            averageFiberG:
              type: number
            weightChangeKg:
              type: number
            averageWaterMl:
              type: number

    # ------------------------------------------------------------ notifications
    PushDeviceInput:
      type: object
      required: [platform, token, deviceId]
      properties:
        platform:
          type: string
          enum: [IOS, ANDROID]
        token:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
          maxLength: 255

    PushDevice:
      allOf:
        - $ref: "#/components/schemas/PushDeviceInput"
        - type: object
          required: [id, enabled]
          properties:
            id:
              type: string
              format: uuid
            enabled:
              type: boolean

    NotificationSettings:
      type: object
      required: [water, food, weighIn, goalWarning, quietHours]
      properties:
        water:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
        food:
          type: object
          required: [enabled, inactiveForMinutes]
          properties:
            enabled:
              type: boolean
            inactiveForMinutes:
              type: integer
        weighIn:
          type: object
          required: [enabled, time]
          properties:
            enabled:
              type: boolean
            time:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              example: "08:00"
        goalWarning:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
        quietHours:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              example: "23:00"
            end:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              example: "08:00"

    NotificationSettingsPatch:
      type: object
      minProperties: 1
      properties:
        water:
          type: object
          minProperties: 1
          properties:
            enabled:
              type: boolean
        food:
          type: object
          minProperties: 1
          properties:
            enabled:
              type: boolean
            inactiveForMinutes:
              type: integer
              minimum: 1
        weighIn:
          type: object
          minProperties: 1
          properties:
            enabled:
              type: boolean
            time:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        goalWarning:
          type: object
          minProperties: 1
          properties:
            enabled:
              type: boolean
        quietHours:
          type: object
          minProperties: 1
          properties:
            start:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
            end:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"

    # ------------------------------------------------------------ media
    MediaUploadRequest:
      type: object
      required: [contentType, purpose, sizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        purpose:
          type: string
          enum: [DISH_PHOTO, RECIPE_PHOTO, SAVED_DISH_PHOTO]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760

    MediaUpload:
      type: object
      required: [mediaId, uploadUrl, uploadMethod, uploadHeaders, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        uploadMethod:
          type: string
          enum: [PUT]
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    MediaObject:
      type: object
      required: [id, purpose, contentType, sizeBytes, status, url]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [DISH_PHOTO, RECIPE_PHOTO, SAVED_DISH_PHOTO]
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, READY, DELETED]
        url:
          type: string
          nullable: true
          format: uri

    # ------------------------------------------------------------ meal-plan
    MealPlanGenerationInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        excludedRecipeIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    # ------------------------------------------------------------ meal-plan
    MealPlanJob:
      type: object
      required: [jobId, from, to, status, progress, mealPlanId, errorCode, createdAt, startedAt, completedAt]
      properties:
        jobId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        progress:
          type: number
          nullable: true
          format: double
          minimum: 0
          maximum: 1
        mealPlanId:
          type: string
          nullable: true
          format: uuid
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          nullable: true
          format: date-time
        completedAt:
          type: string
          nullable: true
          format: date-time

    MealPlanItem:
      type: object
      required: [id, type, recipe, servings]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MealType"
        recipe:
          $ref: "#/components/schemas/RecipeSummary"
        servings:
          type: number

    MealPlanDay:
      type: object
      required: [date, meals]
      properties:
        date:
          type: string
          format: date
        meals:
          type: array
          items:
            $ref: "#/components/schemas/MealPlanItem"

    MealPlan:
      type: object
      required: [id, from, to, days]
      properties:
        id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/MealPlanDay"

    PlanIngredient:
      type: object
      required: [ingredientId, name, amount, unit]
      properties:
        ingredientId:
          type: string
          format: uuid
        name:
          type: string
        amount:
          type: number
        unit:
          type: string
          enum: [G, ML]

    MealPlanItemReplacementInput:
      type: object
      required: [excludedRecipeIds]
      properties:
        excludedRecipeIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    CartImportJob:
      type: object
      required: [jobId, status, cartId, errorCode, createdAt, completedAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        cartId:
          type: string
          nullable: true
          format: uuid
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          nullable: true
          format: date-time
