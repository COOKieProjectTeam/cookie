          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [health]
      operationId: addWeightMeasurement
      summary: Создать ручное измерение или idempotent upsert измерения внешнего источника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightMeasurementInput"
      responses:
        "200":
          description: Измерение внешнего источника обновлено по externalId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightMeasurement"
        "201":
          description: Измерение сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightMeasurement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health/weight/{weightId}:
    parameters:
      - name: weightId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [health]
      operationId: updateWeightMeasurement
      summary: Изменить измерение веса (только для source=MANUAL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightMeasurementPatch"
      responses:
        "200":
          description: Обновлённое измерение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightMeasurement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [health]
      operationId: deleteWeightMeasurement
      summary: Удалить измерение веса (только для source=MANUAL)
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- progress
  /progress/days/{date}:
    parameters:
      - $ref: "#/components/parameters/DatePath"
    get:
      tags: [progress]
      operationId: getDailyProgress
      summary: Получить прогресс за день (read model)
      responses:
        "200":
          description: Прогресс дня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /progress:
    get:
      tags: [progress]
      operationId: getProgressRange
      summary: Получить прогресс за диапазон до 366 дней и агрегированную сводку
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Диапазон + сводка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRange"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /progress/weight:
    get:
      tags: [progress]
      operationId: getWeightProgress
      summary: Точки веса за диапазон до 366 дней (read model)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Точки веса
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        weightKg:
                          type: number
                          format: double
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- notifications
  /notifications/devices:
    post:
      tags: [notifications]
      operationId: registerDevice
      summary: Зарегистрировать push-токен устройства
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "200":
          description: Токен существующего устройства обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "201":
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [notifications]
      operationId: unregisterDevice
      summary: Удалить push-токен устройства
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: Получить настройки уведомлений
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Частично обновить настройки уведомлений
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsPatch"
      responses:
        "200":
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- media
  /media/uploads:
    post:
      tags: [media]
      operationId: createMediaUpload
      summary: Запросить presigned URL для загрузки медиа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "201":
          description: Presigned URL выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /media/{mediaId}/complete:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [media]
      operationId: completeMediaUpload
      summary: Подтвердить завершение загрузки в Object Storage
      responses:
        "200":
          description: Медиа готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [media]
      operationId: getMedia
      summary: Получить метаданные и временный URL медиа-объекта
      responses:
        "200":
          description: Медиа-объект
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Удалить медиа-объект
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- meal-plan
  /meal-plan-generations:
    post:
      tags: [meal-plan]
      operationId: startMealPlanGeneration
      summary: Запустить асинхронную генерацию плана питания (premium)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanGenerationInput"
      responses:
        "202":
          description: Задача принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Требуется premium-подписка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /meal-plan-generations/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [meal-plan]
      operationId: getMealPlanGenerationStatus
      summary: Получить статус генерации плана
      responses:
        "200":
          description: Статус задачи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /meal-plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [meal-plan]
      operationId: getMealPlan
      summary: Получить план питания
      responses:
        "200":
          description: План
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /meal-plans/{planId}/items/{itemId}/replace:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [meal-plan]
      operationId: replaceMealPlanItem
      summary: Заменить рецепт в позиции плана (учитывает DO_NOT_RECOMMEND, аллергии, диету, БЖУ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanItemReplacementInput"
      responses:
        "200":
          description: Обновлённая позиция плана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /meal-plans/{planId}/ingredients:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [meal-plan]
      operationId: getMealPlanIngredients
      summary: Предпросмотр ингредиентов плана за диапазон дней
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Список ингредиентов
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingredients:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlanIngredient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /meal-plans/{planId}/add-to-cart:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [meal-plan]
      operationId: addMealPlanToCart
      summary: Добавить рецепты плана за диапазон дней в корзину покупок (batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
      responses:
        "202":
          description: Создана отслеживаемая задача импорта в корзину
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartImportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart/import-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [shopping]
      operationId: getCartImportJob
      summary: Получить статус асинхронного импорта плана в корзину
      responses:
        "200":
          description: Статус импорта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartImportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    DateQuery:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatchRevision:
      name: If-Match-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт версий (optimistic locking) или бизнес-правило
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Слишком много запросов; повторите позднее
      headers:
        Retry-After:
          description: Число секунд до следующей разрешённой попытки
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Сервис временно не готов обрабатывать запросы
      headers:
        Retry-After:
          description: Рекомендуемая задержка перед повтором, в секундах
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ------------------------------------------------------------ common
    ServiceHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_AMOUNT
        message:
          type: string
          example: Amount must be greater than zero.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          format: uuid

    Amount:
      type: object
      required: [value, unit]
      properties:
        value:
          type: number
          format: double
        unit:
          type: string
          enum: [G, ML, PIECE]

    Nutrition:
      type: object
      required: [calories, proteinG, fatG, carbsG, fiberG]
      properties:
        calories:
          type: number
          format: double
        proteinG:
          type: number
          nullable: true
          format: double
        fatG:
          type: number
          nullable: true
          format: double
        carbsG:
          type: number
          nullable: true
          format: double
        fiberG:
          type: number
          nullable: true
          format: double

    NutritionInput:
      type: object
      required: [calories]
      properties:
        calories:
          type: number
          minimum: 0
        proteinG:
          type: number
          nullable: true
          minimum: 0
        fatG:
          type: number
          nullable: true
          minimum: 0
        carbsG:
          type: number
          nullable: true
          minimum: 0
        fiberG:
          type: number
          nullable: true
          minimum: 0

    MealType:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]

    DietType:
      type: string
      enum:
        - BALANCED
        - HIGH_PROTEIN
        - VEGETARIAN
        - VEGAN
        - PESCATARIAN
        - LOW_CARB
        - KETO
        - MEDITERRANEAN
        - GLUTEN_FREE
        - LACTOSE_FREE

    Allergen:
      type: string
      enum:
        - GLUTEN
        - CRUSTACEANS
        - EGGS
        - FISH
        - PEANUTS
        - SOY
        - MILK
        - TREE_NUTS
        - CELERY
        - MUSTARD
        - SESAME
        - SULPHITES
        - LUPIN
        - MOLLUSCS

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    ActivityLevel:
      type: string
      enum: [LOW, MODERATE, HIGH]

    Sex:
      type: string
      enum: [MALE, FEMALE]

    # ------------------------------------------------------------ bff
    TodaySummary:
      type: object
      required: [date, goal, consumed, activity, water, meals, suggestedRecipes]
      properties:
        date:
          type: string
          format: date
        goal:
          type: object
          properties:
            calories:
              type: number
            proteinG:
              type: number
            fatG:
              type: number
            carbsG:
              type: number
            fiberG:
              type: number
            unlimitedCalories:
              type: boolean
        consumed:
          $ref: "#/components/schemas/Nutrition"
        activity:
          type: object
          properties:
            steps:
              type: integer
            activeCalories:
              type: number
        water:
          type: object
          properties:
            consumedMl:
              type: integer
            targetMl:
              type: integer
        meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"
        suggestedRecipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"

    # ------------------------------------------------------------ auth
    EmailAddress:
      type: string
      format: email
      maxLength: 254
      description: >-
        Разрешены только адреса с ASCII local-part и российским доменом верхнего
        уровня .ru или .рф. Перед сравнением адрес проходит trim, Unicode NFC,
        IDNA-преобразование домена и приведение к нижнему регистру.

    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 15
      maxLength: 128
      description: >-
        От 15 до 128 Unicode code points. Пробелы, Unicode whitespace/separator
        и управляющие символы запрещены; остальные требования к составу не
        навязываются. На сервере хранится только Argon2id encoded hash.

    EmailRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
        password:
          $ref: "#/components/schemas/Password"
        locale:
          type: string
          maxLength: 35

    EmailLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
        password:
          $ref: "#/components/schemas/Password"
        deviceId:
          type: string
          maxLength: 255

    EmailActionRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"

    EmailVerificationConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        deviceId:
          type: string
          maxLength: 255

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512

    TokenPair:
      type: object
      description: >-
        Access token — короткоживущий JWT и не хранится на сервере. Refresh token —
        случайный opaque secret; клиент хранит его в Keychain/Keystore, а Identity
        сохраняет в PostgreSQL только hash и состояние rotation family.
      required: [accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresIn]
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          description: seconds
          example: 900
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          description: seconds

    TokenPairWithUser:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/AuthenticatedUser"

    AuthenticatedUser:
      type: object
      required: [id, newUser]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 account identifier.
        newUser:
          type: boolean

    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JsonWebKey"

    JsonWebKey:
      type: object
      required: [kty, use, alg, kid, crv, x, y]
      properties:
        kty:
          type: string
          enum: [EC]
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [ES256]
        kid:
          type: string
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
        y:
          type: string

    # ------------------------------------------------------------ profile
    OnboardingRequest:
      type: object
      required:
        - sex
        - birthDate
        - heightCm
        - activityLevel
        - currentWeightKg
        - targetWeightKg
        - targetWeightChangeKgPerWeek
      properties:
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
        heightCm:
          type: number
          format: double
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        currentWeightKg:
          type: number
          format: double
          description: Сохраняется как первое ручное измерение веса в Health Data Service.
        targetWeightKg:
          type: number
          format: double
        targetWeightChangeKgPerWeek:
          type: number
          format: double
        dietPreferences:
          type: array
          items:
            $ref: "#/components/schemas/DietType"
        allergies:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"

    OnboardingResponse:
      type: object
      required: [profile, goal, hydrationGoalMl, onboardingCompleted, initialWeightMeasurement]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        goal:
          $ref: "#/components/schemas/NutritionGoal"
        hydrationGoalMl:
          type: integer
        onboardingCompleted:
          type: boolean
        initialWeightMeasurement:
          $ref: "#/components/schemas/WeightMeasurement"

    Profile:
      type: object
      required: [sex, birthDate, heightCm, activityLevel, timezone, locale, dietPreferences, allergies, onboardingCompleted, version]
      properties:
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
        heightCm:
          type: number
          format: double
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        timezone:
          type: string
        locale:
          type: string
        dietPreferences:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DietType"
        allergies:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Allergen"
