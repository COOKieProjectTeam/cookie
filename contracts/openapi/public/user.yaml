openapi: 3.0.3
info:
  title: COOKie User API
  version: 2.0.0
  description: User-owned profile, immutable manual goals and daily overrides. Identity
    activation is asynchronous; the first verified request also initializes an incomplete
    profile when needed. Runtime/probes are private.
servers:
- url: /v1
tags:
- name: profile
  description: Profile and goals
paths:
  /me/profile:
    get:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: getProfile
      summary: Получить профиль пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
    patch:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: updateProfile
      summary: Частично обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUIDv4 for one logical command; keep the key across retries.
          Changed payload with the same operation/key conflicts. Evidence retained
          until account deletion.
        schema:
          type: string
          format: uuid
  /me/goals/current:
    get:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: getCurrentGoal
      summary: Получить текущую цель по КБЖУ
      responses:
        '200':
          description: Текущая цель
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionGoal'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
  /me/goals/history:
    get:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: getGoalHistory
      summary: Получить историю версий цели
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список версий цели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalHistoryPage'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
  /me/goals/overrides/{date}:
    parameters:
    - $ref: '#/components/parameters/DatePath'
    put:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: setDailyGoalOverride
      summary: Задать override целей на конкретный день (в т.ч. cheat day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyGoalOverrideInput'
      responses:
        '200':
          description: Override создан/обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyGoalOverride'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUIDv4 for one logical command; keep the key across retries.
          Changed payload with the same operation/key conflicts. Evidence retained
          until account deletion.
        schema:
          type: string
          format: uuid
    delete:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: deleteDailyGoalOverride
      summary: Удалить override на день
      responses:
        '204':
          description: Override удалён
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUIDv4 for one logical command; keep the key across retries.
          Changed payload with the same operation/key conflicts. Evidence retained
          until account deletion.
        schema:
          type: string
          format: uuid
    get:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: getDailyGoalOverride
      responses:
        '200':
          description: Daily override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyGoalOverride'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
  /me/goals/hydration:
    get:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: getHydrationGoal
      responses:
        '200':
          description: Hydration goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrationGoal'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
    put:
      security:
      - accessToken: []
      tags:
      - profile
      operationId: setHydrationGoal
      responses:
        '200':
          description: Hydration goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrationGoal'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '401':
          description: Invalid Identity access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '403':
          description: Account deletion received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '404':
          description: Goal or override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '409':
          description: Version/idempotency/cheat-day conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
        '503':
          description: Dependency unavailable; retry with the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserError'
          headers:
            Retry-After:
              description: Delay in seconds before retrying a temporarily unavailable dependency
              schema:
                type: integer
                minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HydrationGoalInput'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUIDv4 for one logical command; keep the key across retries.
          Changed payload with the same operation/key conflicts. Evidence retained
          until account deletion.
        schema:
          type: string
          format: uuid
  /me/onboarding:
    post:
      tags: [profile]
      security: [{accessToken: []}]
      operationId: completeOnboarding
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalAcceptance'}
      responses:
        '202':
          description: Accepted for asynchronous execution
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalAttempt'}
        '400': {description: Invalid input or receipt}
        '401': {description: Invalid access token}
        '409': {description: Attempt conflicts with current state}
        '503': {description: Service unavailable}
  /me/goals/acceptances:
    post:
      tags: [profile]
      security: [{accessToken: []}]
      operationId: acceptNutritionAssessment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalAcceptance'}
      responses:
        '202':
          description: Accepted for asynchronous execution
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalAttempt'}
        '400': {description: Invalid input or receipt}
        '401': {description: Invalid access token}
        '409': {description: Attempt conflicts with current state}
        '503': {description: Service unavailable}
  /me/goal-attempts/{onboardingId}:
    get:
      tags: [profile]
      security: [{accessToken: []}]
      operationId: getGoalAttempt
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current attempt state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalAttempt'}
        '401': {description: Invalid access token}
        '404': {description: Attempt not found}
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Identity access JWT: ES256, typ=at+jwt, expected issuer and audience,
        and mandatory valid sub, sid, jti, iat and exp claims.
  parameters:
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Sex:
      type: string
      enum:
      - MALE
      - FEMALE
    ActivityLevel:
      type: string
      enum:
      - INACTIVE
      - LOW_ACTIVE
      - ACTIVE
      - VERY_ACTIVE
    DietType:
      type: string
      enum:
      - BALANCED
      - HIGH_PROTEIN
      - VEGETARIAN
      - VEGAN
      - PESCATARIAN
      - LOW_CARB
      - KETO
      - MEDITERRANEAN
      - GLUTEN_FREE
      - LACTOSE_FREE
    Allergen:
      type: string
      enum:
      - GLUTEN
      - CRUSTACEANS
      - EGGS
      - FISH
      - PEANUTS
      - SOY
      - MILK
      - TREE_NUTS
      - CELERY
      - MUSTARD
      - SESAME
      - SULPHITES
      - LUPIN
      - MOLLUSCS
    Profile:
      type: object
      required:
      - sex
      - birthDate
      - heightCm
      - activityLevel
      - timezone
      - locale
      - dietPreferences
      - allergies
      - onboardingCompleted
      - version
      - userId
      properties:
        sex:
          allOf:
          - $ref: '#/components/schemas/Sex'
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        heightCm:
          type: number
          format: double
          minimum: 30
          maximum: 300
          multipleOf: 0.01
          nullable: true
        activityLevel:
          allOf:
          - $ref: '#/components/schemas/ActivityLevel'
          nullable: true
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone identifier supported by the service, for example Europe/Moscow or UTC.
        locale:
          type: string
          maxLength: 100
          enum: [ru, en]
        dietPreferences:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DietType'
        allergies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Allergen'
        onboardingCompleted:
          type: boolean
        version:
          type: integer
          format: int64
          description: Profile-only optimistic version. Goal, hydration and daily override
            changes do not advance this value.
        userId:
          type: string
          format: uuid
      additionalProperties: false
    ProfilePatch:
      type: object
      required:
      - version
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
          format: int64
          description: The profile version returned by GET or the previous successful
            profile PATCH. A concurrent profile change causes VERSION_CONFLICT.
        heightCm:
          type: number
          format: double
          minimum: 30
          maximum: 300
          multipleOf: 0.01
        activityLevel:
          $ref: '#/components/schemas/ActivityLevel'
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone identifier supported by the service, for example Europe/Moscow or UTC.
        locale:
          type: string
          maxLength: 100
          enum: [ru, en]
        dietPreferences:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DietType'
        allergies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Allergen'
      additionalProperties: false
    NutritionGoal:
      type: object
      required: [outcome, revision]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64}
        effectiveFrom: {type: string, format: date}
        latestRevision: {type: integer, format: int64, description: Use this revision in a new preview.}
        outcome: {type: string, enum: [CALCULATED, NO_CALORIE_GOAL, LEGACY_POINT]}
        source: {type: string, enum: [CALCULATED, MANUAL]}
        reason: {type: string}
        policyVersion: {type: string}
        macroProfile: {type: string}
        foodRestrictions:
          type: array
          items: {type: string}
        calories: {$ref: '#/components/schemas/HealthNutritionTarget'}
        proteinG: {$ref: '#/components/schemas/HealthNutritionTarget'}
        fatG: {$ref: '#/components/schemas/HealthNutritionTarget'}
        carbsG: {$ref: '#/components/schemas/HealthNutritionTarget'}
        fiberG: {$ref: '#/components/schemas/HealthNutritionTarget'}
        targetWeightKg: {type: number}
        weeklyChangeKg: {type: number}
    DailyGoalOverrideInput:
      type: object
      required: [type, unlimitedCalories]
      properties:
        type: {type: string, enum: [CHEAT_DAY]}
        unlimitedCalories: {type: boolean}
      additionalProperties: false
    DailyGoalOverride:
      type: object
      required:
      - id
      - localDate
      - type
      - unlimitedCalories
      properties:
        id:
          type: string
          format: uuid
        localDate:
          type: string
          format: date
        type:
          type: string
          enum:
          - CHEAT_DAY
        unlimitedCalories:
          type: boolean
        calories:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
        proteinG:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
        fatG:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
        carbsG:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
        fiberG:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
      additionalProperties: false
    HydrationGoalInput:
      type: object
      required:
      - targetMl
      properties:
        targetMl:
          type: integer
          minimum: 1
          maximum: 20000
      additionalProperties: false
    HydrationGoal:
      type: object
      required:
      - id
      - effectiveFrom
      - revision
      - targetMl
      properties:
        id:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date
        revision:
          type: integer
          format: int64
        targetMl:
          type: integer
      additionalProperties: false
    UserError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false

    HealthAssessmentInput:
      type: object
      additionalProperties: false
      required: [purpose, profileVersion, goalRevision, timezone, sex, birthDate, heightCm, currentWeightKg, weeklyChangeKg, activity, macroProfile, standardAdultPolicyApplies, measuredAt, measurementOffsetMinutes, foodRestrictions, dietStyles, allergies]
      properties:
        purpose: {type: string, enum: [INITIAL, RECALC]}
        profileVersion: {type: integer, format: int64, minimum: 1}
        goalRevision: {type: integer, format: int64, minimum: 0}
        timezone: {type: string, maxLength: 100}
        sex: {type: string, enum: [MALE, FEMALE]}
        birthDate: {type: string, format: date}
        heightCm: {type: number, minimum: 30, maximum: 300, multipleOf: 0.01}
        currentWeightKg: {type: number, minimum: 0.01, maximum: 999.99, multipleOf: 0.01}
        targetWeightKg: {type: number, minimum: 0.01, maximum: 999.99, multipleOf: 0.01}
        weeklyChangeKg: {type: number, description: "One of -0.25, 0 or 0.25 kg per week."}
        activity: {type: string, enum: [INACTIVE, LOW_ACTIVE, ACTIVE, VERY_ACTIVE]}
        macroProfile: {type: string, enum: [BALANCED, HIGH_PROTEIN, LOW_CARB, KETO]}
        standardAdultPolicyApplies: {type: boolean}
        measuredAt: {type: string, format: date-time}
        measurementOffsetMinutes: {type: integer, minimum: -1080, maximum: 1080}
        foodRestrictions:
          type: array
          uniqueItems: true
          maxItems: 5
          items: {type: string, enum: [VEGAN, VEGETARIAN, PESCATARIAN, GLUTEN_FREE, LACTOSE_FREE]}
        dietStyles:
          type: array
          uniqueItems: true
          maxItems: 1
          items: {type: string, enum: [MEDITERRANEAN]}
        allergies:
          type: array
          uniqueItems: true
          maxItems: 14
          items: {type: string, enum: [GLUTEN, CRUSTACEANS, EGGS, FISH, PEANUTS, SOY, MILK, TREE_NUTS, CELERY, MUSTARD, SESAME, SULPHITES, LUPIN, MOLLUSCS]}
    HealthNutritionTarget:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [RANGE, UPPER_LIMIT, AT_LEAST, LEGACY_POINT]}
        low: {type: number}
        center: {type: number}
        high: {type: number}

    GoalHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NutritionGoal'}
        nextCursor: {type: string, nullable: true}
    GoalAcceptance:
      type: object
      required: [receipt, input]
      additionalProperties: false
      properties:
        receipt: {type: string, maxLength: 8192}
        input: {$ref: '#/components/schemas/HealthAssessmentInput'}
    GoalAttempt:
      type: object
      required: [onboardingId, status, statusUrl]
      properties:
        onboardingId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, COMPLETED, NEEDS_NEW_PREVIEW]}
        statusUrl: {type: string}
        outcome: {type: string}
        reason: {type: string}
        goalRevision: {type: integer, format: int64}
        hydrationRevision: {type: integer, format: int64}
        initialWeightId: {type: string, format: uuid}
