schema_version: 1
status: accepted
source_contracts:
  public: contracts/openapi/openapi.yaml
  runtime: contracts/openapi/runtime.yaml
  internal_service_contracts: contracts/openapi/internal/{service-id}.yaml

generator:
  product: openapi-generator
  version: 7.24.0
  templates_version: upstream-7.24.0

rules:
  contract_first: true
  generated_sources_committed: false
  generated_output_pattern: "{module}/build/generated/openapi"
  manual_edits_to_generated_sources: forbidden
  server_business_logic_generation: forbidden
  stable_unique_operation_ids: required
  public_tag_owner_source: docs/architecture/model/services.yaml
  internal_contract_owner: callee_service
  internal_client_granularity: per_callee
  aggregate_internal_client: forbidden

targets:
  - id: kotlin_server_transport
    status: active
    source: public
    language: kotlin
    runtime: jvm
    output: server_interfaces_routing_and_transport_models
    partition: openapi_tag_owner
    generator_name: kotlin-spring
    options:
      interfaceOnly: true
      skipDefaultInterface: true
      useTags: true
      useSpringBoot4: true
      useJackson3: true
      useBeanValidation: false

  - id: kotlin_runtime_probes
    status: active
    source: runtime
    language: kotlin
    runtime: jvm
    output: shared_server_interfaces_and_transport_models
    generator_name: kotlin-spring

  - id: kmp_public_client
    status: configured
    source: public
    language: kotlin
    runtime: kotlin_multiplatform
    output: apps/mobile/shared/build/generated/openapi
    generator_name: kotlin
    library: multiplatform

  - id: kotlin_internal_clients
    status: blocked
    source: internal_service_contracts
    language: kotlin
    runtime: jvm
    output: clients/{service-id}/build/generated/openapi
    module_granularity: one_per_callee
    allowed_dependencies: docs/architecture/model/sync-calls.yaml
    access_policy: services/{service-id}/service.yaml

ci:
  validate_openapi: required
  validate_local_refs: required
  validate_unique_operation_ids: required
  validate_tag_ownership: required
  validate_internal_permissions: required_after_first_internal_contract
  validate_internal_callers: required_after_first_internal_contract
  validate_client_dependencies_against_sync_calls: required_after_gradle_bootstrap
  compile_generated_sources: required
  regeneration_diff_check: required
